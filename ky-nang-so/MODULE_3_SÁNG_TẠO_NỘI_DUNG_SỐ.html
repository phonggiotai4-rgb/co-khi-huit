<style>
:root{--bg:#E8EFF7;--panel:#FFFFFF;--ink:#16243B;--mut:#5A6B85;--line:#C9D5E4;--c1:#2F5BEA;--c2:#F26B5B;--c3:#1FA38A;--c4:#E9A722;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1828;--panel:#16253C;--ink:#EAF0F8;--mut:#9FB0C9;--line:#2A3D5A;--c1:#7B9BFF;--c2:#FF8D7E;--c3:#4CD1B6;--c4:#F4C255;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1828;--panel:#16253C;--ink:#EAF0F8;--mut:#9FB0C9;--line:#2A3D5A;--c1:#7B9BFF;--c2:#FF8D7E;--c3:#4CD1B6;--c4:#F4C255;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.5}
.player{max-width:960px;margin:0 auto;padding:20px 16px 32px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 26px 18px;display:flex;flex-direction:column;gap:10px}
h2{font:700 clamp(22px,3.4vw,32px)/1.2 Lexend,"Be Vietnam Pro",sans-serif;margin:0}
.fig svg{width:100%;height:auto;max-height:54vh;display:block}
.cap{margin:0;min-height:3.3em;color:var(--mut);font-size:clamp(14px,2vw,17px);max-width:72ch}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
button{font:600 14px "Be Vietnam Pro",sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--c1)}
button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
#play{background:var(--c1);border-color:var(--c1);color:#fff;min-width:110px}
.sp{flex:1}
.cnt{color:var(--mut);font-size:14px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;height:10px;padding:0;border-radius:5px;border:0;background:var(--line);position:relative;overflow:hidden}
.seg button::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--c1)}
/* SVG */
svg text{font-family:inherit;fill:var(--ink);font-size:15px}
.b{font-weight:600}.m{fill:var(--mut);font-size:12.5px}.big{font-size:17px}.h1{font-size:34px;font-weight:700}.h2{font-size:19px;font-weight:700;fill:var(--c1)}
.brand{background:#1F6FB5;color:#fff;text-align:center;border-radius:14px;padding:10px 16px;margin-bottom:12px;line-height:1.35}
.brand b{display:block;font:700 clamp(13px,2.2vw,18px) Lexend,sans-serif}.brand span{font-size:clamp(12px,1.8vw,15px)}
.url{margin:8px 0 0;color:var(--mut);font-size:12px}
.st{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1.5;stroke:var(--mut)}
.s1{stroke:var(--c1)}.s2{stroke:var(--c2)}.s3{stroke:var(--c3)}.s4{stroke:var(--c4)}
.f1{fill:var(--c1);fill-opacity:.16}.f2{fill:var(--c2);fill-opacity:.16}.f3{fill:var(--c3);fill-opacity:.16}.f4{fill:var(--c4);fill-opacity:.2}
.fp{fill:var(--panel)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s ease var(--d,0s) forwards}
.r{opacity:0;animation:rv .6s ease var(--d,0s) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes rv{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fi{from{fill-opacity:0}}
@keyframes pop{from{transform:scale(.93)}}
@keyframes pulse{50%{stroke-width:3.6}}
@keyframes sc{from{opacity:0;transform:translateY(10px)}}
@keyframes tt{from{opacity:0;transform:translateX(-12px)}}
@keyframes bp{50%{box-shadow:0 0 0 7px rgba(47,91,234,.22)}}
rect.draw,circle.draw{transform-box:fill-box;transform-origin:center}
rect.draw{animation:dr 1.1s ease var(--d,0s) forwards,pop .55s cubic-bezier(.2,1.3,.4,1) var(--d,0s) backwards}
circle.draw{animation:dr 1.1s ease var(--d,0s) forwards,pulse 3.4s ease-in-out calc(var(--d,0s) + 1.8s) infinite}
rect.draw:is(.f1,.f2,.f3,.f4){animation:dr 1.1s ease var(--d,0s) forwards,pop .55s cubic-bezier(.2,1.3,.4,1) var(--d,0s) backwards,fi .8s ease calc(var(--d,0s) + .45s) backwards}
circle.draw:is(.f1,.f2,.f3,.f4){animation:dr 1.1s ease var(--d,0s) forwards,fi .8s ease calc(var(--d,0s) + .45s) backwards,pulse 3.4s ease-in-out calc(var(--d,0s) + 1.8s) infinite}
.fig svg{animation:sc .5s ease}
.t{animation:tt .55s ease}
button{transition:transform .15s,border-color .15s}button:active{transform:scale(.96)}
.paused #play{animation:bp 1.8s ease-in-out infinite}
.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.draw,rect.draw,circle.draw{animation:none!important;stroke-dashoffset:0}.r{animation:none;opacity:1;transform:none}.fig svg,.t,.paused #play{animation:none!important}}
/* Nút quay lại trang chủ (đặt trên cùng, cạnh logo) */
.home{display:inline-flex;align-items:center;gap:7px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13.5px "Be Vietnam Pro",system-ui,sans-serif;text-decoration:none;transition:border-color .15s,color .15s,transform .15s}
.home:hover{border-color:var(--c1);color:var(--c1)}
.home:active{transform:scale(.97)}
.home:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
</style>
</head>

  <p class="url">https://huit.edu.vn</p>
</main>

{t:"Giới thiệu Module 3",d:32500,
 n:"Chào mừng các bạn đến với Module 3: Sáng tạo nội dung số, từ ý tưởng đến sản phẩm số. Bài học có hai phần. Phần một gồm: tổng quan về sáng tạo nội dung số; phân tích đối tượng và mục tiêu; phân loại và đánh giá nội dung số; quy trình sáng tạo và công cụ hỗ trợ. Phần hai gồm: kỹ thuật biên tập, chuyển đổi và tái sử dụng nội dung; bản quyền và giấy phép sử dụng; công cụ và công nghệ sáng tạo; đánh giá, tối ưu và xuất bản nội dung số.",

{t:"Các nền tảng nội dung số phổ biến",d:52000,

{t:"Xu hướng nội dung mới",d:58500,

{t:"Mục tiêu truyền thông",d:66000,

{t:"Tiêu chí đánh giá chất lượng nội dung số",d:42500,

{t:"Kiểm định tính cập nhật",d:52000,

{t:"Sáu bước sáng tạo nội dung số",d:33500,

{t:"Bước 1–2: Nghiên cứu, đối tượng và mục tiêu",d:42000,
 n:"Bước một, nghiên cứu chủ đề và xu hướng: phân tích thị trường và hành vi người dùng qua Google Trends, TikTok Creative Center, YouTube Analytics, BuzzSumo; tìm chủ đề đang nổi, và khoảng trống nội dung mà đối thủ chưa khai thác. Đây là giai đoạn định hướng chiến lược cho toàn bộ quy trình. Bước hai, xác định đối tượng và mục tiêu: độ tuổi, giới tính, hành vi, nhu cầu, nền tảng yêu thích; xây dựng user persona; chọn mục tiêu nhận diện, tương tác, chuyển đổi hoặc giáo dục; đặt mục tiêu SMART.",

{t:"Bước 3–4: Outline, sản xuất và biên tập",d:48000,

 n:"Bước năm, xuất bản và phân phối đa nền tảng: lên lịch theo hành vi người dùng, TikTok và Reels dùng video ngắn, giờ cao điểm buổi tối; YouTube nội dung dài, phát hành định kỳ; blog và LinkedIn bài chuyên sâu, SEO. Áp dụng nguyên tắc ba R: định dạng lại, tái sử dụng, chia sẻ lại, giữ thông điệp nhất quán trên mọi kênh. Bước sáu, đo lường và tối ưu hóa: KPI gồm độ phủ, tương tác, chuyển đổi, duy trì; dùng Google Analytics, Meta Insights, YouTube Studio, TikTok Analytics; phân tích phản hồi để cải thiện. Đo lường là khởi đầu của vòng sáng tạo mới.",

{t:"Công cụ hỗ trợ: nhóm viết nội dung",d:54000,

{t:"Công cụ thiết kế và dựng video",d:61000,

{t:"Âm thanh, quản lý dự án và tổng kết",d:62000,

{t:"AI trong sáng tạo: ChatGPT và Claude",d:67000,

 n:"Quyền nhân thân là quyền của tác giả liên quan đến danh tính và uy tín tác phẩm: được ghi nhận tác giả; ngăn chặn xuyên tạc, thay đổi tác phẩm; và rút tác phẩm khỏi công bố trong một số trường hợp. Ví dụ: họa sĩ không muốn tác phẩm bị chỉnh sửa mà mất ý nghĩa ban đầu; nhạc sĩ yêu cầu tên mình luôn gắn trên bài hát. Về mối quan hệ: sở hữu trí tuệ là khái niệm rộng, bao gồm bản quyền; bản quyền bảo vệ cả quyền tài sản và quyền nhân thân. Ví dụ nhà văn: bản quyền quyết định ai được xuất bản, bán, cấp phép; quyền nhân thân bảo đảm tên tác giả luôn được gắn, không ai chỉnh sửa làm đổi ý tưởng. Nhạc sĩ: bản quyền là thu lợi từ streaming, bán bản quyền nhạc; quyền nhân thân là yêu cầu credit, không bị remix trái phép.",
 v:()=>BOXS(20,15,290,150,1,'Quyền nhân thân',['Được ghi nhận tác giả','Ngăn xuyên tạc, thay đổi tác phẩm','Rút tác phẩm khỏi công bố','(trong một số trường hợp)'],1)+

{t:"Các yếu tố dễ vi phạm bản quyền",d:80000,
 n:"Phần hai: các yếu tố nội dung dễ vi phạm bản quyền. Năm yếu tố phổ biến: hình ảnh, nhạc nền, logo thương hiệu, đoạn văn hoặc bài viết, và giọng nói AI. Vi phạm có thể khiến video bị gỡ, bị phạt tiền, kiện tụng, mất uy tín thương hiệu. Hình ảnh: ảnh tải từ web hoặc Google Images không xin phép, hoặc ảnh stock không mua bản quyền; giải pháp là dùng ảnh Creative Commons, stock có bản quyền, tự chụp hoặc thuê nhiếp ảnh gia. Nhạc nền: bài hát phổ biến, âm thanh lấy từ phim hoặc game; dùng nhạc miễn phí bản quyền như YouTube Audio Library, Free Music Archive, hoặc mua từ nhà cung cấp nhạc stock. Logo và đoạn văn: dùng logo doanh nghiệp khác, copy nội dung từ website, blog, sách, kể cả chỉ paraphrase nhỏ; hãy xin phép, mua bản quyền, hoặc tạo nội dung gốc, dùng AI viết lại nhưng kiểm tra tính độc đáo. Giọng nói AI: dùng giọng người nổi tiếng không có quyền, hoặc giọng AI thương mại không trả phí; dùng giọng có giấy phép rõ ràng và kiểm tra điều khoản trước khi xuất bản.",
 v:()=>[['Hình ảnh',['Vi phạm: ảnh web, Google Images,','ảnh stock chưa mua bản quyền','Giải pháp: ảnh Creative Commons,','stock có bản quyền, tự chụp']],['Nhạc nền',['Vi phạm: bài hát phổ biến,','sample từ phim, game','Giải pháp: YouTube Audio Library,','Free Music Archive, nhạc stock']],['Logo và đoạn văn',['Vi phạm: dùng logo hãng khác;','copy bài viết, paraphrase nhỏ','Giải pháp: xin phép, mua, hoặc','tạo gốc / AI viết lại + kiểm tra']],['Giọng nói AI',['Vi phạm: giọng người nổi tiếng;','giọng AI thương mại không trả phí','Giải pháp: giấy phép thương mại','rõ ràng, đọc điều khoản trước']]].map((o,i)=>BOXS(20+(i%2)*310,15+Math.floor(i/2)*143,290,135,[1,2,3,4][i],o[0],o[1],[18,34,47,63][i])).join('')+

{t:"Ba loại giấy phép nội dung phổ biến",d:68000,
 n:"Phần ba: các loại giấy phép nội dung phổ biến. Giấy phép xác định quyền sử dụng, chia sẻ, chỉnh sửa tác phẩm số, nhằm bảo vệ quyền tác giả, cho phép người khác dùng nội dung hợp pháp, tránh rủi ro pháp lý. Có ba loại phổ biến. Một, Creative Commons, giấy phép mở với điều kiện cụ thể: CC0 công khai hoàn toàn; CC-BY cần ghi nhận tác giả; CC-BY-SA ghi nhận tác giả và chia sẻ theo cùng điều kiện; CC-BY-NC chỉ phi thương mại; CC-BY-ND không sửa đổi nội dung; ví dụ ảnh Unsplash, Wikipedia. Hai, Royalty-free: dùng không phải trả tiền bản quyền mỗi lần, cho ảnh, nhạc, video stock; không đồng nghĩa miễn phí, không được bán lại; ví dụ AudioJungle, Shutterstock. Ba, Public Domain: tác phẩm hết hạn bản quyền hoặc tác giả từ bỏ quyền, ai cũng dùng được, không cần xin phép; ví dụ văn học cổ điển, hình ảnh lịch sử.",
 v:()=>BOXS(20,15,300,300,1,'Creative Commons (CC)',['CC0 – công khai hoàn toàn','CC-BY – ghi nhận tác giả','CC-BY-SA – ghi nhận tác giả,','chia sẻ cùng điều kiện','CC-BY-NC – phi thương mại','CC-BY-ND – không sửa đổi','VD: Unsplash, Wikipedia media'],16)+
 BOXS(330,15,290,140,2,'Royalty-free',['Không trả tiền bản quyền mỗi lần','Ảnh, nhạc, video stock','Không = miễn phí; không bán lại','VD: AudioJungle, Shutterstock'],38)+

{t:"Nguyên tắc sử dụng tài nguyên số",d:40500,
 n:"Phần bốn: tra cứu và sử dụng tài nguyên số đúng quy định. Dùng sai có thể vi phạm bản quyền, với hình ảnh, video, nhạc nền, âm thanh, font chữ. Năm nguyên tắc: một, luôn kiểm tra loại giấy phép: CC0, CC-BY, CC-BY-SA, Royalty-Free, Public Domain. Hai, ghi nhận tác giả nếu được yêu cầu. Ba, tuân thủ mục đích sử dụng, phi thương mại hay thương mại. Bốn, tránh tải từ nguồn không chính thức hoặc không rõ giấy phép. Năm, lưu trữ chứng cứ giấy phép, như link hoặc file, để minh chứng khi cần.",

{t:"Nguồn tài nguyên miễn phí bản quyền",d:53000,
 n:"Một số nguồn tài nguyên miễn phí bản quyền. Pixabay: ảnh, video miễn phí, CC0. Pexels: ảnh và video miễn phí, dùng thương mại được. Unsplash: ảnh miễn phí, nên ghi nhận tác giả. FreeSound: hiệu ứng âm thanh, CC0 hoặc CC-BY. Bensound: nhạc nền miễn phí cho dự án phi thương mại, trả phí bản quyền khi thương mại. Về font chữ, Google Fonts có hàng nghìn font miễn phí, dùng thương mại được; hãy kiểm tra giấy phép trước khi dùng trong logo, ấn phẩm thương mại, và tải trực tiếp từ trang chính thức. Lưu ý chung: kiểm tra giấy phép, ghi nhận tác giả trước khi tải; không tải nhạc từ YouTube hay Spotify để dùng trực tiếp.",
 v:()=>[['Pixabay',['Ảnh, video miễn phí','CC0']],['Pexels',['Ảnh, video miễn phí','Dùng thương mại được']],['Unsplash',['Ảnh miễn phí','Nên ghi nhận tác giả']],['FreeSound',['Hiệu ứng âm thanh','CC0 hoặc CC-BY']],['Bensound',['Nhạc nền miễn phí phi','thương mại; trả phí khi bán']],['Google Fonts',['Hàng nghìn font miễn phí','Dùng thương mại được']]].map((o,i)=>BOXS(20+(i%3)*205,15+Math.floor(i/3)*137,190,130,[1,2,3,4,1,2][i],o[0],o[1],[3,8.5,13,18,23,31][i])).join('')+

{t:"Công cụ kiểm tra bản quyền tự động",d:69500,
 n:"Phần năm: các công cụ kiểm tra bản quyền tự động, giúp phát hiện vi phạm trước khi xuất bản, bảo vệ quyền tác giả, quản lý nội dung hiệu quả. Ba công cụ phổ biến. YouTube Content ID phát hiện video và âm thanh trùng nội dung có bản quyền, tự động chặn, gỡ hoặc kiếm tiền thay tác giả; ví dụ video dùng nhạc nổi tiếng không xin phép sẽ bị đánh dấu; chỉ áp dụng cho YouTube. Copyscape kiểm tra đạo văn văn bản, so với hàng triệu trang web; dùng kiểm tra blog trước khi xuất bản hoặc bài do freelancer viết; bản miễn phí giới hạn số lần kiểm tra. Grammarly Plagiarism Checker nằm trong Grammarly Premium, so với hàng tỷ trang web và tài liệu học thuật, báo cáo phần trùng lặp và đề xuất sửa, kết hợp chỉnh sửa ngữ pháp và văn phong. Nguyên tắc: kiểm tra trước khi xuất bản, đúng loại nội dung, lưu lại báo cáo, và xin phép bản quyền khi cần.",
 v:()=>[['YouTube Content ID',['Phát hiện video, âm thanh','trùng nội dung có bản quyền','Chặn, gỡ hoặc kiếm tiền','thay tác giả','Chỉ áp dụng cho YouTube']],['Copyscape',['Kiểm tra đạo văn văn bản','So với hàng triệu trang web','VD: blog trước xuất bản,','bài freelancer viết','Bản miễn phí giới hạn lượt']],['Grammarly Plagiarism',['Trong Grammarly Premium','So với hàng tỷ trang web,','tài liệu học thuật','Báo cáo trùng, gợi ý sửa','Kết hợp sửa ngữ pháp']]].map((o,i)=>BOXS(20+i*205,15,190,215,[1,2,3][i],o[0],o[1],[9,28,43][i])).join('')+

{t:"Công cụ và lập trình nội dung số",d:46000,

{t:"H5P, Articulate, Genially, ThingLink",d:49000,
 n:"H5P là nền tảng mã nguồn mở tạo nội dung tương tác HTML5: quiz, video tương tác, timeline, infographic; tích hợp Moodle, WordPress, LMS; dễ dùng, không cần lập trình, hỗ trợ SCORM. Articulate Storyline là công cụ chuyên nghiệp tạo bài giảng e-learning: mô phỏng, quiz, video tương tác; xuất bản chuẩn SCORM, xAPI; nhiều template. Genially là công cụ web tạo slide, infographic, game học tập, thêm hiệu ứng động, hotspot, video nhúng, dễ chia sẻ. ThingLink tạo hình ảnh, video, bản đồ ảo với điểm chạm hotspot: hướng dẫn sản phẩm, du lịch ảo, học tập mô phỏng; dễ tích hợp web, LMS hoặc kính VR.",

{t:"AI và lập trình: Python, JavaScript",d:68000,

{t:"AI sinh nội dung, mở rộng và Chatbot AI",d:76000,
 n:"AI hỗ trợ sáng tạo nhanh và hiệu quả hơn. Sinh văn bản: ChatGPT, Claude, Gemini. Sinh hình ảnh: DALL·E, Midjourney, Stable Diffusion. Sinh video: Synthesia, Runway ML. Sinh giọng nói: ElevenLabs, Play.ht. Với Python có thể dùng thư viện openai, transformers, diffusers để tạo nội dung tự động; với JavaScript tích hợp AI vào web hoặc app qua API REST hoặc WebSocket. Đề xuất mở rộng: kết hợp AI với Python hoặc JavaScript để tạo chatbot cho web học tập, video động từ dữ liệu marketing, slide hoặc infographic tự động cập nhật, mô phỏng AR hướng dẫn kỹ năng. Xu hướng: kể chuyện dựa trên dữ liệu và nội dung học tập thích ứng cá nhân hóa. Chatbot AI tạo nội dung nhanh, nhất quán, cá nhân hóa, hỗ trợ tương tác hai mươi bốn trên bảy, thu thập dữ liệu hành vi. Cần kỹ năng prompt engineering, hiểu logic hội thoại và cấu trúc dữ liệu, tích hợp API và kiểm thử. Công cụ nổi bật: ChatGPT, Claude, Gemini, LangChain, Rasa.",

{t:"Đánh giá và tối ưu nội dung số",d:50000,
 n:"Chương tám: đánh giá, tối ưu và xuất bản nội dung số. Gồm bốn phần: đánh giá và tối ưu nội dung số; phân tích chỉ số đo lường hiệu quả, KPI; tối ưu SEO và thuật toán phân phối theo nền tảng; chiến lược phân phối đa kênh. Phần một: mục tiêu là đo lường hiệu quả nội dung số để tối ưu hiệu suất truyền thông. Các chỉ số chính: tỷ lệ tương tác, thử nghiệm so sánh A/B, bản đồ hành vi người dùng Heatmap, tỷ lệ chuyển đổi. Cách tiếp cận: phân tích định lượng kết hợp định tính. Đánh giá không chỉ đo hiệu quả mà còn giúp hiểu hành vi người dùng và điều chỉnh chiến lược sáng tạo.",

{t:"Kỹ thuật A/B Testing",d:46000,
 n:"Kỹ thuật A/B Testing: so sánh hai phiên bản nội dung, A và B, để xác định phiên bản hiệu quả hơn. Quy trình bốn bước: một, chọn yếu tố cần kiểm thử như tiêu đề, ảnh, CTA, bố cục; hai, tạo hai phiên bản A và B; ba, phân phối ngẫu nhiên cho hai nhóm người dùng; bốn, đo lường và so sánh kết quả như CTR, thời gian xem, chuyển đổi. Ví dụ trên slide: phiên bản A có tỷ lệ chuyển đổi năm phẩy hai phần trăm, phiên bản B bảy phẩy tám phần trăm, nên chọn B. Kết luận: A/B Testing xác định yếu tố tối ưu dựa trên dữ liệu thực tế.",
 v:()=>RW([['Chọn yếu tố kiểm thử','Tiêu đề, ảnh, CTA, bố cục'],['Tạo hai phiên bản','Hai phiên bản nội dung A và B'],['Phân phối ngẫu nhiên','Ngẫu nhiên cho 2 nhóm người dùng'],['Đo lường, so sánh kết quả','CTR, thời gian xem, chuyển đổi']],[9,14,19.5,25])+
 BOXS(395,15,105,170,1,'Phiên bản A',['5,2%','chuyển đổi'],33)+BOXS(515,15,105,170,3,'Phiên bản B',['7,8%','chuyển đổi'],36)+
 BOXS(395,195,225,55,3,'Chọn B!',[],39)+

{t:"Heatmap và Engagement Rate",d:39500,
 n:"Heatmap là bản đồ hành vi người dùng: ghi nhận vùng người dùng click, cuộn, dừng đọc nhiều nhất; công cụ Hotjar, CrazyEgg, Microsoft Clarity; giúp tối ưu bố cục trang, vị trí CTA và yếu tố hình ảnh. Engagement Rate bằng tổng tương tác, gồm like, share, comment, chia cho tổng lượt tiếp cận, nhân một trăm phần trăm; đánh giá mức độ thu hút và lan tỏa. Gợi ý: kết hợp với Google Analytics, Meta Insights hoặc YouTube Studio để trực quan hóa dữ liệu tương tác.",
 v:()=>BOXS(20,15,300,150,1,'Heatmap',['Ghi nhận vùng click, cuộn, dừng đọc','Hotjar, CrazyEgg, Microsoft Clarity','Tối ưu bố cục, vị trí CTA, hình ảnh'],1)+
 BOXS(330,15,290,150,2,'Engagement Rate',['ER = (like + share + comment)','÷ tổng lượt tiếp cận × 100%','Đo mức độ thu hút và lan tỏa'],18)+
 BOXS(20,180,600,100,3,'Gợi ý mở rộng',['Kết hợp Google Analytics, Meta Insights, YouTube Studio','để trực quan hóa dữ liệu và đề xuất cải thiện'],32)},
{t:"Công cụ đánh giá và tối ưu nội dung",d:73000,
 n:"Công cụ hỗ trợ đánh giá và tối ưu, bốn nhóm. Một, phân tích hành vi người dùng: Hotjar tạo heatmap, bản ghi hành vi và khảo sát; Microsoft Clarity miễn phí, hiển thị bản đồ click và cuộn trang; Google Analytics bốn theo dõi lưu lượng, nguồn truy cập, tỷ lệ chuyển đổi. Hai, kiểm thử và tối ưu: Google Optimize hoặc VWO làm A/B Testing và kiểm thử đa biến; Optimizely phân tích hành vi, cá nhân hóa trải nghiệm. Ba, đo lường tương tác mạng xã hội: Meta Insights; YouTube Studio hoặc TubeBuddy; Twitter Analytics hoặc X Pro. Bốn, công cụ sáng tạo có đo hiệu quả: Canva Analytics, Notion AI, ChatGPT gợi ý cải thiện tiêu đề, CTA. Nên kết hợp ít nhất một công cụ phân tích và một công cụ kiểm thử. Tổng kết: A/B Testing so sánh hai phiên bản, Heatmap quan sát hành vi thực, Engagement Rate đo sức hút. Thực hành: thử nghiệm nhỏ trên TikTok hoặc blog, đổi tiêu đề, thumbnail hoặc mô tả, rồi đo sự khác biệt.",
 v:()=>[['Phân tích hành vi',['Hotjar: heatmap, bản ghi, khảo sát','Microsoft Clarity: miễn phí, click, cuộn','Google Analytics 4: lưu lượng, chuyển đổi']],['Kiểm thử, tối ưu',['Google Optimize / VWO: A/B, đa biến','Optimizely: hành vi, cá nhân hóa']],['Mạng xã hội',['Meta Insights: reach, impression','YouTube Studio / TubeBuddy','Twitter Analytics / X Pro']],['Công cụ sáng tạo',['Canva Analytics: lượt xem, chia sẻ','Notion AI / ChatGPT: gợi ý tiêu đề, CTA']]].map((o,i)=>BOXS(20+(i%2)*310,15+Math.floor(i/2)*135,290,125,[1,2,3,4][i],o[0],o[1],[5,24,35,46][i])).join('')+
 BOXS(20,285,600,45,3,'Kết hợp ≥1 công cụ đo lường + ≥1 công cụ A/B',[],57)},
{t:"KPI đo lường hiệu quả nội dung số",d:80000,
 n:"Phần hai: KPI trong đánh giá và tối ưu nội dung số. KPI giúp đánh giá hiệu quả định lượng. Năm KPI phổ biến. Reach: số người tiếp cận nội dung; phân tích theo kênh, thời gian, định dạng. Watch Time hoặc Time on Page: thời lượng người dùng xem hoặc trải nghiệm; với video là tổng thời lượng xem của từng người. Retention Rate: tỷ lệ giữ chân người dùng theo thời gian, bằng người dùng giữ lại chia tổng số người dùng ban đầu, nhân một trăm phần trăm. CTR: tỷ lệ nhấp vào link hoặc CTA, bằng số lần nhấp chia số lượt hiển thị, nhân một trăm phần trăm; CTR cao nghĩa là nội dung hấp dẫn, CTA hiệu quả. Conversion Rate: tỷ lệ thực hiện hành động mong muốn như mua hàng, đăng ký, tải về, bằng số người thực hiện chia tổng lượt truy cập, nhân một trăm phần trăm. Tổng kết: Reach đo lượng tiếp cận; Watch Time và Retention đo khả năng giữ chân; CTR đo sự hấp dẫn của CTA; Conversion đo kết quả cuối cùng. Luôn so sánh KPI theo thời gian, định dạng và nền tảng.",
 v:()=>RW([['Reach','Số người tiếp cận nội dung'],['Watch Time / Time on Page','Tổng thời lượng xem của từng người'],['Retention Rate','Người giữ lại ÷ ban đầu × 100%'],['CTR','Lượt nhấp ÷ lượt hiển thị × 100%'],['Conversion Rate','Người hành động ÷ lượt truy cập × 100%']],[8,17,27.5,38,50])+
 BOXS(20,288,600,42,3,'Tiếp cận → Giữ chân → Hấp dẫn CTA → Chuyển đổi',[],62)},
{t:"Tối ưu SEO nội dung số",d:67000,
 n:"Phần ba: tối ưu SEO và thuật toán phân phối theo từng nền tảng. Mục tiêu là tăng khả năng tiếp cận, giữ chân người dùng và lan tỏa. SEO tối ưu công cụ tìm kiếm như Google, YouTube, Pinterest; thuật toán phân phối tối ưu hiển thị trên feed, explore, recommend. Cần phân tích hành vi, từ khóa, thói quen xem và mức độ tương tác. Tối ưu SEO nội dung số gồm ba nhóm. Một, nội dung chuẩn SEO: chọn từ khóa bằng Google Keyword Planner, Ubersuggest, Ahrefs; meta title, meta description, headings, alt text; nội dung dài, chất lượng, có giá trị thực tế. Hai, cấu trúc website hoặc blog: URL thân thiện, breadcrumbs, sitemap; tốc độ tải trang, giao diện responsive; liên kết nội bộ và backlink chất lượng. Ba, SEO video: tiêu đề, mô tả, tag, thumbnail hấp dẫn; caption, subtitle, playlist, CTA; tăng watch time và retention rate.",
 v:()=>BOXS(20,15,600,70,1,'SEO + thuật toán phân phối',['Tăng tiếp cận, giữ chân, lan tỏa trên các nền tảng'],8)+
 [['Nội dung chuẩn SEO',['Từ khóa: Keyword Planner,','Ubersuggest, Ahrefs','Meta title, description,','headings, alt text','Nội dung dài, chất lượng']],['Cấu trúc web / blog',['URL thân thiện, breadcrumbs,','sitemap','Tốc độ tải, responsive','Internal linking,','backlink chất lượng']],['SEO video',['Tiêu đề, mô tả, tag,','thumbnail hấp dẫn','Caption, subtitle, playlist','Tăng watch time,','retention rate']]].map((o,i)=>BOXS(20+i*205,95,190,230,[2,3,4][i],o[0],o[1],[25,42,55][i])).join('')},
{t:"Thuật toán phân phối theo nền tảng",d:57000,
 n:"Thuật toán phân phối nội dung theo nền tảng. TikTok, Reels, Shorts: thời lượng ngắn, hook trong ba đến năm giây đầu; dùng hashtag, âm thanh trending, caption hấp dẫn; thuật toán ưu tiên video có engagement nhanh. YouTube: ưu tiên watch time, CTR thumbnail, retention rate; tối ưu playlist, end screen, metadata; đăng định kỳ, tương tác với comment. Instagram và Facebook: hình ảnh, video chất lượng cao, story, carousel; hashtag phù hợp, caption ngắn, call to action; ưu tiên nội dung tạo engagement nhanh. Blog và website: tối ưu on-page SEO với từ khóa, headings, hình ảnh, internal linking; tốc độ tải trang, mobile-friendly; ưu tiên bài dài, giá trị, thời gian onsite cao.",
 v:()=>[['TikTok / Reels / Shorts',['Ngắn, hook 3–5 giây đầu','Hashtag, âm thanh trending, caption','Ưu tiên engagement nhanh']],['YouTube',['Ưu tiên watch time, CTR, retention','Tối ưu playlist, end screen, metadata','Đăng định kỳ, tương tác comment']],['Instagram / Facebook',['Ảnh, video chất lượng cao, story, carousel','Hashtag phù hợp, caption ngắn, CTA','Ưu tiên engagement nhanh']],['Blog / Website',['On-page SEO: từ khóa, headings, link nội bộ','Tốc độ tải, mobile-friendly','Ưu tiên bài dài, giá trị, onsite lâu']]].map((o,i)=>BOXS(20+(i%2)*310,15+Math.floor(i/2)*160,290,150,[1,2,3,4][i],o[0],o[1],[1,14.5,28,42][i])).join('')},
{t:"Chiến lược kết hợp SEO và công cụ",d:70000,
 n:"Chiến lược kết hợp SEO và thuật toán phân phối gồm năm bước. Một, phân tích dữ liệu hành vi trên từng nền tảng. Hai, chọn định dạng phù hợp: video ngắn, carousel, blog dài, infographic. Ba, tối ưu từ khóa, tiêu đề, thumbnail, CTA và metadata. Bốn, thử nghiệm A/B Testing để xác định nội dung thu hút nhất. Năm, lặp lại liên tục: xuất bản, đo lường KPI, tối ưu. Mẹo SEO tốt cộng thuật toán phân phối hiệu quả bằng nội dung tiếp cận rộng, engagement cao, conversion tăng. Công cụ hỗ trợ: SEO có Google Keyword Planner, Ahrefs, SEMrush, Ubersuggest; video có TubeBuddy, VidIQ, Canva Analytics; mạng xã hội có TikTok Analytics, Meta Insights, Instagram Insights; blog có Yoast SEO, RankMath, Google Search Console; phân phối và thử nghiệm có Buffer, Hootsuite, Google Optimize. Hãy kết hợp phân tích dữ liệu và công cụ để nội dung vừa thân thiện SEO vừa thu hút thuật toán nền tảng.",
 v:()=>RW([['Phân tích dữ liệu hành vi','Từng nền tảng'],['Chọn định dạng phù hợp','Video ngắn, carousel, blog dài'],['Tối ưu từ khóa, tiêu đề, CTA','Thumbnail, metadata'],['Thử nghiệm A/B Testing','Xác định nội dung thu hút nhất'],['Lặp: xuất bản → KPI → tối ưu','Liên tục']],[4,10,17,24,31])+
 BOXS(330,15,290,265,2,'Công cụ hỗ trợ',['SEO: Keyword Planner, Ahrefs,','SEMrush, Ubersuggest','Video: TubeBuddy, VidIQ, Canva','Social: TikTok Analytics, Meta,','Instagram Insights','Blog: Yoast SEO, RankMath, GSC','Phân phối: Buffer, Hootsuite,','Google Optimize'],37)+
 BOXS(20,288,600,42,3,'SEO tốt + thuật toán hiệu quả = tiếp cận rộng, engagement cao',[],31)},
{t:"Chiến lược phân phối đa kênh",d:63000,
 n:"Phần bốn: chiến lược phân phối đa kênh, Omni-channel. Mục tiêu là tối đa hóa phạm vi tiếp cận và tương tác bằng cách phân phối nội dung trên nhiều kênh một cách đồng bộ: website, blog, email, mạng xã hội, video, podcast, ứng dụng di động; đồng bộ thông điệp thương hiệu, hình ảnh, giá trị; tận dụng sức mạnh từng kênh. Omni-channel là nội dung tối ưu theo kênh nhưng nhất quán về thông điệp. Năm nguyên tắc triển khai: một, nhất quán thông điệp, tone và style. Hai, tùy biến theo nền tảng: định dạng, thời lượng, hình ảnh, CTA. Ba, tích hợp dữ liệu và phân tích: KPI chung và riêng từng nền tảng. Bốn, lập kế hoạch lịch đăng đồng bộ với chiến dịch, event, promotion. Năm, tối ưu trải nghiệm người dùng, dẫn dắt từ kênh này sang kênh khác, cross-channel journey.",
 v:()=>T(320,26,'Omni-channel: tối ưu theo kênh, nhất quán thông điệp','b big',8)+
 RW([['Nhất quán thông điệp','Cùng thương hiệu, tone và style'],['Tùy biến theo nền tảng','Định dạng, thời lượng, hình, CTA'],['Tích hợp dữ liệu, phân tích','KPI chung và riêng từng nền tảng'],['Lịch đăng đồng bộ','Chiến dịch, event, promotion'],['Tối ưu trải nghiệm người dùng','Cross-channel journey']],[38,43,48.5,54,59],45)},
{t:"Các kênh phân phối phổ biến",d:26000,
 n:"Các kênh phân phối phổ biến. Website hoặc blog: nội dung dài, SEO, bài chuyên sâu. Email marketing: newsletter, thông báo sản phẩm, nurturing leads. Mạng xã hội: TikTok, YouTube, Instagram, Facebook. Podcast hoặc audio: storytelling, phỏng vấn chuyên gia. Ứng dụng di động và thông báo đẩy. Quảng cáo trả phí và nội dung tài trợ: quảng cáo hiển thị, retargeting, native ads.",

/* ====== BỘ PHÁT ====== */
const $=id=>document.getElementById(id);
const stage=$('stage'),fig=$('fig'),ttl=$('ttl'),cap=$('cap'),seg=$('seg'),btn=$('play'),vb=$('voice'),cnt=$('cnt');
let i=0,el=0,last=performance.now(),playing=true,done=false,voice=false,sd=true,tok=0;

SCENES.forEach((s,k)=>{const b=document.createElement('button');b.setAttribute('aria-label','Phần '+(k+1)+': '+s.t);b.onclick=()=>jump(k);seg.appendChild(b)});

function speak(){
  if(!('speechSynthesis' in window)){sd=true;return}
  speechSynthesis.cancel();const k=++tok;
  const u=new SpeechSynthesisUtterance(SCENES[i].n);u.lang='vi-VN';u.rate=.95;sd=false;
  u.onend=u.onerror=()=>{if(k===tok)sd=true};
  speechSynthesis.speak(u);if(!playing)speechSynthesis.pause();
}
function fit(svg){const rs=[...svg.querySelectorAll('rect')].map(r=>({x:+r.getAttribute('x'),y:+r.getAttribute('y'),w:+r.getAttribute('width'),h:+r.getAttribute('height')})).filter(r=>r.w<600);
  svg.querySelectorAll('text').forEach(t=>{const w=t.getComputedTextLength();if(!w)return;const x=+t.getAttribute('x'),y=+t.getAttribute('y'),mid=t.getAttribute('text-anchor')==='middle';
    const r=rs.filter(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h).sort((p,q)=>p.w-q.w)[0];if(!r)return;
    const room=mid?r.w-16:r.x+r.w-8-x;if(w>room){t.setAttribute('textLength',room);t.setAttribute('lengthAdjust','spacingAndGlyphs')}})}
function show(n){
  i=n;el=0;sd=true;const s=SCENES[n];
  fig.innerHTML=`<svg viewBox="0 0 640 360" role="img" aria-label="${s.t}">${DEFS}${s.v()}</svg>`;
  fit(fig.firstChild);
  ttl.classList.remove('t');cap.classList.remove('t');void ttl.offsetWidth;ttl.classList.add('t');cap.classList.add('t');
  ttl.textContent=s.t;cap.textContent=s.n;cnt.textContent=(n+1)+' / '+SCENES.length;
  if(voice)speak();
}
function sync(){stage.classList.toggle('paused',!playing);btn.textContent=done?'Xem lại':playing?'Tạm dừng':'Phát'}
function jump(n){done=false;playing=true;show(n);sync()}
btn.onclick=()=>{
  if(done){jump(0);return}
  playing=!playing;sync();
  if(voice&&'speechSynthesis' in window)playing?speechSynthesis.resume():speechSynthesis.pause();
};
$('prev').onclick=()=>jump(Math.max(0,i-(el>2000?0:1)));
$('next').onclick=()=>jump(Math.min(SCENES.length-1,i+1));
vb.onclick=()=>{
  voice=!voice;vb.textContent='Giọng đọc: '+(voice?'Bật':'Tắt');vb.setAttribute('aria-pressed',voice);
  if(voice)speak();else{tok++;sd=true;if('speechSynthesis' in window)speechSynthesis.cancel()}
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON')return;
  if(e.code==='Space'){e.preventDefault();btn.click()}
  if(e.code==='ArrowRight')$('next').click();
  if(e.code==='ArrowLeft')$('prev').click();
});

function tick(ts){
  const dt=Math.min(ts-last,100);last=ts;
  if(playing){
    el+=dt;const d=SCENES[i].d;
    if(el>=d&&(sd||el>d+6000)){
      if(i<SCENES.length-1)show(i+1);else{playing=false;done=true;sync()}
    }
  }
  [...seg.children].forEach((b,k)=>b.style.setProperty('--p',(k<i||(done&&k===i)?100:k===i?Math.min(el/SCENES[i].d,1)*100:0)+'%'));
  requestAnimationFrame(tick);
}
show(0);sync();requestAnimationFrame(tick);
</script>
