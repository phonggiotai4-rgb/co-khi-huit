<!DOCTYPE html>
<html lang="vi">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EFF7;--panel:#FFFFFF;--ink:#16243B;--mut:#5A6B85;--line:#C9D5E4;--c1:#2F5BEA;--c2:#F26B5B;--c3:#1FA38A;--c4:#E9A722;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1828;--panel:#16253C;--ink:#EAF0F8;--mut:#9FB0C9;--line:#2A3D5A;--c1:#7B9BFF;--c2:#FF8D7E;--c3:#4CD1B6;--c4:#F4C255;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1828;--panel:#16253C;--ink:#EAF0F8;--mut:#9FB0C9;--line:#2A3D5A;--c1:#7B9BFF;--c2:#FF8D7E;--c3:#4CD1B6;--c4:#F4C255;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.5}
.player{max-width:960px;margin:0 auto;padding:20px 16px 32px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 26px 18px;display:flex;flex-direction:column;gap:10px}
h2{font:700 clamp(22px,3.4vw,32px)/1.2 Lexend,"Be Vietnam Pro",sans-serif;margin:0}
.fig svg{width:100%;height:auto;max-height:54vh;display:block}
.cap{margin:0;min-height:3.3em;color:var(--mut);font-size:clamp(14px,2vw,17px);max-width:72ch}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
button{font:600 14px "Be Vietnam Pro",sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--c1)}
button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
#play{background:var(--c1);border-color:var(--c1);color:#fff;min-width:110px}
.sp{flex:1}
.cnt{color:var(--mut);font-size:14px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;height:10px;padding:0;border-radius:5px;border:0;background:var(--line);position:relative;overflow:hidden}
.seg button::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--c1)}
/* SVG */
svg text{font-family:inherit;fill:var(--ink);font-size:15px}
.b{font-weight:600}.m{fill:var(--mut);font-size:12.5px}.big{font-size:17px}.h1{font-size:34px;font-weight:700}.h2{font-size:19px;font-weight:700;fill:var(--c1)}
.brand{background:#1F6FB5;color:#fff;text-align:center;border-radius:14px;padding:10px 16px;margin-bottom:12px;line-height:1.35}
.brand b{display:block;font:700 clamp(13px,2.2vw,18px) Lexend,sans-serif}.brand span{font-size:clamp(12px,1.8vw,15px)}
.url{margin:8px 0 0;color:var(--mut);font-size:12px}
.st{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1.5;stroke:var(--mut)}
.s1{stroke:var(--c1)}.s2{stroke:var(--c2)}.s3{stroke:var(--c3)}.s4{stroke:var(--c4)}
.f1{fill:var(--c1);fill-opacity:.16}.f2{fill:var(--c2);fill-opacity:.16}.f3{fill:var(--c3);fill-opacity:.16}.f4{fill:var(--c4);fill-opacity:.2}
.fp{fill:var(--panel)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s ease var(--d,0s) forwards}
.r{opacity:0;animation:rv .6s ease var(--d,0s) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes rv{to{opacity:1}}
.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.r{animation:none;opacity:1}}
</style>
</head>
<body>
<main class="player">
  <div class="brand"><span>BỘ CÔNG THƯƠNG</span><b>TRƯỜNG ĐẠI HỌC CÔNG THƯƠNG THÀNH PHỐ HỒ CHÍ MINH</b></div>

</main>

<script>
/* ====== NỘI DUNG: chỉnh sửa mảng SCENES bên dưới ======
   t: tiêu đề | d: thời lượng (ms) | n: lời giảng (phụ đề + giọng đọc) | v: hàm vẽ hình SVG
   Mỗi phần tử vẽ có thể có độ trễ riêng (tham số cuối) để hình hiện ra theo lời giảng. */
const D=n=>`style="--d:${n}s"`;
const T=(x,y,s,c='',n=0,a='middle')=>`<text class="r ${c}" ${D(n)} x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
const P=(tag,attrs,c='',n=0)=>`<${tag} pathLength="1" class="st draw ${c}" ${D(n)} ${attrs}/>`;
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" class="st" style="stroke-width:2"/></marker></defs>`;

const AR=(x1,x2,y,n)=>`<path pathLength="1" class="st draw" ${D(n)} d="M${x1} ${y}H${x2}" marker-end="url(#ah)"/>`;
const BOX=(x,y,w,h,k,title,L,n)=>P('rect',`x="${x}" y="${y}" width="${w}" height="${h}" rx="14"`,`s${k} f${k}`,n)+T(x+w/2,y+30,title,'b big',n+.3)+L.map((l,j)=>T(x+w/2,y+62+j*22,l,'m',n+.6+j*.3)).join('');
const GRID=(C,x)=>{let s='';C.forEach((o,i)=>{const X=30+i%2*300,Y=40+Math.floor(i/2)*140,n=.3+i*2.8,k=o[0];
 s+=P('rect',`x="${X}" y="${Y}" width="280" height="110" rx="16"`,`s${k} f${k}`,n)+(x?P('path',`d="M${X+28} ${Y+39}l20 20M${X+48} ${Y+39}l-20 20"`,`s${k}`,n+.3):P('circle',`cx="${X+38}" cy="${Y+55}" r="16"`,`s${k}`,n+.3))+
 T(X+68,Y+44,o[1],'b',n+.6,'start')+T(X+68,Y+68,o[2],'m',n+.8,'start')+(o[3]?T(X+68,Y+86,o[3],'m',n+.9,'start'):'');});return s;};
const BOXS=(x,y,w,h,k,title,L,n)=>P('rect',`x="${x}" y="${y}" width="${w}" height="${h}" rx="14"`,`s${k} f${k}`,n)+T(x+w/2,y+30,title,'b',n+.3)+L.map((l,j)=>T(x+w/2,y+58+j*22,l,'m',n+.6+j*.3)).join('');
const ROWS=(R,pt=64)=>{let s='';R.forEach((o,i)=>{const y=20+i*pt,n=.3+i*3,m=o[0],k=m==='✓'?3:m==='✗'?2:[1,3,4,2][i%4];
 s+=P('circle',`cx="60" cy="${y+22}" r="20"`,`s${k} f${k}`,n)+(m==='✓'?P('path',`d="M50 ${y+22}l7 7 13-14"`,'s3',n+.4):m==='✗'?P('path',`d="M52 ${y+14}l16 16M68 ${y+14}l-16 16"`,'s2',n+.4):T(60,y+28,m,'b big',n+.4))+
 T(100,y+18,o[1],'b big',n+.7,'start')+T(100,y+40,o[2],'m',n+.9,'start');});return s;};
const SCENES=[
{t:"Khoa Công nghệ thông tin",d:10000,
 n:"Chào mừng các bạn đến với Module 1: Khai thác dữ liệu và thông tin, thuộc Khoa Công nghệ thông tin, Trường Đại học Công Thương Thành phố Hồ Chí Minh. Module này giúp ta biến dữ liệu thô thành thông tin hữu ích.",
 v:()=>

  `<path pathLength="1" class="st draw" ${D(3)} d="M185 240h60" marker-end="url(#ah)"/>`+

  `<path pathLength="1" class="st draw" ${D(5)} d="M355 240h60" marker-end="url(#ah)"/>`+

{t:"Nội dung Module 1",d:16000,

      T(88,y+28,o[1],'b',n+.6,'start');});

{t:"Vì sao dữ liệu quan trọng?",d:11000,

{t:"Dữ liệu – Thông tin – Tri thức",d:22000,
 n:"Dữ liệu là những giá trị thô, chưa xử lý, ví dụ dãy điểm 7, 5, 9, 10. Khi được tính toán và tổ chức, nó trở thành thông tin, như điểm trung bình môn Toán là 7,8. Kết hợp thông tin với kinh nghiệm, ta có tri thức: nếu điểm trung bình dưới 6, cần điều chỉnh phương pháp học. Giá trị tăng dần từ thấp, trung bình đến cao.",

  BOX(20,40,170,120,4,'Dữ liệu',['Thô, chưa xử lý','7, 5, 9, 10'],.3)+AR(193,232,100,3)+
  BOX(235,40,170,120,1,'Thông tin',['Đã xử lý, có ý nghĩa','TB môn Toán: 7.8'],4)+AR(408,447,100,8)+
  BOX(450,40,170,120,3,'Tri thức',['Hiểu sâu, hành động','TB dưới 6 → đổi cách học'],9)+
  P('rect','x="75" y="270" width="60" height="30"','s4 f4',13)+T(105,322,'Giá trị thấp','m',13.5)+
  P('rect','x="290" y="240" width="60" height="60"','s1 f1',15)+T(320,322,'Trung bình','m',15.5)+
  P('rect','x="505" y="200" width="60" height="100"','s3 f3',17)+T(535,322,'Giá trị cao','m',17.5)},
{t:"Ba loại dữ liệu",d:18000,
 n:"Dữ liệu có cấu trúc được tổ chức theo hàng và cột cố định, như bảng Excel hay cơ sở dữ liệu SQL. Dữ liệu bán cấu trúc có thẻ hoặc dấu phân cách nhưng không có sơ đồ cứng, như JSON, XML. Dữ liệu phi cấu trúc gồm văn bản, hình ảnh, video, âm thanh, chiếm khoảng 80 phần trăm dữ liệu số hiện nay.",
 v:()=>
  P('rect','x="62" y="40" width="90" height="70"','s1 f1',.3)+P('path','d="M62 63h90M62 86h90M92 40v70M122 40v70"','s1',.8)+
  T(107,150,'Có cấu trúc','b big',1.5)+T(107,172,'Bảng, Excel, SQL','m',1.8)+T(107,190,'Hàng và cột rõ ràng','m',1.8)+
  T(320,100,'{ }','h1',5)+T(320,150,'Bán cấu trúc','b big',5.5)+T(320,172,'JSON, XML, NoSQL','m',5.8)+T(320,190,'Có thẻ, không sơ đồ cứng','m',5.8)+
  P('rect','x="476" y="48" width="30" height="42" rx="3"','s2',9.5)+P('rect','x="514" y="52" width="40" height="34" rx="3"','s2',9.8)+P('path','d="M518 82l10-14l8 8l6-6l8 12"','s2',10.1)+P('path','d="M562 70v10M568 62v26M574 66v18M580 72v6"','s2',10.4)+
  T(533,150,'Phi cấu trúc','b big',10.8)+T(533,172,'Văn bản, ảnh, video,','m',11.1)+T(533,190,'âm thanh','m',11.1)+
  P('rect','x="60" y="240" width="520" height="22" rx="11"','thin',13)+P('rect','x="60" y="240" width="416" height="22" rx="11"','s2 f2',13.5)+T(320,295,'Phi cấu trúc chiếm khoảng 80% dữ liệu số hiện nay','b',14.5)},
{t:"Đặc điểm dữ liệu số",d:13000,
 n:"Dữ liệu số có bốn đặc điểm: dễ sao chép và phân tán mà không mất chất lượng; không bị hao mòn theo thời gian; được tạo mới rất nhanh với khối lượng khổng lồ mỗi giây; và có thể xử lý tự động bằng trí tuệ nhân tạo.",

 n:"Dữ liệu đi qua sáu giai đoạn: thu thập từ nhiều nguồn, lưu trữ an toàn, xử lý bằng cách làm sạch và biến đổi, phân tích để khám phá quy luật, trích xuất thông tin, và cuối cùng là ứng dụng tri thức để hành động.",

{t:"Ví dụ: một buổi học online",d:17000,

{t:"Các loại thông tin không đáng tin",d:21000,

/* ====== BỘ PHÁT ====== */
const $=id=>document.getElementById(id);
const stage=$('stage'),fig=$('fig'),ttl=$('ttl'),cap=$('cap'),seg=$('seg'),btn=$('play'),vb=$('voice'),cnt=$('cnt');
let i=0,el=0,last=performance.now(),playing=true,done=false,voice=false,sd=true,tok=0;

SCENES.forEach((s,k)=>{const b=document.createElement('button');b.setAttribute('aria-label','Phần '+(k+1)+': '+s.t);b.onclick=()=>jump(k);seg.appendChild(b)});

function speak(){
  if(!('speechSynthesis' in window)){sd=true;return}
  speechSynthesis.cancel();const k=++tok;
  const u=new SpeechSynthesisUtterance(SCENES[i].n);u.lang='vi-VN';u.rate=.95;sd=false;
  u.onend=u.onerror=()=>{if(k===tok)sd=true};
  speechSynthesis.speak(u);if(!playing)speechSynthesis.pause();
}
function show(n){
  i=n;el=0;sd=true;const s=SCENES[n];
  fig.innerHTML=`<svg viewBox="0 0 640 360" role="img" aria-label="${s.t}">${DEFS}${s.v()}</svg>`;
  ttl.textContent=s.t;cap.textContent=s.n;cnt.textContent=(n+1)+' / '+SCENES.length;
  if(voice)speak();
}
function sync(){stage.classList.toggle('paused',!playing);btn.textContent=done?'Xem lại':playing?'Tạm dừng':'Phát'}
function jump(n){done=false;playing=true;show(n);sync()}
btn.onclick=()=>{
  if(done){jump(0);return}
  playing=!playing;sync();
  if(voice&&'speechSynthesis' in window)playing?speechSynthesis.resume():speechSynthesis.pause();
};
$('prev').onclick=()=>jump(Math.max(0,i-(el>2000?0:1)));
$('next').onclick=()=>jump(Math.min(SCENES.length-1,i+1));
vb.onclick=()=>{
  voice=!voice;vb.textContent='Giọng đọc: '+(voice?'Bật':'Tắt');vb.setAttribute('aria-pressed',voice);
  if(voice)speak();else{tok++;sd=true;if('speechSynthesis' in window)speechSynthesis.cancel()}
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON')return;
  if(e.code==='Space'){e.preventDefault();btn.click()}
  if(e.code==='ArrowRight')$('next').click();
  if(e.code==='ArrowLeft')$('prev').click();
});

function tick(ts){
  const dt=Math.min(ts-last,100);last=ts;
  if(playing){
    el+=dt;const d=SCENES[i].d;
    if(el>=d&&(sd||el>d+6000)){
      if(i<SCENES.length-1)show(i+1);else{playing=false;done=true;sync()}
    }
  }
  [...seg.children].forEach((b,k)=>b.style.setProperty('--p',(k<i||(done&&k===i)?100:k===i?Math.min(el/SCENES[i].d,1)*100:0)+'%'));
  requestAnimationFrame(tick);
}
show(0);sync();requestAnimationFrame(tick);
</script>
