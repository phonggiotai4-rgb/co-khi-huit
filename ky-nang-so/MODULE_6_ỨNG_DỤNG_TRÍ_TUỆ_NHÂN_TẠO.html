<style>

:root[data-theme="dark"]{--bg:#0E1828;--panel:#16253C;--ink:#EAF0F8;--mut:#9FB0C9;--line:#2A3D5A;--c1:#7B9BFF;--c2:#FF8D7E;--c3:#4CD1B6;--c4:#F4C255;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif;line-height:1.5}
.player{max-width:960px;margin:0 auto;padding:20px 16px 32px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 26px 18px;display:flex;flex-direction:column;gap:10px}
h2{font:700 clamp(22px,3.4vw,32px)/1.2 Lexend,"Be Vietnam Pro",sans-serif;margin:0}
.fig svg{width:100%;height:auto;max-height:54vh;display:block}
.cap{margin:0;min-height:3.3em;color:var(--mut);font-size:clamp(14px,2vw,17px);max-width:72ch}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
button{font:600 14px "Be Vietnam Pro",sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--c1)}
button:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
#play{background:var(--c1);border-color:var(--c1);color:#fff;min-width:110px}
.sp{flex:1}
.cnt{color:var(--mut);font-size:14px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;height:10px;padding:0;border-radius:5px;border:0;background:var(--line);position:relative;overflow:hidden}
.seg button::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--c1)}
/* SVG */
svg text{font-family:inherit;fill:var(--ink);font-size:15px}
.b{font-weight:600}.m{fill:var(--mut);font-size:12.5px}.big{font-size:17px}.h1{font-size:34px;font-weight:700}.h2{font-size:19px;font-weight:700;fill:var(--c1)}
.brand{background:#1F6FB5;color:#fff;text-align:center;border-radius:14px;padding:10px 16px;margin-bottom:12px;line-height:1.35}
.brand b{display:block;font:700 clamp(13px,2.2vw,18px) Lexend,sans-serif}.brand span{font-size:clamp(12px,1.8vw,15px)}
.url{margin:8px 0 0;color:var(--mut);font-size:12px}
.st{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.thin{stroke-width:1.5;stroke:var(--mut)}
.s1{stroke:var(--c1)}.s2{stroke:var(--c2)}.s3{stroke:var(--c3)}.s4{stroke:var(--c4)}
.f1{fill:var(--c1);fill-opacity:.16}.f2{fill:var(--c2);fill-opacity:.16}.f3{fill:var(--c3);fill-opacity:.16}.f4{fill:var(--c4);fill-opacity:.2}
.fp{fill:var(--panel)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.1s ease var(--d,0s) forwards}
.r{opacity:0;animation:rv .6s ease var(--d,0s) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes rv{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes fi{from{fill-opacity:0}}
@keyframes pop{from{transform:scale(.93)}}
@keyframes pulse{50%{stroke-width:3.6}}
@keyframes sc{from{opacity:0;transform:translateY(10px)}}
@keyframes tt{from{opacity:0;transform:translateX(-12px)}}
@keyframes bp{50%{box-shadow:0 0 0 7px rgba(47,91,234,.22)}}
rect.draw,circle.draw{transform-box:fill-box;transform-origin:center}
rect.draw{animation:dr 1.1s ease var(--d,0s) forwards,pop .55s cubic-bezier(.2,1.3,.4,1) var(--d,0s) backwards}
circle.draw{animation:dr 1.1s ease var(--d,0s) forwards,pulse 3.4s ease-in-out calc(var(--d,0s) + 1.8s) infinite}
rect.draw:is(.f1,.f2,.f3,.f4){animation:dr 1.1s ease var(--d,0s) forwards,pop .55s cubic-bezier(.2,1.3,.4,1) var(--d,0s) backwards,fi .8s ease calc(var(--d,0s) + .45s) backwards}
circle.draw:is(.f1,.f2,.f3,.f4){animation:dr 1.1s ease var(--d,0s) forwards,fi .8s ease calc(var(--d,0s) + .45s) backwards,pulse 3.4s ease-in-out calc(var(--d,0s) + 1.8s) infinite}
.fig svg{animation:sc .5s ease}
.t{animation:tt .55s ease}
button{transition:transform .15s,border-color .15s}button:active{transform:scale(.96)}
.paused #play{animation:bp 1.8s ease-in-out infinite}
.paused *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){.draw,rect.draw,circle.draw{animation:none!important;stroke-dashoffset:0}.r{animation:none;opacity:1;transform:none}.fig svg,.t,.paused #play{animation:none!important}}
/* Nút quay lại trang chủ (đặt trên cùng, cạnh logo) */
.home{display:inline-flex;align-items:center;gap:7px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 13.5px "Be Vietnam Pro",system-ui,sans-serif;text-decoration:none;transition:border-color .15s,color .15s,transform .15s}
.home:hover{border-color:var(--c1);color:var(--c1)}
.home:active{transform:scale(.97)}
.home:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
</style>
</head>

{t:"Xử lý ngôn ngữ tự nhiên (NLP)",d:36500,

{t:"Robotics và Học tăng cường",d:36500,
 n:"Robotics kết hợp AI với kỹ thuật cơ khí để tạo ra các robot có thể tương tác vật lý với môi trường. Ứng dụng gồm robot phẫu thuật, robot trong dây chuyền sản xuất, máy bay không người lái tự hành và robot hút bụi thông minh. Học tăng cường mô phỏng cách con người và động vật học: nhận phần thưởng cho hành động đúng, hình phạt cho hành động sai, từ đó tối ưu hóa chiến lược. Ứng dụng gồm AI chơi game như AlphaGo, tối ưu hóa chuỗi cung ứng và tối ưu hóa hệ thống giao dịch tự động.",

{t:"Lịch sử AI: từ 1900 đến 2000",d:47500,
 n:"Lịch sử AI đi qua nhiều giai đoạn. Từ một chín không không đến một chín năm không: ống chân không Triode, robot đầu tiên, logic số, điều khiển học, rồi phép thử Turing. Từ một chín năm không đến một chín bảy ba: thuật ngữ AI ra đời năm một chín năm sáu, perceptron đầu tiên, chương trình AI đầu tiên, robot công nghiệp đầu tiên và chatbot Eliza. Sau đó là mùa đông AI thứ nhất. Thập niên một chín tám không có WABOT hai, mạng Hopfield, xử lý song song, lan truyền ngược và mạng tích chập, trước mùa đông AI thứ hai. Giai đoạn một chín chín ba đến hai nghìn có Robocup, Deep Blue thắng Kasparov, LSTM, robot chó AIBO và robot Kismet.",

{t:"Lịch sử AI: từ 2000 đến nay",d:41000,

{t:"Các yếu tố quyết định hiệu quả của AI",d:37500,
 n:"Ba yếu tố quyết định hiệu quả của AI. Một, chất lượng dữ liệu: quan trọng nhất, rác vào thì rác ra, nghĩa là dữ liệu cần sạch, đầy đủ, đa dạng và đại diện. Hai, độ thiên lệch: AI học từ dữ liệu, nếu dữ liệu có định kiến thì AI tái tạo định kiến đó, chẳng hạn dữ liệu huấn luyện bác sĩ là nam, y tá là nữ gây phân biệt đối xử trong tuyển dụng. Ba, thuật toán: cần chọn thuật toán phù hợp với bài toán; Deep Learning không phải lúc nào cũng tốt nhất, bài toán đơn giản thì thuật toán đơn giản là đủ.",

 v:()=>GRID([[1,'Tập trung tài liệu','Phân tích sâu'],[3,'Tiết kiệm thời gian',''],[4,'Audio &amp; đa dạng đầu ra',''],[2,'Tích hợp hệ sinh thái','Google']])},
{t:"Nhược điểm của NotebookLM",d:38500,
 n:"Nhược điểm của NotebookLM. Một, chưa hoàn hảo về độ chính xác: như nhiều công cụ LLM, đôi khi tạo thông tin không chính xác, nên cần kiểm tra chéo với nguồn gốc. Hai, giới hạn định dạng và đa phương tiện: phiên bản đầu có thể chưa hỗ trợ video dài hay biểu đồ tương tác. Ba, quyền riêng tư: nếu tải tài liệu nhạy cảm, cần cẩn trọng khi chia sẻ và luôn kiểm tra cài đặt trước khi share. Bốn, mức phù hợp với môn học: tốt với môn cần đọc hiểu và tóm tắt, kém hơn ở bài toán logic cần bước chứng minh chi tiết.",
 v:()=>DEF(20,16,290,128,2,'Chưa hoàn hảo về độ chính xác',['Như nhiều công cụ LLM, đôi khi tạo ra','thông tin không chính xác','(hallucination) — cần kiểm tra chéo','với nguồn gốc.'],2.1,17,1.6)+DEF(330,16,290,128,2,'Giới hạn đa phương tiện',['Phiên bản đầu có thể chưa hỗ trợ một số','media phức tạp (video trong thời lượng','dài, biểu đồ tương tác).'],12.2,17,1.6)+DEF(20,160,290,128,2,'Quyền riêng tư và chia sẻ',['Nếu upload tài liệu nhạy cảm, cần cẩn','trọng khi dùng tính năng chia sẻ (luôn','kiểm tra setting trước khi share).'],20.4,17,1.6)+DEF(330,160,290,128,2,'Phù hợp môn học',['Tốt với môn cần đọc hiểu và tóm tắt;','kém hơn ở bài toán logic/giải bài tập','cần bước chứng minh chi tiết.'],29.1,17,1.6)},
{t:"Thực hành NotebookLM: đăng nhập và tạo notebook",d:18000,
 n:"Thực hành với NotebookLM. Bước một, đăng nhập: vào trang notebooklm chấm google bằng tài khoản Google, có thể cần quyền Workspace tùy tài khoản. Bước hai, tạo notebook mới, rồi tải lên tài liệu như PDF, slide, liên kết, hoặc dán văn bản.",
 v:()=>T(320,26,'5.1 THỰC HÀNH VỚI NOTEBOOKLM','m',0)+DEF(20,44,590,100,1,'1. Đăng nhập',['Vào https://notebooklm.google/ bằng Google account','(có thể cần quyền Workspace tùy tài khoản).'],2.0,17,2.2)+DEF(20,176,590,84,3,'2. Tạo notebook mới',['Upload tài liệu (PDF, slide, link) hoặc dán văn bản'],11.0,17,2.2)},
{t:"Thu thập nguồn và chọn nguồn cùng chủ đề",d:30000,
 n:"Bước hai chấm một: thu thập nguồn. Chọn một Youtuber bạn yêu thích, vào NotebookLM tạo notebook mới, bắt đầu với khoảng mười nguồn là video YouTube, ưu tiên video trên hai mươi phút vì lượng kiến thức cao hơn. Tiếp theo, chọn nguồn cùng một chủ đề: NotebookLM hoạt động tốt nhất khi các nguồn xoay quanh cùng một topic; có thể tải link YouTube trực tiếp, thêm PDF, Google Docs hoặc dán nội dung vào.",
 v:()=>DEF(20,30,290,200,1,'2.1 Thu thập nguồn',['• Chọn một Youtuber bạn yêu thích','• Vào NotebookLM và tạo notebook mới','• Bắt đầu với khoảng 10 nguồn (video','YouTube) bạn thích nhất','• Ưu tiên video trên 20 phút vì lượng','kiến thức cao hơn.'],1,28,2.0)+DEF(330,30,290,200,4,'2.1 Chọn nguồn cùng một chủ đề',['• NotebookLM hoạt động tốt nhất khi tất','cả nguồn xoay quanh cùng một topic','hoặc các chủ đề liên quan','• Upload link YouTube trực tiếp.','• Có thể thêm PDF, Google Docs, hoặc','copy-paste nội dung vào.'],15.8,28,2.0)},
{t:"Chat với tài liệu: giao diện NotebookLM",d:27000,
 n:"Giao diện NotebookLM có bốn vùng. Vùng một quản lý và hiển thị các tài liệu bạn tải lên để NotebookLM đọc và phân tích. Vùng hai là vùng chính của trang làm việc, dùng để tải tài liệu đầu tiên. Vùng ba là Studio, các công cụ AI tạo nội dung tự động dựa trên nguồn dữ liệu bạn đã thêm. Vùng bốn là nơi lưu kết quả đầu ra từ Studio hoặc các ghi chú bạn viết tay.",
 v:()=>P('rect','x="20" y="40" width="80" height="250" rx="10"','s1 f1',.5)+P('rect','x="108" y="40" width="120" height="250" rx="10"','s3 f3',.8)+P('rect','x="236" y="40" width="84" height="160" rx="10"','s4 f4',1.1)+P('rect','x="236" y="208" width="84" height="82" rx="10"','s2 f2',1.4)+[[60,165,'1',1,2.6],[168,165,'2',3,9.1],[278,120,'3',4,14.6],[278,249,'4',2,21.5]].map(o=>P('circle',`cx="${o[0]}" cy="${o[1]}" r="15"`,`s${o[3]}`,o[4])+T(o[0],o[1]+6,o[2],'b big',o[4]+.3)).join('')+[['1 · Nguồn',['Quản lý và hiển thị các tài liệu bạn tải','lên để NotebookLM đọc và phân tích.'],1,2.6],['2 · Vùng làm việc chính',['Dùng để tải tài liệu đầu tiên.'],3,9.1],['3 · Studio',['Các công cụ AI tạo nội dung tự động dựa','trên nguồn dữ liệu bạn đã thêm.'],4,14.6],['4 · Lưu kết quả',['Nơi lưu kết quả đầu ra từ Studio hoặc','các ghi chú bạn viết tay.'],2,21.5]].map((o,i)=>DEF(330,16+i*80,290,72,o[2],o[0],o[1],o[3],17,1.2)).join('')},
{t:"Sáu công cụ trong Studio",d:24500,
 n:"Studio có sáu công cụ. Một, tổng quan bằng âm thanh: tạo bản tóm tắt dạng podcast, hội thoại AI. Hai, tổng quan bằng video: tạo video tóm tắt nội dung. Ba, bản đồ tư duy: sinh sơ đồ ý tưởng chính. Bốn, báo cáo ngắn gọn, có cấu trúc. Năm, thẻ ghi nhớ: tạo flashcard dạng câu hỏi và trả lời. Sáu, bài kiểm tra: tạo quiz ôn tập.",
 v:()=>[['1','Tổng quan bằng âm thanh','Tóm tắt dạng podcast, hội thoại AI',1.8],['2','Tổng quan bằng video','Video tóm tắt nội dung',7.4],['3','Bản đồ tư duy','Sinh sơ đồ ý tưởng chính',11.5],['4','Báo cáo','Báo cáo ngắn gọn, có cấu trúc',14.9],['5','Thẻ ghi nhớ','Flashcard (câu hỏi – trả lời)',17.6],['6','Bài kiểm tra','Quiz ôn tập',21.9]].map((o,i)=>NR(i<3?40:350,30+(i%3)*96,o[0],[1,3,4,2,1,3][i],o[1],o[2],o[3])).join('')},
{t:"Chat với NotebookLM như thế nào?",d:24000,
 n:"Cách chat với NotebookLM. Bắt đầu bằng câu hỏi rộng, chẳng hạn: những ý tưởng chính từ các nguồn này là gì? Tiếp theo, yêu cầu NotebookLM tạo sơ đồ tư duy. Sau khi có cái nhìn tổng quan, hỏi những câu cụ thể hơn, ví dụ: chiến lược nào được đề cập nhiều nhất, hoặc làm thế nào để áp dụng ý này vào tình huống của tôi?",
 v:()=>DEF(20,16,590,84,1,'1. Bắt đầu bằng câu hỏi rộng',['Ví dụ: “Những ý tưởng chính từ các nguồn này là gì?”'],2.0,17,1.5)+DEF(20,112,590,56,3,'2. Yêu cầu NotebookLM tạo sơ đồ tư duy',[],8.2,17,1.5)+DEF(20,180,590,120,4,'3. Sau khi có cái nhìn tổng quan, hỏi câu cụ thể hơn',['Ví dụ: “Chiến lược nào được đề cập nhiều nhất?”','Ví dụ: “Làm thế nào để áp dụng ý này vào tình huống của tôi?”'],11.8,17,2.4)},
{t:"Thực hành và một số kết quả",d:12500,
 n:"Thực hành và một số kết quả. Trên một notebook mẫu, ta thử ba công cụ của Studio: tạo sơ đồ tư duy, tạo thẻ ghi nhớ, và tạo bài trắc nghiệm.",
 v:()=>T(320,40,'Thực hành và một số kết quả','h2',0)+IBOX(20,80,190,150,1,'chart','Sơ đồ tư duy',['Sinh sơ đồ ý tưởng','chính'],6.2)+IBOX(225,80,190,150,3,'book','Thẻ ghi nhớ',['Flashcard câu hỏi','– trả lời'],7.6)+IBOX(430,80,190,150,4,'list','Bài trắc nghiệm',['Quiz ôn tập'],9.1)},
{t:"Shakkeral: sáng tạo hình ảnh bằng AI",d:32500,
 n:"Phần năm điểm hai: ứng dụng GenAI trong xử lý và sáng tạo hình ảnh. Shakkeral là một nền tảng trực tuyến cho phép tạo và chỉnh sửa hình ảnh bằng trí tuệ nhân tạo, dùng mô hình tương tự Stable Diffusion, Lora, checkpoint. Điểm mạnh: thư viện hơn năm mươi nghìn mô hình có sẵn, gồm nhiều phong cách, lĩnh vực khác nhau; giao diện web, không cần tải phần mềm phức tạp; miễn phí để bắt đầu, có gói miễn phí, ảnh tạo ra không bị watermark.",
 v:()=>T(320,24,'5.2 ỨNG DỤNG GENAI TRONG XỬ LÝ VÀ SÁNG TẠO HÌNH ẢNH','m',0)+T(320,92,'Shakkeral','h1',3)+T(320,130,'Nền tảng tạo và chỉnh sửa ảnh bằng AI','big',6)+T(320,158,'(mô hình tương tự Stable Diffusion, Lora, checkpoint)','m',8)+CHIP(20,205,190,80,1,['Hơn 50.000 mô hình','nhiều phong cách'],14)+CHIP(225,205,190,80,3,['Giao diện web','không cần cài đặt'],19)+CHIP(430,205,190,80,4,['Miễn phí bắt đầu','ảnh không watermark'],24)},
{t:"Shakkeral: chức năng chính và nhược điểm",d:39000,
 n:"Các chức năng chính của Shakkeral: tạo ảnh từ văn bản, tùy chỉnh mô hình và phong cách, chỉnh sửa ảnh, quản lý và lưu lại lịch sử tạo ảnh, chia sẻ và kiếm mô hình. Về nhược điểm: gói miễn phí giới hạn số credits hoặc số lần tạo ảnh mỗi ngày; một số tính năng nâng cao như controlnet, attention có thể hạn chế hơn các công cụ chuyên sâu; vì là nền tảng trực tuyến nên phụ thuộc kết nối Internet ổn định; và tùy chỉnh chuyên sâu như tự huấn luyện mô hình lớn trên dữ liệu riêng không mạnh bằng dùng mô hình cài đặt riêng.",
 v:()=>DEF(20,16,290,230,1,'Chức năng chính',['Tạo ảnh từ văn bản (text-to-image)','Tùy chỉnh mô hình và phong cách','Chỉnh sửa ảnh','Quản lý, lưu lại lịch sử tạo ảnh','Chia sẻ và kiếm mô hình'],1,30,2.6)+DEF(330,16,290,300,2,'Nhược điểm',['Gói miễn phí giới hạn “credits” hoặc','số lần tạo ảnh mỗi ngày.','Tính năng nâng cao (controlnet,','attention…) kém công cụ chuyên sâu.','Phụ thuộc kết nối Internet ổn định.','Tùy chỉnh chuyên sâu (tự huấn luyện','mô hình lớn, dữ liệu riêng) không','mạnh bằng cài đặt mô hình riêng.'],17,24,2.2)},
{t:"Thực hành Shakkeral: đăng nhập và chọn mô hình",d:23500,
 n:"Thực hành với Shakkeral. Bước một, đăng ký hoặc đăng nhập: truy cập trang web chính thức, chọn Sign in. Bạn có thể đăng nhập bằng tài khoản Google hoặc Discord. Bước hai, chọn mô hình hoặc tải ảnh tham khảo: bạn có thể chọn một trong các mô hình có sẵn, hoặc tải ảnh của bạn làm tham khảo, gọi là image reference.",
 v:()=>T(320,30,'Thực hành với Shakkeral','h2',0)+NR(60,60,'1',1,'Đăng ký / đăng nhập','Vào trang web chính thức, chọn “Sign in”',2)+PILL(94,115,170,1,'Tài khoản Google',8)+PILL(280,115,170,4,'Tài khoản Discord',10)+NR(60,195,'2',3,'Chọn mô hình hoặc tải ảnh tham khảo','Dùng mô hình có sẵn hoặc ảnh của bạn (image reference)',13)+PILL(94,250,200,3,'Chọn mô hình có sẵn',18)+PILL(310,250,200,4,'Tải ảnh tham khảo',20)},
{t:"Thực hành Shakkeral: nhập prompt và thông số",d:50000,
 n:"Bước ba, nhập prompt và tùy chỉnh thông số: nhập mô tả bạn muốn tạo, chọn mô hình Lora hoặc checkpoint, điều chỉnh phong cách, hiệu ứng, kích thước. Ô nhập prompt chính là nơi bạn mô tả nội dung bức ảnh muốn AI tạo. Image to Image: tải một ảnh gốc để AI biến đổi dựa trên đó. Image Reference: tải ảnh làm mẫu phong cách hoặc khuôn mặt. Color Palette: chọn bảng màu tổng thể như pastel, warm, cold tone. Image Size: chọn kích thước ảnh đầu ra, ví dụ bảy sáu tám nhân một không hai bốn, hoặc một không hai bốn nhân một không hai bốn. Advanced: bật để tùy chỉnh sâu như seed, sampler, CFG scale, steps. Cuối cùng là nút khởi tạo ảnh.",
 v:()=>T(320,28,'Bước 3: nhập prompt và tùy chỉnh thông số','h2',0)+T(320,52,'Nhập mô tả, chọn mô hình (Lora, checkpoint), chỉnh phong cách, hiệu ứng, kích thước','m',1.5)+RW(20,72,290,66,1,'Ô nhập Prompt','Nơi mô tả nội dung bức ảnh muốn tạo',6)+RW(330,72,290,66,3,'Image to Image','Tải ảnh gốc để AI biến đổi theo đó',12.5)+RW(20,146,290,66,4,'Image Reference','Tải ảnh làm mẫu phong cách, khuôn mặt',19)+RW(330,146,290,66,2,'Color Palette','Chọn bảng màu: pastel, warm, cold…',25.5)+RW(20,220,290,66,1,'Image Size','Kích thước: 768×1024, 1024×1024…',32)+RW(330,220,290,66,3,'Advanced','Seed, sampler, CFG scale, steps…',38.5)+PILL(200,295,240,4,'Nút khởi tạo ảnh',46)},
{t:"Shakkeral: hai ví dụ prompt",d:33000,
 n:"Hai ví dụ prompt. Phong cách chân thực, Realistic Portrait: một cô gái trẻ đứng dưới ánh nắng dịu trong công viên, da tự nhiên, ánh sáng điện ảnh, ống kính tám mươi lăm mi li mét, siêu thực, bốn K, chi tiết cao, độ sâu trường ảnh nông. Phong cách anime: cô gái anime dễ thương mặc kimono đỏ, đứng dưới hoa anh đào, nụ cười nhẹ, nền chi tiết, phong cách Studio Ghibli, màu sắc rực rỡ. Hai slide sau đó cho thấy ảnh kết quả của từng prompt.",
 v:()=>T(320,36,'Hai ví dụ prompt','h2',0)+DEF(20,64,290,190,1,'Chân thực (Realistic Portrait)',['“A young woman standing under soft','sunlight in a park, natural skin','texture, cinematic lighting, 85mm','lens, ultra realistic, 4K, high','detail, shallow depth of field”'],2,22,1.8)+DEF(330,64,290,190,4,'Phong cách anime',['“Cute anime girl wearing a red','kimono, standing under cherry','blossoms, gentle smile, detailed','background, Studio Ghibli style,','vibrant colors”'],17,22,1.8)+T(165,290,'Kết quả: ảnh chân thực','m',12)+T(475,290,'Kết quả: ảnh anime','m',27)},
{t:"Sora: sáng tạo video bằng AI",d:41500,
 n:"Phần năm điểm ba: ứng dụng GenAI trong xử lý và sáng tạo video. Sora là dòng sản phẩm của OpenAI, cho phép chuyển prompt bằng văn bản, hoặc ảnh, clip tham chiếu, thành video ngắn với nhiều phong cách: điện ảnh, hoạt hình, photoreal. Các chức năng chính: tạo video từ văn bản; Remix hoặc Blend, sửa đổi hoặc hoán đổi chi tiết video đã tạo, như thay nhân vật, đổi không khí; Cameo hoặc avatar tái hiện, cho phép chèn hình, clip của người thật vào cảnh, cần xác minh bằng ghi hình; và công cụ chỉnh sửa trim, recut, loop, extend để tối ưu độ dài và mạch cảnh.",
 v:()=>T(320,24,'5.3 ỨNG DỤNG GENAI TRONG XỬ LÝ VÀ SÁNG TẠO VIDEO','m',0)+T(320,80,'Sora','h1',2.5)+T(320,112,'Sản phẩm / ứng dụng của OpenAI','big',5)+T(320,136,'Chuyển prompt (hoặc ảnh/clip tham chiếu) thành video ngắn','m',6.5)+T(320,156,'(điện ảnh, hoạt hình, photoreal…)','m',8)+CHIP(20,190,140,90,1,['Tạo video','từ văn bản'],16)+CHIP(173,190,140,90,3,['Remix / Blend','sửa, hoán đổi'],22)+CHIP(326,190,140,90,4,['Cameo / avatar','người thật'],28)+CHIP(479,190,140,90,2,['Trim, recut,','loop, extend'],34)+T(320,314,'Remix: thay nhân vật, đổi không khí. Cameo: cần xác minh bằng ghi hình','m',38)},
{t:"Sora: ưu điểm và nhược điểm",d:44500,
 n:"Ưu điểm của Sora: tạo video nhiều phong cách; dễ dùng, chỉ cần prompt ngắn là tạo ngay, có app và feed kiểu mạng xã hội trên iOS và Android; có công cụ remix, chỉnh sửa giúp biến ý tưởng thành sản phẩm gần hoàn chỉnh. Nhược điểm: hạn chế về người thật và deepfake, OpenAI đã giới hạn việc tạo và đăng video người thật để giảm lạm dụng, vẫn có lo ngại về deepfake và bản quyền; chất lượng và kiểm soát chuyển động phức tạp còn giới hạn so với quay thực tế, có thể xảy ra artefact; và quyền truy cập, giá: ban đầu là nhóm tester, gói trả phí hoặc giới hạn khu vực, còn hạn chế ở vài thị trường.",
 v:()=>DEF(20,16,290,300,3,'Ưu điểm',['Tạo video nhiều phong cách','Dễ dùng: prompt ngắn là tạo ngay;','có app / feed kiểu mạng xã hội','(iOS/Android).','Có công cụ remix, chỉnh sửa giúp ý','tưởng thành sản phẩm gần hoàn chỉnh.'],1,24,2.4)+DEF(330,16,290,300,2,'Nhược điểm',['Người thật / deepfake: OpenAI giới','hạn tạo, đăng video người thật; còn','lo ngại deepfake và bản quyền.','Chất lượng, kiểm soát chuyển động phức','tạp còn giới hạn so với quay thực tế;','có thể có artefact.','Quyền truy cập / giá: ban đầu nhóm','tester, gói trả phí hoặc giới hạn khu','vực; còn hạn chế ở vài thị trường.'],18,24,2.2)},
{t:"Thực hành Sora",d:43500,
 n:"Thực hành với Sora. Bước một, cài app Sora trên iOS hoặc Android, hoặc truy cập trang Sora của OpenAI. Bước hai, viết prompt mô tả cảnh, ngắn gọn kèm từ khóa phong cách; ví dụ: một cảnh điện ảnh mười giây ở khu phố neon sau cơn mưa, camera dolly chậm, photoreal, nhạc piano kịch tính. Bước ba, chọn style, aspect ratio, length; nếu có ảnh hoặc clip tham chiếu thì tải lên để Sora lấy làm nền. Bước bốn, bấm Generate, xem preview, và dùng Remix hoặc Recut nếu cần chỉnh sửa. Bước năm, nếu dùng Cameo thì làm theo bước ghi hình, ghi âm để xác minh và tạo avatar, lưu ý quyền riêng tư.",
 v:()=>NR(40,16,'1',1,'Cài app Sora hoặc vào trang Sora','App iOS/Android, hoặc trang Sora của OpenAI',1)+NR(40,78,'2',3,'Viết prompt mô tả cảnh','Ngắn gọn + từ khóa phong cách (cinematic, photoreal…)',8.5)+NR(40,140,'3',4,'Chọn style, aspect ratio, length','Có ảnh/clip tham chiếu thì tải lên làm nền',16)+NR(40,202,'4',2,'Generate → xem preview','Cần chỉnh sửa thì dùng Remix / Recut',23.5)+NR(40,264,'5',1,'Nếu dùng Cameo: ghi hình, ghi âm','Để xác minh, tạo avatar; lưu ý quyền riêng tư',31)},
{t:"Prompt là gì?",d:11500,
 n:"Phần sáu: thực hành minh họa prompt. Prompt là đoạn văn bản, câu lệnh hoặc câu hỏi mà người dùng gửi đến AI để nhận lại phản hồi phù hợp.",
 v:()=>T(320,28,'THỰC HÀNH MINH HỌA PROMPT','m',0)+T(320,96,'Prompt','h1',2)+T(320,134,'Đoạn văn bản, câu lệnh hoặc câu hỏi','big',4)+T(320,160,'người dùng gửi đến AI để nhận lại phản hồi phù hợp','m',5.5)+CHIP(40,215,140,60,1,['Người dùng'],6.5)+AR(180,245,245,7.2)+T(212,235,'prompt','m',7.4)+CHIP(250,215,140,60,3,['AI'],7.8)+AR(390,455,245,8.4)+CHIP(460,215,140,60,4,['Phản hồi'],8.8)},
{t:"Cấu trúc prompt: tám thành phần",d:46500,
 n:"Cấu trúc prompt gồm tám thành phần. Một, vai trò: xác định AI sẽ đóng vai ai để định hướng cách trả lời. Hai, mục tiêu: nêu rõ mục đích hoặc kết quả mong muốn của cuộc hội thoại. Ba, thông tin đầu vào: cung cấp dữ kiện, bối cảnh hoặc nội dung để AI xử lý. Bốn, nhiệm vụ cụ thể: mô tả hành động AI cần thực hiện. Năm, giới hạn: nêu rõ những điều cần tránh hoặc ràng buộc về định dạng, độ dài, nội dung. Sáu, phong cách diễn đạt: xác định giọng văn, cảm xúc hoặc phong cách giao tiếp mà AI nên dùng. Bảy, định dạng đầu ra: chỉ định cách trình bày kết quả. Tám, mẫu minh họa: cung cấp ví dụ để AI học phong cách mong muốn.",
 v:()=>RW(20,16,290,70,1,'1. Vai trò','Xác định AI sẽ đóng vai ai',1.5)+RW(20,94,290,70,3,'2. Mục tiêu','Mục đích, kết quả mong muốn',7.1)+RW(20,172,290,70,4,'3. Thông tin đầu vào','Dữ kiện, bối cảnh, nội dung để xử lý',12.7)+RW(20,250,290,70,2,'4. Nhiệm vụ cụ thể','Hành động AI cần thực hiện',18.3)+RW(330,16,290,70,1,'5. Giới hạn','Điều cần tránh, ràng buộc định dạng, độ dài',23.9)+RW(330,94,290,70,3,'6. Phong cách diễn đạt','Giọng văn, cảm xúc, phong cách giao tiếp',29.5)+RW(330,172,290,70,4,'7. Định dạng đầu ra','Cách trình bày kết quả',35.1)+RW(330,250,290,70,2,'8. Mẫu minh họa','Ví dụ để AI học phong cách mong muốn',40.7)},
{t:"Ví dụ prompt: tư vấn tài chính cá nhân",d:66000,
 n:"Ví dụ prompt hoàn chỉnh về tư vấn tài chính. Vai trò: bạn là chuyên gia tư vấn tài chính cá nhân với hơn mười năm kinh nghiệm, am hiểu đầu tư, tiết kiệm và quản lý rủi ro. Mục tiêu: giúp người dùng lập kế hoạch tài chính cá nhân tối ưu và đưa ra lời khuyên đầu tư an toàn, hiệu quả. Thông tin đầu vào: người dùng ba mươi tuổi, thu nhập hàng tháng ba mươi triệu đồng, muốn đầu tư hai trăm triệu đồng trong năm năm tới, chấp nhận rủi ro trung bình. Nhiệm vụ: phân tích tình hình tài chính hiện tại và đề xuất ba chiến lược đầu tư phù hợp, kèm lợi ích và rủi ro của từng phương án. Giới hạn: trả lời không quá hai trăm từ, tránh thuật ngữ tài chính khó hiểu. Phong cách: thân thiện, dễ hiểu, như một người bạn đáng tin cậy. Định dạng đầu ra: danh sách gạch đầu dòng, mỗi chiến lược có tiêu đề, mô tả ngắn, lợi ích và rủi ro. Phần mẫu minh họa được thể hiện ở ví dụ đầu ra ngay sau đây.",
 v:()=>DEF(20,16,290,76,1,'1. Vai trò',['Chuyên gia tư vấn tài chính cá nhân,', 'hơn 10 năm kinh nghiệm'],1,17,.4)+DEF(20,96,290,76,3,'2. Mục tiêu',['Lập kế hoạch tài chính tối ưu, lời', 'khuyên đầu tư an toàn, hiệu quả'],8,17,.4)+DEF(20,176,290,76,4,'3. Thông tin đầu vào',['30 tuổi, thu nhập 30 triệu/tháng,', 'đầu tư 200 triệu/5 năm, rủi ro trung bình'],15,17,.4)+DEF(20,256,290,76,2,'4. Nhiệm vụ cụ thể',['Phân tích tình hình tài chính, đề xuất', '3 chiến lược kèm lợi ích và rủi ro'],22,17,.4)+DEF(330,16,290,76,1,'5. Giới hạn',['Không quá 200 từ, tránh thuật ngữ', 'tài chính khó hiểu'],29,17,.4)+DEF(330,96,290,76,3,'6. Phong cách',['Thân thiện, dễ hiểu, như một người', 'bạn đáng tin cậy'],36,17,.4)+DEF(330,176,290,76,4,'7. Định dạng đầu ra',['Gạch đầu dòng: tiêu đề, mô tả ngắn,', 'lợi ích và rủi ro'],43,17,.4)+DEF(330,256,290,76,2,'8. Mẫu minh họa',['Thể hiện ở ví dụ đầu ra', 'ở cảnh kế tiếp'],50,17,.4)},
{t:"Ví dụ về đầu ra của prompt",d:22500,
 n:"Ví dụ về đầu ra của prompt này. Chiến lược một, gửi tiết kiệm ngân hàng: lợi ích là an toàn, lãi suất ổn định; rủi ro là lãi suất thấp, lợi nhuận hạn chế. Chiến lược hai, đầu tư quỹ mở: lợi ích là lợi nhuận cao hơn lãi suất tiết kiệm, đa dạng danh mục; rủi ro là biến động thị trường, có thể lỗ vốn.",
 v:()=>T(320,36,'Ví dụ về đầu ra','h2',0)+DEF(20,70,290,190,3,'Chiến lược 1: Tiết kiệm',['Gửi tiết kiệm ngân hàng','Lợi ích: an toàn, lãi suất ổn định.','Rủi ro: lãi suất thấp, lợi nhuận','hạn chế.'],1.5,26,1.6)+DEF(330,70,290,190,4,'Chiến lược 2: Quỹ mở',['Đầu tư quỹ mở','Lợi ích: lợi nhuận cao hơn lãi suất','tiết kiệm, đa dạng danh mục.','Rủi ro: biến động thị trường,','có thể lỗ vốn.'],11,26,1.3)},
{t:"Các kỹ thuật trong prompt",d:9000,
 n:"Các kỹ thuật trong prompt. Có ba kỹ thuật chính: kỹ thuật vai trò, kỹ thuật cấu trúc, và kỹ thuật tạo sản phẩm.",
 v:()=>T(320,40,'CÁC KỸ THUẬT TRONG PROMPT','h2',0)+CHIP(20,120,190,100,1,['Kỹ thuật','Vai trò'],2.5)+CHIP(225,120,190,100,3,['Kỹ thuật','Cấu trúc'],4.5)+CHIP(430,120,190,100,4,['Kỹ thuật','Tạo sản phẩm'],6.5)},
{t:"Kỹ thuật Vai trò",d:36500,
 n:"Kỹ thuật vai trò là giao vai trò cho AI để hướng nó trả lời đúng góc nhìn, chuyên môn hoặc phong cách bạn muốn. Lợi ích: câu trả lời sâu hơn, thực tế hơn, vì AI nhập vai chuyên gia, giảng viên, nhà nghiên cứu, sinh viên; và giảm lỗi trả lời chung chung. Cấu trúc prompt: hãy đóng vai là chuyên gia hoặc người trong vai trò cụ thể, và nhiệm vụ bạn muốn AI làm. Ví dụ: hãy đóng vai là một giảng viên kinh tế, giải thích khái niệm chi phí cơ hội cho sinh viên năm nhất bằng ví dụ dễ hiểu.",
 v:()=>DEF(20,16,600,74,1,'Kỹ thuật Vai trò',['Giao vai trò cho AI để trả lời đúng góc nhìn, chuyên môn hoặc phong cách bạn muốn.'],1,17,1)+DEF(20,100,600,104,3,'Lợi ích',['Câu trả lời sâu hơn, thực tế hơn vì AI “nhập vai” chuyên gia, giảng viên,','nhà nghiên cứu, sinh viên…','Giảm lỗi “trả lời chung chung”.'],9,17,1.6)+DEF(20,214,600,110,4,'Cấu trúc prompt',['Hãy đóng vai là [chuyên gia/vai trò cụ thể], và [nhiệm vụ bạn muốn AI làm].','Ví dụ: Hãy đóng vai là một giảng viên kinh tế, giải thích khái niệm','“chi phí cơ hội” cho sinh viên năm nhất bằng ví dụ dễ hiểu.'],22,17,2.2)},
{t:"Kỹ thuật Cấu trúc",d:46000,
 n:"Kỹ thuật cấu trúc là đưa ra khung định dạng rõ ràng để AI sắp xếp câu trả lời logic, có trình tự, như What, Why, How, ba bước, năm ý. Kỹ thuật này giúp AI tư duy mạch lạc, không lan man. Nó phù hợp khi bạn cần lập dàn ý, kế hoạch, quy trình hoặc phân tích, và khi soạn bài thuyết trình, báo cáo, outline, đề cương. Cấu trúc prompt: hãy trình bày câu trả lời theo cấu trúc What, Why, How; hoặc chia câu trả lời thành ba phần: giới thiệu, nội dung, kết luận. Ví dụ: hãy lập dàn ý phân tích quyết định mua laptop mới cho sinh viên. What: lợi ích trực tiếp. Why: chi phí cơ hội là gì. How: các bước ra quyết định hợp lý.",
 v:()=>DEF(20,16,290,150,1,'Kỹ thuật Cấu trúc',['Đưa khung định dạng rõ ràng để AI','sắp xếp câu trả lời có trình tự','(What – Why – How, 3 bước, 5 ý…).','Giúp AI tư duy mạch lạc, không lan man.'],1,20,1.8)+DEF(330,16,290,150,3,'Phù hợp khi cần',['Lập dàn ý, kế hoạch, quy trình,','hoặc phân tích.','Soạn bài thuyết trình, báo cáo,','outline, đề cương.'],14,20,1.8)+DEF(20,176,290,150,4,'Cấu trúc prompt',['Hãy trình bày câu trả lời theo cấu','trúc: (What) … (Why) … (How) …','Hoặc: chia câu trả lời thành 3 phần:','Giới thiệu – Nội dung – Kết luận.'],26,20,1.8)+DEF(330,176,290,150,2,'Ví dụ: mua laptop cho sinh viên',['Lập dàn ý quyết định mua laptop mới:','What: lợi ích trực tiếp.','Why: chi phí cơ hội là gì.','How: các bước ra quyết định hợp lý.'],38,20,1.8)},
{t:"Kỹ thuật Tạo sản phẩm",d:51000,
 n:"Kỹ thuật tạo sản phẩm là yêu cầu AI tạo ra một sản phẩm cụ thể như bảng, checklist, đoạn văn, bài đăng mạng xã hội, infographic nội dung, câu hỏi, đoạn hội thoại. Mục tiêu: từ lý thuyết hoặc thông tin, biến thành sản phẩm thực tế, dùng được ngay. Kỹ thuật này dùng trong học tập, truyền thông hoặc công việc, để tạo nội dung, tóm tắt, thiết kế ý tưởng, giúp người học thấy kết quả cụ thể thay vì chỉ lý thuyết. Cấu trúc prompt: hãy tạo dạng sản phẩm về chủ đề nội dung cụ thể, có các phần theo yêu cầu định dạng. Ví dụ: hãy tạo bảng so sánh hai lựa chọn chi tiêu, mua khóa học tiếng Anh online và đi du lịch ba ngày, gồm các cột chi phí, lợi ích ngắn hạn, lợi ích dài hạn, rủi ro.",
 v:()=>DEF(20,16,600,100,1,'Kỹ thuật Tạo sản phẩm',['Yêu cầu AI tạo sản phẩm cụ thể: bảng, checklist, đoạn văn, bài đăng','mạng xã hội, infographic nội dung, câu hỏi, đoạn hội thoại…','Mục tiêu: biến lý thuyết, thông tin thành sản phẩm dùng ngay.'],1,17,3)+DEF(20,126,600,86,3,'Dùng trong học tập, truyền thông, công việc',['Tạo nội dung, tóm tắt, thiết kế ý tưởng.','Giúp người học thấy kết quả cụ thể thay vì chỉ lý thuyết.'],20,17,3)+DEF(20,222,600,106,4,'Cấu trúc prompt và ví dụ',['Hãy tạo [dạng sản phẩm] về chủ đề [nội dung cụ thể], có các phần: [yêu cầu định dạng].','Ví dụ: tạo bảng so sánh “Mua khóa học tiếng Anh online” và “Đi du lịch 3 ngày”,','gồm các cột: Chi phí, Lợi ích ngắn hạn, Lợi ích dài hạn, Rủi ro.'],40,17,4)},
{t:"ChatGPT: giao diện",d:18500,
 n:"Phần thực hành minh họa với ChatGPT. Giao diện ChatGPT gồm các khu vực chính. Nút thu nhỏ sidebar. Công cụ hỗ trợ như tạo chat mới, tìm kiếm. Danh sách các đoạn chat đã tạo. Nơi viết prompt. Chức năng hỗ trợ nâng cao. Và thông tin về tài khoản.",
 v:()=>T(320,34,'THỰC HÀNH MINH HỌA: CHATGPT','h2',0)+RW(20,60,290,70,1,'Thu nhỏ thanh bên','Nút thu nhỏ sidebar',2.0)+RW(330,60,290,70,3,'Công cụ hỗ trợ','Tạo chat mới, tìm kiếm…',4.4)+RW(20,146,290,70,4,'Danh sách đoạn chat','Các đoạn chat đã tạo',6.8)+RW(330,146,290,70,2,'Nơi viết prompt','Ô nhập câu hỏi, câu lệnh',9.2)+RW(20,232,290,70,1,'Chức năng nâng cao','Các chức năng hỗ trợ nâng cao',11.6)+RW(330,232,290,70,3,'Thông tin tài khoản','Thông tin về tài khoản',14.0)},
{t:"Thực hành ChatGPT: hỏi đáp",d:15000,

/* ====== BỘ PHÁT ====== */
const $=id=>document.getElementById(id);
const stage=$('stage'),fig=$('fig'),ttl=$('ttl'),cap=$('cap'),seg=$('seg'),btn=$('play'),vb=$('voice'),cnt=$('cnt');
let i=0,el=0,last=performance.now(),playing=true,done=false,voice=false,sd=true,tok=0;

SCENES.forEach((s,k)=>{const b=document.createElement('button');b.setAttribute('aria-label','Phần '+(k+1)+': '+s.t);b.onclick=()=>jump(k);seg.appendChild(b)});

function speak(){
  if(!('speechSynthesis' in window)){sd=true;return}
  speechSynthesis.cancel();const k=++tok;
  const u=new SpeechSynthesisUtterance(SCENES[i].n);u.lang='vi-VN';u.rate=.95;sd=false;
  u.onend=u.onerror=()=>{if(k===tok)sd=true};
  speechSynthesis.speak(u);if(!playing)speechSynthesis.pause();
}
function fit(svg){const rs=[...svg.querySelectorAll('rect')].map(r=>({x:+r.getAttribute('x'),y:+r.getAttribute('y'),w:+r.getAttribute('width'),h:+r.getAttribute('height')})).filter(r=>r.w<600);
  svg.querySelectorAll('text').forEach(t=>{const w=t.getComputedTextLength();if(!w)return;const x=+t.getAttribute('x'),y=+t.getAttribute('y'),mid=t.getAttribute('text-anchor')==='middle';
    const r=rs.filter(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h).sort((p,q)=>p.w-q.w)[0];if(!r)return;
    const room=mid?r.w-16:r.x+r.w-8-x;if(w>room){t.setAttribute('textLength',room);t.setAttribute('lengthAdjust','spacingAndGlyphs')}})}
function show(n){
  i=n;el=0;sd=true;const s=SCENES[n];
  fig.innerHTML=`<svg viewBox="0 0 640 360" role="img" aria-label="${s.t}">${DEFS}${s.v()}</svg>`;
  fit(fig.firstChild);
  ttl.classList.remove('t');cap.classList.remove('t');void ttl.offsetWidth;ttl.classList.add('t');cap.classList.add('t');
  ttl.textContent=s.t;cap.textContent=s.n;cnt.textContent=(n+1)+' / '+SCENES.length;
  if(voice)speak();
}
function sync(){stage.classList.toggle('paused',!playing);btn.textContent=done?'Xem lại':playing?'Tạm dừng':'Phát'}
function jump(n){done=false;playing=true;show(n);sync()}
btn.onclick=()=>{
  if(done){jump(0);return}
  playing=!playing;sync();
  if(voice&&'speechSynthesis' in window)playing?speechSynthesis.resume():speechSynthesis.pause();
};
$('prev').onclick=()=>jump(Math.max(0,i-(el>2000?0:1)));
$('next').onclick=()=>jump(Math.min(SCENES.length-1,i+1));
vb.onclick=()=>{
  voice=!voice;vb.textContent='Giọng đọc: '+(voice?'Bật':'Tắt');vb.setAttribute('aria-pressed',voice);
  if(voice)speak();else{tok++;sd=true;if('speechSynthesis' in window)speechSynthesis.cancel()}
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='BUTTON')return;
  if(e.code==='Space'){e.preventDefault();btn.click()}
  if(e.code==='ArrowRight')$('next').click();
  if(e.code==='ArrowLeft')$('prev').click();
});

function tick(ts){
  const dt=Math.min(ts-last,100);last=ts;
  if(playing){
    el+=dt;const d=SCENES[i].d;
    if(el>=d&&(sd||el>d+6000)){
      if(i<SCENES.length-1)show(i+1);else{playing=false;done=true;sync()}
    }
  }
  [...seg.children].forEach((b,k)=>b.style.setProperty('--p',(k<i||(done&&k===i)?100:k===i?Math.min(el/SCENES[i].d,1)*100:0)+'%'));
  requestAnimationFrame(tick);
}
show(0);sync();requestAnimationFrame(tick);
</script>
