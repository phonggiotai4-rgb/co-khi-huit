<style>

<script>
var S=[
{t:"Đề bài",f:"AB = h√2 · ω₁ = ω (↺), ε₁ = 0",n:"Tay quay AB (khâu 1) quay quanh A cố định với ω₁ = ω ngược chiều kim đồng hồ và ε₁ = 0. Con trượt 2 trượt dọc AB và đẩy khâu 3 chạy trên đường nằm ngang HC, cách A một khoảng h. Vì AB nghiêng 45° nên AB = h√2. Cần tìm v₂₁, aʳ₂₁, v₃ và a₃."},
{t:"Vận tốc của B₁",f:"v_B1 = AB·ω₁ = h√2·ω, v_B1 ⊥ AB (↖)",n:"B₁ thuộc khâu 1 quay quanh A, vận tốc vuông góc AB theo chiều ω₁, tức hướng lên-trái, độ lớn AB·ω₁ = h√2·ω."},
{t:"Phương trình vận tốc",f:"v_B2 = v_B3 = v₃ ∥ HC · v_B2 = v_B1 + v₂₁, v₂₁ ∥ AB",n:"B₂ trùng B₃ nên v_B2 = v₃ nằm ngang. Vận tốc tuyệt đối của B₂ bằng vận tốc theo (của B₁) cộng vận tốc tương đối v₂₁ dọc AB. Đã biết v_B1, chưa biết độ lớn của v₂₁ và v₃."},
{t:"Tam giác vận tốc",f:"v₂₁ = v_B1 = h√2·ω (↙) · v₃ = v_B2 = 2hω (←)",n:"Từ cực p vẽ v_B1 chếch lên-trái. Từ mút kẻ đường song song AB cho v₂₁, từ p kẻ đường nằm ngang cho v_B2, hai đường cắt nhau. Tam giác vuông cân tại mút v_B1 nên v₂₁ = h√2·ω hướng xuống-trái và v_B2 = √2·h√2·ω = 2hω hướng sang trái."},
{t:"Phương trình gia tốc",f:"a₃ = a_B1 + aᵏ₂₁ + aʳ₂₁",n:"Do ε₁ = 0 nên a_B1 chỉ có thành phần pháp AB·ω₁² = h√2·ω², hướng về A. Gia tốc Coriolis aᵏ₂₁ = 2ω₁·v₂₁ = 2√2·hω², vuông góc AB; hướng của v₂₁ quay 90° theo chiều ω₁ nên hướng xuống-phải. aʳ₂₁ song song AB và a₃ nằm ngang chưa biết độ lớn."},
{t:"Đa giác gia tốc",f:"π → a_B1 → aᵏ₂₁ → aʳ₂₁, mút nằm trên đường ngang qua π",n:"Từ cực π vẽ a_B1 xuống-trái, nối tiếp aᵏ₂₁ xuống-phải, rồi aʳ₂₁ dọc AB đi lên-phải cho tới khi chạm đường nằm ngang qua π. Giao điểm đó là mút của a₃."},
{t:"Tìm aʳ₂₁ và a₃",f:"Oy: −1 − 2 + aʳ/√2 = 0 ⇒ aʳ₂₁ = 3√2·hω² · Ox: a₃ = −1 + 2 + 3 = 4hω²",n:"Chiếu theo đơn vị hω². Phương thẳng đứng: −1 − 2 + aʳ/√2 = 0 nên aʳ₂₁ = 3√2·hω², hướng lên-phải. Phương ngang: a₃ = −1 + 2 + 3 = 4, tức a₃ = 4hω², hướng sang phải."},
{t:"Kết quả",f:"v₂₁ = h√2·ω ↙ · aʳ₂₁ = 3√2·hω² ↗ · v₃ = 2hω ← · a₃ = 4hω² →",n:"Bốn đại lượng cần tìm: v₂₁ = h√2·ω hướng xuống-trái, aʳ₂₁ = 3√2·hω² hướng lên-phải, v₃ = 2hω hướng sang trái và a₃ = 4hω² hướng sang phải."}
];

S.forEach(function(_,k){var b=document.createElement("button");b.setAttribute("aria-label","Bước "+(k+1));b.onclick=function(){go(k)};dots.appendChild(b)});
function dur(k){return 2500+S[k].n.length*45}
function sched(ms){clearTimeout(timer);timer=setTimeout(function(){if(i<S.length-1)go(i+1);else stop()},ms)}

document.getElementById("play").textContent=i===S.length-1?"↻ Xem lại":"▶ Phát";fill.style.transition="none";fill.style.width="0"}
function go(k){i=k;clearTimeout(timer);try{speechSynthesis.cancel()}catch(e){}
es.forEach(function(e){var s=e.getAttribute("data-s").split(",");e.classList.toggle("on",s.indexOf(String(k))>-1)});
document.getElementById("step").textContent="Bước "+(k+1)+" / "+S.length;
document.getElementById("title").textContent=S[k].t;
document.getElementById("formula").textContent=S[k].f;
document.getElementById("narr").textContent=S[k].n;
Array.prototype.forEach.call(dots.children,function(d,j){d.className=j===k?"cur":""});
fill.style.transition="none";fill.style.width="0";
if(playing){document.getElementById("play").textContent="❚❚ Dừng";void fill.offsetWidth;
if(voice&&window.speechSynthesis){fill.style.width="0";var u=new SpeechSynthesisUtterance(S[k].n);u.lang="vi-VN";
u.onend=function(){if(playing)finish()};u.onerror=function(){sched(dur(k))};speechSynthesis.speak(u)}
else{fill.style.transition="width "+dur(k)+"ms linear";fill.style.width="100%";sched(dur(k))}}
else document.getElementById("play").textContent=k===S.length-1?"↻ Xem lại":"▶ Phát"}
function finish(){if(i<S.length-1)timer=setTimeout(function(){go(i+1)},1200);else stop()}
document.getElementById("play").onclick=function(){if(playing){stop();return}
playing=true;go(i===S.length-1?0:i)};
document.getElementById("prev").onclick=function(){var p=playing;playing=false;go(Math.max(0,i-1));if(p){playing=true;go(i)}};
document.getElementById("next").onclick=function(){var p=playing;playing=false;go(Math.min(S.length-1,i+1));if(p){playing=true;go(i)}};
var vb=document.getElementById("voice");
if(!window.speechSynthesis)vb.style.display="none";
vb.onclick=function(){voice=!voice;vb.classList.toggle("on",voice);if(playing)go(i)};
go(0);
(function(){var AX=190,AY=240,H=90,th=45,dir=1,run=true,sp=.6,show=true,last=null,K=22;var $=function(i){return document.getElementById(i)};
function f3(x){return x.toFixed(3).replace('.',',')}
function setL(id,x1,y1,x2,y2){var e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}
function draw(){var t=th*Math.PI/180,s=Math.sin(t),c=Math.cos(t),bx=AX+H*c/s,by=AY-H;
setL('sAB',AX,AY,bx,by);setL('sL3',bx,by,Math.min(bx+60,372),by);
var ux=c,uy=-s,px=s,py=c,pts=[[bx+22*ux+9*px,by+22*uy+9*py],[bx+22*ux-9*px,by+22*uy-9*py],[bx-22*ux-9*px,by-22*uy-9*py],[bx-22*ux+9*px,by-22*uy+9*py]];
$('sSl').setAttribute('points',pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' '));
$('sB').setAttribute('cx',bx);$('sB').setAttribute('cy',by);$('tB').setAttribute('x',bx-18);$('tB').setAttribute('y',by-12);
var v3=-dir/(s*s),v21=-dir*c/(s*s),vb1x=-dir/s*s*0,a3=2*c/(s*s*s);
var bX=-dir*K,bY=-dir*K*c/s;
['v1','v2','v3'].forEach(function(id){$(id).style.display=show?'':'none'});
setL('v1',bx,by,bx+bX,by+bY);setL('v2',bx,by,bx+K*v21*c,by-K*v21*s);setL('v3',bx,by,bx+K*v3,by);
var dg=th;$('rd').innerHTML='θ = '+Math.round(dg)+'°<br>v₃ = '+f3(Math.abs(v3))+' hω ('+(v3<0?'←':'→')+') · a₃ = '+f3(Math.abs(a3))+' hω² ('+(a3<0?'←':'→')+')<br>v₂₁ = '+f3(Math.abs(v21))+' hω';
$('sTh').value=th}
function tick(t){if(last===null)last=t;var dt=Math.min((t-last)/1000,.1);last=t;if(run){th+=dir*dt*sp*57.2958;if(th>145){th=145;dir=-1}if(th<35){th=35;dir=1}draw()}requestAnimationFrame(tick)}
$('sPlay').onclick=function(){run=!run;this.textContent=run?'❚❚ Dừng':'▶ Chạy'};
$('sReset').onclick=function(){th=45;dir=1;run=false;$('sPlay').textContent='▶ Chạy';draw()};
$('sVec').onclick=function(){show=!show;this.classList.toggle('on',show);draw()};
$('sSp').oninput=function(){sp=parseFloat(this.value)};
$('sTh').oninput=function(){run=false;$('sPlay').textContent='▶ Chạy';th=parseFloat(this.value);draw()};
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){run=false;$('sPlay').textContent='▶ Chạy'}
draw();requestAnimationFrame(tick)})();
</script></body></html>
