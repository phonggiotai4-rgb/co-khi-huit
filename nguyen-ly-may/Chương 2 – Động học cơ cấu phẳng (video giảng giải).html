<style>
:root{--bg:#fbfaf4;--ink:#1f2a37;--mut:#6b7280;--ac:#2563eb;--or:#e07b00;--hl:#fde68a;--card:#fff;--ln:#e3e8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--ink:#e5e7eb;--mut:#9ca3af;--ac:#60a5fa;--hl:#713f12;--card:#1f2937;--ln:#2b3646;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111827;--ink:#e5e7eb;--mut:#9ca3af;--ac:#60a5fa;--hl:#713f12;--card:#1f2937;--ln:#2b3646;color-scheme:dark}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px 12px 88px}
h1{font-size:1.15rem;margin:4px 0 8px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
nav button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:16px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.board{background-color:var(--card);background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--ln);border-radius:12px;padding:14px;min-height:300px}
.board h2{margin:0 0 8px;font-size:1.05rem;color:var(--ac)}
#st{font-size:.8rem;font-weight:400;color:var(--mut);margin-left:6px}
#ln div{padding:4px 10px;margin:4px 0;border-radius:6px;border-left:3px solid transparent;font-size:1.1rem;opacity:.7;overflow-wrap:anywhere}
#ln div.n{opacity:1;font-weight:600;border-left-color:var(--ac);animation:fl 1.4s}
@keyframes fl{from{background:var(--hl)}to{background:transparent}}
#sub{margin:10px 0;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:6px;min-height:4.5em;font-size:1.08rem}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--ln)}
.bar select{border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 4px;font:inherit}
.bar button{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.bar input{flex:1;min-width:0}
small{color:var(--mut);display:block;margin-top:8px}
#fig svg{width:100%;max-height:230px;margin-top:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px}
#fig svg.tall{max-height:340px}
#fig text{fill:var(--mut);font-size:11px}
.o{fill:none;stroke:var(--ac);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2s forwards}

.j{fill:var(--card);stroke:var(--or);stroke-width:2.6}
@keyframes dr{to{stroke-dashoffset:0}}
.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sp 3s ease-in-out infinite alternate}
@keyframes sp{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em;line-height:1.25}.fr>span{padding:0 4px}.fr>span:first-child{border-bottom:1.5px solid currentColor}
sub{font-size:.72em;line-height:0}
.fm{display:inline-block;margin:3px 2px;padding:3px 11px;border:2px solid var(--ac);border-radius:7px;background:var(--bg);color:var(--ink);font-weight:800;font-size:1.06em}
@media print{.fm{border-color:#000;background:#fff;color:#000}}
.d3{animation:d3 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes d3{0%,100%{transform:none}10%{transform:translateX(45px)}22%{transform:translateX(-45px)}34%,38%{transform:none}48%{transform:translateY(-24px)}60%{transform:translateY(20px)}70%,74%{transform:none}84%{transform:rotate(28deg)}94%{transform:rotate(-28deg)}}
.gcw,.gcc{animation:rt 5s linear infinite;transform-box:fill-box;transform-origin:center}.gcc{animation-direction:reverse}@keyframes rt{to{transform:rotate(360deg)}}
.l1,.l2,.l3{fill:none;stroke-width:5;stroke-linecap:round}.l1{stroke:var(--ac)}.l2{stroke:var(--or)}.l3{stroke:#16a34a}
.sl{animation:sld 2.4s ease-in-out infinite alternate}@keyframes sld{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
#sim{margin-top:8px}#sim label{display:inline-flex;gap:6px;align-items:center;margin-right:12px;font-size:.9rem}
#de{margin:0 0 8px;padding:8px 12px;border:1px dashed var(--ac);border-radius:8px;background:var(--bg);font-size:.95rem}#de:empty{display:none}
#lg{margin-top:8px;padding:6px 12px;border-left:3px solid var(--or);background:var(--bg);border-radius:6px;font-size:.93rem}#lg:empty{display:none}#lg div{margin:2px 0}.sy{display:inline-block;min-width:2.4em;font-weight:800;font-style:italic;color:var(--ac)}
#tb{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}#tb button{flex:none;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:8px;padding:3px 10px;font:inherit;font-size:.82rem;cursor:pointer}#tb button.on{border-color:var(--or);background:var(--or);color:#fff}
#sheet{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);color:var(--ink);padding:14px 14px 40px}#sheet[hidden]{display:none}#sheet h2{margin:0 0 4px;font-size:1.15rem}#sheet .tb{display:flex;gap:8px;margin:8px 0 12px}#sheet .tb button{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}#sheet .gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}#sheet .cd{border:1px solid var(--ln);border-radius:10px;padding:8px 11px;background:var(--card);break-inside:avoid;font-size:.92rem}#sheet .cd b{display:block;margin-bottom:3px}#sheet .w{color:#b45309;font-size:.85rem}
@media print{main{display:none!important}#sheet{position:static;overflow:visible;background:#fff;color:#000;padding:0}#sheet .tb{display:none}#sheet .gr{grid-template-columns:1fr 1fr;gap:6px}#sheet .cd{background:#fff;font-size:11px;padding:5px 8px;border-color:#999}#sheet .w{color:#000}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.o{stroke-dashoffset:0}}
</style></head><body><main>
<h1>Chương 2. Động học cơ cấu phẳng</h1>
<nav id="nv"></nav><div id="tb"></div>
<section class="board"><h2><span id="ct"></span><span id="st"></span></h2><div id="de"></div><div id="ln"></div><div id="lg"></div><div id="fig"></div><div id="sim" hidden></div></section>
<div id="sub"></div>
<div class="bar"><button id="pv">◀ Trước</button><button id="pl">▶ Phát</button><button id="nx">Tiếp ▶</button><button id="cs">Tờ ôn</button><select id="sp" title="Tốc độ đọc"><option value="0.85">0,85×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option></select><input type="range" id="pr" min="0" value="0" aria-label="Tiến độ"></div>
<small>Giọng đọc dùng giọng tiếng Việt của trình duyệt; nếu máy không có, bài tự chuyển bước theo độ dài câu.</small>
</main><div id="sheet" hidden></div><script>const C=[],S=[],ch=t=>C.push(t),T=(say,ln=[],k)=>S.push({c:C.length-1,say,ln,k});

ch('2.0 Ôn tập động học điểm');
T('Ôn lại động học điểm và vật rắn trước khi vào cơ cấu. Vận tốc điểm M luôn tiếp tuyến với quỹ đạo. Gia tốc tách thành hai thành phần vuông góc nhau: pháp tuyến a_n và tiếp tuyến a_t.',['v_M tiếp tuyến quỹ đạo','a = a_n + a_t','a_n ⟂ a_t'],'rig');
T('Gia tốc pháp tuyến hướng vào mặt lõm quỹ đạo, độ lớn a_n = v²/ρ = ω²·r. Gia tốc tiếp tuyến độ lớn a_t = dv/dt = ε·r. Độ lớn toàn phần a = √(a_n² + a_t²). Góc α giữa a và a_n thỏa tan α = a_t/a_n.',['a_n = v²/ρ = ω²r (hướng vào tâm cong)','a_t = εr (vuông góc a_n)','a = √(a_n²+a_t²) ; tan α = a_t/a_n']);
T('Vật rắn quay quanh trục cố định: mọi điểm cùng ω, ε. Vận tốc dài v = ω·r, phân bố theo quy luật tam giác vuông. Khi bài vận tốc đã giải thì ω biết, nên a_n chắc chắn xác định được.',['v = ω·r (phân bố tam giác vuông)','ω, ε chung cho mọi điểm','a_n xác định khi ω đã biết']);
T('Chuyển động song phẳng: v_B = v_A + v_BA (v_BA ⟂ AB, = AB·ω). Gia tốc a_B = a_A + a_BA^n + a_BA^t. Hợp chuyển động thêm gia tốc Coriolis a_c = 2ω_e×v_r, độ lớn 2ω_e·v_r; chiều quay v_r 90° theo chiều ω_e.',['v_B = v_A + v_BA','a_B = a_A + a^n + a^t','a_c = 2ω_e·v_r (quay v_r 90° theo ω_e)']);
ch('2.1 Hai điểm cùng khâu');
T('Chương hai tìm vận tốc và gia tốc của các khâu. Xét hai điểm A và B thuộc cùng một khâu i, tức cùng một vật rắn. Vận tốc điểm B bằng vận tốc điểm A cộng vận tốc tương đối của B quanh A. Vận tốc tương đối vuông góc với AB và có độ lớn AB nhân omega.',['v_Bi = v_Ai + v_BiAi','v_BiAi ⊥ AB','v_BiAi = AB·ω_i'],'rig');
T('Gia tốc cũng tách tương tự: a B bằng a A cộng thành phần pháp tuyến cộng thành phần tiếp tuyến. Thành phần pháp tuyến hướng từ B về A, độ lớn AB nhân omega bình phương. Thành phần tiếp tuyến vuông góc AB, độ lớn AB nhân epsilon.',['a_Bi = a_Ai + a_BiAi^n + a_BiAi^t','a^n hướng B → A, a^n = AB·ω²','a^t ⊥ AB, a^t = AB·ε']);
T('Nhớ rằng mỗi điểm phải ghi rõ thuộc khâu nào, ví dụ B 2 là điểm B của khâu 2. Hai điểm B 1 và B 2 trùng nhau tại một bản lề thì có cùng vận tốc và cùng gia tốc.',['Luôn ghi: điểm M thuộc khâu i → M_i','Bản lề: v_B2 = v_B1 ; a_B2 = a_B1']);

ch('2.2 Hai điểm trùng nhau');
T('Khi hai khâu i và j trượt trên nhau, lấy hai điểm A i và A j trùng nhau tại một vị trí. Vận tốc A i bằng vận tốc A j cộng vận tốc trượt tương đối, song song phương trượt. Hai khâu trượt trên nhau thì quay cùng tốc độ.',['v_Ai = v_Aj + v_AiAj','v_AiAj ∥ phương trượt','ω_i = ω_j ; ε_i = ε_j'],'sli');
T('Gia tốc có thêm thành phần Coriolis. a A i bằng a A j cộng a Coriolis cộng a tương đối. Thành phần tương đối song song phương trượt. Coriolis bằng hai nhân omega nhân vận tốc tương đối.',['a_Ai = a_Aj + a_k + a_r','a_k = 2ω_i × v_AiAj','a_r ∥ phương trượt']);
T('Cách xác định chiều Coriolis: lấy vector vận tốc tương đối rồi quay đi 90 độ theo chiều quay omega của khâu. Độ lớn là hai omega nhân v tương đối. Nếu vận tốc tương đối bằng không thì Coriolis bằng không.',['Chiều a_k: quay v_rel 90° theo chiều ω','|a_k| = 2·ω·v_rel']);

ch('2.3 Họa đồ vector');
T('Phương pháp họa đồ: viết phương trình vector, ghi dưới mỗi vector phương và độ lớn. Mỗi phương trình vector giải được khi có tối đa hai ẩn. Mỗi ẩn là một độ lớn, vì phương đã biết.',['Ghi dưới mỗi vector: phương, chiều, độ lớn','Tối đa 2 ẩn mỗi phương trình','Cách giải: vẽ họa đồ hoặc chiếu lên 2 trục']);
T('Giải bằng họa đồ: từ gốc p, vẽ các vector đã biết nối đuôi nhau, rồi vẽ hai đường theo phương của hai ẩn. Giao điểm cho kết quả. Cách chiếu lên hai trục cho cùng kết quả. Định lý đồng dạng: hình vận tốc, hình gia tốc của một khâu đồng dạng với khâu đó.',['Họa đồ vận tốc: gốc p ; gia tốc: gốc π','Chiếu x, y ⇔ họa đồ','Hình vận tốc ∼ khâu ; hình gia tốc ∼ khâu']);

ch('2.4 Ba trường hợp bài toán');
T('Sổ tay tổng kết: để tìm vận tốc, gia tốc của một điểm hay một khâu trong cơ cấu phẳng, phân thành ba trường hợp. Trường hợp một: điểm thuộc khâu quay quanh trục cố định. Trường hợp hai: khâu chuyển động song phẳng. Trường hợp ba: hai khâu trượt trên nhau, dạng Culit.',['TH1: điểm quay quanh trục cố định','TH2: chuyển động song phẳng','TH3: hai khâu trượt (Culit)']);
T('Trường hợp một: điểm M quay quanh trục cố định TM. Vận tốc v bằng TM nhân omega, vuông góc TM, chiều theo chiều omega. Gia tốc gồm pháp tuyến a_n bằng TM nhân omega bình phương, hướng về tâm, và tiếp tuyến a_t bằng TM nhân epsilon, vuông góc TM.',['TH1: v = TM·ω ⊥ TM (theo ω)','a_n = TM·ω² (hướng về tâm)','a_t = TM·ε ⊥ TM'],'rig');
T('Trường hợp hai: khâu chuyển động song phẳng, ví dụ v_M3 = v_M3′ + v_M3M3. Gia tốc tương đối giữa hai điểm M, N của khâu có pháp tuyến MN nhân omega bình phương và tiếp tuyến MN nhân epsilon. Quy tắc của sổ tay: TH2 = TH1 + TH1′, tức chuyển động song phẳng là hợp của hai chuyển động quay quanh trục cố định. Tính điểm bất kỳ trên khâu thì dùng định lý đồng dạng.',['TH2: v_M3 = v_M3′ + v_M3M3','a^n = MN·ω² ; a^t = MN·ε','Quy tắc: TH2 = TH1 + TH1′ ; định lý đồng dạng'],'rig');
T('Trường hợp ba: hai khâu trượt trên nhau thì quay cùng tốc độ và cùng gia tốc góc. Vận tốc: v_M2 bằng v_M1 cộng v_21, thành phần trượt v_21 song song phương trượt. Gia tốc: a_M2 bằng a_M1 cộng a_k cộng a_21, Coriolis quay v_21 90 độ theo chiều omega, độ lớn hai omega nhân v_21.',['TH3: ω₁ ≡ ω₂ ; ε₁ ≡ ε₂','v_M2 = v_M1 + v_21 (v_21 ∥ phương trượt)','a_M2 = a_M1 + a_k + a_21 ; a_k quay v_21 90° theo ω'],'sli');

ch('Chiều quay (TH1/TH2)');
T('Định chiều quay ở trường hợp một: lấy điểm A có vận tốc đã biết làm gốc, rồi quay. Đặt các v tương đối tại đúng điểm của chúng trên cơ cấu: chúng vuông góc thanh và cùng trỏ về một phía quanh gốc, chiều đó là chiều omega.',['TH1: "lấy A làm gốc rồi quay"','v tương đối ⊥ thanh, cùng quanh gốc'],'rig');
T('Định chiều quay ở trường hợp hai: ví dụ v_O2 bằng v_B3 cộng v_O2B3. Sau khi họa đồ cho v_O2B3, lấy chiều từ điểm đ′, đặt vector tương đối rồi bắt đầu quay như kim đồng hồ. Ví dụ trong sổ tay kết luận omega hai ngược chiều kim đồng hồ.',['TH2: v_O2 = v_B3 + v_O2B3','"chiều từ đ′ vẽ ra ngoài, quay như kim đồng hồ"','Ví dụ sổ tay: ω_2 ngược chiều kim đồng hồ'],'sl');
T('Định chiều của epsilon: thành phần tiếp tuyến a_t xử lý giống y như vận tốc v ở trên, sổ tay ghi là a_t tương tự như v.',['a^t định chiều ε ⇔ v định chiều ω','"a^t tương tự như v"']);
T('Chú ý: chiều Coriolis ở TH3 vẫn quay v_21 90 độ theo chiều omega, và hai khâu trượt luôn dùng chung một omega. Kiểm tra chiều bằng cách đối chiếu hướng v tương đối với đoạn nối hai điểm.',['TH3: a_k quay v_21 90° theo ω','Hai khâu trượt: ω chung']);

ch('VD 2.1 Tay quay con trượt');
T('Đề: tay quay AB bằng a, BC bằng a căn ba, góc CAB bằng 60 độ, omega một không đổi, quay cùng chiều kim đồng hồ. Khâu 2 là tam giác BCD, BD bằng một phẩy năm a, CD bằng căn ba trên hai a. Tìm omega hai, v ba, v D hai, epsilon hai, a ba.',['AB = a ; BC = a√3 ; ∠CAB = 60°','ω_1 = ω không đổi','Tìm: ω_2, v_3, v_D2, ε_2, a_3'],'ex1');
T('Bước 1, vận tốc. v B hai bằng v B một, vuông góc AB, độ lớn a omega. v C hai bằng v C ba, song song AC. Phương trình: v C hai bằng v B hai cộng v C hai B hai, trong đó v C B vuông góc BC. Chỉ còn hai ẩn nên giải được.',['v_C2 = v_B2 + v_C2B2','v_B2 ⊥ AB ; v_B2 = a·ω','v_C2 ∥ AC ; v_C2B2 ⊥ BC']);
T('Bước 2, giải. Chiếu lên hai trục, hoặc đọc từ họa đồ. Ta được v C bằng hai căn ba nhân a omega, chia ba. Vận tốc tương đối v C B bằng a omega chia căn ba, nên omega hai bằng v C B chia BC, bằng omega chia ba.',['v_3 = v_C2 = 2aω/√3','v_C2B2 = aω/√3','ω_2 = v_C2B2 / BC = ω/3']);
T('Bước 3, gia tốc. a B hai bằng a omega bình phương, hướng về A. a C hai song song AC. Thành phần pháp tuyến a C B bằng BC nhân omega hai bình phương, bằng căn ba a omega bình phương chia chín. Thành phần tiếp tuyến vuông góc BC, ẩn số.',['a_C2 = a_B2 + a_C2B2^n + a_C2B2^t','a_B2 = a·ω² (hướng B → A)','a_C2B2^n = BC·ω_2² = √3·aω²/9']);
T('Giải ra: a ba bằng hai phần chín a omega bình phương. Thành phần tiếp tuyến bằng tám phần chín a omega bình phương, nên epsilon hai bằng tám căn ba trên hai mươi bảy omega bình phương. Theo định lý đồng dạng, điểm D có v D hai bằng căn ba trên hai nhân a omega.',['a_3 = 2aω²/9','a_C2B2^t = 8aω²/9','ε_2 = 8√3·ω²/27','v_D2 = √3·aω/2']);

ch('VD 2.2 Con trượt trên thanh');
T('Đề: tay quay AB bằng a, AC bằng a căn ba, góc CAB bằng 90 độ, omega một không đổi. Khâu 2 là con trượt ở B, trượt trên thanh BC là khâu 3 quay quanh C. Tìm omega hai, omega ba, epsilon hai, epsilon ba.',['AB = a ; AC = a√3 ; ∠CAB = 90°','BC = 2a','Tìm: ω_2, ω_3, ε_2, ε_3'],'ex2');
T('Bước 1, vận tốc. Hai điểm trùng nhau B hai và B ba. v B ba vuông góc BC. v B ba bằng v B hai cộng v B ba B hai, thành phần sau song song BC. Vì khâu 2 và 3 trượt nhau nên omega hai bằng omega ba.',['v_B3 = v_B2 + v_B3B2','v_B3 ⊥ BC ; v_B3B2 ∥ BC','ω_2 = ω_3']);
T('Giải: v B ba bằng a omega chia hai, nên omega hai bằng omega ba bằng v B ba chia BC, bằng omega chia bốn. Vận tốc trượt bằng căn ba trên hai a omega.',['v_B3 = aω/2','ω_2 = ω_3 = ω/4','v_B3B2 = √3·aω/2']);
T('Bước 2, gia tốc. a B ba pháp tuyến bằng BC omega ba bình phương, bằng a omega bình phương chia tám. Coriolis bằng hai omega ba nhân v trượt, bằng căn ba chia bốn nhân a omega bình phương, vuông góc BC. Chiếu lên phương vuông góc BC để tìm thành phần tiếp tuyến.',['a_B3^n = BC·ω_3² = aω²/8','a_k = 2ω_3·v_B3B2 = √3·aω²/4']);
T('Kết luận: gia tốc góc epsilon hai bằng epsilon ba bằng căn ba chia tám omega bình phương, ngược chiều kim đồng hồ. Gia tốc trượt tương đối bằng ba phần tám a omega bình phương.',['ε_2 = ε_3 = √3·ω²/8','a_r = 3aω²/8']);

ch('VD 2.3 Cơ cấu góc 45 độ');
T('Đề: BD bằng AB bằng BC bằng a, góc CAB bằng 45 độ, góc CBD bằng 90 độ, omega một không đổi. Bậc tự do: n bằng 3, p năm bằng 4, nên W bằng 9 trừ 8 bằng 1. Tìm omega hai, v D hai, v ba, epsilon hai, a ba.',['BD = AB = BC = a','∠CAB = 45° ; ∠CBD = 90°','W = 3·3 − 2·4 = 1'],'bd');
T('Vận tốc. v B hai vuông góc AB, bằng a omega. v C hai song song AC. Chiếu lên hai trục: v C bằng căn hai a omega, hướng sang trái, và v C B bằng a omega, nên omega hai bằng omega, ngược chiều omega một.',['v_3 = v_C2 = √2·aω (←)','v_C2B2 = aω','ω_2 = v_C2B2 / BC = ω']);
T('Điểm D trùng với tâm vận tốc tức thời của khâu 2 nên v D hai bằng không. Gia tốc: pháp tuyến a C B bằng BC omega hai bình phương bằng a omega bình phương, trùng đường BC. Họa đồ cho a ba bằng căn hai a omega bình phương, và epsilon hai bằng không.',['v_D2 = 0 (D ≡ tâm tức thời)','a_3 = √2·aω² (←)','ε_2 = 0']);

ch('VD 2.4 Con trượt trên tay quay');
T('Đề: AH bằng h, vuông góc với đường ngang HC. Góc BAH bằng 45 độ, nên AB bằng h căn hai. Khâu 1 quay với omega không đổi. Khâu 2 là con trượt trượt trên AB, nối bản lề với khâu 3 chuyển động tịnh tiến theo phương ngang. Tìm v hai một, v ba, a r hai một, a ba.',['AH = h ; ∠BAH = 45° ; AB = h√2','ω_1 = ω ; ε_1 = 0','Tìm: v_21, v_3, a_21^r, a_3'],'sl');
T('Vận tốc. v B một vuông góc AB, bằng h căn hai omega. v B hai bằng v B ba bằng v ba, nằm ngang. Phương trình v B hai bằng v B một cộng v hai một, trong đó v hai một song song AB. Đủ hai ẩn.',['v_B2 = v_B1 + v_21','v_B1 ⊥ AB ; v_B1 = hω√2','v_B2 ∥ HC ; v_21 ∥ AB']);
T('Giải: v ba bằng hai h omega, hướng sang trái. v hai một bằng h căn hai omega, hướng về A. Đó là tam giác vuông cân nên hai cạnh bằng nhau.',['v_3 = 2hω (←)','v_21 = hω√2 (hướng về A)']);
T('Gia tốc. a B một bằng h căn hai omega bình phương, hướng về A. Coriolis a k bằng hai omega nhân v hai một, bằng hai căn hai h omega bình phương, chiếu lên phương vuông góc AB. Chiếu phương trình lên trục ngang và đứng.',['a_B2 = a_B1 + a_k + a_r','a_B1 = hω²√2 (B → A)','a_k = 2ω·v_21 = 2√2·hω²']);
T('Kết quả: a ba bằng bốn h omega bình phương, hướng sang phải. a tương đối bằng ba căn hai h omega bình phương, dọc AB. Câu thêm: điểm D trên khâu 2 với BD vuông góc AB, BD bằng h căn hai, khâu 2 cùng quay omega: v D hai bằng căn mười h omega.',['a_3 = 4hω² (→)','a_21^r = 3√2·hω²','v_D2 = √10·hω']);

ch('VD 2.5 Cơ cấu 4 khâu (số liệu)');
T('Đề: cơ cấu 4 khâu bản lề ABCD, giá AD. Khâu dẫn 1 quay đều ω_1 = 8 rad/s. Kích thước AB = BC = 0,1 m, CD = 0,2 m. Vị trí khảo sát: AB vuông góc AD, BC thẳng đứng. Tìm v_B, v_C, ω_2, ω_3, v_E, v_M.',['AB = BC = 0,1 m ; CD = 0,2 m','ω_1 = 8 rad/s (không đổi)','AB ⊥ AD ; BC thẳng đứng','Tìm: v_B, v_C, ω_2, ω_3, v_E, v_M'],'ex1');
T('Bước 1, vận tốc. v_B = ω_1·AB = 8×0,1 = 0,8 m/s, nằm ngang. Phương trình v_C = v_B + v_CB và v_C = v_CD (vì v_D = 0). v_CB vuông góc BC (nằm ngang), v_CD vuông góc CD (nghiêng 45°).',['v_B = 0,8 m/s (ngang)','v_C = v_B + v_CB = v_CD','v_CB ⊥ BC ; v_CD ⊥ CD']);
T('Bước 2, họa đồ vận tốc. Tam giác vuông cân: v_CB = 0,8 m/s. Cạnh huyền v_C = v_B·√2 = 0,8√2 ≈ 1,131 m/s.',['v_CB = 0,8 m/s','v_C = 0,8√2 m/s']);
T('Bước 3, vận tốc góc. ω_2 = v_CB/BC = 0,8/0,1 = 8 rad/s (ngược chiều kim đồng hồ). ω_3 = v_CD/CD = 0,8√2/0,2 = 4√2 ≈ 5,66 rad/s (ngược chiều kim đồng hồ).',['ω_2 = 8 rad/s','ω_3 = 4√2 rad/s']);
T('Bước 4, điểm E trên khâu 3 với DE = 0,1√2 m: v_E = ω_3·DE = 4√2×0,1√2 = 0,8 m/s. Điểm M là trung điểm BC (MB = 0,05 m): v_MB = ω_2·MB = 8×0,05 = 0,4 m/s; v_M = √(v_B² + v_MB²) = √(0,8²+0,4²) = √0,8 ≈ 0,894 m/s.',['v_E = 0,8 m/s','v_M = √0,8 ≈ 0,894 m/s']);
ch('VD 2.6 Cơ cấu Culit tịnh tiến');
T('Đề: khâu 1 chuyển động tịnh tiến với V_1 = 2 m/s. Khâu 2 (con trượt) nối bản lề với khâu 1 nên v_B2 = V_1 = 2 m/s. Khâu 3 (cần Culit) nối với khâu 2 qua khớp trượt và quay quanh bản lề cố định C. Tìm v_B3, v_B3B2, ω_3.',['V_1 = 2 m/s','v_B2 = 2 m/s','Tìm: v_B3, v_B3B2, ω_3'],'sl');
T('Phương trình: v_B3 = v_B2 + v_B3B2 và v_B3 = v_B3C (vì v_C = 0). Khâu BC nghiêng 45°, họa đồ vận tốc là tam giác vuông cân.',['v_B3 = v_B2 + v_B3B2','v_B3 = v_B3C (v_C = 0)']);
T('Kết quả: v_B3 = v_B2·√2 = 2√2 ≈ 2,828 m/s. Vận tốc trượt v_B3B2 = 2 m/s. ω_3 = v_B3/BC = 2√2/BC rad/s (cùng chiều kim đồng hồ).',['v_B3 = 2√2 m/s','v_B3B2 = 2 m/s','ω_3 = 2√2/BC rad/s']);
ch('2.5 Tâm vận tốc tức thời');
T('Tâm vận tốc tức thời của chuyển động tương đối giữa hai khâu i và j là điểm P mà vận tốc của P i bằng vận tốc của P j. Với khớp bản lề, P chính là tâm bản lề. Với khớp trượt, P ở vô cùng, trên phương vuông góc đường trượt. Với khớp cao, P nằm trên pháp tuyến chung.',['v_Pi = v_Pj','Bản lề: P = tâm bản lề','Trượt: P ở ∞ ⊥ đường trượt','Khớp cao: P trên pháp tuyến chung']);
T('Định lý ba tâm thẳng hàng: ba tâm tức thời của ba khâu bất kỳ luôn nằm trên một đường thẳng. Hệ quả: trong cơ cấu bốn khâu, hai đường tâm của hai khâu đối nhau cắt nhau tại tâm tức thời của hai khâu còn lại.',['Ba khâu → ba tâm P_ij, P_jk, P_ik thẳng hàng','Bốn khâu: AB ∩ CD = P_13']);
T('Ví dụ trên cơ cấu tay quay con trượt: AB bằng a, BC bằng a căn ba, góc CAB bằng 60 độ. Tâm P một ba nằm trên đường qua A vuông góc AC, và trên đường BC. Điểm P thuộc khâu một có v P bằng AP nhân omega, bằng vận tốc con trượt: v ba bằng hai a omega chia căn ba.',['P_13 = (đường qua A ⊥ AC) ∩ BC','v_3 = v_P = AP·ω','v_3 = 2aω/√3'],'ic');

T('Ví dụ tâm tức thời: cơ cấu 4 khâu bản lề ABCD, giá AD. Kéo dài BC cắt AD tại P_13 = tâm tức thời của khâu 1 và 3. Nếu P_13 nằm trong đoạn AD và P_13D = 2·P_13A thì tỉ số truyền i_13 = ω_1/ω_3 = P_13D/P_13A = 2, nên ω_3 = ω_1/2. P_13 trong đoạn AD ⇒ ω_3 ngược chiều ω_1; P_13 ngoài đoạn AD ⇒ cùng chiều.',['P_13 = BC ∩ AD','i_13 = P_13D / P_13A','P_13 trong AD ⇒ ω_3 ngược chiều ω_1'],'ic');
ch('BT 1–5 Bài tập về nhà');
T('Yêu cầu chung của bộ bài tập chương hai (PDF Bai tap cac chuong - chuong 02): phần vận tốc, tìm vận tốc và vận tốc góc bằng phương pháp họa đồ và bằng phương pháp tâm vận tốc tức thời. Phần gia tốc, tìm gia tốc và gia tốc góc. Cả năm bài đều cho omega một bằng omega.',['Phần v: họa đồ + tâm tức thời','Phần a: gia tốc, gia tốc góc']);
T('Bài một: khâu một là tay quay AB quay quanh A; khâu hai là phiến BCD với D là điểm trên phiến, đầu C cài vào con trượt ba trượt trên đường AC. CD bằng AB bằng l, BC bằng hai l, BD bằng căn ba l, góc CAB và góc BDC bằng chín mươi độ, góc CBD bằng ba mươi độ, omega một bằng omega. Tìm omega hai, v D hai, v ba, epsilon hai, a ba. Kết quả theo sổ tay: omega hai bằng không, v D hai bằng v ba bằng omega l hướng sang phải, epsilon hai bằng omega bình phương chia căn ba, a ba bằng omega bình phương l chia căn ba.',['CD = AB = ℓ ; BC = 2ℓ ; BD = √3ℓ','∠CAB = ∠BDC = 90° ; ∠CBD = 30°','Tìm: ω₂, v_D2, v₃, ε₂, a₃','KQ sổ tay: ω₂ = 0 ; v₃ = v_D2 = ωl','ε₂ = ω²/√3 ; a₃ = ω²l/√3'],'bt1');
T('Bài hai: cơ cấu bốn khâu bản lề, giá AD. Tay quay AB quay quanh A với omega một bằng omega. AB bằng BC bằng l, AD bằng hai l, CD bằng l căn hai, A B D thẳng hàng. Tìm omega hai, omega ba, epsilon hai, epsilon ba. Kết quả theo sổ tay: omega hai bằng omega ba bằng omega, ngược chiều omega một, epsilon ba bằng không, epsilon hai bằng hai omega bình phương.',['AB = BC = ℓ ; AD = 2ℓ ; CD = ℓ√2','A, B, D thẳng hàng ; ω₁ = ω','Tìm: ω₂, ω₃, ε₂, ε₃','KQ sổ tay: ω₂ = ω₃ = ω (ngược ω₁)','ε₃ = 0 ; ε₂ = 2ω²'],'bt2');
T('Bài ba: AB bằng BD bằng l, AC bằng l căn ba, góc CAB và góc CBD bằng chín mươi độ, góc ABC bằng sáu mươi độ, omega một bằng omega. Tìm omega hai, omega ba, v D hai, epsilon hai, epsilon ba. Sổ tay ghi bài này giống ví dụ hai chấm hai, nên giữ kết quả omega hai bằng omega ba bằng omega chia bốn, epsilon hai bằng epsilon ba bằng căn ba chia tám omega bình phương, còn v D hai tính thêm theo định lý đồng dạng.',['AB = BD = ℓ ; AC = ℓ√3','∠CAB = ∠CBD = 90° ; ∠ABC = 60°','Tìm: ω₂, ω₃, v_D2, ε₂, ε₃','KQ sổ tay (= VD 2.2): ω₂ = ω₃ = ω/4','ε₂ = ε₃ = √3ω²/8 ; v_D2 cần thêm'],'bt3');
T('Bài bốn: AB bằng AD bằng DF bằng a, BC bằng CD bằng DE bằng a căn hai, B A D F thẳng hàng, góc DFE và góc CDE bằng chín mươi độ, omega một bằng omega không đổi. Tìm omega hai, omega ba, omega năm, v E bốn, epsilon hai, epsilon ba, epsilon năm. Kết quả theo sổ tay: omega hai bằng omega ba bằng omega năm bằng omega chia hai, v E bốn bằng omega a, epsilon hai bằng omega bình phương chia bốn; epsilon ba và epsilon năm sổ tay chưa ghi rõ.',['AB = AD = DF = a ; BC = CD = DE = a√2','B, A, D, F thẳng hàng','∠DFE = ∠CDE = 90° ; ω₁ = ω','Tìm: ω₂, ω₃, ω₅, v_E4, ε₂, ε₃, ε₅','KQ sổ tay: ω₂ = ω₃ = ω₅ = ω/2','v_E4 = ωa ; ε₂ = ω²/4 (ε₃, ε₅ chưa ghi)'],'bt4');
T('Bài năm: hai bánh ma sát, bánh một quay quanh A với omega một bằng omega, bánh hai quay quanh C, tâm bánh hai là O, điểm tiếp xúc là B. Số liệu theo PDF: IB bằng ba r, DC bằng hai r, OC bằng r, IA bằng hai r, đề viết tay nên cần đối chiếu lại ký tự B và D. Tìm omega hai. Theo sổ tay: P một hai là điểm tiếp xúc B, nằm trên đường nối hai tâm và pháp tuyến chung, omega hai bằng omega nhân AB chia CB, cần xác nhận hình để ra số.',['IB = 3r ; DC = 2r ; OC = r ; IA = 2r','ω₁ = ω ; Tìm: ω₂','KQ sổ tay: P₁₂ = điểm tiếp xúc B','ω₂ = ω·AB/CB (cần xác nhận hình)'],'bt5');

ch('BT sổ tay (kết quả)');
T('Một số kết quả chốt từ sổ tay giải tay, chỉ lấy các chỗ rõ ràng, bỏ qua vùng số bị gạch xóa. Nhóm cơ cấu bản lề: độ lớn gia tốc điểm B2 bằng căn năm nhân l nhân omega bình phương, và khi epsilon ba bằng không thì a_C3 bằng căn mười ba nhân l nhân omega bình phương.',['|a_B2| = lω²√5','a_C3 = lω²√13 (khi ε₃ = 0)']);
T('Nhóm góc nghiêng của vector gia tốc: tan α lần lượt bằng một phần ba, hai phần ba, và hai. Một bài cho Coriolis a_k bằng ba nhân l nhân omega bình phương.',['tan α ∈ {1/3 ; 2/3 ; 2}','a_k = 3·lω²']);
T('Nhóm dạng Culit: với BC bằng a căn hai và omega ba bằng omega chia hai thì vận tốc trượt v₃₂ bằng a nhân omega chia căn hai. Có bài cho v₂ bằng hai nhân a nhân omega chia ba. Các kết quả a₃₂ = lω²/4, 4lω²/9, 2lω² nằm ở vùng bị gạch sửa trong ảnh (ảnh 11–14 và 22–23) nên tạm chưa dùng, cần soát lại theo đề gốc.',['BC = a√2 ; ω₃ = ω/2','v₃₂ = aω/√2','v₂ = 2aω/3','Chưa dùng (vùng gạch sửa): a₃₂ = lω²/4, 4lω²/9, 2lω²']);

ch('2.6 Hệ số làm việc');
T('Hệ số làm việc K của cơ cấu nhanh-chậm (máy bào nhanh): tỉ số thời gian hành trình làm việc t_1 và thời gian hành trình chạy không t_2. K = t_1/t_2 = φ_1/φ_2 = (180° + θ)/(180° − θ), với θ là góc lệch của tâm tức thời. Thiết kế sao cho K > 1 để rút ngắn thời gian chạy không.',['K = t_1/t_2 = φ_1/φ_2','K = (180° + θ)/(180° − θ)','K > 1 : rút ngắn chạy không'],'ic');
ch('Tổng kết chương 2');
T('Tóm tắt: hai điểm cùng khâu dùng vận tốc tương đối vuông góc, gia tốc có hai thành phần. Hai điểm trùng nhau thuộc hai khâu trượt có thêm Coriolis. Giải bằng họa đồ hoặc chiếu hai trục, tâm tức thời dùng cho bài chỉ hỏi vận tốc.',['Cùng khâu: v ⊥, a^n + a^t','Trùng nhau: thêm a_k = 2ω × v_rel','Tâm tức thời: nhanh cho vận tốc']);
T('Quy trình: một, viết phương trình vận tốc và giải. Hai, tính omega. Ba, tính pháp tuyến và Coriolis. Bốn, viết phương trình gia tốc, giải, tìm epsilon. Ba lỗi hay gặp: quên Coriolis, nhầm chiều Coriolis, và quên rằng omega hai khâu trượt nhau bằng nhau.',['Bước 1: v → ω','Bước 2: a^n, a_k','Bước 3: a → ε','Lỗi: quên a_k ; sai chiều ; ω_i ≠ ω_j']);

3 = P_13D/P_13A = 2 ⇒ ω_3 = ω_1/2 ; P_13 trong AD ⇒ ngược chiều'],['Hệ số K','K = (180°+θ)/(180°−θ) ; K > 1 rút ngắn chạy không'],['Ôn tập điểm','a_n = ω²r ; a_t = εr ; a = √(a_n²+a_t²) ; tan α = a_t/a_n'],['Ba lỗi','1) Quên a_k.<br>2) Sai chiều a_k.<br>3) Quên ω_i = ω_j khi hai khâu trượt nhau.']];
