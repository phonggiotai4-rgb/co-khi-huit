<style>

<g class="e" data-s="5,6,7" style="--d:2s"><line class="v" pathLength="1" x1="120" y1="70" x2="195" y2="70" stroke="#E24B4A" stroke-width="3" marker-end="url(#mr)"/><text class="s sb" x="158" y="58" text-anchor="middle" style="fill:#E24B4A">a₃</text></g>
<g class="e" data-s="5"><text class="s" x="20" y="250">a_B ↓, aⁿ_CB = 0, aᵗ_CB ⊥ BC (↗), a₃ nằm ngang</text></g>
<g class="e" data-s="6"><text class="s sb" x="20" y="250" style="fill:#BA7517">aᵗ_CB = 2lω²/√3 ⇒ ε₂ = √3ω²/3 (↺)</text><text class="s sb" x="20" y="272" style="fill:#E24B4A">a₃ = lω²/√3 = √3·lω²/3 (→)</text></g>
<g class="e" data-s="7"><text class="s sb" x="20" y="250" style="fill:#E24B4A">ω₂ = 0 · v_D2 = ωl → · v₃ = ωl →</text><text class="s sb" x="20" y="272" style="fill:#E24B4A">ε₂ = √3ω²/3 ↺ · a₃ = √3·lω²/3 →</text></g>
</svg></div>

<script>
var S=[
{t:"Đề bài",f:"CD = AB = l · BC = 2l · BD = √3·l · ∠CBD = 30° · ω₁ = ω",n:"Tay quay AB (khâu 1) quay quanh A cùng chiều kim đồng hồ với tốc độ góc ω₁ = ω. Tấm 2 là tam giác BCD nối bản lề với AB tại B. Con trượt 3 gắn với tấm 2 tại C và trượt dọc đường nằm ngang AC. Cần tìm ω₂, v_D2, v₃, ε₂ và a₃."},
{t:"Hình học của cơ cấu",f:"AC = √3·l · ∠ABC = 60° · ABDC là hình chữ nhật",n:"Tam giác ABC vuông tại A có AB = l, BC = 2l nên AC = √3·l và ∠ABC = 60°. Vì ∠CBD = 30° nên BD nằm ngang, BD = √3·l = AC và CD = l = AB, suy ra ABDC là hình chữ nhật. BC nghiêng 30° so với phương ngang."},
{t:"Phương trình vận tốc",f:"v_C = v_B + v_CB · v_C = v₃ ∥ AC · v_B = lω (→) · v_CB ⊥ BC",n:"B thuộc khâu 1 nên v_B = AB·ω₁ = lω, hướng sang phải vì B nằm trên A và quay cùng chiều kim đồng hồ. C thuộc tấm 2 và con trượt 3 nên v_C = v₃ song song AC. Thành phần quay v_CB vuông góc BC, chưa biết độ lớn."},
{t:"Tìm ω₂, v_D2 và v₃",f:"ω₂ = 0 ⇒ v₃ = v_D2 = v_B = lω (→)",n:"Chiếu phương trình lên phương thẳng đứng: 0 = 0 + v_CB·cos30°, nên v_CB = 0 và ω₂ = 0. Cách khác: v_B và v_C song song, hai đường vuông góc với chúng cũng song song nên tâm vận tốc tức thời ở vô cùng. Tấm 2 tịnh tiến tức thời, mọi điểm có cùng vận tốc: v₃ = v_D2 = v_B = lω, hướng sang phải."},
{t:"Phương trình gia tốc",f:"a_C = a_B + aⁿ_CB + aᵗ_CB · a_B = lω² (↓) · aⁿ_CB = 0",n:"Đề không cho ε₁ nên coi ε₁ = 0. Khi đó a_B = AB·ω² = lω², hướng xuống về A. Vì ω₂ = 0 nên aⁿ_CB = BC·ω₂² = 0. Còn aᵗ_CB vuông góc BC và a₃ = a_C song song AC, hai đại lượng chưa biết độ lớn."},
{t:"Đa giác gia tốc",f:"π → a_B, từ mút kẻ đường ⊥ BC, từ π kẻ đường nằm ngang",n:"Từ cực π vẽ a_B hướng xuống. Từ mút của a_B kẻ đường vuông góc BC cho aᵗ_CB, hướng lên-phải và hợp với phương ngang góc 60°. Từ π kẻ đường nằm ngang cho a₃. Giao điểm của hai đường khép đa giác."},
{t:"Tìm ε₂ và a₃",f:"aᵗ_CB = 2lω²/√3 ⇒ ε₂ = √3ω²/3 · a₃ = √3·lω²/3",n:"Tính theo đơn vị lω². Chiếu lên phương thẳng đứng: −1 + (√3/2)·aᵗ = 0 nên aᵗ = 2/√3. Chiếu lên phương ngang: a₃ = aᵗ/2 = 1/√3. Từ đó ε₂ = aᵗ/BC = (2lω²/√3)/(2l) = ω²/√3 = √3ω²/3, ngược chiều kim đồng hồ vì aᵗ hướng lên-phải."},
{t:"Kết quả",f:"ω₂ = 0 · v_D2 = v₃ = ωl · ε₂ = √3ω²/3 · a₃ = √3·lω²/3",n:"Kết quả: ω₂ = 0, v_D2 = ωl hướng sang phải, v₃ = ωl hướng sang phải, ε₂ = √3ω²/3 ngược chiều kim đồng hồ và a₃ = √3·lω²/3 hướng sang phải."}
];
var i=0,playing=false,timer=null,voice=false,es=document.querySelectorAll(".lec .e"),fill=document.getElementById("fill");
var dots=document.getElementById("dots");
S.forEach(function(_,k){var b=document.createElement("button");b.setAttribute("aria-label","Bước "+(k+1));b.onclick=function(){go(k)};dots.appendChild(b)});
function dur(k){return 2500+S[k].n.length*45}
function sched(ms){clearTimeout(timer);timer=setTimeout(function(){if(i<S.length-1)go(i+1);else stop()},ms)}
function stop(){playing=false;clearTimeout(timer);try{speechSynthesis.cancel()}catch(e){}
document.getElementById("play").textContent=i===S.length-1?"↻ Xem lại":"▶ Phát";fill.style.transition="none";fill.style.width="0"}
function go(k){i=k;clearTimeout(timer);try{speechSynthesis.cancel()}catch(e){}
es.forEach(function(e){var s=e.getAttribute("data-s").split(",");e.classList.toggle("on",s.indexOf(String(k))>-1)});
document.getElementById("step").textContent="Bước "+(k+1)+" / "+S.length;
document.getElementById("title").textContent=S[k].t;
document.getElementById("formula").textContent=S[k].f;
document.getElementById("narr").textContent=S[k].n;
Array.prototype.forEach.call(dots.children,function(d,j){d.className=j===k?"cur":""});
fill.style.transition="none";fill.style.width="0";
if(playing){document.getElementById("play").textContent="❚❚ Dừng";void fill.offsetWidth;
if(voice&&window.speechSynthesis){fill.style.width="0";var u=new SpeechSynthesisUtterance(S[k].n);u.lang="vi-VN";
u.onend=function(){if(playing)finish()};u.onerror=function(){sched(dur(k))};speechSynthesis.speak(u)}
else{fill.style.transition="width "+dur(k)+"ms linear";fill.style.width="100%";sched(dur(k))}}
else document.getElementById("play").textContent=k===S.length-1?"↻ Xem lại":"▶ Phát"}
function finish(){if(i<S.length-1)timer=setTimeout(function(){go(i+1)},1200);else stop()}
document.getElementById("play").onclick=function(){if(playing){stop();return}
playing=true;go(i===S.length-1?0:i)};
document.getElementById("prev").onclick=function(){var p=playing;playing=false;go(Math.max(0,i-1));if(p){playing=true;go(i)}};
document.getElementById("next").onclick=function(){var p=playing;playing=false;go(Math.min(S.length-1,i+1));if(p){playing=true;go(i)}};
var vb=document.getElementById("voice");
if(!window.speechSynthesis)vb.style.display="none";
vb.onclick=function(){voice=!voice;vb.classList.toggle("on",voice);if(playing)go(i)};
go(0);
(function(){var AX=90,AY=140,L=80,ph=0,run=true,sp=.6,show=true,last=null,K=40,dl=1e-3;var $=function(i){return document.getElementById(i)};
function f3(x){return x.toFixed(3).replace('.',',')}
function dirs(x,p,n){return x>=0?p:n}
function Cx(f){return Math.sin(f)+Math.sqrt(4-Math.cos(f)*Math.cos(f))}
function psi(f){return Math.atan2(-Math.cos(f),Math.sqrt(4-Math.cos(f)*Math.cos(f)))}
function Dp(f){var bx=Math.sin(f),by=Math.cos(f),c=Cx(f),ux=(c-bx)/2,uy=-by/2,ca=Math.cos(Math.PI/6),sa=.5,k=Math.sqrt(3);return[bx+k*(ux*ca-uy*sa),by+k*(ux*sa+uy*ca)]}
function X(x){return AX+L*x}function Y(y){return AY-L*y}
function setL(id,x1,y1,x2,y2){var e=$(id);e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2)}
function put(id,x,y){var e=$(id);e.setAttribute('cx',x);e.setAttribute('cy',y)}
function txt(id,x,y){var e=$(id);e.setAttribute('x',x);e.setAttribute('y',y)}
function draw(){var f=ph,bx=Math.sin(f),by=Math.cos(f),c=Cx(f),d=Dp(f),BX=X(bx),BY=Y(by),CX=X(c),CY=AY,DX=X(d[0]),DY=Y(d[1]);
setL('sAB',AX,AY,BX,BY);$('sPl').setAttribute('points',BX+','+BY+' '+DX+','+DY+' '+CX+','+CY);
var r=$('sSl');r.setAttribute('x',CX-15);r.setAttribute('y',CY-11);
put('sB',BX,BY);put('sC',CX,CY);put('sD',DX,DY);txt('tB',BX-16,BY-8);txt('tC',CX-4,CY+30);txt('tD',DX+6,DY-8);
var dp=Dp(f+dl),dm=Dp(f-dl),vdx=(dp[0]-dm[0])/(2*dl),vdy=(dp[1]-dm[1])/(2*dl),vbx=Math.cos(f),vby=-Math.sin(f),vc=(Cx(f+dl)-Cx(f-dl))/(2*dl);
var ac=(Cx(f+dl)-2*c+Cx(f-dl))/(dl*dl),w2=(psi(f+dl)-psi(f-dl))/(2*dl),e2=(psi(f+dl)-2*psi(f)+psi(f-dl))/(dl*dl);
['v1','v2','v3'].forEach(function(id){$(id).style.display=show?'':'none'});
setL('v1',BX,BY,BX+K*vbx,BY-K*vby);setL('v2',DX,DY,DX+K*vdx,DY-K*vdy);setL('v3',CX,CY,CX+K*vc,CY);
var deg=((f*180/Math.PI)%360+360)%360;
$('rd').innerHTML='φ = '+Math.round(deg)+'° · v₃ = '+f3(vc)+' lω · ω₂ = '+f3(w2)+' ω<br>ε₂ = '+f3(e2)+' ω² ('+dirs(e2,'↺','↻')+') · a₃ = '+f3(ac)+' lω² ('+dirs(ac,'→','←')+')';
$('sTh').value=deg}
function tick(t){if(last===null)last=t;var dt=Math.min((t-last)/1000,.1);last=t;if(run){ph+=dt*sp;draw()}requestAnimationFrame(tick)}
$('sPlay').onclick=function(){run=!run;this.textContent=run?'❚❚ Dừng':'▶ Chạy'};
$('sReset').onclick=function(){ph=0;run=false;$('sPlay').textContent='▶ Chạy';draw()};
$('sVec').onclick=function(){show=!show;this.classList.toggle('on',show);draw()};
$('sSp').oninput=function(){sp=parseFloat(this.value)};
$('sTh').oninput=function(){run=false;$('sPlay').textContent='▶ Chạy';ph=parseFloat(this.value)*Math.PI/180;draw()};
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){run=false;$('sPlay').textContent='▶ Chạy'}
draw();requestAnimationFrame(tick)})();
</script></body></html>
