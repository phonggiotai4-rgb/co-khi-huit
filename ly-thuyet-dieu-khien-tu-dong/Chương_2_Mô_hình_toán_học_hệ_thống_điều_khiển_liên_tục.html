  html:`<div class='r3' style='align-items:flex-start;margin:0'>${TANK}<div class='nt lgd' style='margin:0;font-size:2cqw;line-height:1.5'>a: tiết diện van xả<br>A: tiết diện ngang của bồn<br>G: gia tốc trọng trường<br>k: hệ số tỷ lệ với công suất bơm<br>C<sub>D</sub>: hệ số xả</div></div><div class='m' style='font-size:2cqw;line-height:1.9;margin:1.5cqw 0 0 3cqw'><span style='${MF}'>Phương trình cân bằng:</span> &emsp;A ẏ(t) = q<sub>in</sub>(t) − q<sub>out</sub>(t)<br>&emsp;&emsp;&emsp;&emsp;<span style='${MF}'>trong đó:</span> &emsp;q<sub>in</sub>(t) = k u(t)<br>&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;q<sub>out</sub>(t) = aC<sub>D</sub>${SQ('2gy(t)')}</div><div style='margin:1.5cqw 0 0 4cqw'><span class='m'>⇒</span> <span class='eqy' style='font-size:2.1cqw'>ẏ(t) = ${fr('1','A')}(ku(t) − aC<sub>D</sub>${SQ('2gy(t)')})</span> <span class='bl' style='font-size:2cqw'>(hệ phi tuyến bậc 1)</span></div>`,
  speech:"Thí dụ đầu tiên là bồn chứa chất lỏng, một hệ phi tuyến bậc một. a là tiết diện van xả. A là tiết diện ngang của bồn. g là gia tốc trọng trường. k là hệ số tỷ lệ với công suất bơm. C D là hệ số xả. Phương trình cân bằng: A nhân y chấm bằng q vào trừ q ra. Trong đó q vào bằng k nhân u của t, và q ra bằng a C D nhân căn bậc hai của hai g y của t. Suy ra y chấm bằng một chia A, nhân k u trừ a C D căn hai g y. Đây là hệ phi tuyến bậc một. Nguồn gốc của tính phi tuyến là căn bậc hai của chiều cao mực chất lỏng. Lưu lượng ra không tỉ lệ thuận với chiều cao mà tỉ lệ với căn của nó."},
 {type:"rich",title:"Mô tả toán học hệ phi tuyến dùng PTVP – Thí dụ 2",
  html:`<div class='r3' style='align-items:flex-start;margin:0'>${ROBOT}<div class='nt lgd' style='margin:0;font-size:1.85cqw;line-height:1.45'>J: moment quán tính của cánh tay máy<br>M: khối lượng của cánh tay máy<br>m: khối lượng vật nặng<br>l: chiều dài cánh tay máy<br>l<sub>C</sub>: khoảng cách từ trọng tâm tay máy đến trục quay<br>B: hệ số ma sát nhớt<br>g: gia tốc trọng trường<br>u(t) moment tác động lên trục quay của cánh tay máy<br>θ(t): góc quay (vị trí) của cánh tay máy</div></div><div class='tk' style='margin:1cqw 0 0'>Theo định luật Newton:</div><div class='m' style='font-size:2cqw;text-align:center;margin:.8cqw 0 1cqw'>(J + ml<sup>2</sup>)θ̈(t) + Bθ̇(t) + (ml + Ml<sub>C</sub>)g cosθ = u(t)</div><div style='margin-left:2cqw'><span class='m'>⇒</span> <span class='eqy' style='font-size:1.85cqw'>θ̈(t) = −${fr('B','J + ml<sup>2</sup>')}θ̇(t) − ${fr('ml + Ml<sub>C</sub>','J + ml<sup>2</sup>')}g cosθ + ${fr('1','J + ml<sup>2</sup>')}u(t)</span></div><div class='bl' style='text-align:center;font-size:2cqw;margin-top:.6cqw'>(hệ phi tuyến bậc 2)</div>`,
  speech:"Thí dụ thứ hai là cánh tay máy, một hệ phi tuyến bậc hai. J là moment quán tính của cánh tay máy. M là khối lượng của cánh tay máy. m là khối lượng vật nặng. l là chiều dài cánh tay máy. l C là khoảng cách từ trọng tâm tay máy đến trục quay. B là hệ số ma sát nhớt. g là gia tốc trọng trường. u của t là moment tác động lên trục quay. Thêta của t là góc quay, hay vị trí của cánh tay máy. Theo định luật Newton: J cộng m l bình phương, nhân thêta hai chấm, cộng B nhân thêta một chấm, cộng m l cộng M l C, nhân g nhân cô-sin thêta, bằng u của t. Suy ra thêta hai chấm bằng âm B chia J cộng m l bình phương nhân thêta một chấm, trừ m l cộng M l C chia J cộng m l bình phương, nhân g cô-sin thêta, cộng một chia J cộng m l bình phương nhân u. Đây là hệ phi tuyến bậc hai. Tính phi tuyến đến từ hàm cô-sin của góc quay, vì tác dụng của trọng lực lên cánh tay thay đổi theo vị trí."},
 {type:"rich",title:"Mô tả toán học hệ phi tuyến dùng PTVP – Thí dụ 3",
  html:`<div class='r3' style='align-items:flex-start;margin:0'>${SHIP}<div class='nt lgd' style='margin:2cqw 0 0;font-size:2.1cqw;line-height:1.6'>δ: góc bánh lái<br>ψ: hướng chuyển động của tàu<br>k : hệ số<br>τ<sub>i</sub> : hệ số</div></div><div class='tk' style='margin-top:1cqw'>Phương trình vi phân mô tả đặc tính động học hệ thống lái tàu:</div><div style='margin:1cqw 0 0'><span class='eqy' style='font-size:1.7cqw;padding:.8cqw .8cqw'>ψ<sup>(3)</sup>(t) = −(${fr('1','τ<sub>1</sub>')} + ${fr('1','τ<sub>2</sub>')})ψ̈(t) − (${fr('1','τ<sub>1</sub>τ<sub>2</sub>')})(ψ̇<sup>3</sup>(t) + ψ̇(t)) + (${fr('k','τ<sub>1</sub>τ<sub>2</sub>')})(τ<sub>3</sub>δ̇(t) + δ(t))</span></div><div class='bl' style='text-align:right;font-size:2cqw;margin:1cqw 6cqw 0 0'>(hệ phi tuyến bậc 3)</div>`,
  speech:"Thí dụ thứ ba là hệ thống lái tàu. Đề-ta là góc bánh lái. Sai là hướng chuyển động của tàu. k và tau i là các hệ số. Phương trình vi phân mô tả đặc tính động học hệ thống lái tàu là một phương trình phi tuyến bậc ba, trong đó đạo hàm bậc ba của hướng tàu phụ thuộc vào đạo hàm bậc hai, số hạng lập phương của đạo hàm bậc một, và góc bánh lái cùng đạo hàm của nó. Đây là một hệ phi tuyến bậc ba. Thí dụ này cho thấy mô hình thực tế có thể rất phức tạp, và việc tuyến tính hóa là cần thiết để thiết kế điều khiển."},
 {type:"rich",title:"Mô tả toán học hệ phi tuyến dùng PTTT",
  html:`<div class='rb' style='margin-top:2cqw'>Hệ phi tuyến liên tục có thể mô tả bằng phương trình trạng thái:</div><div style='margin:2cqw 0 3cqw 24cqw'><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('ẋ(t) = <b>f</b>(<b>x</b>(t), u(t))','y(t) = h(<b>x</b>(t), u(t))')}</span></div><div class='m' style='font-size:2.1cqw;line-height:2.1;margin-left:6cqw'><span style='${MF}'>trong đó:</span> &emsp;u(t) <span style='${MF}'>là tín hiệu vào</span><br>&emsp;&emsp;&emsp;&emsp;&emsp;y(t) <span style='${MF}'>là tín hiệu ra</span><br>&emsp;&emsp;&emsp;&emsp;&emsp;<b>x</b>(t) <span style='${MF}'>là vector trạng thái</span><br>&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;&emsp;<b>x</b>(t) = [x<sub>1</sub>(t), x<sub>2</sub>(t), …, x<sub>n</sub>(t)]<sup>T</sup><br>&emsp;&emsp;&emsp;&emsp;&emsp;f(.), h(.) <span style='${MF}'>là hàm phi tuyến</span></div>`,
  speech:"Giống như hệ tuyến tính, hệ phi tuyến cũng có thể mô tả bằng phương trình trạng thái. Hệ phi tuyến liên tục có thể mô tả bằng phương trình trạng thái: x chấm của t bằng f của x của t và u của t, và y của t bằng h của x của t và u của t. Trong đó u của t là tín hiệu vào, y của t là tín hiệu ra, x của t là vector trạng thái gồm x một đến x n, và f, h là các hàm phi tuyến. Khác biệt duy nhất là các ma trận A, B, C được thay bằng các hàm phi tuyến f và h."},
 {type:"rich",title:"Mô tả toán học hệ phi tuyến dùng PTTT – Thí dụ 1",
  html:`<div class='r3' style='align-items:flex-start;margin:0'>${TANK}<div style='flex:1;min-width:0'><div class='tk' style='font-size:2cqw'>Phương trình vi phân</div><div class='m' style='font-size:2cqw;text-align:center'>ẏ(t) = ${fr('1','A')}(ku(t) − aC<sub>D</sub>${SQ('2gy(t)')})</div><div class='tk' style='font-size:2cqw;margin-top:1.5cqw'>Đặt biến trạng thái: x<sub>1</sub>(t) = y(t)</div></div></div><div class='r3' style='margin:1.5cqw 0 1cqw'><span class='tk' style='margin:0'>Phương trình trạng thái</span><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('ẋ(t) = <b>f</b>(<b>x</b>(t), u(t))','y(t) = h(<b>x</b>(t), u(t))')}</span><span style='flex:1'></span></div><div class='m' style='font-size:2cqw;margin-left:8cqw;line-height:2.3'><span style='${MF}'>trong đó</span> &emsp;<span style='background:#c8f0ff;padding:.4cqw 1cqw'><b>f</b>(<b>x</b>, u) = −${fr('aC<sub>D</sub>'+SQ('2gx<sub>1</sub>(t)'),'A')} + ${fr('k','A')}u(t)</span><br>&emsp;&emsp;&emsp;&emsp;<span style='background:#c8f0ff;padding:.4cqw 1cqw'>h(<b>x</b>(t), u(t)) = x<sub>1</sub>(t)</span></div>`,
  speech:"Ta chuyển thí dụ bồn chứa sang dạng phương trình trạng thái. Phương trình vi phân là y chấm bằng một chia A, nhân k u trừ a C D căn hai g y. Đặt biến trạng thái x một bằng y của t. Phương trình trạng thái có dạng x chấm bằng f của x và u, y bằng h của x và u. Trong đó f của x và u bằng âm a C D căn hai g x một, chia A, cộng k chia A nhân u của t. Và h của x và u bằng x một của t. Vì hệ bậc một nên chỉ có một biến trạng thái, chính là mực chất lỏng."},
 {type:"rich",title:"Mô tả toán học hệ phi tuyến dùng PTTT – Thí dụ 2",
  html:`<div class='r3' style='align-items:flex-start;margin:0'>${ROBOT}<div style='flex:1;min-width:0'><div class='tk' style='font-size:2cqw'>Phương trình vi phân</div><div class='m' style='font-size:1.7cqw;margin-bottom:1.2cqw'>θ̈(t) = −${fr('B','J+ml<sup>2</sup>')}θ̇(t) − ${fr('ml+Ml<sub>C</sub>','J+ml<sup>2</sup>')}g cosθ + ${fr('1','J+ml<sup>2</sup>')}u(t)</div><div class='r3' style='margin:0;justify-content:flex-start;gap:2cqw'><span class='tk' style='font-size:2cqw;margin:0'>Đặt biến trạng thái:</span><span class='m' style='font-size:2cqw'>${BR('x<sub>1</sub>(t) = θ(t)','x<sub>2</sub>(t) = θ̇(t)')}</span></div></div></div><div class='r3' style='margin:1.5cqw 0 1cqw'><span class='tk' style='margin:0'>Phương trình trạng thái</span><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('ẋ(t) = <b>f</b>(<b>x</b>(t), u(t))','y(t) = h(<b>x</b>(t), u(t))')}</span><span style='flex:1'></span></div><div class='m' style='font-size:1.85cqw;margin-left:3cqw;display:flex;align-items:center;gap:1.5cqw;flex-wrap:wrap'><span style='${MF}'>trong đó</span><span style='background:#c8f0ff;padding:.4cqw 1cqw'><b>f</b>(<b>x</b>,u) = ${MAT([['x<sub>2</sub>(t)'],['−'+fr('(ml+Ml<sub>C</sub>)g','J+ml<sup>2</sup>')+'cos x<sub>1</sub>(t) − '+fr('B','J+ml<sup>2</sup>')+'x<sub>2</sub>(t) + '+fr('1','J+ml<sup>2</sup>')+'u(t)']])}</span></div><div class='m' style='font-size:1.9cqw;margin:1cqw 0 0 12cqw'><span style='background:#c8f0ff;padding:.4cqw 1cqw'>h(<b>x</b>(t), u(t)) = x<sub>1</sub>(t)</span></div>`,
  speech:"Tương tự, ta chuyển thí dụ cánh tay máy sang dạng phương trình trạng thái. Phương trình vi phân là thêta hai chấm bằng âm B chia J cộng m l bình phương nhân thêta một chấm, trừ m l cộng M l C chia J cộng m l bình phương, nhân g cô-sin thêta, cộng một chia J cộng m l bình phương nhân u. Đặt biến trạng thái: x một bằng thêta, x hai bằng thêta một chấm. Phương trình trạng thái có dạng x chấm bằng f của x và u, y bằng h của x và u. Trong đó f là vector gồm hai thành phần: thành phần thứ nhất là x hai, thành phần thứ hai là âm m l cộng M l C nhân g chia J cộng m l bình phương, nhân cô-sin x một, trừ B chia J cộng m l bình phương nhân x hai, cộng một chia J cộng m l bình phương nhân u. Và h bằng x một. Hai biến trạng thái là góc quay và tốc độ quay của cánh tay."},
 {type:"rich",title:"Điểm dừng của hệ phi tuyến",
  html:`<div class='tk'>Xét hệ phi tuyến mô tả bởi PTTT phi tuyến:</div><div style='margin:.5cqw 0 1.5cqw 24cqw'><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('ẋ(t) = <b>f</b>(<b>x</b>(t), u(t))','y(t) = h(<b>x</b>(t), u(t))')}</span></div><div class='tk'>Điểm trạng thái <b>x̄</b> được gọi là <span class='r'>điểm dừng</span> của hệ phi tuyến nếu như hệ đang ở trạng thái <b>x̄</b> và với tác động điều khiển ū khi cố định, không đổi cho trước thì hệ sẽ nằm nguyên tại trạng thái đó.</div><div class='tk'>Nếu (<b>x̄</b>, ū) là điểm dừng của hệ phi tuyến thì:</div><div style='margin:1cqw 0 1.5cqw 24cqw'><span class='eqy' style='font-size:2.2cqw'><b>f</b>(<b>x</b>(t), u(t))|<sub><b>x</b>=<b>x̄</b>, u=ū</sub> = 0</span></div><div class='tk'><span class='r'>Điểm dừng</span> còn được gọi là <span class='r'>điểm làm việc tĩnh</span> của hệ phi tuyến</div>`,
  speech:"Để tuyến tính hóa, ta cần chọn một điểm làm việc. Điểm đó gọi là điểm dừng. Xét hệ phi tuyến mô tả bởi phương trình trạng thái phi tuyến: x chấm bằng f của x và u, y bằng h của x và u. Điểm trạng thái x gạch ngang được gọi là điểm dừng của hệ phi tuyến nếu như hệ đang ở trạng thái x gạch ngang, và với tác động điều khiển u gạch ngang khi cố định, không đổi cho trước thì hệ sẽ nằm nguyên tại trạng thái đó. Nếu x gạch ngang và u gạch ngang là điểm dừng của hệ phi tuyến thì f của x và u tại điểm đó bằng không. Điểm dừng còn được gọi là điểm làm việc tĩnh của hệ phi tuyến. Hình dung bồn nước có mực ổn định khi lưu lượng vào bằng lưu lượng ra, hoặc cánh tay máy đứng yên ở một góc nào đó. Muốn tìm điểm dừng, ta cho đạo hàm của trạng thái bằng không rồi giải hệ phương trình."},
 {type:"rich",title:"Điểm dừng của hệ phi tuyến – Thí dụ 1",
  html:`<div class='r3' style='justify-content:flex-start;gap:1.5cqw;margin:0 0 1cqw'><span class='tk' style='margin:0'>Cho hệ phi tuyến mô tả bởi PTTT:</span><span class='m' style='font-size:2cqw'>${MAT([['ẋ<sub>1</sub>(t)'],['ẋ<sub>2</sub>(t)']])} = ${MAT([['x<sub>1</sub>(t)·x<sub>2</sub>(t) + u'],['x<sub>1</sub>(t) + 2x<sub>2</sub>(t)']])}</span></div><div class='pp' style='margin-left:6cqw'>Xác định điểm dừng của hệ thống khi u(t) = ū = 1</div><div class='pp' style='margin:1cqw 0 0 3cqw'><b class='r'>* Giải:</b></div><div class='pp' style='margin-left:6cqw'>Điểm dừng là nghiệm của phương trình:</div><div class='m' style='font-size:2cqw;margin:.8cqw 0 0 10cqw;line-height:2.4'><b>f</b>(<b>x</b>(t), u(t))|<sub><b>x</b>=<b>x̄</b>, u=ū</sub> = 0<br>⇔ ${BR('x̄<sub>1</sub>·x̄<sub>2</sub> + 1 = 0','x̄<sub>1</sub> + 2x̄<sub>2</sub> = 0')}<br>⇔ ${BR('x̄<sub>1</sub> = √2','x̄<sub>2</sub> = −'+fr('√2','2'))} &emsp;<span style='${MF}'>hoặc</span>&emsp;${BR('x̄<sub>1</sub> = −√2','x̄<sub>2</sub> = +'+fr('√2','2'))}</div>`,
  speech:"Ta thực hành tìm điểm dừng qua hai thí dụ. Cho hệ phi tuyến mô tả bởi phương trình trạng thái: x một chấm bằng x một nhân x hai cộng u, và x hai chấm bằng x một cộng hai x hai. Xác định điểm dừng của hệ thống khi u của t bằng u gạch ngang bằng 1. Lời giải: điểm dừng là nghiệm của phương trình f bằng không. Tức là x một nhân x hai cộng 1 bằng 0, và x một cộng hai x hai bằng 0. Giải ra x một bằng căn hai, x hai bằng âm căn hai chia hai. Hoặc x một bằng âm căn hai, x hai bằng căn hai chia hai. Chú ý hệ phi tuyến có thể có nhiều điểm dừng, ở đây có hai điểm. Mỗi điểm dừng cho một mô hình tuyến tính riêng."},
 {type:"rich",title:"Điểm dừng của hệ phi tuyến – Thí dụ 2",
  html:`<div class='tk' style='margin-top:2cqw'>Cho hệ phi tuyến mô tả bởi PTTT:</div><div class='m' style='font-size:2.2cqw;margin:2cqw 0 0 14cqw;display:flex;align-items:center;gap:2cqw'>${MAT([['ẋ<sub>1</sub>'],['ẋ<sub>2</sub>'],['ẋ<sub>3</sub>']])} = ${MAT([['1 + x<sub>2</sub><sup>2</sup> + x<sub>3</sub><sup>2</sup> + u'],['x<sub>3</sub> + sin(x<sub>1</sub> − x<sub>3</sub>)'],['x<sub>3</sub><sup>2</sup> + u']])}</div><div class='m' style='font-size:2.2cqw;margin:1.5cqw 0 0 24cqw'>y = x<sub>1</sub></div><div class='pp' style='margin:3cqw 0 0 6cqw'>Xác định điểm dừng của hệ thống khi u(t) = ū = 0</div>`,
  speech:"Thí dụ thứ hai có ba biến trạng thái. Cho hệ phi tuyến mô tả bởi phương trình trạng thái: x một chấm bằng một cộng x hai bình phương cộng x ba bình phương cộng u. X hai chấm bằng x ba cộng sin của x một trừ x ba. X ba chấm bằng x ba bình phương cộng u. Đầu ra y bằng x một. Xác định điểm dừng của hệ thống khi u của t bằng u gạch ngang bằng 0. Các em hãy tự giải hệ này. Gợi ý là bắt đầu từ phương trình thứ ba, vì nó chỉ chứa x ba và u."},
 {type:"rich",title:"Tuyến tính hóa hệ PT xung quanh điểm làm việc tĩnh",
  html:`<div class='tk'>Cho hệ phi tuyến mô tả bởi PTTT phi tuyến:</div><div style='margin:.5cqw 0 1.5cqw 24cqw'><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('ẋ(t) = <b>f</b>(<b>x</b>(t), u(t))','y(t) = h(<b>x</b>(t), u(t))')}</span></div><div class='tk'>Khai triển Taylor f(x,u) và h(x,u) xung quanh điểm làm việc tĩnh (x̄, ū) ta có thể mô tả hệ thống bằng PTTT tuyến tính:</div><div class='r3' style='margin:.5cqw 0 1cqw 12cqw;justify-content:flex-start;gap:6cqw'><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('x̃̇(t) = <b>A</b>x̃(t) + <b>B</b>ũ(t)','ỹ(t) = <b>C</b>x̃(t) + <b>D</b>ũ(t)')}</span><span class='r' style='font-size:1.8cqw'>(*)</span></div><div class='m' style='font-size:2cqw;margin-left:6cqw;line-height:1.9'><span style='${MF}'>Trong đó</span> &emsp;x̃(t) = x(t) − x̄<br>&emsp;&emsp;&emsp;&emsp;&emsp;ũ(t) = u(t) − ū<br>&emsp;&emsp;&emsp;&emsp;&emsp;ỹ(t) = y(t) − ȳ &emsp;&emsp;(ȳ = h(x̄, ū))</div>`,
  speech:"Bây giờ ta đến ý tưởng chính của phần này: tuyến tính hóa. Ý tưởng giống như khi ta nhìn một đoạn rất ngắn của đường cong, nó gần như là một đoạn thẳng. Cho hệ phi tuyến mô tả bởi phương trình trạng thái phi tuyến x chấm bằng f của x và u, y bằng h của x và u. Khai triển Taylor f và h xung quanh điểm làm việc tĩnh x gạch ngang, u gạch ngang, ta có thể mô tả hệ thống bằng phương trình trạng thái tuyến tính: x ngoạc chấm bằng A x ngoạc cộng B u ngoạc, và y ngoạc bằng C x ngoạc cộng D u ngoạc. Trong đó x ngoạc bằng x trừ x gạch ngang, u ngoạc bằng u trừ u gạch ngang, y ngoạc bằng y trừ y gạch ngang, với y gạch ngang bằng h của x gạch ngang và u gạch ngang. Về mặt toán học, ta dùng khai triển Taylor và chỉ giữ lại số hạng bậc nhất. Các biến mới là độ lệch so với điểm làm việc, nên mô hình tuyến tính chỉ đúng khi hệ thống hoạt động gần điểm làm việc."},
 {type:"rich",title:"Tuyến tính hóa hệ PT xung quanh điểm làm việc tĩnh",
  html:`<div class='zm'><div class='tk'>Các ma trận trạng thái của hệ tuyến tính quanh điểm làm việc tĩnh được tính như sau:</div><div class='r3' style='align-items:center;margin:1cqw 0 2.5cqw'><span class='m' style='font-size:3.1cqw'><b>A</b> = <span style='background:#fff200;padding:.5cqw 1cqw'>${MAT([[PD('f<sub>1</sub>','x<sub>1</sub>'),PD('f<sub>1</sub>','x<sub>2</sub>'),'…',PD('f<sub>1</sub>','x<sub>n</sub>')],[PD('f<sub>2</sub>','x<sub>1</sub>'),PD('f<sub>2</sub>','x<sub>2</sub>'),'…',PD('f<sub>2</sub>','x<sub>n</sub>')],['⋮','⋮','⋱','⋮'],[PD('f<sub>n</sub>','x<sub>1</sub>'),PD('f<sub>n</sub>','x<sub>2</sub>'),'…',PD('f<sub>n</sub>','x<sub>n</sub>')]])}${BAR}</span></span><span class='m' style='font-size:3.1cqw'><b>B</b> = <span style='background:#c8f0ff;padding:.5cqw 1cqw'>${MAT([[PD('f<sub>1</sub>','u')],[PD('f<sub>2</sub>','u')],['⋮'],[PD('f<sub>n</sub>','u')]])}${BAR}</span></span></div><div class='r3' style='align-items:center;margin:0'><span class='m' style='font-size:3.1cqw'><b>C</b> = <span style='background:#ffd0d0;padding:.5cqw 1cqw'>${MAT([[PD('h','x<sub>1</sub>'),PD('h','x<sub>2</sub>'),'…',PD('h','x<sub>n</sub>')]])}${BAR}</span></span><span class='m' style='font-size:3.1cqw'><b>D</b> = <span style='background:#c8f5c8;padding:.5cqw 1cqw'>${MAT([[PD('h','u')]])}${BAR}</span></span></div></div>`,
  speech:"Vậy các ma trận A, B, C, D được tính như thế nào? Câu trả lời là bằng các đạo hàm riêng. Các ma trận trạng thái của hệ tuyến tính quanh điểm làm việc tĩnh được tính như sau. Ma trận A là ma trận các đạo hàm riêng của f i theo x j, gồm n hàng n cột, lấy giá trị tại điểm làm việc tĩnh. Ma trận B là vector cột gồm các đạo hàm riêng của f i theo u. Ma trận C là vector hàng gồm các đạo hàm riêng của h theo x một đến x n. Ma trận D là đạo hàm riêng của h theo u. Tất cả đều lấy giá trị tại x gạch ngang và u gạch ngang. Quy tắc: A là đạo hàm của f theo trạng thái, B là đạo hàm của f theo tín hiệu vào, còn C và D lấy từ h. Mọi thứ đều tính tại điểm làm việc, nên kết quả là các hằng số."},
 {type:"rich",title:"Tuyến tính hóa hệ phi tuyến – Thí dụ 1",
  html:`<div class='r3' style='align-items:flex-start;margin:0'>${TANK}<div style='flex:1;min-width:0'><div class='tk' style='font-size:2cqw'>Thông số hệ bồn chứa</div><div class='m' style='font-size:2cqw;line-height:1.8;margin-left:4cqw'>a = 1cm<sup>2</sup>, &nbsp;A = 100cm<sup>2</sup><br>k = 150cm<sup>3</sup>/sec.V, &nbsp;C<sub>D</sub> = 0.8<br>g = 981cm/sec<sup>2</sup></div></div></div><div class='r3' style='margin:1.5cqw 0 1cqw'><span class='tk' style='margin:0'>Phương trình trạng thái:</span><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('ẋ(t) = <b>f</b>(<b>x</b>(t), u(t))','y(t) = h(<b>x</b>(t), u(t))')}</span><span style='flex:1'></span></div><div class='m' style='font-size:1.9cqw;margin-left:3cqw;line-height:2.4'><span style='${MF}'>trong đó</span> &emsp;<b>f</b>(<b>x</b>, u) = −${fr('aC<sub>D</sub>'+SQ('2gx<sub>1</sub>(t)'),'A')} + ${fr('k','A')}u(t) = −0.3544${SQ('x<sub>1</sub>(t)')} + 1.5u(t)<br>&emsp;&emsp;&emsp;&emsp;h(<b>x</b>(t), u(t)) = x<sub>1</sub>(t)</div>`,
  speech:"Ta áp dụng vào hệ bồn chứa. Đầu tiên là các thông số cụ thể. Thông số hệ bồn chứa: a bằng 1 xen-ti-mét vuông, A bằng 100 xen-ti-mét vuông, k bằng 150 xen-ti-mét khối trên giây vôn, C D bằng 0 phẩy 8, g bằng 981 xen-ti-mét trên giây bình phương. Phương trình trạng thái x chấm bằng f của x và u, y bằng h của x và u, trong đó f của x và u bằng âm a C D căn hai g x một chia A, cộng k chia A nhân u, bằng âm 0 phẩy 3544 căn x một, cộng 1 phẩy 5 u. Và h bằng x một. Các hệ số đã được gộp sẵn nên hàm f có dạng rất gọn."},
 {type:"rich",title:"Tuyến tính hóa hệ phi tuyến – Thí dụ 1(tt)",
  html:`<div class='tk' style='margin-top:2cqw'>Tuyến tính hóa hệ bồn chứa quanh điểm y = 20cm:</div><div class='tk' style='margin-top:3cqw'>Xác định điểm làm việc tĩnh:</div><div class='m' style='font-size:2.2cqw;line-height:2.6;margin-left:10cqw'>x̄<sub>1</sub> = 20<br><b>f</b>(<b>x̄</b>, ū) = −0.3544${SQ('x̄<sub>1</sub>')} + 1.5ū = 0 &emsp;⇒ &emsp;ū = 0.9465</div>`,
  speech:"Ta muốn tuyến tính hóa quanh mực chất lỏng hai mươi xen-ti-mét. Việc đầu tiên là tìm tín hiệu điều khiển để giữ mực đứng yên ở mức này. Tuyến tính hóa hệ bồn chứa quanh điểm y bằng 20 xen-ti-mét. Xác định điểm làm việc tĩnh: x một gạch ngang bằng 20. f của x gạch ngang và u gạch ngang bằng âm 0 phẩy 3544 căn x một gạch ngang, cộng 1 phẩy 5 u gạch ngang, bằng 0. Suy ra u gạch ngang bằng 0 phẩy 9465, như trên slide."},
 {type:"rich",title:"Tuyến tính hóa hệ phi tuyến – Thí dụ 1(tt)",
  html:`<div class='tk' style='margin-top:1cqw'>Xác định các ma trận trạng thái tại điểm làm việc tĩnh:</div><div class='r3' style='margin:2.5cqw 0'><span class='m' style='font-size:1.95cqw'><b>A</b> = ${fr('∂f<sub>1</sub>','∂x<sub>1</sub>')}${BAR} = −${fr('aC<sub>D</sub>√(2g)','2A√x̄<sub>1</sub>')}${BAR} = −0.0396</span><span class='m' style='font-size:1.95cqw'><b>B</b> = ${fr('∂f<sub>1</sub>','∂u')}${BAR} = ${fr('k','A')}${BAR} = 1.5</span></div><div class='r3' style='margin:2.5cqw 0'><span class='m' style='font-size:1.95cqw'><b>C</b> = ${fr('∂h','∂x<sub>1</sub>')}${BAR} = 1</span><span class='m' style='font-size:1.95cqw'><b>D</b> = ${fr('∂h','∂u')}${BAR} = 0</span></div><div class='tk'>Vậy PTTT mô tả hệ bồn chứa quanh điểm làm việc y = 20 cm là:</div><div style='text-align:center;margin-top:2cqw'><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('x̃̇(t) = −0.0396x̃(t) + 1.5ũ(t)','ỹ(t) = x̃(t)')}</span></div>`,
  speech:"Bước tiếp theo là tính các ma trận trạng thái bằng đạo hàm riêng, như công thức ở slide trước. Xác định các ma trận trạng thái tại điểm làm việc tĩnh. A bằng đạo hàm riêng của f một theo x một, bằng âm a C D căn hai g chia hai A căn x một gạch ngang, bằng âm 0 phẩy 0396. B bằng đạo hàm riêng của f một theo u, bằng k chia A, bằng 1 phẩy 5. C bằng đạo hàm riêng của h theo x một, bằng 1. D bằng đạo hàm riêng của h theo u, bằng 0. Vậy phương trình trạng thái mô tả hệ bồn chứa quanh điểm làm việc y bằng 20 xen-ti-mét là: x ngoạc chấm bằng âm 0 phẩy 0396 x ngoạc cộng 1 phẩy 5 u ngoạc, và y ngoạc bằng x ngoạc. Hệ số A âm cho thấy mô hình tuyến tính là ổn định: nếu mực chất lỏng lệch khỏi điểm làm việc thì nó tự trở về."},
 {type:"rich",title:"Tuyến tính hóa hệ phi tuyến – Thí dụ 2",
  html:`<div class='r3' style='align-items:flex-start;margin:0'>${ROBOT}<div style='flex:1;min-width:0'><div class='tk' style='font-size:2cqw'>Thông số cánh tay máy</div><div class='m' style='font-size:2cqw;line-height:1.9;margin-left:4cqw'>l = 0.5m, &nbsp;l<sub>C</sub> = 0.2m, m = 0.1kg<br>M = 0.5kg, J = 0.02kg.m<sup>2</sup><br>B = 0.005, &nbsp;g = 9.81m/sec<sup>2</sup></div></div></div><div class='r3' style='margin:1.5cqw 0 1cqw'><span class='tk' style='margin:0'>Phương trình trạng thái:</span><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('ẋ(t) = <b>f</b>(<b>x</b>(t), u(t))','y(t) = h(<b>x</b>(t), u(t))')}</span><span style='flex:1'></span></div><div class='m' style='font-size:1.85cqw;margin-left:3cqw;display:flex;align-items:center;gap:1.5cqw;flex-wrap:wrap'><span style='${MF}'>trong đó</span><b>f</b>(<b>x</b>,u) = ${MAT([['x<sub>2</sub>(t)'],['−'+fr('(ml+Ml<sub>C</sub>)g','J+ml<sup>2</sup>')+'cos x<sub>1</sub>(t) − '+fr('B','J+ml<sup>2</sup>')+'x<sub>2</sub>(t) + '+fr('1','J+ml<sup>2</sup>')+'u(t)']])}</div><div class='m' style='font-size:1.9cqw;margin:1cqw 0 0 12cqw'>h(<b>x</b>(t), u(t)) = x<sub>1</sub>(t)</div>`,
  speech:"Thí dụ thứ hai là cánh tay máy. Ta bắt đầu với các thông số cụ thể. Thông số cánh tay máy: l bằng 0 phẩy 5 mét, l C bằng 0 phẩy 2 mét, m bằng 0 phẩy 1 ki-lô-gam. M bằng 0 phẩy 5 ki-lô-gam, J bằng 0 phẩy 02 ki-lô-gam mét vuông. B bằng 0 phẩy 005, g bằng 9 phẩy 81 mét trên giây bình phương. Phương trình trạng thái có dạng x chấm bằng f của x và u, y bằng h của x và u, trong đó f là vector gồm x hai và biểu thức âm m l cộng M l C nhân g chia J cộng m l bình phương nhân cô-sin x một, trừ B chia J cộng m l bình phương nhân x hai, cộng một chia J cộng m l bình phương nhân u. Và h bằng x một."},
 {type:"rich",title:"Tuyến tính hóa hệ phi tuyến – Thí dụ 2(tt)",
  html:`<div class='tk'>Tuyến tính hóa hệ tay máy quanh điểm làm việc y = π/6 (rad):</div><div class='tk'>Xác định điểm làm việc tĩnh:</div><div class='m' style='font-size:1.9cqw;margin:1cqw 0 0 8cqw;line-height:2.6'>x̄<sub>1</sub> = π/6<br><b>f</b>(<b>x̄</b>, ū) = ${MAT([['x̄<sub>2</sub>'],['−'+fr('(ml+Ml<sub>C</sub>)g','J+ml<sup>2</sup>')+'cos x̄<sub>1</sub> − '+fr('B','J+ml<sup>2</sup>')+'x̄<sub>2</sub> + '+fr('1','J+ml<sup>2</sup>')+'ū']])} = 0<br>&emsp;&emsp;&emsp;&emsp;⇒ ${BR('x̄<sub>2</sub> = 0','ū = 1.2744')}</div><div class='tk' style='margin-top:1cqw'>Do đó điểm làm việc tĩnh cần xác định là:</div><div class='m' style='font-size:2cqw;margin-left:8cqw;line-height:2.4'><span class='eqy' style='padding:.4cqw 1cqw'><b>x̄</b> = ${MAT([['x̄<sub>1</sub>'],['x̄<sub>2</sub>']])} = ${MAT([['π/6'],['0']])}</span><br><span class='eqy' style='padding:.4cqw 1cqw'>ū = 1.2744</span></div>`,
  speech:"Ta tuyến tính hóa quanh góc pi chia sáu radian, tức ba mươi độ. Tại điểm dừng, cánh tay đứng yên nên tốc độ góc bằng không. Tuyến tính hóa hệ tay máy quanh điểm làm việc y bằng pi chia sáu radian. Xác định điểm làm việc tĩnh: x một gạch ngang bằng pi chia sáu. Cho f của x gạch ngang và u gạch ngang bằng 0, ta được x hai gạch ngang bằng 0 và u gạch ngang bằng 1 phẩy 2744. Do đó điểm làm việc tĩnh cần xác định là x gạch ngang bằng pi chia sáu và 0, và u gạch ngang bằng 1 phẩy 2744. Moment u gạch ngang chính là moment cần thiết để giữ cánh tay đứng yên ở vị trí này, cân bằng với trọng lực."},
 {type:"rich",title:"Tuyến tính hóa hệ phi tuyến – Thí dụ 2(tt)",
  html:`<div class='zm'><div class='tk'>Xác định các ma trận trạng thái tại điểm làm việc tĩnh:</div><div style='text-align:center;margin:1cqw 0 2cqw'><span class='eqy' style='font-size:3.6cqw'><b>A</b> = ${MAT([['a<sub>11</sub>','a<sub>12</sub>'],['a<sub>21</sub>','a<sub>22</sub>']])}</span></div><div class='r3' style='margin:0 0 2cqw'><span class='m' style='font-size:3.4cqw'>a<sub>11</sub> = ${PD('f<sub>1</sub>','x<sub>1</sub>')}${BAR} = 0</span><span class='m' style='font-size:3.4cqw'>a<sub>12</sub> = ${PD('f<sub>1</sub>','x<sub>2</sub>')}${BAR} = 1</span></div><div class='m' style='font-size:3.4cqw;margin:0 0 2cqw 3cqw'>a<sub>21</sub> = ${PD('f<sub>2</sub>','x<sub>1</sub>')}${BAR} = ${fr('(ml+Ml<sub>C</sub>)g','J+ml<sup>2</sup>')}sin x<sub>1</sub>(t)${BAR}</div><div class='m' style='font-size:3.4cqw;margin-left:3cqw'>a<sub>22</sub> = ${PD('f<sub>2</sub>','x<sub>2</sub>')}${BAR} = −${fr('B','J+ml<sup>2</sup>')}${BAR}</div></div>`,
  speech:"Bây giờ ta tính ma trận A bằng cách lấy đạo hàm riêng. Xác định các ma trận trạng thái tại điểm làm việc tĩnh. Ma trận A gồm a mười một, a mười hai, a hai một, a hai hai. A mười một bằng đạo hàm riêng của f một theo x một, bằng 0. A mười hai bằng đạo hàm riêng của f một theo x hai, bằng 1. A hai một bằng đạo hàm riêng của f hai theo x một, bằng m l cộng M l C nhân g chia J cộng m l bình phương, nhân sin x một, tại điểm làm việc tĩnh. A hai hai bằng đạo hàm riêng của f hai theo x hai, bằng âm B chia J cộng m l bình phương. Hai phần tử trên hàng đầu rất đơn giản vì phương trình đầu chỉ là x một chấm bằng x hai. Phần tử a hai một chứa hàm sin, là kết quả của việc lấy đạo hàm hàm cô-sin."},
 {type:"rich",title:"Tuyến tính hóa hệ phi tuyến – Thí dụ 2(tt)",
  html:`<div class='tk'>Xác định các ma trận trạng thái tại điểm làm việc tĩnh:</div><div style='margin:1cqw 0 3cqw 12cqw'><span class='eqy' style='font-size:2cqw'><b>B</b> = ${MAT([['b<sub>1</sub>'],['b<sub>2</sub>']])}</span></div><div class='m' style='font-size:2cqw;margin-left:10cqw;line-height:3'>b<sub>1</sub> = ${PD('f<sub>1</sub>','u')}${BAR} = 0<br>b<sub>2</sub> = ${PD('f<sub>2</sub>','u')}${BAR} = ${fr('1','J+ml<sup>2</sup>')}</div>`,
  speech:"Tiếp theo là vector B. Xác định các ma trận trạng thái tại điểm làm việc tĩnh. Vector B gồm b một và b hai. B một bằng đạo hàm riêng của f một theo u, bằng 0. B hai bằng đạo hàm riêng của f hai theo u, bằng một chia J cộng m l bình phương. Chỉ có moment điều khiển u tác động lên phương trình thứ hai, nên phần tử đầu của B bằng không."},
 {type:"rich",title:"Tuyến tính hóa hệ phi tuyến – Thí dụ 2(tt)",
  html:`<div class='tk'>Xác định các ma trận trạng thái tại điểm làm việc tĩnh:</div><div class='r3' style='margin:1cqw 0 1cqw'><span class='eqy' style='font-size:2cqw'><b>C</b> = ${MAT([['c<sub>1</sub>','c<sub>2</sub>']])}</span><span class='m' style='font-size:1.9cqw'>c<sub>1</sub> = ${PD('h','x<sub>1</sub>')}${BAR} = 1</span><span class='m' style='font-size:1.9cqw'>c<sub>2</sub> = ${PD('h','x<sub>2</sub>')}${BAR} = 0</span></div><div class='r3' style='margin:1cqw 0 1.5cqw'><span class='eqy' style='font-size:2cqw'><b>D</b> = d<sub>1</sub></span><span class='m' style='font-size:1.9cqw'>d<sub>1</sub> = ${PD('h','u')}${BAR} = 0</span><span style='flex:1'></span></div><div class='r3' style='margin:0 0 1cqw'><span class='tk' style='margin:0'>Vậy phương trình trạng thái cần tìm là:</span><span class='eqy' style='padding:.6cqw 1.5cqw'>${BR('x̃̇(t) = <b>A</b>x̃(t) + <b>B</b>ũ(t)','ỹ(t) = <b>C</b>x̃(t) + <b>D</b>ũ(t)')}</span><span style='flex:.3'></span></div><div class='m' style='font-size:1.9cqw;display:flex;align-items:center;gap:2.5cqw;justify-content:center;flex-wrap:wrap'><b>A</b> = ${MAT([['0','1'],['a<sub>21</sub>','a<sub>22</sub>']])}<b>B</b> = ${MAT([['0'],['b<sub>2</sub>']])}<b>C</b> = ${MAT([['1','0']])}<b>D</b> = 0</div>`,
  speech:"Cuối cùng là C và D, rồi ta viết kết quả. Xác định các ma trận trạng thái tại điểm làm việc tĩnh. Vector C gồm c một và c hai, với c một bằng đạo hàm riêng của h theo x một, bằng 1, và c hai bằng đạo hàm riêng của h theo x hai, bằng 0. D bằng d một, bằng đạo hàm riêng của h theo u, bằng 0. Vậy phương trình trạng thái cần tìm là: x ngoạc chấm bằng A x ngoạc cộng B u ngoạc, y ngoạc bằng C x ngoạc cộng D u ngoạc. Trong đó A gồm hàng không, một và hàng a hai một, a hai hai. B bằng không và b hai. C bằng một, không. D bằng 0. Ngõ ra chỉ là góc quay nên C chỉ có một phần tử khác không và D bằng không. Phương trình trạng thái tuyến tính này có thể dùng để thiết kế bộ điều khiển quanh vị trí ba mươi độ."},
 {type:"rich",title:"Điều khiển ổn định hóa hệ phi tuyến quanh ĐLV tĩnh",
  html:`<div class='rb' style='margin-top:1cqw'>Đưa hệ phi tuyến về miền xung quanh điểm làm việc tĩnh (đơn giản nhất có thể dùng <span class='r'>bộ điều khiển ON-OFF</span>).</div><div class='rb' style='margin-top:1.5cqw'>Xung quanh điểm làm việc, dùng bộ điều khiển tuyến tính.</div>${S(380,135,`<path d='M2 40H38M52 40H80M80 22V102M80 22H100M80 57H100M80 102H100M160 22H190M160 57H190M222 62H255M335 62H372M355 62V128H45V47'/><path d='M160 102H208V72' stroke-dasharray='3 2'/><path d='M222 62L194 26'/>`+SMc(45,40)+DT(190,22,'#111')+DT(190,57,'#111')+DT(222,62,'#111')+DT(355,62,'#111')+ARw(100,22)+ARw(100,57)+ARw(100,102)+ARw(255,62)+ARw(372,62)+BXs(100,10,60,24,'ĐK tuyến tính','#ffc8c8')+BXs(100,45,60,24,'ON-OFF','#fff200')+BXs(100,90,60,24,'Chọn bộ ĐK','#ff5030')+BXs(255,47,80,30,'Đối tượng phi tuyến','#35c8ff')+TX(2,34,'r(t)')+TX(60,34,'e(t)')+TX(232,56,'u(t)')+TX(360,56,'y(t)')+TX(34,32,'+')+TX(50,58,'−'),'w')}`,
  speech:"Cuối cùng, ta ứng dụng vào điều khiển. Mô hình tuyến tính chỉ đúng gần điểm làm việc, vậy khi hệ ở xa điểm làm việc thì phải làm sao? Một: đưa hệ phi tuyến về miền xung quanh điểm làm việc tĩnh, đơn giản nhất có thể dùng bộ điều khiển ON OFF. Hai: xung quanh điểm làm việc, dùng bộ điều khiển tuyến tính. Sơ đồ gồm ba bộ điều khiển: điều khiển tuyến tính, ON OFF và khối chọn bộ điều khiển, cùng một công tắc chuyển để đưa tín hiệu u vào đối tượng phi tuyến, có hồi tiếp âm từ ngõ ra y. Giải pháp là điều khiển hai giai đoạn: dùng bộ ON OFF kéo hệ về gần điểm làm việc, rồi chuyển sang bộ điều khiển tuyến tính được thiết kế từ mô hình đã tuyến tính hóa."},
 {type:"rich",title:"Bảng tổng hợp công thức (1/4)",
  html:`<div class='ftb'><div class='ftc' data-src='10' style='--ftc:#1f4e8c'><button class='ftg' data-go='10' data-n='10' aria-label='Xem bài giảng, slide 10'></button><div class='ftl'>Laplace · Định nghĩa</div><div class='fl'>ℒ{f(t)} = F(s) = <span class='in'><i>+∞</i>∫<i>0</i></span> f(t)·e<sup>−st</sup>dt</div></div><div class='ftc' data-src='11' style='--ftc:#1f4e8c'><button class='ftg' data-go='11' data-n='11' aria-label='Xem bài giảng, slide 11'></button><div class='ftl'>Laplace · Tính tuyến tính</div><div class='fl'>ℒ{a·f(t) + b·g(t)} = a·F(s) + b·G(s)</div></div><div class='ftc' data-src='11' style='--ftc:#1f4e8c'><button class='ftg' data-go='11' data-n='11' aria-label='Xem bài giảng, slide 11'></button><div class='ftl'>Laplace · Định lý chậm trễ</div><div class='fl'>ℒ{f(t − T)} = e<sup>−Ts</sup>·F(s)</div></div><div class='ftc' data-src='11' style='--ftc:#1f4e8c'><button class='ftg' data-go='11' data-n='11' aria-label='Xem bài giảng, slide 11'></button><div class='ftl'>Laplace · Ảnh của đạo hàm</div><div class='fl'>ℒ{<span class='fr'><span>df(t)</span><span>dt</span></span>} = sF(s) − f(0<sup>+</sup>)</div></div><div class='ftc' data-src='11' style='--ftc:#1f4e8c'><button class='ftg' data-go='11' data-n='11' aria-label='Xem bài giảng, slide 11'></button><div class='ftl'>Laplace · Ảnh của tích phân</div><div class='fl'>ℒ{<span class='in'><i>t</i>∫<i>0</i></span> f(τ)dτ} = <span class='fr'><span>F(s)</span><span>s</span></span></div></div><div class='ftc' data-src='11' style='--ftc:#1f4e8c'><button class='ftg' data-go='11' data-n='11' aria-label='Xem bài giảng, slide 11'></button><div class='ftl'>Laplace · Định lý giá trị cuối</div><div class='fl'>lim<sub>t→∞</sub> f(t) = lim<sub>s→0</sub> sF(s)</div></div><div class='ftc' data-src='12' style='--ftc:#1f4e8c'><button class='ftg' data-go='12' data-n='12' aria-label='Xem bài giảng, slide 12'></button><div class='ftl'>Hàm nấc đơn vị và hàm Dirac</div><div class='fl'>ℒ{u(t)} = <span class='fr'><span>1</span><span>s</span></span>&emsp;ℒ{δ(t)} = 1</div></div><div class='ftc' data-src='13' style='--ftc:#1f4e8c'><button class='ftg' data-go='13' data-n='13' aria-label='Xem bài giảng, slide 13'></button><div class='ftl'>Hàm dốc và hàm mũ</div><div class='fl'>ℒ{t·u(t)} = <span class='fr'><span>1</span><span>s<sup>2</sup></span></span>&emsp;ℒ{e<sup>−at</sup>·u(t)} = <span class='fr'><span>1</span><span>s + a</span></span></div></div><div class='ftc' data-src='14' style='--ftc:#1f4e8c'><button class='ftg' data-go='14' data-n='14' aria-label='Xem bài giảng, slide 14'></button><div class='ftl'>Hàm sin</div><div class='fl'>ℒ{(sin ωt)·u(t)} = <span class='fr'><span>ω</span><span>s<sup>2</sup> + ω<sup>2</sup></span></span></div></div><div class='ftc' data-src='16' style='--ftc:#0a7d4b'><button class='ftg' data-go='16' data-n='16' aria-label='Xem bài giảng, slide 16'></button><div class='ftl'>Hàm truyền · Định nghĩa</div><div class='fl'>G(s) = <span class='fr'><span>Y(s)</span><span>U(s)</span></span>&emsp;(điều kiện đầu = 0)</div></div><div class='ftc w' data-src='16,15' style='--ftc:#0a7d4b'><button class='ftg' data-go='16' data-n='16' aria-label='Xem bài giảng, slide 16'></button><div class='ftl'>Hàm truyền của phương trình vi phân bậc n</div><div class='fl'>G(s) = <span class='fr'><span>Y(s)</span><span>U(s)</span></span> = <span class='fr'><span>b<sub>0</sub>s<sup>m</sup> + b<sub>1</sub>s<sup>m−1</sup> + ⋯ + b<sub>m−1</sub>s + b<sub>m</sub></span><span>a<sub>0</sub>s<sup>n</sup> + a<sub>1</sub>s<sup>n−1</sup> + ⋯ + a<sub>n−1</sub>s + a<sub>n</sub></span></span></div></div></div>`,
  speech:"Bảng tổng hợp công thức, phần một, biến đổi Laplace và hàm truyền. Định nghĩa Laplace, F của s bằng tích phân từ không đến vô cùng của f của t nhân e mũ trừ s t. Tính tuyến tính, Laplace của a f cộng b g bằng a F cộng b G. Định lý chậm trễ, dịch f đi T thì ảnh nhân thêm e mũ trừ T s. Ảnh của đạo hàm bằng s F của s trừ f của không cộng. Ảnh của tích phân bằng F của s chia s. Định lý giá trị cuối, giới hạn của f khi t tiến đến vô cùng bằng giới hạn của s F khi s tiến đến không. Với các hàm cơ bản, hàm nấc đơn vị có ảnh là một chia s, hàm Dirac có ảnh bằng một. Hàm dốc có ảnh một chia s bình phương, hàm mũ có ảnh một chia s cộng a. Hàm sin có ảnh là omega chia s bình phương cộng omega bình phương. Hàm truyền là tỉ số giữa biến đổi Laplace của tín hiệu ra và tín hiệu vào, khi điều kiện đầu bằng không. Với phương trình vi phân bậc n, hàm truyền là một phân thức, tử số là đa thức bậc m theo s, mẫu số là đa thức bậc n theo s."},
 {type:"rich",title:"Bảng tổng hợp công thức (2/4)",
  html:`<div class='ftb'><div class='ftc' data-src='28' style='--ftc:#0a7d4b'><button class='ftg' data-go='28' data-n='28' aria-label='Xem bài giảng, slide 28'></button><div class='ftl'>Quán tính bậc 1 · Xe ô tô</div><div class='fl'>G(s) = <span class='fr'><span>1</span><span>Ms + B</span></span> = <span class='fr'><span>K</span><span>Ts + 1</span></span></div><div class='fl'>K = <span class='fr'><span>1</span><span>B</span></span>&emsp;T = <span class='fr'><span>M</span><span>B</span></span></div></div><div class='ftc' data-src='29' style='--ftc:#0a7d4b'><button class='ftg' data-go='29' data-n='29' aria-label='Xem bài giảng, slide 29'></button><div class='ftl'>Hệ giảm xóc</div><div class='fl'>G(s) = <span class='fr'><span>1</span><span>Ms<sup>2</sup> + Bs + K</span></span></div></div><div class='ftc' data-src='30' style='--ftc:#0a7d4b'><button class='ftg' data-go='30' data-n='30' aria-label='Xem bài giảng, slide 30'></button><div class='ftl'>Thang máy</div><div class='fl'>G(s) = <span class='fr'><span>K</span><span>M<sub>T</sub>s<sup>2</sup> + Bs</span></span></div></div><div class='ftc' data-src='27' style='--ftc:#0a7d4b'><button class='ftg' data-go='27' data-n='27' aria-label='Xem bài giảng, slide 27'></button><div class='ftl'>Lò nhiệt</div><div class='fl'>G(s) = <span class='fr'><span>Ke<sup>−T<sub>1</sub>s</sup></span><span>1 + T<sub>2</sub>s</span></span></div></div><div class='ftc' data-src='31' style='--ftc:#0a7d4b'><button class='ftg' data-go='31' data-n='31' aria-label='Xem bài giảng, slide 31'></button><div class='ftl'>Cảm biến</div><div class='fl'>H(s) = K<sub>ht</sub></div><div class='fl'>H(s) = <span class='fr'><span>K<sub>ht</sub></span><span>1 + T<sub>ht</sub>s</span></span></div></div><div class='ftc' data-src='18' style='--ftc:#c26a00'><button class='ftg' data-go='18' data-n='18' aria-label='Xem bài giảng, slide 18'></button><div class='ftl'>Mạch tích phân – vi phân bậc 1</div><div class='fl'>G(s) = <span class='fr'><span>1</span><span>RCs + 1</span></span>&emsp;G(s) = <span class='fr'><span>RCs</span><span>RCs + 1</span></span></div></div><div class='ftc' data-src='19' style='--ftc:#c26a00'><button class='ftg' data-go='19' data-n='19' aria-label='Xem bài giảng, slide 19'></button><div class='ftl'>Mạch sớm pha</div><div class='fl'>G(s) = K<sub>C</sub><span class='fr'><span>αTs + 1</span><span>Ts + 1</span></span></div><div class='fl'>K<sub>C</sub> = <span class='fr'><span>R<sub>2</sub></span><span>R<sub>1</sub>+R<sub>2</sub></span></span>&emsp;T = <span class='fr'><span>R<sub>2</sub>R<sub>1</sub>C</span><span>R<sub>1</sub>+R<sub>2</sub></span></span>&emsp;α = <span class='fr'><span>R<sub>1</sub>+R<sub>2</sub></span><span>R<sub>2</sub></span></span> &gt; 1</div></div><div class='ftc' data-src='19' style='--ftc:#c26a00'><button class='ftg' data-go='19' data-n='19' aria-label='Xem bài giảng, slide 19'></button><div class='ftl'>Mạch trễ pha</div><div class='fl'>G(s) = K<sub>C</sub><span class='fr'><span>αTs + 1</span><span>Ts + 1</span></span></div><div class='fl'>K<sub>C</sub> = 1&emsp;T = (R<sub>1</sub>+R<sub>2</sub>)C&emsp;α = <span class='fr'><span>R<sub>2</sub></span><span>R<sub>1</sub>+R<sub>2</sub></span></span> &lt; 1</div></div><div class='ftc' data-src='20' style='--ftc:#c26a00'><button class='ftg' data-go='20' data-n='20' aria-label='Xem bài giảng, slide 20'></button><div class='ftl'>Khâu P và khâu PI</div><div class='fl'>G(s) = K<sub>P</sub>&emsp;K<sub>P</sub> = −<span class='fr'><span>R<sub>2</sub></span><span>R<sub>1</sub></span></span></div><div class='fl'>G(s) = K<sub>P</sub> + <span class='fr'><span>K<sub>I</sub></span><span>s</span></span>&emsp;K<sub>I</sub> = −<span class='fr'><span>1</span><span>R<sub>1</sub>C</span></span></div></div><div class='ftc' data-src='21' style='--ftc:#c26a00'><button class='ftg' data-go='21' data-n='21' aria-label='Xem bài giảng, slide 21'></button><div class='ftl'>Khâu PD và khâu PID</div><div class='fl'>G(s) = K<sub>P</sub> + K<sub>D</sub>s&emsp;K<sub>D</sub> = −R<sub>2</sub>C</div><div class='fl'>G(s) = K<sub>P</sub> + <span class='fr'><span>K<sub>I</sub></span><span>s</span></span> + K<sub>D</sub>s</div><div class='fl'>K<sub>P</sub> = −<span class='fr'><span>R<sub>1</sub>C<sub>1</sub>+R<sub>2</sub>C<sub>2</sub></span><span>R<sub>1</sub>C<sub>2</sub></span></span>&emsp;K<sub>I</sub> = −<span class='fr'><span>1</span><span>R<sub>1</sub>C<sub>2</sub></span></span>&emsp;K<sub>D</sub> = −R<sub>2</sub>C<sub>1</sub></div></div></div>`,
  speech:"Phần hai, hàm truyền của các phần tử và các khâu hiệu chỉnh. Khâu quán tính bậc một, ví dụ xe ô tô, G bằng một chia M s cộng B, hay K chia T s cộng một, với K bằng một chia B và T bằng M chia B. Hệ giảm xóc, G bằng một chia M s bình phương cộng B s cộng K. Thang máy, G bằng K chia M T s bình phương cộng B s. Lò nhiệt, G bằng K e mũ trừ T một s, chia một cộng T hai s. Cảm biến là khâu tỉ lệ H bằng K ht, hoặc khâu quán tính bậc một K ht chia một cộng T ht s. Mạch tích phân bậc một, một chia R C s cộng một. Mạch vi phân bậc một, R C s chia R C s cộng một. Mạch sớm pha, G bằng K C nhân alpha T s cộng một, chia T s cộng một, với alpha lớn hơn một. Mạch trễ pha có cùng dạng hàm truyền, nhưng K C bằng một và alpha nhỏ hơn một. Khâu tỷ lệ P và khâu PI, K P bằng trừ R hai chia R một, khâu PI thêm K I chia s. Khâu PD và khâu PID, khâu PD thêm K D nhân s, khâu PID gồm cả ba thành phần K P, K I chia s và K D nhân s."},
 {type:"rich",title:"Bảng tổng hợp công thức (3/4)",
  html:`<div class='ftb'><div class='ftc' data-src='23' style='--ftc:#7a3fb0'><button class='ftg' data-go='23' data-n='23' aria-label='Xem bài giảng, slide 23'></button><div class='ftl'>Động cơ DC · Mạch phần ứng</div><div class='fl'>U<sub>ư</sub>(t) = i<sub>ư</sub>(t)·R<sub>ư</sub> + L<sub>ư</sub><span class='fr'><span>di<sub>ư</sub>(t)</span><span>dt</span></span> + E<sub>ư</sub>(t)</div><div class='fl'>E<sub>ư</sub>(t) = KΦω(t)</div></div><div class='ftc' data-src='23' style='--ftc:#7a3fb0'><button class='ftg' data-go='23' data-n='23' aria-label='Xem bài giảng, slide 23'></button><div class='ftl'>Động cơ DC · Phương trình cơ</div><div class='fl'>M(t) = M<sub>t</sub>(t) + Bω(t) + J<span class='fr'><span>dω(t)</span><span>dt</span></span></div><div class='fl'>M(t) = KΦi<sub>ư</sub>(t)</div></div><div class='ftc' data-src='24' style='--ftc:#7a3fb0'><button class='ftg' data-go='24' data-n='24' aria-label='Xem bài giảng, slide 24'></button><div class='ftl'>Động cơ DC · Hằng số thời gian</div><div class='fl'>T<sub>ư</sub> = <span class='fr'><span>L<sub>ư</sub></span><span>R<sub>ư</sub></span></span>&emsp;T<sub>c</sub> = <span class='fr'><span>J</span><span>B</span></span></div></div><div class='ftc' data-src='25' style='--ftc:#7a3fb0'><button class='ftg' data-go='25' data-n='25' aria-label='Xem bài giảng, slide 25'></button><div class='ftl'>Động cơ DC · Hàm truyền thành phần</div><div class='fl'>I<sub>ư</sub>(s) = <span class='fr'><span>U<sub>ư</sub>(s) − E<sub>ư</sub>(s)</span><span>R<sub>ư</sub>(1 + T<sub>ư</sub>s)</span></span></div><div class='fl'>ω(s) = <span class='fr'><span>M(s) − M<sub>t</sub>(s)</span><span>B(1 + T<sub>c</sub>s)</span></span></div></div><div class='ftc' data-src='34' style='--ftc:#c0262d'><button class='ftg' data-go='34' data-n='34' aria-label='Xem bài giảng, slide 34'></button><div class='ftl'>Sơ đồ khối · Nối tiếp</div><div class='fl'>G<sub>nt</sub>(s) = ∏<sub>i=1</sub><sup>n</sup> G<sub>i</sub>(s)</div></div><div class='ftc' data-src='35' style='--ftc:#c0262d'><button class='ftg' data-go='35' data-n='35' aria-label='Xem bài giảng, slide 35'></button><div class='ftl'>Sơ đồ khối · Song song</div><div class='fl'>G<sub>ss</sub>(s) = ∑<sub>i=1</sub><sup>n</sup> G<sub>i</sub>(s)</div></div><div class='ftc' data-src='36' style='--ftc:#c0262d'><button class='ftg' data-go='36' data-n='36' aria-label='Xem bài giảng, slide 36'></button><div class='ftl'>Hồi tiếp âm</div><div class='fl'>G<sub>k</sub>(s) = <span class='fr'><span>G(s)</span><span>1 + G(s)·H(s)</span></span></div><div class='fl'>G<sub>k</sub>(s) = <span class='fr'><span>G(s)</span><span>1 + G(s)</span></span>&emsp;(hồi tiếp đơn vị)</div></div><div class='ftc' data-src='37' style='--ftc:#c0262d'><button class='ftg' data-go='37' data-n='37' aria-label='Xem bài giảng, slide 37'></button><div class='ftl'>Hồi tiếp dương</div><div class='fl'>G<sub>k</sub>(s) = <span class='fr'><span>G(s)</span><span>1 − G(s)·H(s)</span></span></div><div class='fl'>G<sub>k</sub>(s) = <span class='fr'><span>G(s)</span><span>1 − G(s)</span></span>&emsp;(hồi tiếp đơn vị)</div></div><div class='ftc' data-src='39,40' style='--ftc:#00798c'><button class='ftg' data-go='39' data-n='39' aria-label='Xem bài giảng, slide 39'></button><div class='ftl'>Chuyển điểm rẽ nhánh qua một khối</div><div class='fl'>x<sub>3</sub> = x<sub>1</sub>G&emsp;x<sub>2</sub> = x<sub>3</sub>·<span class='fr'><span>1</span><span>G</span></span> = x<sub>1</sub></div></div><div class='ftc' data-src='41,42' style='--ftc:#00798c'><button class='ftg' data-go='41' data-n='41' aria-label='Xem bài giảng, slide 41'></button><div class='ftl'>Chuyển bộ tổng qua một khối</div><div class='fl'>x<sub>2</sub> = (x<sub>1</sub> − x<sub>3</sub>)·G = x<sub>1</sub>G − x<sub>3</sub>G</div><div class='fl'>x<sub>2</sub> = x<sub>1</sub>G − x<sub>3</sub> = [x<sub>1</sub> − x<sub>3</sub>·<span class='fr'><span>1</span><span>G</span></span>]·G</div></div><div class='ftc w' data-src='61,62,63' style='--ftc:#00798c'><button class='ftg' data-go='61' data-n='61' aria-label='Xem bài giảng, slide 61'></button><div class='ftl'>Công thức Mason</div><div class='fl'>G = <span class='fr'><span>1</span><span>Δ</span></span> ∑<sub>k</sub> Δ<sub>k</sub>P<sub>k</sub></div><div class='fl'>Δ = 1 − ∑<sub>i</sub> L<sub>i</sub> + ∑<sub>i,j</sub> L<sub>i</sub>L<sub>j</sub> − ∑<sub>i,j,m</sub> L<sub>i</sub>L<sub>j</sub>L<sub>m</sub> + ⋯</div></div></div>`,
  speech:"Phần ba, động cơ một chiều, đại số sơ đồ khối và công thức Mason. Động cơ DC, mạch phần ứng, U ư bằng i ư nhân R ư cộng L ư di ư trên dt cộng E ư, với E ư bằng K phi omega. Phương trình cơ, moment M bằng M t cộng B omega cộng J d omega trên dt, với M bằng K phi i ư. Hằng số thời gian, T ư bằng L ư chia R ư là hằng số thời gian điện từ, T c bằng J chia B là hằng số thời gian điện cơ. Hàm truyền thành phần, I ư của s bằng U ư trừ E ư chia R ư nhân một cộng T ư s, và omega của s bằng M trừ M t chia B nhân một cộng T c s. Với sơ đồ khối, các khối nối tiếp có hàm truyền bằng tích các hàm truyền. Các khối song song có hàm truyền bằng tổng các hàm truyền. Hồi tiếp âm, G k bằng G chia một cộng G H, và bằng G chia một cộng G khi hồi tiếp đơn vị. Hồi tiếp dương, G k bằng G chia một trừ G H. Khi chuyển điểm rẽ nhánh ra sau một khối, x ba bằng x một G, và x hai bằng x ba nhân một chia G, bằng x một. Khi chuyển bộ tổng ra sau một khối, x hai bằng x một trừ x ba, nhân G, bằng x một G trừ x ba G. Chuyển ngược về phía trước thì x hai bằng x một G trừ x ba, bằng x một trừ x ba nhân một chia G, rồi nhân G. Công thức Mason, G bằng một chia delta nhân tổng delta k nhân P k, trong đó định thức delta bằng một trừ tổng các vòng L i, cộng tổng các tích hai vòng không chạm nhau, trừ tổng các tích ba vòng không chạm nhau, và cứ thế."},
 {type:"rich",title:"Bảng tổng hợp công thức (4/4)",
  html:`<div class='ftb'><div class='ftc' data-src='72' style='--ftc:#00798c'><button class='ftg' data-go='72' data-n='72' aria-label='Xem bài giảng, slide 72'></button><div class='ftl'>Phương trình trạng thái</div><div class='fl'>ẋ(t) = Ax(t) + Bu(t)</div><div class='fl'>y(t) = Cx(t)</div></div><div class='ftc' data-src='92' style='--ftc:#00798c'><button class='ftg' data-go='92' data-n='92' aria-label='Xem bài giảng, slide 92'></button><div class='ftl'>Hàm truyền tính từ PTTT</div><div class='fl'>G(s) = <span class='fr'><span>Y(s)</span><span>U(s)</span></span> = C(sI − A)<sup>−1</sup>B</div></div><div class='ftc' data-src='95' style='--ftc:#00798c'><button class='ftg' data-go='95' data-n='95' aria-label='Xem bài giảng, slide 95'></button><div class='ftl'>Nghiệm của phương trình trạng thái</div><div class='fl'>x(t) = Φ(t)x(0<sup>+</sup>) + <span class='in'><i>t</i>∫<i>0</i></span> Φ(t − τ)Bu(τ)dτ</div><div class='fl'>Φ(s) = (sI − A)<sup>−1</sup>&emsp;Φ(t) = ℒ<sup>−1</sup>[Φ(s)]</div></div><div class='ftc' data-src='78,79' style='--ftc:#00798c'><button class='ftg' data-go='78' data-n='78' aria-label='Xem bài giảng, slide 78'></button><div class='ftl'>PTVP → PTTT · vế phải chỉ có u</div><div class='fl'>x<sub>1</sub> = y&emsp;x<sub>i</sub> = ẋ<sub>i−1</sub> (i = 2…n)</div><div class='fl'>hàng cuối của A: [ −<span class='fr'><span>a<sub>n</sub></span><span>a<sub>0</sub></span></span> … −<span class='fr'><span>a<sub>1</sub></span><span>a<sub>0</sub></span></span> ]</div><div class='fl'>B = [0 … 0 <span class='fr'><span>b<sub>0</sub></span><span>a<sub>0</sub></span></span>]<sup>T</sup>&emsp;C = [1 0 … 0]</div></div><div class='ftc' data-src='81,82,83' style='--ftc:#00798c'><button class='ftg' data-go='81' data-n='81' aria-label='Xem bài giảng, slide 81'></button><div class='ftl'>PTVP → PTTT · có đạo hàm của u</div><div class='fl'>x<sub>i</sub> = ẋ<sub>i−1</sub> − β<sub>i−1</sub>r</div><div class='fl'>β<sub>1</sub> = <span class='fr'><span>b<sub>0</sub></span><span>a<sub>0</sub></span></span>&emsp;β<sub>2</sub> = <span class='fr'><span>b<sub>1</sub> − a<sub>1</sub>β<sub>1</sub></span><span>a<sub>0</sub></span></span></div><div class='fl'>β<sub>n</sub> = <span class='fr'><span>b<sub>n−1</sub> − a<sub>1</sub>β<sub>n−1</sub> − … − a<sub>n−1</sub>β<sub>1</sub></span><span>a<sub>0</sub></span></span></div></div><div class='ftc' data-src='86,87' style='--ftc:#00798c'><button class='ftg' data-go='86' data-n='86' aria-label='Xem bài giảng, slide 86'></button><div class='ftl'>PTVP → PTTT · phương pháp thứ hai</div><div class='fl'>C = [ <span class='fr'><span>b<sub>m</sub></span><span>a<sub>0</sub></span></span> … <span class='fr'><span>b<sub>0</sub></span><span>a<sub>0</sub></span></span> 0 … 0 ]</div><div class='fl'>B = [0 … 0 1]<sup>T</sup></div></div><div class='ftc' data-src='99' style='--ftc:#c0262d'><button class='ftg' data-go='99' data-n='99' aria-label='Xem bài giảng, slide 99'></button><div class='ftl'>Hệ phi tuyến · PTVP</div><div class='fl'>y<sup>(n)</sup> = g( y<sup>(n−1)</sup>, …, ẏ, y, u<sup>(m)</sup>, …, u̇, u )</div></div><div class='ftc' data-src='103,106' style='--ftc:#c0262d'><button class='ftg' data-go='103' data-n='103' aria-label='Xem bài giảng, slide 103'></button><div class='ftl'>Hệ phi tuyến · PTTT và điểm dừng</div><div class='fl'>ẋ(t) = f(x(t), u(t))&emsp;y(t) = h(x(t), u(t))</div><div class='fl'>điểm dừng: f(x̄, ū) = 0</div></div><div class='ftc' data-src='109' style='--ftc:#c0262d'><button class='ftg' data-go='109' data-n='109' aria-label='Xem bài giảng, slide 109'></button><div class='ftl'>Tuyến tính hóa quanh điểm dừng</div><div class='fl'>x̃=x−x̄&emsp;ũ=u−ū&emsp;ỹ=y−ȳ</div><div class='fl'>x̃̇(t) = Ax̃(t) + Bũ(t)&emsp;ỹ(t) = Cx̃(t) + Dũ(t)</div></div><div class='ftc' data-src='110' style='--ftc:#c0262d'><button class='ftg' data-go='110' data-n='110' aria-label='Xem bài giảng, slide 110'></button><div class='ftl'>Ma trận A, B, C, D (đạo hàm riêng)</div><div class='fl'>A = <span class='fr'><span>∂f</span><span>∂x</span></span><sub>(x̄,ū)</sub>&emsp;B = <span class='fr'><span>∂f</span><span>∂u</span></span><sub>(x̄,ū)</sub></div><div class='fl'>C = <span class='fr'><span>∂h</span><span>∂x</span></span><sub>(x̄,ū)</sub>&emsp;D = <span class='fr'><span>∂h</span><span>∂u</span></span><sub>(x̄,ū)</sub></div></div></div>`,

function assignIdx(cardTexts,sentences){
  const n=cardTexts.length,S=sentences.length;
  if(!n)return[];
  if(S<=1)return cardTexts.map(()=>0);
  const sT=sentences.map(x=>{const a=tokz(x);return{u:new Set(a),b:new Set(bigr(a))}});
  const sc=cardTexts.map(t=>{
    const a=tokz(t),b=bigr(a),len=Math.sqrt(a.length+2);
    return sT.map(q=>{
      let u=0;new Set(a).forEach(w=>{if(q.u.has(w)&&!STOPW.has(w))u+=w.length>=4?1:.5});
      let g=0;b.forEach(w=>{if(q.b.has(w))g++});
      return (u+2*g)/len;
    });
  });
  const lam=.4,pos=k=>n>1?k*(S-1)/(n-1):0;
  const dp=[],bk=[];
  for(let k=0;k<n;k++){
    dp.push(new Array(S).fill(Infinity));bk.push(new Array(S).fill(0));
    for(let s=0;s<S;s++){
      const c=-sc[k][s]+lam*Math.abs(s-pos(k));
      if(k===0){dp[k][s]=c;continue}
      let best=Infinity,bi=0;
      for(let q=0;q<=s;q++)if(dp[k-1][q]<best){best=dp[k-1][q];bi=q}
      dp[k][s]=best+c;bk[k][s]=bi;
    }
  }
  let s=0,best=Infinity;
  for(let q=0;q<S;q++)if(dp[n-1][q]<best){best=dp[n-1][q];s=q}
  const out=new Array(n);
  for(let k=n-1;k>=0;k--){out[k]=s;s=bk[k][s]}
  return out;
}

$("goto").max=slides.length;
function segAt(x){const r=prog.getBoundingClientRect();return Math.max(0,Math.min(slides.length-1,Math.floor((x-r.left)/r.width*slides.length)))}
function hov(k){if(hovEl)hovEl.classList.remove("hv");hovEl=k>=0?prog.children[k]:null;if(hovEl)hovEl.classList.add("hv")}
prog.addEventListener("pointermove",e=>{
  const k=segAt(e.clientX);
  tip.textContent=(k+1)+". "+slides[k].title;tip.style.display="block";
  const cr=ctrl.getBoundingClientRect(),tw=tip.offsetWidth;
  let x=e.clientX-cr.left;x=Math.max(tw/2+4,Math.min(cr.width-tw/2-4,x));
  tip.style.left=x+"px";hov(k);
});
prog.addEventListener("pointerleave",()=>{tip.style.display="none";hov(-1)});
prog.addEventListener("click",e=>jumpTo(segAt(e.clientX)+1));
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);$("play").onclick=toggle;
$("ccbtn").onclick=toggleCC;$("fsbtn").onclick=toggleFS;
$("gear").onclick=()=>{menu.classList.toggle("open");wake()};
ctrl.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&e.detail>0)b.blur()});
ctrl.addEventListener("pointerenter",()=>{overCtrl=true;wake()});
ctrl.addEventListener("pointerleave",()=>{overCtrl=false;wake()});
player.addEventListener("pointermove",wake);
player.addEventListener("pointerdown",wake);
player.addEventListener("mouseleave",()=>{if(playing&&!menu.classList.contains("open")){clearTimeout(hideT);hideT=setTimeout(()=>player.classList.add("hide"),600)}});
pw.addEventListener("click",e=>{
  if(e.target.closest(".ctrl,.menu"))return;
  if(menu.classList.contains("open")){closeMenu();return}
  if(clickT){clearTimeout(clickT);clickT=0;toggleFS();return}
  clickT=setTimeout(()=>{clickT=0;toggle()},250);
});
document.addEventListener("click",e=>{if(menu.classList.contains("open")&&!e.target.closest("#menu,#gear"))closeMenu()});
$("rate").oninput=e=>{$("rv").textContent=parseFloat(e.target.value).toFixed(1)+"×"};
$("rate").onchange=()=>{if(playing)speakFrom()};
$("voice").onchange=()=>{if(playing)speakFrom()};
$("goto").onchange=()=>jumpTo(parseInt($("goto").value));
$("panel").addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){e.stopPropagation();jumpTo(+g.dataset.go);return}
  const b=e.target.closest("[data-back]");
  if(b){e.stopPropagation();flashSrc=+b.dataset.from;jumpTo(+b.dataset.back)}
});
$("jump").onchange=e=>jumpTo(+e.target.value+1);
document.addEventListener("keydown",e=>{
  const t=e.target.tagName;
  if(t==="SELECT"||t==="INPUT"||e.metaKey||e.ctrlKey||e.altKey)return;
  if((e.key===" "||e.key==="Enter")&&e.target.closest&&e.target.closest(".ftg,.xchip"))return;
  const k=e.key;
  if(k===" "&&t==="BUTTON")return;
  if(k==="ArrowLeft")go(-1);
  else if(k==="ArrowRight")go(1);
  else if(k===" "){e.preventDefault();toggle()}
  else if(k==="f"||k==="F")toggleFS();
  else if(k==="c"||k==="C")toggleCC();
  else if(k==="Escape"){if(pfs){pfs=false;setFS(false)}closeMenu()}
  wake();
});
render();setPlaying(false);
</script>
</body>
</html>
