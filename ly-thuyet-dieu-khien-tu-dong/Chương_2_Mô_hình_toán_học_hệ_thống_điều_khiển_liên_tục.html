<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}

.ag::before{content:"➢";position:absolute;left:0;color:#1f4e8c}

.ck{width:22cqw;height:auto}
.ck.mo{width:52cqw}
.m.s{font-size:2.1cqw;line-height:1.7}
.lg{display:flex;gap:6cqw;font-size:2.15cqw;line-height:1.5;margin:1cqw 0 0 8cqw}

.eqn b{font-style:normal;color:#1f4e8c;font-family:Arial,sans-serif;font-size:2cqw}
.bl{color:#1f4e8c;font-style:normal}
.bl2{color:#1f4e8c;font-size:2.2cqw;margin:0 0 1.4cqw 14cqw;line-height:1.4}
.bd{display:block;width:88cqw;max-width:100%;height:auto;margin:1cqw auto 0}
.fu{width:8cqw;height:9cqw;background:#9aa8a8;border:.3cqw solid #555}
.cap{display:flex;justify-content:space-around;font:italic 2.1cqw "Times New Roman",serif;color:#1f4e8c;margin:.5cqw 0}
.pl{width:38cqw;height:auto}
.svw .sv{height:auto;display:block}
.svw.s1 .sv{width:52cqw}
.svw.s2 .sv{width:26cqw}
.svw.s3 .sv{width:26cqw}
.svw.s3b .sv{width:19cqw}
.lgd{font-size:2.1cqw;line-height:1.5}
.rc{flex:1;margin-left:3cqw}
.sd{width:34cqw;height:auto}
.sd.w{display:block;width:80cqw;margin:1cqw auto 0}
.sd.f{width:40cqw}
.sd.e{width:36cqw}
.svw.s4 .sv{width:70cqw;margin:2cqw auto 0}
.tk{font-size:2.25cqw;line-height:1.4;padding-left:3.2cqw;position:relative;margin-bottom:1.2cqw}
.tk::before{content:"✓";position:absolute;left:.6cqw}
.eqr{background:#ff3b00}
.sd.m{width:46cqw}
.sd.m2{display:block;width:64cqw;margin:0 auto}
.svw.s5 .sv{display:block;width:60cqw;height:auto;margin:0 auto}
.svw.s5 .sv{width:56cqw;margin:0 auto}
.sd.s{width:76cqw;display:block;margin:0 auto}
.svw.s6 .sv{width:74cqw;margin:0 auto}
.mx{display:inline-grid;gap:.25em .9em;align-items:center;justify-items:center;padding:.25em .7em;margin:0 .15em;vertical-align:middle;font-style:italic;text-align:center;background:linear-gradient(#000,#000) left top/.12em 100% no-repeat,linear-gradient(#000,#000) left top/.4em .1em no-repeat,linear-gradient(#000,#000) left bottom/.4em .1em no-repeat,linear-gradient(#000,#000) right top/.12em 100% no-repeat,linear-gradient(#000,#000) right top/.4em .1em no-repeat,linear-gradient(#000,#000) right bottom/.4em .1em no-repeat}
.svw.s7 .sv{width:22cqw;flex:none}
.sd.t{width:38cqw;flex:none}
.svw.s5c .sv{display:block;width:48cqw;height:auto;margin:0 auto}
.sd.s3x{display:block;width:52cqw;margin:0 auto}
.sd.w2{display:block;width:62cqw;margin:.6cqw auto 0}

.bar{display:flex;align-items:center;justify-content:center;color:#fff;font:700 2.3cqw Arial,sans-serif}
.mcen{position:absolute;left:0;right:0;top:40%;display:flex;justify-content:center}
.mi.sec{margin:0;font-size:3.2cqw;color:#e00000;padding:1.2cqw 2.6cqw}
.mfoot{position:absolute;bottom:1.6cqw;left:0;right:0;text-align:center;font-size:1.7cqw;color:#3a5fa0}
.mnum{position:absolute;bottom:1.6cqw;right:4cqw;font-size:1.9cqw;color:#222}
.m0{background:linear-gradient(90deg,#f6f1d0,#b8a916)}
.m1{background:linear-gradient(90deg,#f1f8ee,#8fcf86)}
.m2{background:linear-gradient(90deg,#eef3f3,#b3c6c9)}
.fade{animation:f .4s ease}@keyframes f{from{opacity:0}to{opacity:1}}
.player{width:100%}
.pw{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:20px;container-type:inline-size;background:#000;user-select:none;-webkit-user-select:none}
.pw .stage{width:100%}
.player.fs{position:fixed;inset:0;z-index:999;background:#000;display:flex;align-items:center;justify-content:center}
.player.fs .pw{width:min(100vw,calc(100vh*4/3));border-radius:0}
.player.fs .stage{border-radius:0}
.player.hide{cursor:none}
.ctrl,.cc,.menu{--ib:clamp(30px,5.2cqw,52px)}
.ctrl{position:absolute;left:0;right:0;bottom:0;padding:34px 10px 6px;background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,0));color:#fff;transition:opacity .25s;z-index:5}
.player.hide .ctrl{opacity:0;pointer-events:none}
.prog{display:flex;gap:2px;height:18px;align-items:flex-end;cursor:pointer;padding:0 2px}
.sg{flex:1;height:100%;display:flex;align-items:flex-end}
.sg i{display:block;position:relative;width:100%;height:4px;background:rgba(255,255,255,.3);overflow:hidden;border-radius:1px;transition:height .1s}
.sg i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#f00}
.prog:hover .sg i{height:7px}
.sg.hv i{background:rgba(255,255,255,.6)}
.tip{display:none;position:absolute;bottom:calc(var(--ib) + 30px);transform:translateX(-50%);background:rgba(20,20,20,.92);color:#fff;font-size:12px;padding:4px 8px;border-radius:4px;white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.crow{display:flex;justify-content:space-between;align-items:center}
.grp{display:flex;align-items:center;gap:2px}
.ib{position:relative;width:var(--ib);height:var(--ib);border:0;background:none;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;padding:0}
.ib:hover{background:rgba(255,255,255,.16)}
.ib svg{width:62%;height:62%;fill:#fff}
.ib:disabled{opacity:.35;cursor:default;background:none}
.ib.on::after{content:"";position:absolute;left:24%;right:24%;bottom:3px;height:3px;background:#f00;border-radius:2px}
.ctrl .cnt{font-size:clamp(12px,2.1cqw,20px);margin-left:8px;white-space:nowrap}
.cc{position:absolute;left:50%;bottom:calc(var(--ib) + 40px);transform:translateX(-50%);max-width:86%;text-align:center;background:rgba(8,8,8,.78);color:#fff;padding:.25em .6em;border-radius:4px;font-size:clamp(12px,2.5cqw,30px);line-height:1.4;z-index:4;transition:bottom .25s;pointer-events:none}
.player.hide .cc{bottom:3cqw}
.menu{display:none;position:absolute;right:10px;bottom:calc(var(--ib) + 46px);width:min(310px,92%);background:rgba(28,28,28,.96);color:#fff;border-radius:12px;padding:6px 0;z-index:6;font-size:14px;max-height:calc(100% - var(--ib) - 70px);overflow:auto}
.menu.open{display:block}
.mi2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px}
.mi2.col{flex-direction:column;align-items:stretch}
.mi2 .v{display:flex;gap:8px;align-items:center}
.mi2 em{font-style:normal;min-width:2.8em;text-align:right}
.menu select,.menu input[type=number]{background:#3a3a3a;color:#fff;border:1px solid #555;border-radius:6px;padding:6px;font:inherit;max-width:100%}
.menu select{flex:1;min-width:0}
.menu input[type=number]{width:64px}
.menu input[type=range]{accent-color:#f00;width:120px}
.sw{position:relative;width:36px;height:20px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;background:#666;border-radius:10px;transition:.15s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+i{background:#f00}
.sw input:checked+i::after{transform:translateX(16px)}
.note{font-size:13px;opacity:.7;margin-top:8px}

/* phóng to chữ + công thức ở các slide .zm */
.zm .rb,.zm .pp,.zm .pa,.zm .nt,.zm .tk,.zm .so,.zm .sb{font-size:2.55cqw}
.zm .tk{padding-left:3.8cqw}

/* ===== HIỆU ỨNG SLIDE ===== */
@keyframes slin{from{opacity:0;transform:translateX(6%)}to{opacity:1;transform:none}}
@keyframes dropin{from{opacity:0;transform:translateY(-40%)}to{opacity:1;transform:none}}
@keyframes dropin2{from{opacity:0;transform:translateY(-30%)}to{opacity:1;transform:none}}
@keyframes shimmer{0%,100%{text-shadow:0 0 0 rgba(255,215,64,0)}50%{text-shadow:0 0 .9cqw rgba(255,200,40,.85),0 0 2.2cqw rgba(255,225,120,.55)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes spinin{from{opacity:0;transform:rotate(-200deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(3cqw)}to{opacity:1;transform:none}}
@keyframes zoomout{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
.panel.fade{animation:slin .55s cubic-bezier(.2,.7,.2,1) both}
.stage{overflow:hidden}
.stage.content::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.6cqw;z-index:2;
 background:linear-gradient(#b8a916,#31644f);transform-origin:top;animation:growY .9s .1s ease-out both}
.panel.fade .mline{transform-origin:left;animation:grow .8s .35s ease-out both}
.panel.fade .msil{animation:spinin .8s .2s cubic-bezier(.2,.8,.3,1) both}
.panel.fade .mtitle,.panel.fade .rtitle,.panel.fade .mcen{animation:slin .6s .3s cubic-bezier(.2,.7,.2,1) both}
.panel.fade .mi,.panel.fade .cd{animation:rise .5s ease-out both;animation-delay:var(--d,.6s)}
.panel.fade .mi.sec{animation:slin .6s .5s both}
.panel.fade .rbody>svg,.panel.fade .rbody img,.panel.fade .rbody .svw,.panel.fade .rbody .dg,.panel.fade .rbody .row,.panel.fade .rbody .r3{transform-origin:center}
.panel.fade .cd.fg{animation:zoomout .7s ease-out both;animation-delay:var(--d,1s)}
/* bìa */
.stage:not(.content) .panel>*,.stage:not(.content) .logo,.stage:not(.content) .bar{animation:dropin .7s cubic-bezier(.2,.8,.3,1) both}
.stage:not(.content) .logo{animation-delay:.15s}
.stage:not(.content) .bar{animation-delay:1.35s}
.stage:not(.content) .chap{animation-delay:.5s}
.stage:not(.content) .ttl{animation:dropin .7s .8s cubic-bezier(.2,.8,.3,1) both,shimmer 3.2s 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
 .panel.fade,.panel.fade *{opacity:1!important;transform:none!important}
}

/* ===== SLIDE CUỐI ===== */
@keyframes chpop{0%{opacity:0;transform:translateY(-12cqw) scale(.3) rotate(-25deg)}60%{opacity:1;transform:translateY(1.2cqw) scale(1.15) rotate(4deg)}100%{opacity:1;transform:none}}
@keyframes chwave{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.1cqw)}}
@keyframes endglow{0%,100%{text-shadow:0 0 .4cqw rgba(31,78,140,.25)}50%{text-shadow:0 0 1.2cqw rgba(255,200,40,.9),0 0 3cqw rgba(0,168,232,.45)}}
@keyframes spk{0%{opacity:0;transform:translateY(4cqw) scale(.3) rotate(0)}25%{opacity:1}100%{opacity:0;transform:translateY(-26cqw) scale(1.1) rotate(180deg)}}
@keyframes endbar{from{opacity:0;transform:translateY(4cqw) scaleX(.2)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
.stage.end .panel{position:relative;overflow:hidden}
.stage.end .panel .ttl{font-size:10cqw;font-style:italic;animation:endglow 3s 2s ease-in-out infinite;letter-spacing:.2cqw}
.stage.end .panel .ttl .ch{display:inline-block;animation:chpop .8s cubic-bezier(.2,.9,.3,1) both,chwave 2.6s ease-in-out infinite;
 animation-delay:calc(.35s + var(--k)*.09s),calc(1.9s + var(--k)*.12s)}
.stage.end .panel .chap{display:none}
.stage.end .panel>.spk{position:absolute;bottom:6%;color:#e0b800;line-height:1;opacity:0;animation:spk var(--t,4s) var(--dl,1s) ease-out infinite}
.stage.end .bar{overflow:hidden;position:relative;animation:endbar .8s 1.5s cubic-bezier(.2,.8,.3,1) both}
.stage.end .bar::after{content:"";position:absolute;top:0;bottom:0;width:25%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 2.8s 2.4s ease-in-out infinite}
.stage.end .logo{animation:dropin .8s .1s cubic-bezier(.2,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){.stage.end .panel>.spk{display:none}}

/* ===== ĐỒNG BỘ VỚI LỜI ĐỌC: thẻ chỉ sáng lên khi được nói tới ===== */
.panel.sync .cd{animation:none!important;opacity:0;transform:translateY(2.5cqw);
 transition:opacity .55s ease,transform .6s cubic-bezier(.2,.8,.3,1),box-shadow .45s ease,filter .45s ease}
.panel.sync .cd.fg{transform:scale(.55)}
.panel.sync .cd.lit{opacity:1;transform:none;transition-delay:var(--td,0s)}
.panel.sync .cd.fg.lit{transition-delay:calc(var(--td,0s) + .35s)}
.panel.sync .cd.on{border-radius:.8cqw;box-shadow:0 0 0 .3cqw rgba(255,196,0,.95),0 0 2.2cqw rgba(255,210,64,.65)}
.panel.sync .mi.on{transform:scale(1.03);filter:brightness(1.08) saturate(1.25)}





/* ===== CHỈ MỤC CÔNG THỨC BẤM ĐƯỢC ===== */
.ftc{position:relative}
.ftg{position:absolute;top:.35cqw;right:.5cqw;z-index:2;border:0;border-radius:99px;background:var(--ftc,#1f4e8c);color:#fff;
 font:700 1.05cqw/1 inherit;font-family:inherit;padding:.3cqw .75cqw;cursor:pointer;opacity:.88;transition:transform .2s,opacity .2s}
.ftg::after{content:"Xem bài " attr(data-n) " ›"}
.ftg:hover,.ftg:focus-visible{opacity:1;transform:scale(1.07);outline:.2cqw solid #ffc400;outline-offset:.1cqw}
.xchip{position:absolute;z-index:5;top:.9cqw;right:2.5cqw;border:1px solid #1f4e8c;background:#fff;color:#1f4e8c;font:700 1.35cqw/1 inherit;
 font-family:inherit;padding:.45cqw 1.1cqw;border-radius:99px;cursor:pointer;box-shadow:0 .2cqw .8cqw rgba(31,78,140,.25);animation:slin .5s 1s both;transition:background .2s,color .2s}
.xchip:hover,.xchip:focus-visible{background:#1f4e8c;color:#fff}
@keyframes ftflash{0%,100%{box-shadow:0 0 0 0 rgba(255,196,0,0)}50%{box-shadow:0 0 0 .4cqw rgba(255,196,0,.95),0 0 2.4cqw rgba(255,210,64,.8)}}
.panel.fade .ftc.flash{animation:ftflash 1.1s ease-in-out 3}

/* ===== BẢNG TỔNG HỢP CÔNG THỨC ===== */
.ftb{display:grid;grid-template-columns:1fr 1fr;gap:.7cqw 1.3cqw;align-items:stretch;color:#1f4e8c}
.ftc{background:#f4f8ff;border:1px solid #c5d6f0;border-left:.55cqw solid var(--ftc,#1f4e8c);border-radius:.5cqw;padding:.35cqw .8cqw .45cqw;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ftc.w{grid-column:1/-1}
.ftl{font-size:1.35cqw;font-weight:700;color:var(--ftc,#e00000);line-height:1.2;margin-bottom:.1cqw}
.fl{font:italic 1.7cqw "Times New Roman",serif;color:#000;text-align:center;line-height:1.25}
.ftc .fr{margin:0 .1em}

  speech:"Phần một: Khái niệm về mô hình toán học. Ta bắt đầu bằng một câu hỏi cơ bản: vì sao phải xây dựng mô hình toán học cho một hệ thống?"},
 {type:"rich",title:"Khái niệm về mô hình toán học",
  html:`<div class='zm'><div class='rb'>Hệ thống điều khiển thực tế rất đa dạng và có bản chất vật lý khác nhau.</div><div class='rb'>Cần có cơ sở chung để phân tích, thiết kế các hệ thống điều khiển có bản chất vật lý khác nhau. <span class='r'>Cơ sở đó chính là toán học.</span></div><div class='rb'>Quan hệ giữa tín hiệu vào và tín hiệu ra của một <span class='c'>hệ thống tuyến tính bất biến liên tục</span> có thể mô tả bằng <span class='r'>phương trình vi phân tuyến tính hệ số hằng</span>:</div><div class='dg'><span class='lb'>u(t)</span><span class='ar'></span><div class='bx'>Hệ thống tuyến tính<br>bất biến liên tục</div><span class='ar'></span><span class='lb'>y(t)</span></div><div class='eq big'>${EL}y(t)=<br>b<sub>0</sub>${ER}</div><div class='nt'>n: bậc của hệ thống, hệ thống hợp thức nếu n≥m.<br>a<sub>i</sub>, b<sub>i</sub> : thông số của hệ thống</div></div>`,
  speech:"Ta bắt đầu với ý tưởng cốt lõi của cả chương: mô hình toán học. Hệ thống điều khiển thực tế rất đa dạng và có bản chất vật lý khác nhau. Cần có cơ sở chung để phân tích, thiết kế các hệ thống điều khiển có bản chất vật lý khác nhau. Cơ sở đó chính là toán học. Quan hệ giữa tín hiệu vào và tín hiệu ra của một hệ thống tuyến tính bất biến liên tục có thể mô tả bằng phương trình vi phân tuyến tính hệ số hằng. Trong đó u của t là tín hiệu vào, y của t là tín hiệu ra. n là bậc của hệ thống, hệ thống hợp thức nếu n lớn hơn hoặc bằng m. a i, b i là các thông số của hệ thống. Các em chú ý ba chữ trong cụm hệ thống tuyến tính bất biến liên tục. Tuyến tính nghĩa là áp dụng được nguyên lý xếp chồng. Bất biến nghĩa là các thông số a và b không đổi theo thời gian. Liên tục nghĩa là tín hiệu được xét ở mọi thời điểm. Còn hệ thống hợp thức là hệ thống thực hiện được trong thực tế, tức là bậc đạo hàm lớn nhất của tín hiệu vào không vượt quá bậc của tín hiệu ra."},
 {type:"rich",title:"Một số thí dụ mô tả hệ thống bằng PT vi phân",
  html:`<div class='rb'><b><u>Thí dụ 2.1:</u></b> <span class='k'>Đặc tính động học tốc độ xe ô tô</span></div><svg class='car' viewBox='0 0 420 125' aria-hidden='true'><rect x='0' y='112' width='420' height='9' fill='#777'/><polygon points='110,78 150,48 240,48 265,78' fill='#fff' stroke='#111' stroke-width='2'/><rect x='70' y='78' width='250' height='26' fill='#fff' stroke='#111' stroke-width='2'/><circle cx='130' cy='100' r='12' fill='#111'/><circle cx='260' cy='100' r='12' fill='#111'/><g stroke='#111' stroke-width='2' fill='#111'><line x1='40' y1='85' x2='70' y2='85'/><polygon points='30,85 41,80 41,90'/><line x1='320' y1='85' x2='380' y2='85'/><polygon points='390,85 379,80 379,90'/><line x1='255' y1='36' x2='300' y2='36'/><polygon points='310,36 299,31 299,41'/></g><g font-family='Times New Roman,serif' font-style='italic' fill='#111'><text x='14' y='90' font-size='18'>d</text><text x='180' y='70' font-size='20'>M</text><text x='262' y='28' font-size='16'>v(t)</text><text x='394' y='86' font-size='17'>f(t)</text></g></svg><div class='eqp'>M${fr('dv(t)','dt')}+Bv(t)=f(t)</div><div class='nt'>M: khối lượng xe<br>B: hệ số ma sát: thông số của hệ thống<br>f(t): lực kéo của động cơ: tín hiệu vào<br>v(t): tốc độ xe: tín hiệu ra</div>`,
  speech:"Để thấy mô hình toán học hình thành như thế nào, ta cùng xét ba thí dụ quen thuộc từ đời sống. Thí dụ hai chấm một: đặc tính động học tốc độ xe ô tô. Phương trình mô tả là: M nhân đạo hàm của v theo t, cộng B nhân v của t, bằng f của t. Trong đó, M là khối lượng xe. B là hệ số ma sát, là thông số của hệ thống. f của t là lực kéo của động cơ, là tín hiệu vào. v của t là tốc độ xe, là tín hiệu ra. Ý nghĩa vật lý rất dễ thấy: một phần lực kéo dùng để tăng tốc xe, phần còn lại bị ma sát cản lại. Nhờ phương trình này, ta tính được tốc độ xe khi biết lực kéo."},
 {type:"rich",title:"Một số thí dụ mô tả hệ thống bằng PT vi phân",
  html:`<div class='rb'><b><u>Thí dụ 2.2:</u></b> <span class='k'>Đặc tính động học hệ thống giảm chấn của xe</span></div><div class='row'><svg viewBox='0 0 220 245' aria-hidden='true'><g stroke='#111' stroke-width='1.6' fill='none'><rect x='55' y='52' width='90' height='28' fill='#fff'/><line x1='100' y1='20' x2='100' y2='44'/><line x1='75' y1='80' x2='75' y2='108'/><line x1='68' y1='108' x2='82' y2='108'/><rect x='66' y='100' width='18' height='28'/><line x1='75' y1='128' x2='75' y2='142'/><line x1='125' y1='80' x2='125' y2='92'/><polyline points='125,92 134,97 116,104 134,111 116,118 134,125 125,130'/><line x1='125' y1='130' x2='125' y2='142'/><line x1='75' y1='142' x2='125' y2='142'/><line x1='155' y1='70' x2='175' y2='70'/><line x1='165' y1='70' x2='165' y2='128'/></g><circle cx='100' cy='202' r='38' fill='#bdbdbd' stroke='#333' stroke-width='1.2'/><rect x='94' y='142' width='12' height='34' fill='#111'/><polygon points='100,52 94,40 106,40' fill='#111'/><polygon points='165,138 159,126 171,126' fill='#111'/><g font-family='Times New Roman,serif' font-style='italic' fill='#111'><text x='72' y='18' font-size='16'>f(t)</text><text x='93' y='71' font-size='17'>M</text><text x='46' y='118' font-size='14'>B</text><text x='140' y='110' font-size='14'>K</text><text x='176' y='108' font-size='15'>y(t)</text></g></svg><div class='col'><div class='eq2'>M${fr('d<sup>2</sup>y(t)','dt<sup>2</sup>')}+B${fr('dy(t)','dt')}+Ky(t)=f(t)</div><div class='nt'>M: khối lượng tác động lên bánh xe<br>B: hệ số ma sát, K: độ cứng lò xo<br>f(t): lực do sốc: tín hiệu vào<br>y(t): dịch chuyển của thân xe: tín hiệu ra</div></div></div>`,
  speech:"Thí dụ hai chấm hai: đặc tính động học hệ thống giảm chấn của xe. Phương trình mô tả là: M nhân đạo hàm bậc hai của y theo t, cộng B nhân đạo hàm bậc một của y theo t, cộng K nhân y của t, bằng f của t. Trong đó, M là khối lượng tác động lên bánh xe. B là hệ số ma sát, K là độ cứng lò xo. f của t là lực do sốc, là tín hiệu vào. y của t là dịch chuyển của thân xe, là tín hiệu ra. Đây là mô hình kinh điển gồm khối lượng, lò xo và giảm chấn. Các em sẽ gặp lại cấu trúc phương trình bậc hai này rất nhiều lần trong môn học."},
 {type:"rich",title:"Một số thí dụ mô tả hệ thống bằng PT vi phân",
  html:`<div class='rb'><b><u>Thí dụ 2.3:</u></b> <span class='k'>Đặc tính động học thang máy</span></div><div class='row t'><svg viewBox='0 0 225 240' aria-hidden='true'><g stroke='#111' stroke-width='1.5' fill='none'><line x1='0' y1='26' x2='36' y2='26'/><line x1='18' y1='26' x2='18' y2='222'/><rect x='38' y='20' width='46' height='34' rx='10' fill='#7c8b99'/><line x1='84' y1='40' x2='108' y2='48' stroke-width='6'/><circle cx='112' cy='48' r='22' fill='#c8c8c8'/><circle cx='160' cy='48' r='22' fill='#c8c8c8'/><line x1='112' y1='26' x2='160' y2='26'/><line x1='90' y1='48' x2='90' y2='135'/><line x1='182' y1='48' x2='182' y2='100'/><rect x='60' y='135' width='60' height='60' fill='#fff'/><rect x='152' y='100' width='60' height='60' fill='#fff'/><path d='M88,34 Q92,20 106,20'/></g><polygon points='18,234 12,222 24,222' fill='#111'/><polygon points='110,20 102,16 102,24' fill='#111'/><g font-family='Times New Roman,serif' font-style='italic' fill='#111' font-size='13'><text x='80' y='14'>τ(t)</text><text x='106' y='92'>B</text><text x='26' y='170' font-size='15'>y(t)</text><text x='82' y='153'>M</text><text x='92' y='156' font-size='8'>T</text><text x='78' y='171'>Buồng</text><text x='83' y='187'>thang</text><text x='172' y='118'>M</text><text x='182' y='121' font-size='8'>Đ</text><text x='170' y='136'>Đối</text><text x='166' y='152'>trọng</text></g></svg><div class='col'><div class='eq2'>M<sub>T</sub>${fr('d<sup>2</sup>y(t)','dt<sup>2</sup>')}+B${fr('dy(t)','dt')}+M<sub>T</sub>g=Kτ(t)+M<sub>Đ</sub>g</div><div class='nt'>M<sub>T</sub>: khối lượng buồng thang<br>M<sub>Đ</sub>: khối lượng đối trọng<br>B hệ số ma sát, K hệ số tỷ lệ<br>τ(t): moment kéo của động cơ: tín hiệu vào<br>y(t): vị trí buồng thang: tín hiệu ra</div></div></div>`,
  speech:"Thí dụ hai chấm ba: đặc tính động học thang máy. Phương trình mô tả là: M T nhân đạo hàm bậc hai của y theo t, cộng B nhân đạo hàm bậc một của y theo t, cộng M T nhân g, bằng K nhân tau của t, cộng M Đ nhân g. Trong đó, M T là khối lượng buồng thang. M Đ là khối lượng đối trọng. B là hệ số ma sát, K là hệ số tỷ lệ. Tau của t là moment kéo của động cơ, là tín hiệu vào. y của t là vị trí buồng thang, là tín hiệu ra. Các em để ý: trọng lực xuất hiện ở cả hai vế. Nếu khối lượng đối trọng bằng khối lượng buồng thang thì hai thành phần trọng lực triệt tiêu nhau. Hãy nhớ nhận xét này, vì ta sẽ quay lại ở phần hàm truyền."},
 {type:"rich",title:"Hạn chế của mô hình toán học dưới dạng PTVP",
  html:`<div class='zm'><div class='rb'><span class='k'>Phương trình vi phân bậc n (n&gt;2) rất khó giải</span></div><div class='eq big'>${EL}y(t)=<br>b<sub>0</sub>${ER}</div><div class='pp'><span class='g'>Phân tích hệ thống</span> dựa vào mô hình toán là phương trình vi phân <span class='r'>gặp rất nhiều khó khăn</span> (một thí dụ đơn giản là biết tín hiệu vào, cần tính đáp ứng của hệ thống, nếu giải phương trình vi phân thì không đơn giản chút nào!!!).</div><div class='pp'><span class='g'>Phân tích hệ thống</span> dựa vào phương trình vi phân <span class='r'>hầu như không thể thực hiện được</span> trong trường hợp tổng quát.</div><div class='pa'><span class='ab'>⇒</span> Cần các dạng mô tả toán học khác giúp phân tích và thiết kế hệ thống tự động dễ dàng hơn:</div><div class='so'>Hàm truyền</div><div class='so'>Phương trình trạng thái</div></div>`,
  speech:"Có mô hình rồi, câu hỏi tiếp theo là dùng nó như thế nào. Và ở đây xuất hiện một khó khăn lớn của dạng phương trình vi phân. Phương trình vi phân bậc n, với n lớn hơn 2, rất khó giải. Phân tích hệ thống dựa vào mô hình toán là phương trình vi phân gặp rất nhiều khó khăn. Một thí dụ đơn giản là biết tín hiệu vào, cần tính đáp ứng của hệ thống, nếu giải phương trình vi phân thì không đơn giản chút nào. Phân tích hệ thống dựa vào phương trình vi phân hầu như không thể thực hiện được trong trường hợp tổng quát. Vì vậy, cần các dạng mô tả toán học khác giúp phân tích và thiết kế hệ thống tự động dễ dàng hơn, đó là hàm truyền và phương trình trạng thái. Nói cách khác, phương trình vi phân mô tả đúng nhưng không tiện để tính toán. Vì vậy ta cần những công cụ mạnh hơn, và đó là nội dung của hai phần sau: hàm truyền và phương trình trạng thái."},
 {type:"section",title:"Hàm truyền",speech:"Phần hai: Hàm truyền. Ý tưởng của hàm truyền rất đơn giản: thay vì giải phương trình vi phân, ta dùng phép biến đổi Laplace để đưa bài toán về phép tính đại số. Trước hết, ta ôn lại công cụ này."},
 {type:"rich",title:"Phép biến đổi Laplace",
  html:`<div class='rb'><b><u>Định nghĩa:</u></b></div><div class='pp'>Cho f(t) là hàm xác định với mọi t ≥ 0, biến đổi Laplace của f(t) là:</div><div style='text-align:center;margin:2.5cqw 0'><span class='eqy'>ℒ{f(t)} = F(s) = ${INT('0','+∞')} f(t)·e<sup>−st</sup> dt</span></div><div class='pp'>Trong đó:<br>- s : biến phức (biến Laplace)<br>- ℒ: toán tử biến đổi Laplace<br>- F(s): biến đổi Laplace của hàm f(t)<br>Biến đổi Laplace tồn tại khi tích phân ở biểu thức định nghĩa trên hội tụ.</div>`,
  speech:"Công cụ toán học đứng sau hàm truyền là phép biến đổi Laplace. Phép biến đổi này biến một hàm theo thời gian t thành một hàm theo biến phức s. Định nghĩa: cho f của t là hàm xác định với mọi t lớn hơn hoặc bằng 0, biến đổi Laplace của f của t là F của s, bằng tích phân từ 0 đến dương vô cùng của f của t nhân e mũ trừ s t, theo t. Trong đó s là biến phức, còn gọi là biến Laplace. L là toán tử biến đổi Laplace. F của s là biến đổi Laplace của hàm f của t. Biến đổi Laplace tồn tại khi tích phân ở biểu thức định nghĩa trên hội tụ. Điểm quan trọng nhất cần nhớ là phép biến đổi này biến đạo hàm và tích phân thành phép nhân và phép chia cho s. Nhờ đó, phương trình vi phân trở thành phương trình đại số."},
 {type:"rich",title:"Phép biến đổi Laplace (tt)",
  html:`<div class='rb'><b><u>Tính chất:</u></b></div><div class='pp'>Cho f(t) và g(t) là hai hàm theo thời gian có biến đổi Laplace là:</div><div class='m' style='text-align:center;margin-bottom:2cqw'>ℒ{f(t)} = F(s) &emsp;&emsp;&emsp; ℒ{g(t)} = G(s)</div><div class='pr'><span>Tính tuyến tính:</span><span class='m'>ℒ{a·f(t) + b·g(t)} = a·F(s) + b·G(s)</span></div><div class='pr'><span>Định lý chậm trễ:</span><span class='m'>ℒ{f(t − T)} = e<sup>−Ts</sup>·F(s)</span></div><div class='pr'><span>Ảnh của đạo hàm:</span><span class='m'>ℒ{${fr('df(t)','dt')}} = sF(s) − f(0<sup>+</sup>)</span></div><div class='pr'><span>Ảnh của tích phân:</span><span class='m'>ℒ{${INT('0','t')} f(τ)dτ} = ${fr('F(s)','s')}</span></div><div class='pr'><span>Định lý giá trị cuối:</span><span class='m'>lim<sub>t→∞</sub> f(t) = lim<sub>s→0</sub> sF(s)</span></div>`,
  speech:"Bây giờ ta xem những tính chất của biến đổi Laplace mà chúng ta sẽ dùng nhiều nhất. Tính chất. Cho f của t và g của t là hai hàm theo thời gian có biến đổi Laplace lần lượt là F của s và G của s. Một, tính tuyến tính: biến đổi Laplace của a nhân f cộng b nhân g bằng a nhân F cộng b nhân G. Hai, định lý chậm trễ: biến đổi Laplace của f của t trừ T bằng e mũ trừ T s nhân F của s. Ba, ảnh của đạo hàm: bằng s nhân F của s trừ f của 0 cộng. Bốn, ảnh của tích phân: bằng F của s chia cho s. Năm, định lý giá trị cuối: giới hạn của f của t khi t tiến tới vô cùng bằng giới hạn của s nhân F của s khi s tiến tới 0. Các em đặc biệt chú ý tính chất thứ ba: đạo hàm trong miền thời gian trở thành phép nhân với s trong miền s. Còn định lý giá trị cuối cho phép ta biết giá trị xác lập của tín hiệu mà không cần giải ra hàm theo thời gian, rất tiện khi tính sai số xác lập sau này."},
 {type:"rich",title:"Phép biến đổi Laplace (tt)",
  html:`<div class='rb'><b><u>Biến đổi Laplace của các hàm cơ bản:</u></b></div><div class='pr1'>Hàm nấc đơn vị (step): tín hiệu vào hệ thống điều khiển ổn định hóa</div><div class='r3'><span class='m'>u(t) = ${PW('1','nếu t ≥ 0','0','nếu t &lt; 0')}</span>${AX(G_STEP)}<span class='eqy'>ℒ{u(t)} = ${fr('1','s')}</span></div><div class='pr1'>Hàm dirac: thường dùng để mô tả nhiễu</div><div class='r3'><span class='m'>δ(t) = ${PW('0','nếu t ≠ 0','∞','nếu t = 0')}<br>${INT('−∞','+∞')} δ(t)dt = 1</span>${AX(G_DIR)}<span class='eqy'>ℒ{δ(t)} = 1</span></div>`,
  speech:"Tiếp theo là biến đổi Laplace của những tín hiệu thường dùng nhất trong điều khiển. Biến đổi Laplace của các hàm cơ bản. Hàm nấc đơn vị, gọi là step, là tín hiệu vào hệ thống điều khiển ổn định hóa. u của t bằng 1 nếu t lớn hơn hoặc bằng 0, bằng 0 nếu t nhỏ hơn 0. Biến đổi Laplace của nó là 1 chia s. Hàm dirac thường dùng để mô tả nhiễu. Delta của t bằng 0 nếu t khác 0, bằng vô cùng nếu t bằng 0, và tích phân của nó từ âm vô cùng đến dương vô cùng bằng 1. Biến đổi Laplace của nó bằng 1. Hàm nấc đơn vị giống như việc đột ngột bật một công tắc, còn xung dirac giống như một cú gõ rất ngắn và rất mạnh. Hai tín hiệu này thường được dùng để thử phản ứng của hệ thống."},
 {type:"rich",title:"Phép biến đổi Laplace (tt)",
  html:`<div class='rb'><b><u>Biến đổi Laplace của các hàm cơ bản (tt):</u></b></div><div class='pr1'>Hàm dốc đơn vị (Ramp): tín hiệu vào hệ thống điều khiển theo dõi</div><div class='r3'><span class='m'>r(t) = t·u(t) = ${PW('t','nếu t ≥ 0','0','nếu t &lt; 0')}</span>${AX(G_RAMP)}<span class='eqy'>ℒ{t·u(t)} = ${fr('1','s<sup>2</sup>')}</span></div><div class='pr1'>Hàm mũ:</div><div class='r3'><span class='m'>f(t) = e<sup>−at</sup>·u(t) = ${PW('e<sup>−at</sup>','nếu t ≥ 0','0','nếu t &lt; 0')}</span>${AX(G_EXP)}<span class='eqy'>ℒ{e<sup>−at</sup>·u(t)} = ${fr('1','s + a')}</span></div>`,
  speech:"Ta xét tiếp hai tín hiệu nữa: hàm dốc và hàm mũ. Hàm dốc đơn vị, gọi là ramp, là tín hiệu vào hệ thống điều khiển theo dõi. r của t bằng t nhân u của t, bằng t nếu t lớn hơn hoặc bằng 0, bằng 0 nếu t nhỏ hơn 0. Biến đổi Laplace của nó là 1 chia s bình phương. Hàm mũ: f của t bằng e mũ trừ a t nhân u của t. Biến đổi Laplace của nó là 1 chia s cộng a. Các em nhận thấy một quy luật: hàm dốc là tích phân của hàm nấc, nên ảnh Laplace chia thêm một lần cho s."},
 {type:"rich",title:"Phép biến đổi Laplace (tt)",
  html:`<div class='rb'><b><u>Biến đổi Laplace của các hàm cơ bản (tt):</u></b></div><div class='pr1'>Hàm sin:</div><div class='r3'>${AX(G_SIN)}<span class='m'>f(t) = (sin ωt)·u(t) = ${PW('sin ωt','nếu t ≥ 0','0','nếu t &lt; 0')}<br><br><span class='eqy'>ℒ{(sin ωt)u(t)} = ${fr('ω','s<sup>2</sup> + ω<sup>2</sup>')}</span></span></div><div class='pp' style='font-weight:700;margin-top:4cqw'>❖ <u>Bảng biến đổi Laplace</u>: SV cần <u class='g'>học thuộc biến đổi Laplace của các hàm cơ bản</u>. Các hàm khác có thể tra BẢNG BIẾN ĐỔI LAPLACE ở phụ lục sách Lý thuyết Điều khiển tự động.</div>`,
  speech:"Tín hiệu cuối cùng trong nhóm hàm cơ bản là hàm sin, thường dùng để mô tả dao động và để khảo sát đáp ứng tần số. Hàm sin: f của t bằng sin ô-mê-ga t nhân u của t, bằng sin ô-mê-ga t nếu t lớn hơn hoặc bằng 0, bằng 0 nếu t nhỏ hơn 0. Biến đổi Laplace của nó là ô-mê-ga chia s bình phương cộng ô-mê-ga bình phương. Về bảng biến đổi Laplace: sinh viên cần học thuộc biến đổi Laplace của các hàm cơ bản. Các hàm khác có thể tra bảng biến đổi Laplace ở phụ lục sách Lý thuyết Điều khiển tự động. Khi đã thuộc các kết quả này, các bài toán sau chỉ còn là biến đổi đại số và tra bảng."},
 {type:"rich",title:"Định nghĩa hàm truyền",
  html:`<div class='zm'><div class='rb'>Xét hệ thống mô tả bởi phương trình vi phân:</div><div class='dg'><span class='lb'>u(t)</span><span class='ar'></span><div class='bx'>Hệ thống tuyến tính<br>bất biến liên tục</div><span class='ar'></span><span class='lb'>y(t)</span></div><div class='m eqw'>${EL}y(t)=<br>&emsp;&emsp;&emsp;&emsp;b<sub>0</sub>${ER}</div><div class='rb'>Biến đổi Laplace 2 vế phương trình trên, để ý tính chất ảnh của đạo hàm, giả thiết điều kiện đầu bằng 0, ta được:</div><div class='m eqw'>a<sub>0</sub>s<sup>n</sup>Y(s)+a<sub>1</sub>s<sup>n−1</sup>Y(s)+⋯+a<sub>n−1</sub>sY(s)+a<sub>n</sub>Y(s)=<br>&emsp;&emsp;&emsp;&emsp;b<sub>0</sub>s<sup>m</sup>U(s)+b<sub>1</sub>s<sup>m−1</sup>U(s)+⋯+b<sub>m−1</sub>sU(s)+b<sub>m</sub>U(s)</div></div>`,
  speech:"Bây giờ ta đến khái niệm trung tâm của phần này: hàm truyền. Cách đi rất tự nhiên, ta lấy biến đổi Laplace của phương trình vi phân. Xét hệ thống tuyến tính bất biến liên tục, có tín hiệu vào u của t và tín hiệu ra y của t, mô tả bởi phương trình vi phân bậc n như trên màn hình. Biến đổi Laplace hai vế phương trình trên, để ý tính chất ảnh của đạo hàm, giả thiết điều kiện đầu bằng 0, ta được phương trình theo biến s, trong đó mỗi số hạng đạo hàm được thay bằng s mũ tương ứng nhân Y của s hoặc U của s. Các em quan sát: sau khi biến đổi, mỗi đạo hàm bậc k chỉ còn là s mũ k nhân với biến đổi Laplace của tín hiệu. Phương trình vi phân đã biến thành phương trình đại số, và từ đây ta rút ra hàm truyền ở slide tiếp theo."},
 {type:"rich",title:"Định nghĩa hàm truyền",
  html:`<div class='zm'><div class='rb'>Hàm truyền của hệ thống:</div><div style='text-align:center;margin:1.5cqw 0 2cqw'><span class='eqy' style='font-size:3.4cqw'>G(s) = ${fr('Y(s)','U(s)')} = ${fr('b<sub>0</sub>s<sup>m</sup>+b<sub>1</sub>s<sup>m−1</sup>+⋯+b<sub>m−1</sub>s+b<sub>m</sub>','a<sub>0</sub>s<sup>n</sup>+a<sub>1</sub>s<sup>n−1</sup>+⋯+a<sub>n−1</sub>s+a<sub>n</sub>')}</span></div><div class='rb'><b class='r'><u>Định nghĩa:</u></b> <b class='g'><i>Hàm truyền của hệ thống là tỉ số giữa biến đổi Laplace của tín hiệu ra và biến đổi Laplace của tín hiệu vào khi điều kiện đầu bằng 0.</i></b></div><div class='rb'><b class='r'><u>Chú ý:</u></b> Mặc dù hàm truyền được định nghĩa là tỉ số giữa biến đổi Laplace của tín hiệu ra và biến đổi Laplace của tín hiệu vào nhưng <span class='r'><i><u>hàm truyền không phụ thuộc vào tín hiệu ra và tín hiệu vào mà chỉ phụ thuộc vào cấu trúc và thông số của hệ thống</u></i></span>.</div><div class='pa'><b>⇒ Do đó, có thể dùng hàm truyền để mô tả hệ thống.</b></div></div>`,
  speech:"Từ phương trình đại số vừa rồi, ta chia hai vế để có tỉ số giữa ngõ ra và ngõ vào. Hàm truyền của hệ thống là G của s bằng Y của s chia U của s, bằng tử số b không s mũ m cộng b một s mũ m trừ 1, và cứ thế cho đến b m, chia cho mẫu số a không s mũ n cộng a một s mũ n trừ 1, và cứ thế cho đến a n. Định nghĩa: hàm truyền của hệ thống là tỉ số giữa biến đổi Laplace của tín hiệu ra và biến đổi Laplace của tín hiệu vào khi điều kiện đầu bằng 0. Chú ý: mặc dù hàm truyền được định nghĩa là tỉ số giữa tín hiệu ra và tín hiệu vào, nhưng hàm truyền không phụ thuộc vào tín hiệu ra và tín hiệu vào, mà chỉ phụ thuộc vào cấu trúc và thông số của hệ thống. Do đó, có thể dùng hàm truyền để mô tả hệ thống. Hãy ghi nhớ ba ý. Một: hàm truyền là một phân thức theo s. Hai: các hệ số của nó chính là các thông số a và b của hệ thống. Ba: bậc của mẫu số chính là bậc của hệ thống. Chữ điều kiện đầu bằng không rất quan trọng, khi làm bài các em đừng quên giả thiết này."},
 {type:"rich",title:"Hàm truyền của các phần tử",
  html:`<div class='sb'>Cách tìm hàm truyền</div><div class='ag'><b class='r'><u>Bước 1:</u></b> Thành lập phương trình vi phân mô tả quan hệ vào – ra của phần tử bằng cách:</div><div class='so'>Áp dụng các định luật Kirchoff, quan hệ dòng – áp trên điện trở, tụ điện, cuộn cảm, … đối với các phần tử điện.</div><div class='so'>Áp dụng các định luật Newton, quan hệ giữa lực ma sát và vận tốc, quan hệ giữa lực và biến dạng của lò xo,… đối với các phần tử cơ khí.</div><div class='so'>Áp dụng các định luật truyền nhiệt, định luật bảo toàn năng lượng, … đối với các phần tử nhiệt.</div><div class='so'>…</div><div class='ag'><b class='r'><u>Bước 2:</u></b> Biến đổi Laplace hai vế phương trình vi phân vừa thành lập ở bước 1, ta được hàm truyền cần tìm.</div><div class='ag'><b class='r'><u>Chú ý:</u></b> <b class='g'>đối với các mạch điện có thể tìm hàm tuyền theo phương pháp tổng trở phức.</b></div>`,
  speech:"Vậy trong thực tế, làm thế nào để tìm hàm truyền của một phần tử cụ thể? Quy trình chỉ gồm hai bước. Cách tìm hàm truyền. Bước một: thành lập phương trình vi phân mô tả quan hệ vào ra của phần tử. Với phần tử điện, áp dụng các định luật Kirchoff và quan hệ dòng áp trên điện trở, tụ điện, cuộn cảm. Với phần tử cơ khí, áp dụng các định luật Newton, quan hệ giữa lực ma sát và vận tốc, quan hệ giữa lực và biến dạng của lò xo. Với phần tử nhiệt, áp dụng các định luật truyền nhiệt và bảo toàn năng lượng. Bước hai: biến đổi Laplace hai vế phương trình vi phân vừa thành lập ở bước một, ta được hàm truyền cần tìm. Chú ý: đối với các mạch điện có thể tìm hàm truyền theo phương pháp tổng trở phức. Tóm lại: viết phương trình vật lý, rồi biến đổi Laplace với điều kiện đầu bằng không. Với mạch điện, dùng tổng trở phức sẽ nhanh hơn rất nhiều, các em sẽ thấy ngay ở các thí dụ sau."},
 {type:"rich",title:"Hàm truyền của các bộ điều khiển (khâu hiệu chỉnh)",
  html:`<div class='sb'>Các khâu hiệu chỉnh thụ động</div><div class='r3 big'><span class='ag2'>➢ Mạch tích phân bậc 1:</span>${LP}<span class='eqy'>G(s) = ${fr('1','RCs + 1')}</span></div><div class='r3 big'><span class='ag2'>➢ Mạch vi phân bậc 1:</span>${HP}<span class='eqy'>G(s) = ${fr('RCs','RCs + 1')}</span></div>`,
  speech:"Ta áp dụng ngay cho các bộ điều khiển, hay còn gọi là khâu hiệu chỉnh, bắt đầu với các mạch thụ động chỉ gồm điện trở và tụ điện. Các khâu hiệu chỉnh thụ động. Mạch tích phân bậc một gồm điện trở R mắc nối tiếp và tụ điện C mắc song song với ngõ ra, có hàm truyền G của s bằng 1 chia R C s cộng 1. Mạch vi phân bậc một gồm tụ điện C mắc nối tiếp và điện trở R mắc song song với ngõ ra, có hàm truyền G của s bằng R C s chia R C s cộng 1. Mạch tích phân bậc một chỉ cho tín hiệu chậm đi qua, nên còn gọi là mạch lọc thông thấp. Ngược lại, mạch vi phân bậc một cho tín hiệu thay đổi nhanh đi qua, nên là mạch lọc thông cao."},
 {type:"rich",title:"Hàm truyền của các bộ điều khiển (khâu hiệu chỉnh)",
  html:`<div class='sb'>Các khâu hiệu chỉnh thụ động (tt)</div><div class='pr1'>Mạch sớm pha:</div><div class='r3'><span class='m s'>K<sub>C</sub> = ${fr('R<sub>2</sub>','R<sub>1</sub>+R<sub>2</sub>')}<br>T = ${fr('R<sub>2</sub>R<sub>1</sub>C','R<sub>1</sub>+R<sub>2</sub>')}<br>α = ${fr('R<sub>1</sub>+R<sub>2</sub>','R<sub>2</sub>')} &gt; 1</span>${LEAD}<span class='eqy'>G(s) = K<sub>C</sub>${fr('αTs + 1','Ts + 1')}</span></div><div class='pr1'>Mạch trễ pha:</div><div class='r3'><span class='m s'>K<sub>C</sub> = 1<br>T = (R<sub>1</sub>+R<sub>2</sub>)C<br>α = ${fr('R<sub>2</sub>','R<sub>1</sub>+R<sub>2</sub>')} &lt; 1</span>${LAG}<span class='eqy'>G(s) = K<sub>C</sub>${fr('αTs + 1','Ts + 1')}</span></div>`,
  speech:"Hai mạch thụ động quan trọng nữa là mạch sớm pha và mạch trễ pha. Mạch sớm pha có hàm truyền G của s bằng K C nhân anpha T s cộng 1 chia T s cộng 1. Trong đó K C bằng R hai chia R một cộng R hai. T bằng R hai R một C chia R một cộng R hai. Anpha bằng R một cộng R hai chia R hai, và lớn hơn 1. Mạch trễ pha có cùng dạng hàm truyền, trong đó K C bằng 1. T bằng R một cộng R hai, nhân C. Anpha bằng R hai chia R một cộng R hai, và nhỏ hơn 1. Để phân biệt: khi anpha lớn hơn một, tín hiệu ra sớm pha hơn tín hiệu vào, giúp cải thiện đáp ứng quá độ. Khi anpha nhỏ hơn một, tín hiệu ra trễ pha, thường dùng để giảm sai số xác lập. Các em sẽ học kỹ hai khâu này ở phần thiết kế."},
 {type:"rich",title:"Hàm truyền của các bộ điều khiển (khâu hiệu chỉnh)",
  html:`<div class='sb'>Các khâu hiệu chỉnh tích cực</div><div class='pr1'>Khâu tỷ lệ P: (<b><u>P</u></b>roportional)</div><div class='r3'>${OA('R₁','R₂')}<span class='m'><span class='eqy'>G(s) = K<sub>P</sub></span><br><br>K<sub>P</sub> = −${fr('R<sub>2</sub>','R<sub>1</sub>')}</span></div><div class='pr1'>Khâu tích phân tỷ lệ PI: (<b><u>P</u></b>roportional <b><u>I</u></b>ntegral)</div><div class='r3'>${OA('R₁','R₂ ∥ C')}<span class='m'><span class='eqy'>G(s) = K<sub>P</sub> + ${fr('K<sub>I</sub>','s')}</span><br><br>K<sub>P</sub> = −${fr('R<sub>2</sub>','R<sub>1</sub>')} &emsp; K<sub>I</sub> = −${fr('1','R<sub>1</sub>C')}</span></div>`,
  speech:"Các khâu hiệu chỉnh tích cực dùng khuếch đại thuật toán, nên có thể khuếch đại tín hiệu và tạo ra các luật điều khiển mà mạch thụ động không làm được. Ta bắt đầu từ khâu P và khâu P I. Khâu tỷ lệ P, viết tắt của Proportional, có hàm truyền G của s bằng K P, với K P bằng âm R hai chia R một. Khâu tích phân tỷ lệ P I, Proportional Integral, có hàm truyền G của s bằng K P cộng K I chia s, với K P bằng âm R hai chia R một, và K I bằng âm 1 chia R một C. Khâu P chỉ khuếch đại sai lệch. Khâu P I có thêm thành phần tích phân, giúp triệt tiêu sai số xác lập. Dấu âm xuất hiện vì mạch khuếch đại thuật toán này là mạch đảo."},
 {type:"rich",title:"Hàm truyền của các bộ điều khiển (khâu hiệu chỉnh)",
  html:`<div class='sb'>Các khâu hiệu chỉnh tích cực (tt)</div><div class='pr1'>Khâu vi phân tỷ lệ PD: (<b><u>P</u></b>roportional <b><u>D</u></b>erivative)</div><div class='r3'>${OA('Z (R₁ ∥ C)','R₂')}<span class='m'><span class='eqy'>G(s) = K<sub>P</sub> + K<sub>D</sub>s</span><br><br>K<sub>P</sub> = −${fr('R<sub>2</sub>','R<sub>1</sub>')} &emsp; K<sub>D</sub> = −R<sub>2</sub>C</span></div><div class='pr1'>Khâu vi tích phân tỷ lệ PID: (<b><u>P</u></b>roportional <b><u>I</u></b>ntegral <b><u>D</u></b>erivative)</div><div class='r3'>${OA('Z₁','Z₂')}<span class='m'><span class='eqy'>G(s) = K<sub>P</sub> + ${fr('K<sub>I</sub>','s')} + K<sub>D</sub>s</span><br><br>K<sub>P</sub> = −${fr('R<sub>1</sub>C<sub>1</sub>+R<sub>2</sub>C<sub>2</sub>','R<sub>1</sub>C<sub>2</sub>')} &emsp; K<sub>I</sub> = −${fr('1','R<sub>1</sub>C<sub>2</sub>')}<br>K<sub>D</sub> = −R<sub>2</sub>C<sub>1</sub></span></div>`,
  speech:"Hai khâu còn lại là khâu P D và khâu P I D. Khâu vi phân tỷ lệ P D, Proportional Derivative, có hàm truyền G của s bằng K P cộng K D nhân s, với K P bằng âm R hai chia R một, và K D bằng âm R hai C. Khâu vi tích phân tỷ lệ P I D, Proportional Integral Derivative, có hàm truyền G của s bằng K P cộng K I chia s cộng K D nhân s. Trong đó K P bằng âm R một C một cộng R hai C hai, chia R một C hai. K I bằng âm 1 chia R một C hai. K D bằng âm R hai C một. Thành phần vi phân phản ứng với tốc độ thay đổi của sai lệch, nên giúp hệ thống phản ứng nhanh và giảm dao động. Khâu P I D kết hợp cả ba thành phần, và là bộ điều khiển được dùng phổ biến nhất trong công nghiệp. Chúng ta sẽ quay lại bộ điều khiển này nhiều lần."},
 {type:"rich",title:"Hàm truyền của các đối tượng thường gặp",
  html:`<div class='sb g'>Hàm truyền động cơ DC</div><div style='text-align:center'>${MOTOR}</div><div class='lg'><div>- L<sub>ư</sub>: điện cảm phần ứng<br>- R<sub>ư</sub>: điện trở phần ứng<br>- U<sub>ư</sub>: điện áp phần ứng<br>- E<sub>ư</sub>: sức phản điện động</div><div>- <b>ω</b>: tốc độ động cơ<br>- <b>M<sub>t</sub></b>: moment tải<br>- <b>B</b>: hệ số ma sát<br>- <b>J</b>: moment quán tính</div></div>`,
  speech:"Ta đã xét các bộ điều khiển. Bây giờ là các đối tượng cần điều khiển, bắt đầu với động cơ một chiều, một đối tượng rất phổ biến trong công nghiệp và robot. Hàm truyền động cơ DC. Trong sơ đồ: L ư là điện cảm phần ứng. R ư là điện trở phần ứng. U ư là điện áp phần ứng. E ư là sức phản điện động. Ô-mê-ga là tốc độ động cơ. M t là moment tải. B là hệ số ma sát. J là moment quán tính. Các em chú ý các thông số này, vì ở những slide sau chúng sẽ xuất hiện trong các phương trình."},
 {type:"rich",title:"Hàm truyền của các đối tượng thường gặp (tt)",
  html:`<div class='sb g'>Hàm truyền động cơ DC (tt)</div><div class='ag'>Áp dụng định luật Kirchoff cho mạch điện phần ứng:</div><div class='eqn m'><span>U<sub>ư</sub>(t) = i<sub>ư</sub>(t)·R<sub>ư</sub> + L<sub>ư</sub>${fr('di<sub>ư</sub>(t)','dt')} + E<sub>ư</sub>(t)</span><b>(1)</b></div><div class='eqn m'><span><i class='bl'>trong đó:</i> &nbsp; E<sub>ư</sub>(t) = KΦω(t)</span><b>(2)</b></div><div class='m bl2'>K : hệ số<br>Φ : từ thông kích từ</div><div class='ag'>Áp dụng định luật Newton cho chuyển động quay của trục động cơ:</div><div class='eqn m'><span>M(t) = M<sub>t</sub>(t) + Bω(t) + J${fr('dω(t)','dt')}</span><b>(3)</b></div><div class='eqn m'><span><i class='bl'>trong đó:</i> &nbsp; M(t) = KΦi<sub>ư</sub>(t)</span><b>(4)</b></div>`,
  speech:"Để tìm hàm truyền, ta làm đúng hai bước đã nói: viết phương trình vật lý, rồi biến đổi Laplace. Phần điện dùng định luật Kirchoff, phần cơ dùng định luật Newton. Áp dụng định luật Kirchoff cho mạch điện phần ứng: U ư của t bằng i ư của t nhân R ư, cộng L ư nhân đạo hàm của i ư theo t, cộng E ư của t. Đây là phương trình một. Trong đó E ư của t bằng K phi nhân ô-mê-ga của t, phương trình hai, với K là hệ số và phi là từ thông kích từ. Áp dụng định luật Newton cho chuyển động quay của trục động cơ: M của t bằng M t của t, cộng B nhân ô-mê-ga của t, cộng J nhân đạo hàm của ô-mê-ga theo t, phương trình ba. Trong đó M của t bằng K phi nhân i ư của t, phương trình bốn. Hai phương trình về sức phản điện động và moment chính là chỗ phần điện và phần cơ liên kết với nhau. Đó là lý do động cơ có một vòng hồi tiếp bên trong."},
 {type:"rich",title:"Hàm truyền của các đối tượng thường gặp (tt)",
  html:`<div class='sb g'>Hàm truyền động cơ DC (tt)</div><div class='ag'>Biến đổi Laplace (1), (2), (3) &amp; (4), ta được:</div><div class='eqn m'><span>U<sub>ư</sub>(s) = I<sub>ư</sub>(s)·R<sub>ư</sub> + L<sub>ư</sub>sI<sub>ư</sub>(s) + E<sub>ư</sub>(s)</span><b>(5)</b></div><div class='eqn m'><span>E<sub>ư</sub>(s) = KΦω(s)</span><b>(6)</b></div><div class='eqn m'><span>M(s) = M<sub>t</sub>(s) + Bω(s) + Jsω(s)</span><b>(7)</b></div><div class='eqn m'><span>M(s) = KΦi<sub>ư</sub>(s)</span><b>(8)</b></div><div class='ag' style='margin-top:2cqw'>Đặt:</div><div class='m' style='margin-left:12cqw'>T<sub>ư</sub> = ${fr('L<sub>ư</sub>','R<sub>ư</sub>')} &emsp;<span class='bl'>hằng số thời gian điện từ của động cơ</span><br>T<sub>c</sub> = ${fr('J','B')} &emsp;<span class='bl'>hằng số thời gian điện cơ của động cơ</span></div>`,
  speech:"Bước hai là biến đổi Laplace cả bốn phương trình. Biến đổi Laplace các phương trình một, hai, ba và bốn, ta được: U ư của s bằng I ư của s nhân R ư, cộng L ư s I ư của s, cộng E ư của s, phương trình năm. E ư của s bằng K phi ô-mê-ga của s, phương trình sáu. M của s bằng M t của s, cộng B ô-mê-ga của s, cộng J s ô-mê-ga của s, phương trình bảy. M của s bằng K phi I ư của s, phương trình tám. Đặt T ư bằng L ư chia R ư, là hằng số thời gian điện từ của động cơ. Và T c bằng J chia B, là hằng số thời gian điện cơ của động cơ. Hai hằng số thời gian này cho biết động cơ phản ứng nhanh hay chậm. Thông thường hằng số thời gian điện từ nhỏ hơn nhiều so với hằng số thời gian điện cơ."},
 {type:"rich",title:"Hàm truyền của các đối tượng thường gặp (tt)",
  html:`<div class='sb g'>Hàm truyền động cơ DC (tt)</div><div class='ag'>(5), (7) suy ra:</div><div class='eqn m'><span>I<sub>ư</sub>(s) = ${fr('U<sub>ư</sub>(s) − E<sub>ư</sub>(s)','R<sub>ư</sub>(1 + T<sub>ư</sub>s)')}</span><b>(5')</b></div><div class='eqn m'><span>ω(s) = ${fr('M(s) − M<sub>t</sub>(s)','B(1 + T<sub>c</sub>s)')}</span><b>(7')</b></div><div class='ag'>Từ (5'), (6), (7') &amp; (8), ta có sơ đồ khối động cơ DC :</div><svg class='bd' viewBox='0 0 330 95' aria-hidden='true'><g stroke='#111' stroke-width='1.2' fill='none'><path d='M25 40H38M52 40H70M120 40H140M175 40H193M207 40H225M280 40H318M200 12V33M295 40V78H155M120 78H45V47'/><circle cx='45' cy='40' r='7'/><circle cx='200' cy='40' r='7'/><path d='M40 35l10 10M50 35l-10 10M195 35l10 10M205 35l-10 10'/><rect x='70' y='22' width='50' height='36'/><rect x='140' y='28' width='35' height='24'/><rect x='225' y='22' width='55' height='36'/><rect x='120' y='66' width='35' height='24'/><path d='M74 40H116M229 40H276'/></g><g font-family='Times New Roman,serif' font-style='italic' font-size='9' fill='#111' text-anchor='middle'><text x='12' y='36'>Uư(s)</text><text x='95' y='35'>1/Rư</text><text x='95' y='52'>1+sTư</text><text x='157' y='44'>KΦ</text><text x='188' y='9'>Mₜ(s)</text><text x='252' y='35'>1/B</text><text x='252' y='52'>1+sTᶜ</text><text x='137' y='82'>KΦ</text><text x='305' y='34'>ω(s)</text><text x='66' y='72'>Eư(s)</text></g></svg>`,
  speech:"Bây giờ ta ghép các phương trình lại thành sơ đồ khối. Từ phương trình năm và bảy suy ra: I ư của s bằng U ư của s trừ E ư của s, chia R ư nhân một cộng T ư s. Và ô-mê-ga của s bằng M của s trừ M t của s, chia B nhân một cộng T c s. Từ các phương trình năm phẩy, sáu, bảy phẩy và tám, ta có sơ đồ khối động cơ DC: điện áp U ư trừ sức phản điện động E ư, qua khối một chia R ư chia một cộng s T ư, qua khối K phi, rồi trừ moment tải M t, qua khối một chia B chia một cộng s T c, cho ra tốc độ ô-mê-ga của s. Tốc độ này được hồi tiếp qua khối K phi để tạo ra E ư. Các em để ý vòng hồi tiếp từ tốc độ về điện áp: khi động cơ quay nhanh, sức phản điện động tăng lên và làm giảm dòng điện. Đây là một cơ chế tự ổn định tự nhiên của động cơ."},
 {type:"rich",title:"Hàm truyền của các đối tượng thường gặp (tt)",
  html:`<div class='sb g'>Hàm truyền lò nhiệt</div><div class='dg'><span class='lb'>u(t)</span><span class='ar'></span><div class='fu'></div><span class='ar'></span><span class='lb'>y(t)</span></div><div class='cap'><span>Công suất điện cấp cho lò 100%</span><span>Nhiệt độ lò</span></div><div class='r3'><svg class='pl' viewBox='0 0 150 90' aria-hidden='true'><g stroke='#222' stroke-width='1'><path d='M20 80H145M20 80V8'/><path d='M20 20H140' stroke='#e0302f' stroke-dasharray='2 2'/></g><path d='M20 80H32Q60 80 80 45T135 22' stroke='#e0302f' stroke-width='1.8' fill='none'/><path d='M32 80L88 20' stroke='#2538d8' fill='none'/><g font-size='9' font-style='italic' fill='#111'><text x='6' y='50'>K</text><text x='30' y='89'>T₁</text><text x='62' y='89'>T₂</text><text x='118' y='76'>t (sec)</text><text x='22' y='7'>y(t) °C</text></g></svg><svg class='pl' viewBox='0 0 150 90' aria-hidden='true'><g stroke='#222' stroke-width='1'><path d='M20 80H145M20 80V8'/><path d='M20 20H140' stroke='#e0302f' stroke-dasharray='2 2'/></g><path d='M20 80H40Q70 78 90 48T135 22' stroke='#e0302f' stroke-width='1.8' fill='none'/><g font-size='9' font-style='italic' fill='#111'><text x='6' y='50'>K</text><text x='36' y='89'>T₁</text><text x='64' y='89'>T₂</text><text x='118' y='76'>t (sec)</text><text x='22' y='7'>y(t) °C</text></g></svg></div><div class='cap'><span>Đặc tính chính xác của lò nhiệt</span><span>Đặc tính gần đúng của lò nhiệt</span></div>`,
  speech:"Thí dụ tiếp theo là lò nhiệt. Khác với động cơ, ở đây ta xác định hàm truyền từ đáp ứng đo được trong thực nghiệm. Tín hiệu vào u của t là công suất điện cấp cho lò, ở mức 100 phần trăm. Tín hiệu ra y của t là nhiệt độ lò. Bên trái là đặc tính chính xác của lò nhiệt, bên phải là đặc tính gần đúng. Đáp ứng tăng dần sau thời gian trễ T một, với hằng số thời gian T hai, và tiến tới giá trị xác lập K. Đặc điểm của lò nhiệt là có thời gian trễ: cấp điện rồi nhưng nhiệt độ chưa tăng ngay. Vì vậy ta mô hình hóa lò bằng một khâu quán tính bậc nhất kèm thời gian trễ."},
 {type:"rich",title:"Hàm truyền của các đối tượng thường gặp (tt)",
  html:`<div class='sb g'>Hàm truyền lò nhiệt (tt)</div><div class='pp' style='margin-left:3cqw'>Ta xác định hàm truyền gần đúng của lò nhiệt dùng định nghĩa:</div><div class='m' style='text-align:center'>G(s) = ${fr('C(s)','R(s)')}</div><div class='ag'>Tín hiệu vào là hàm nấc đơn vị (công suất =100%): &emsp;<span class='m'>R(s) = ${fr('1','s')}</span></div><div class='ag'>Tín hiệu ra gần đúng (hình vẽ bên phải) chính là hàm:</div><div class='m' style='text-align:center'>c(t) = f(t − T<sub>1</sub>)<br><b class='bl' style='font-size:.85em'>trong đó:</b> &emsp; f(t) = K(1 − e<sup>−t/T<sub>2</sub></sup>)</div><div class='pp' style='margin:1cqw 0 0 3cqw'>Dễ dàng chứng minh được: &emsp;<span class='m'>F(s) = ${fr('K','s(1 + T<sub>2</sub>s)')}</span></div><div class='pp' style='margin:1cqw 0 0 3cqw'>Nên áp dụng định lý chậm trễ ta được: &emsp;<span class='m'>C(s) = ${fr('Ke<sup>−T<sub>1</sub>s</sup>','s(1 + T<sub>2</sub>s)')}</span></div><div class='pp' style='margin:1cqw 0 0 3cqw'><b class='bl'><u>Suy ra</u>:</b> &emsp;&emsp;&emsp;&emsp;<span class='m'>G(s) = ${fr('Ke<sup>−T<sub>1</sub>s</sup>','1 + T<sub>2</sub>s')}</span></div>`,
  speech:"Bây giờ ta tìm hàm truyền gần đúng này theo đúng định nghĩa: lấy ngõ ra chia ngõ vào trong miền s. Ta xác định hàm truyền gần đúng của lò nhiệt dùng định nghĩa: G của s bằng C của s chia R của s. Tín hiệu vào là hàm nấc đơn vị, công suất bằng 100 phần trăm, nên R của s bằng 1 chia s. Tín hiệu ra gần đúng chính là hàm c của t bằng f của t trừ T một, trong đó f của t bằng K nhân một trừ e mũ trừ t chia T hai. Dễ dàng chứng minh được F của s bằng K chia s nhân một cộng T hai s. Nên áp dụng định lý chậm trễ ta được C của s bằng K nhân e mũ trừ T một s, chia s nhân một cộng T hai s. Suy ra G của s bằng K nhân e mũ trừ T một s, chia một cộng T hai s. Kết quả gồm ba thông số: K là độ lợi, T hai là hằng số thời gian và T một là thời gian trễ. Từ đồ thị đáp ứng đo được, ta đọc ba giá trị này và có ngay mô hình của lò. Đây là cách làm rất thực tế trong công nghiệp."},
 {type:"rich",title:"Hàm truyền của các đối tượng thường gặp (tt)",
  html:`<div class='sb g'>Xe ô tô</div><div class='r3'><span class='svw s1'>@SV4@</span><span class='nt lgd'>M: khối lượng xe<br>B hệ số ma sát<br>f(t): lực kéo<br>v(t): tốc độ xe</span></div><div class='ag' style='margin-top:3cqw'>Phương trình vi phân: &emsp;<span class='eqy'>M${fr('dv(t)','dt')}+Bv(t)=f(t)</span></div><div class='ag' style='margin-top:3cqw'>Hàm truyền: &emsp;<span class='eqy'>G(s)=${fr('V(s)','F(s)')}=${fr('1','Ms+B')}</span> &nbsp;⇔&nbsp; <span class='eqy'>G(s)=${fr('K','Ts+1')}</span></div><div class='m' style='margin:2cqw 0 0 14cqw'>với &emsp; K=${fr('1','B')} &emsp;&emsp; T=${fr('M','B')}</div>`,
  speech:"Quay lại ba thí dụ ở đầu bài: bây giờ ta tìm hàm truyền cho chúng. Trước tiên là xe ô tô. M là khối lượng xe. B là hệ số ma sát. f của t là lực kéo. v của t là tốc độ xe. Phương trình vi phân: M nhân đạo hàm của v theo t, cộng B nhân v của t, bằng f của t. Hàm truyền: G của s bằng V của s chia F của s, bằng 1 chia M s cộng B, tương đương G của s bằng K chia T s cộng 1, với K bằng 1 chia B và T bằng M chia B. Hàm truyền có dạng khâu quán tính bậc nhất. Xe càng nặng, tức M càng lớn, thì hằng số thời gian T càng lớn, nên xe tăng tốc càng chậm. Điều này hoàn toàn phù hợp với trực giác."},
 {type:"rich",title:"Hàm truyền của các đối tượng thường gặp (tt)",
  html:`<div class='sb g'>Hệ thống giảm xốc của ô tô, xe máy</div><div class='r3' style='align-items:flex-start'><span class='svw s2'>@SV5@</span><div class='rc'><div class='nt lgd' style='margin:0 0 2cqw'>M: khối lượng tác động lên bánh xe,<br>B hệ số ma sát, K độ cứng lò xo<br>f(t): lực do xóc<br>y(t): dịch chuyển của thân xe</div><div class='ag'>Phương trình vi phân:</div><div style='text-align:center;margin-bottom:3cqw'><span class='eqy'>M${fr('d<sup>2</sup>y(t)','dt<sup>2</sup>')}+B${fr('dy(t)','dt')}+Ky(t)=f(t)</span></div><div class='ag'>Hàm truyền:</div><div style='text-align:center'><span class='eqy'>G(s)=${fr('Y(s)','F(s)')}=${fr('1','Ms<sup>2</sup>+Bs+K')}</span></div></div></div>`,
  speech:"Thí dụ thứ hai là hệ thống giảm xóc. M là khối lượng tác động lên bánh xe. B là hệ số ma sát, K là độ cứng lò xo. f của t là lực do xóc. y của t là dịch chuyển của thân xe. Phương trình vi phân: M nhân đạo hàm bậc hai của y, cộng B nhân đạo hàm bậc một của y, cộng K nhân y của t, bằng f của t. Hàm truyền: G của s bằng Y của s chia F của s, bằng 1 chia M s bình phương cộng B s cộng K. Hàm truyền là khâu bậc hai. Tùy theo các giá trị M, B và K, đáp ứng có thể dao động tắt dần hoặc không dao động. Chọn B và K hợp lý chính là bài toán thiết kế hệ thống giảm xóc êm ái."},
 {type:"rich",title:"Hàm truyền của các đối tượng thường gặp (tt)",
  html:`<div class='sb g'>Thang máy</div><div class='r3' style='align-items:flex-start;margin:0'><span class='svw s3b'>@SV6@</span><div class='nt lgd rc' style='margin:0'>M<sub>T</sub>: khối lượng buồng thang,<br>M<sub>Đ</sub>: khối lượng đối trọng<br>B hệ số ma sát, K hệ số tỉ lệ<br>τ(t): moment kéo của động cơ<br>y(t): vị trí buồng thang</div></div><div class='ag' style='margin-top:.6cqw'>Phương trình vi phân: &emsp;<span class='eqy' style='font-size:1.9cqw'>M<sub>T</sub>${fr('d<sup>2</sup>y(t)','dt<sup>2</sup>')}+B${fr('dy(t)','dt')}+M<sub>T</sub>g=Kτ(t)+M<sub>Đ</sub>g</span></div><div class='pp' style='margin:.4cqw 0 .4cqw 6cqw;text-align:left'>Nếu khối lượng đối trọng bằng khối lượng buồng thang: &emsp;<span class='eqy' style='font-size:1.9cqw'>M<sub>T</sub>${fr('d<sup>2</sup>y(t)','dt<sup>2</sup>')}+B${fr('dy(t)','dt')}=Kτ(t)</span></div><div class='ag' style='margin-top:.6cqw'>Hàm truyền: &emsp;<span class='eqy' style='font-size:1.9cqw'>G(s)=${fr('Y(s)','τ(s)')}=${fr('K','M<sub>T</sub>s<sup>2</sup>+Bs')}</span></div><div class='pp r' style='margin:.6cqw 0 0 6cqw;text-align:left'>Nếu khối lượng buồng thang không bằng khối lượng đối trọng?</div>`,
  speech:"Thí dụ thứ ba là thang máy. M T là khối lượng buồng thang. M Đ là khối lượng đối trọng. B là hệ số ma sát, K là hệ số tỉ lệ. Tau của t là moment kéo của động cơ. y của t là vị trí buồng thang. Phương trình vi phân: M T nhân đạo hàm bậc hai của y, cộng B nhân đạo hàm bậc một của y, cộng M T nhân g, bằng K tau của t cộng M Đ nhân g. Nếu khối lượng đối trọng bằng khối lượng buồng thang, phương trình còn M T nhân đạo hàm bậc hai của y cộng B nhân đạo hàm bậc một của y, bằng K tau của t. Hàm truyền: G của s bằng Y của s chia tau của s, bằng K chia M T s bình phương cộng B s. Câu hỏi: nếu khối lượng buồng thang không bằng khối lượng đối trọng thì sao? Gợi ý cho câu hỏi này: khi hai khối lượng khác nhau, trong phương trình xuất hiện thêm một lực không đổi do trọng lực chênh lệch. Lực này tác động như một nhiễu hằng. Các em thử suy nghĩ thêm xem ta nên xử lý nó như thế nào."},
 {type:"rich",title:"Hàm truyền của cảm biến",
  html:`<div class='dg'><span class='lb'>y(t)</span><span class='ar'></span><div class='bx'>Cảm biến</div><span class='ar'></span><span class='lb'>y<sub>ht</sub>(t)</span></div><div class='rb'>Tín hiệu y<sub>ht</sub>(t) có là tín hiệu tỉ lệ với y(t), do đó hàm truyền của cảm biến thường là khâu tỉ lệ:</div><div style='text-align:center;margin:1.5cqw 0'><span class='eqy'>H(s) = K<sub>ht</sub></span></div><div class='rb'><b class='r'><u>Thí dụ:</u></b> <span class='r'>Giả sử nhiệt độ lò thay đổi trong tầm y(t) = 0÷500°C, nếu cảm biến nhiệt biến đổi sự thay đổi nhiệt độ thành sự thay đổi điện áp trong tầm y<sub>ht</sub>(t) 0÷5V</span>, thì hàm truyền của cảm biến là:</div><div style='text-align:center;margin:1.5cqw 0'><span class='eqy'>H(s) = K<sub>ht</sub> = 0.01</span></div><div class='rb'>Nếu cảm biến có trễ, hàm truyền cảm biến là khâu quán tính bậc 1:</div><div style='text-align:center;margin:1.5cqw 0'><span class='eqy'>H(s) = ${fr('K<sub>ht</sub>','1 + T<sub>ht</sub>s')}</span></div>`,
  speech:"Một thành phần nữa không thể thiếu trong hệ thống tự động là cảm biến, vì muốn điều khiển thì phải đo được. Tín hiệu ra của cảm biến, y h t của t, là tín hiệu tỉ lệ với y của t, do đó hàm truyền của cảm biến thường là khâu tỉ lệ: H của s bằng K h t. Thí dụ: giả sử nhiệt độ lò thay đổi trong tầm từ 0 đến 500 độ C, nếu cảm biến nhiệt biến đổi sự thay đổi nhiệt độ thành sự thay đổi điện áp trong tầm từ 0 đến 5 vôn, thì hàm truyền của cảm biến là H của s bằng K h t bằng 0 phẩy 01. Nếu cảm biến có trễ, hàm truyền cảm biến là khâu quán tính bậc 1: H của s bằng K h t chia 1 cộng T h t s. Cảm biến thường được xem là khâu tỉ lệ, với hệ số bằng tỉ số giữa tầm tín hiệu ra và tầm đại lượng đo. Chỉ khi cảm biến phản ứng chậm, ta mới xét thêm khâu quán tính."},
 {type:"section",title:"Hàm truyền của hệ thống tự động",speech:"Phần ba: Hàm truyền của hệ thống tự động. Ta đã biết hàm truyền của từng phần tử. Một hệ thống thực lại gồm nhiều phần tử ghép lại, và bây giờ ta học cách tính hàm truyền của cả hệ thống."},
 {type:"rich",title:"Đại số sơ đồ khối",
  html:`<div class='rb'>Sơ đồ khối của một hệ thống là hình vẽ mô tả chức năng của các phần tử và sự tác động qua lại giữa các phần tử trong hệ thống.</div><div class='rb'>Sơ đồ khối có 3 thành phần chính là:</div><div class='pr1' style='margin-left:6cqw'><span class='g'>Khối chức năng</span>: tín hiệu ra bằng hàm truyền nhân tín hiệu vào</div><div class='pr1' style='margin-left:6cqw'><span class='c'>Bộ tổng</span>: tín hiệu ra bằng tổng đại số các tín hiệu vào</div><div class='pr1' style='margin-left:6cqw'><b>Điểm rẽ nhánh</b>: tất cả các tín hiệu tại điểm rẽ nhánh đều bằng nhau.</div><div class='svw s4'>@SV24@</div><div class='cap'><span style='color:#d00'>bộ tổng</span><span style='color:#00a651'>khối chức năng</span><span style='color:#c0c'>điểm rẽ nhánh</span></div>`,
  speech:"Để mô tả cách các phần tử ghép với nhau, kỹ sư dùng một ngôn ngữ hình vẽ rất trực quan là sơ đồ khối. Sơ đồ khối của một hệ thống là hình vẽ mô tả chức năng của các phần tử và sự tác động qua lại giữa các phần tử trong hệ thống. Sơ đồ khối có ba thành phần chính. Khối chức năng: tín hiệu ra bằng hàm truyền nhân tín hiệu vào. Bộ tổng: tín hiệu ra bằng tổng đại số các tín hiệu vào. Điểm rẽ nhánh: tất cả các tín hiệu tại điểm rẽ nhánh đều bằng nhau. Hình dưới là sơ đồ khối động cơ DC, với các bộ tổng, khối chức năng và điểm rẽ nhánh được chú thích. Chỉ có ba ký hiệu cần nhớ: khối, bộ tổng và điểm rẽ nhánh. Chú ý điểm rẽ nhánh chỉ sao chép tín hiệu, không chia nhỏ hay làm giảm tín hiệu."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Hàm truyền của các hệ thống đơn giản</div><div class='rb'>Hệ thống nối tiếp:</div>${S(330,70,`<rect x='12' y='6' width='306' height='58' stroke-dasharray='2 2'/><path d='M2 34H328'/>`+ARw(40,34)+ARw(130,34)+ARw(248,34)+ARw(328,34)+TX(2,28,'U(s)')+TX(22,28,'U₁(s)')+BXs(40,22,32,24,'G₁',GRN)+TX(78,28,'Y₁(s)')+TX(98,50,'U₂(s)')+BXs(130,22,32,24,'G₂',GRN)+TX(168,50,'Y₂(s)')+TX(196,38,'⋯')+TX(222,28,'Uₙ(s)')+BXs(248,22,32,24,'Gₙ',GRN)+TX(282,28,'Yₙ(s)')+TX(304,28,'Y(s)'),'w')}<div style='text-align:center;margin-top:5cqw'><span class='eqy'>G<sub>nt</sub>(s) = <span class='in'><i>n</i>∏<i>i=1</i></span> G<sub>i</sub>(s)</span></div>`,
  speech:"Có ba cách ghép cơ bản: nối tiếp, song song và hồi tiếp. Ta bắt đầu từ cách đơn giản nhất là nối tiếp. Hệ thống nối tiếp: tín hiệu ra của khối trước là tín hiệu vào của khối sau, qua các khối G một, G hai, cho đến G n. Hàm truyền tương đương G n t bằng tích của các hàm truyền G i của s, với i chạy từ 1 đến n. Cách nhớ rất dễ: nối tiếp thì nhân."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Hàm truyền của các hệ thống đơn giản (tt)</div><div class='rb'>Hệ thống song song:</div>${S(330,125,`<rect x='25' y='6' width='290' height='113' stroke-dasharray='2 2'/><path d='M2 64H70M70 28V108M70 28H110M70 64H110M70 108H110M142 28H240V57M142 64H233M142 108H240V71M247 64H322'/><circle cx='240' cy='64' r='7' fill='#fff'/><path d='M236 64h8M240 60v8'/>`+ARw(110,28)+ARw(110,64)+ARw(110,108)+ARw(322,64)+TX(2,58,'U(s)')+TX(78,24,'U₁(s)')+BXs(110,17,32,22,'G₁',GRN)+TX(150,24,'Y₁(s)')+TX(78,60,'U₂(s)')+BXs(110,53,32,22,'G₂',GRN)+TX(150,60,'Y₂(s)')+TX(120,92,'⋮')+TX(78,104,'Uₙ(s)')+BXs(110,97,32,22,'Gₙ',GRN)+TX(150,104,'Yₙ(s)')+TX(296,58,'Y(s)'),'w')}<div style='text-align:center;margin-top:3cqw'><span class='eqy'>G<sub>ss</sub>(s) = <span class='in'><i>n</i>∑<i>i=1</i></span> G<sub>i</sub>(s)</span></div>`,
  speech:"Cách ghép thứ hai là song song. Hệ thống song song: các khối G một, G hai, cho đến G n cùng nhận tín hiệu vào U của s, và các tín hiệu ra được cộng lại ở bộ tổng. Hàm truyền tương đương G s s bằng tổng của các hàm truyền G i của s, với i chạy từ 1 đến n. Song song thì cộng. Nếu một nhánh đi vào bộ tổng với dấu trừ thì hàm truyền của nhánh đó mang dấu âm khi cộng."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Hàm truyền của các hệ thống đơn giản (tt)</div><div class='r3' style='align-items:flex-start'><span class='ag2' style='flex:1'>☐ Hệ thống hồi tiếp âm:</span><span class='ag2' style='flex:1'>☐ Hệ thống hồi tiếp âm đơn vị:</span></div><div class='r3'>${FB(true,'−')}${FB(false,'−')}</div><div class='r3'><span class='eqy'>G<sub>k</sub>(s) = ${fr('G(s)','1 + G(s)·H(s)')}</span><span class='eqy'>G<sub>k</sub>(s) = ${fr('G(s)','1 + G(s)')}</span></div>`,
  speech:"Cách ghép thứ ba, quan trọng nhất, là hồi tiếp. Hồi tiếp là bản chất của điều khiển tự động, vì hệ thống tự so sánh kết quả với mong muốn rồi tự hiệu chỉnh. Hệ thống hồi tiếp âm có hàm truyền G k của s bằng G của s chia một cộng G của s nhân H của s. Hệ thống hồi tiếp âm đơn vị, tức là H của s bằng 1, có hàm truyền G k của s bằng G của s chia một cộng G của s. Cách nhớ: tử số là hàm truyền đường thuận, mẫu số là một cộng tích của đường thuận và đường hồi tiếp. Với hồi tiếp âm, dấu trong mẫu số là dấu cộng."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Hàm truyền của các hệ thống đơn giản (tt)</div><div class='r3' style='align-items:flex-start'><span class='ag2' style='flex:1'>☐ Hệ thống hồi tiếp dương:</span><span class='ag2' style='flex:1'>☐ Hệ thống hồi tiếp dương đơn vị:</span></div><div class='r3'>${FB(true,'+')}${FB(false,'+')}</div><div class='r3'><span class='eqy'>G<sub>k</sub>(s) = ${fr('G(s)','1 − G(s)·H(s)')}</span><span class='eqy'>G<sub>k</sub>(s) = ${fr('G(s)','1 − G(s)')}</span></div>`,
  speech:"Hồi tiếp dương có công thức tương tự nhưng khác ở dấu. Hệ thống hồi tiếp dương có hàm truyền G k của s bằng G của s chia một trừ G của s nhân H của s. Hệ thống hồi tiếp dương đơn vị có hàm truyền G k của s bằng G của s chia một trừ G của s. Mẫu số lúc này là một trừ tích vòng. Hồi tiếp dương có thể làm hệ thống mất ổn định, nên trong điều khiển ta chủ yếu dùng hồi tiếp âm."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Hàm truyền của các hệ thống hồi tiếp nhiều vòng</div><div class='rb' style='margin-top:3cqw'>Đối với các hệ thống phức tạp gồm nhiều vòng hồi tiếp, ta thực hiện các phép biến đổi tương đương sơ đồ khối để làm xuất hiện các dạng ghép nối đơn giản (nối tiếp, song song, hồi tiếp 1 vòng) và tính hàm truyền tương đương theo thứ tự từ trong ra ngoài.</div><div class='pp r' style='margin-top:3cqw'><b><i>✓ Hai sơ đồ khối được gọi là tương đương nếu hai sơ đồ khối đó có quan hệ giữa các tín hiệu vào và tín hiệu ra như nhau.</i></b></div>`,
  speech:"Vậy nếu hệ thống có nhiều vòng hồi tiếp lồng vào nhau thì sao? Đối với các hệ thống phức tạp gồm nhiều vòng hồi tiếp, ta thực hiện các phép biến đổi tương đương sơ đồ khối để làm xuất hiện các dạng ghép nối đơn giản, gồm nối tiếp, song song và hồi tiếp một vòng, rồi tính hàm truyền tương đương theo thứ tự từ trong ra ngoài. Hai sơ đồ khối được gọi là tương đương nếu hai sơ đồ khối đó có quan hệ giữa các tín hiệu vào và tín hiệu ra như nhau. Chiến lược là rút gọn từng bước, bắt đầu từ vòng trong cùng. Muốn làm được, ta cần các phép biến đổi tương đương, và đó là nội dung của vài slide tiếp theo."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Các phép biến đổi tương đương sơ đồ khối</div><div class='rb'>Chuyển điểm rẽ nhánh từ phía trước ra phía sau 1 khối:</div>${EQV(S(150,80,`<path d='M5 30H115M25 30V62H5'/>`+ARw(115,30)+ARw(5,62)+DT(25,30)+BXs(55,18,30,24,'G(s)',CYN)+TX(4,24,'x₁')+TX(112,24,'x₃')+TX(4,56,'x₂'),'e'),S(150,80,`<path d='M5 30H115M95 30V62H65M45 62H5'/>`+ARw(115,30)+ARw(5,62)+DT(95,30)+BXs(35,18,30,24,'G(s)',CYN)+BXs(40,52,26,20,'1/G(s)',ORG)+TX(4,24,'x₁')+TX(112,24,'x₃')+TX(4,56,'x₂'),'e'),['x₂ = x₁<br>x₃ = x₁G','x₃ = x₁G<br>x₂ = x₃·(1/G) = x₁G·(1/G) = x₁'])}`,
  speech:"Các phép biến đổi tương đương giúp ta di chuyển điểm rẽ nhánh và bộ tổng để làm xuất hiện các dạng ghép đơn giản. Nguyên tắc chung chỉ có một: sau khi biến đổi, tín hiệu ở mọi ngõ ra phải giữ nguyên. Chuyển điểm rẽ nhánh từ phía trước ra phía sau một khối. Trước khi chuyển: x hai bằng x một, và x ba bằng x một nhân G. Sau khi chuyển, phải thêm khối một chia G trên nhánh rẽ: x ba bằng x một nhân G, và x hai bằng x ba nhân một chia G, bằng x một. Hai sơ đồ này tương đương. Quy tắc: chuyển ra phía sau một khối thì nhánh rẽ cần thêm khối một chia G, để tín hiệu rẽ ra vẫn đúng như cũ."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Các phép biến đổi tương đương sơ đồ khối (tt)</div><div class='rb'>Chuyển điểm rẽ nhánh từ phía sau ra phía trước 1 khối:</div>${EQV(S(150,80,`<path d='M5 30H115M95 30V62H5'/>`+ARw(115,30)+ARw(5,62)+DT(95,30)+BXs(45,18,30,24,'G(s)',CYN)+TX(4,24,'x₁')+TX(112,24,'x₃')+TX(4,56,'x₂'),'e'),S(150,80,`<path d='M5 30H115M25 30V62H45M75 62H115'/>`+ARw(115,30)+ARw(115,62)+DT(25,30)+BXs(55,18,30,24,'G(s)',CYN)+BXs(45,52,30,20,'G(s)',ORG)+TX(4,24,'x₁')+TX(112,24,'x₃')+TX(112,56,'x₂'),'e'),['x₃ = x₁G<br>x₂ = x₃ = x₁G','x₃ = x₁G<br>x₂ = x₁G'])}`,
  speech:"Ngược lại, ta chuyển điểm rẽ nhánh về phía trước. Chuyển điểm rẽ nhánh từ phía sau ra phía trước một khối. Trước khi chuyển: x ba bằng x một nhân G, và x hai bằng x ba, bằng x một nhân G. Sau khi chuyển, phải thêm khối G trên nhánh rẽ: x ba bằng x một nhân G, và x hai bằng x một nhân G. Hai sơ đồ này tương đương. Lần này ta thêm khối G."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Các phép biến đổi tương đương sơ đồ khối (tt)</div><div class='rb'>Chuyển bộ tổng từ phía trước ra phía sau 1 khối:</div>${EQV(S(150,80,`<path d='M5 30H21M35 30H70M100 30H140M28 70V37'/><path d='M28 22Q70 2 112 22' stroke='#e0302f' stroke-dasharray='3 2'/>`+SMc(28,30)+BXs(70,18,30,24,'G(s)',CYN)+ARw(140,30)+ARu(28,37)+TX(3,24,'x₁')+TX(138,24,'x₂')+TX(33,76,'x₃')+TX(37,46,'−'),'e'),S(150,80,`<path d='M5 30H35M65 30H98M112 30H140M12 66H35M65 66H105V37'/>`+BXs(35,18,30,24,'G(s)',CYN)+BXs(35,56,30,20,'G(s)',ORG)+SMc(105,30)+ARw(140,30)+ARu(105,37)+TX(3,24,'x₁')+TX(138,24,'x₂')+TX(3,62,'x₃')+TX(113,46,'−'),'e'),['x₂ = (x₁ − x₃)·G','x₂ = x₁·G − x₃·G = (x₁ − x₃)·G'])}`,
  speech:"Bây giờ là phép chuyển bộ tổng. Chuyển bộ tổng từ phía trước ra phía sau một khối. Trước khi chuyển: x hai bằng x một trừ x ba, rồi nhân G. Sau khi chuyển, phải thêm khối G trên nhánh của x ba: x hai bằng x một nhân G trừ x ba nhân G, bằng x một trừ x ba, nhân G. Hai sơ đồ này tương đương. Cách nghĩ giống như điểm rẽ nhánh: khối G đi qua bộ tổng thì nhánh còn lại phải được nhân thêm G."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Các phép biến đổi tương đương sơ đồ khối (tt)</div><div class='rb'>Chuyển bộ tổng từ phía sau ra phía trước 1 khối:</div>${EQV(S(150,80,`<path d='M5 30H40M70 30H88M102 30H140M95 70V37'/><path d='M95 22Q60 2 28 22' stroke='#e0302f' stroke-dasharray='3 2'/>`+BXs(40,18,30,24,'G(s)',CYN)+SMc(95,30)+ARw(140,30)+ARu(95,37)+TX(3,24,'x₁')+TX(138,24,'x₂')+TX(100,76,'x₃')+TX(103,46,'−'),'e'),S(150,80,`<path d='M5 30H21M35 30H62M92 30H140M135 66H70M40 66H28V37'/>`+SMc(28,30)+BXs(62,18,30,24,'G(s)',CYN)+BXs(40,56,30,20,'1/G(s)',ORG)+ARw(140,30)+ARu(28,37)+TX(3,24,'x₁')+TX(138,24,'x₂')+TX(128,62,'x₃')+TX(36,46,'−'),'e'),['x₂ = x₁·G − x₃','x₂ = [x₁ − x₃·(1/G)]·G = x₁·G − x₃'])}`,
  speech:"Ngược lại, ta chuyển bộ tổng về phía trước. Chuyển bộ tổng từ phía sau ra phía trước một khối. Trước khi chuyển: x hai bằng x một nhân G, trừ x ba. Sau khi chuyển, phải thêm khối một chia G trên nhánh của x ba: x hai bằng x một trừ x ba nhân một chia G, rồi nhân G, bằng x một nhân G trừ x ba. Hai sơ đồ này tương đương. Khi đó nhánh còn lại phải được nhân thêm một chia G."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Các phép biến đổi tương đương sơ đồ khối (tt)</div><div class='rb'>Chuyển vị trí hai bộ tổng:</div>${EQV(S(150,80,`<path d='M5 30H21M35 30H70M84 30H140M28 70V37M77 70V37'/>`+SMk(28,30,'#7aa0ff')+SMk(77,30,'#ffd24a')+ARw(140,30)+ARu(28,37)+ARu(77,37)+TX(3,24,'x₁')+TX(138,24,'x₄')+TX(33,76,'x₂')+TX(82,76,'x₃')+TX(36,46,'−')+TX(85,46,'+'),'e'),S(150,80,`<path d='M5 30H21M35 30H70M84 30H140M28 70V37M77 70V37'/>`+SMk(28,30,'#ffd24a')+SMk(77,30,'#7aa0ff')+ARw(140,30)+ARu(28,37)+ARu(77,37)+TX(3,24,'x₁')+TX(138,24,'x₄')+TX(33,76,'x₃')+TX(82,76,'x₂')+TX(36,46,'+')+TX(85,46,'−'),'e'),['x₄ = (x₁ − x₂) + x₃','x₄ = (x₁ + x₃) − x₂'])}`,
  speech:"Hai bộ tổng liền nhau có thể hoán đổi vị trí. Chuyển vị trí hai bộ tổng. Trước khi chuyển: x bốn bằng x một trừ x hai, cộng x ba. Sau khi chuyển: x bốn bằng x một cộng x ba, trừ x hai. Kết quả giống nhau nên hai sơ đồ tương đương. Lý do rất đơn giản: phép cộng có tính giao hoán, nên thứ tự cộng trừ không ảnh hưởng đến kết quả."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'>Các phép biến đổi tương đương sơ đồ khối (tt)</div><div class='rb'>Tách 1 bộ tổng thành 2 bộ tổng:</div>${EQV(S(150,80,`<path d='M5 36H53M67 36H140M60 76V43M60 4V29'/>`+SMk(60,36,'#ffd24a')+ARw(140,36)+ARu(60,43)+`<path d='M60 29l-2 -4h4z' transform='rotate(180 60 27)' fill='#111' stroke='none'/>`+TX(3,30,'x₁')+TX(138,30,'x₄')+TX(66,10,'x₃')+TX(66,74,'x₂')+TX(66,52,'−'),'e'),S(150,80,`<path d='M5 36H33M47 36H88M102 36H140M40 76V43M95 4V29'/>`+SMk(40,36,'#ffd24a')+SMk(95,36,'#7aa0ff')+ARw(140,36)+ARu(40,43)+TX(3,30,'x₁')+TX(138,30,'x₄')+TX(100,10,'x₃')+TX(46,74,'x₂')+TX(46,52,'−'),'e'),['x₄ = x₁ − x₂ + x₃','x₄ = (x₁ − x₂) + x₃'])}`,
  speech:"Ngược lại, ta cũng có thể tách một bộ tổng nhiều ngõ vào thành nhiều bộ tổng liên tiếp. Tách một bộ tổng thành hai bộ tổng. Bộ tổng có ba ngõ vào x một, x hai, x ba cho x bốn bằng x một trừ x hai cộng x ba. Có thể tách thành hai bộ tổng nối tiếp: x bốn bằng x một trừ x hai, rồi cộng x ba. Hai sơ đồ này tương đương. Phép biến đổi này giúp ta tách riêng các ngõ vào khi cần di chuyển một nhánh."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb'><u class='r'>Chú ý</u></div><div class='tk'><u class='r'>Không được</u> chuyển vị trí điểm rẽ nhánh và bộ tổng:</div><div class='r3'>${S(130,70,`<path d='M5 36H125M50 66V43M85 6V36'/>`+SMc(50,36)+DT(85,36,'#111')+TX(3,30,'x₁')+TX(112,30,'x₄')+TX(55,64,'x₂')+TX(90,12,'x₃')+XX,'e')}${S(130,70,`<path d='M5 36H125M85 66V43M50 6V36'/>`+SMc(85,36)+DT(50,36,'#111')+TX(3,30,'x₁')+TX(112,30,'x₄')+TX(90,64,'x₂')+TX(55,12,'x₃')+XX,'e')}</div><div class='tk'><u class='r'>Không được</u> chuyển vị trí 2 bộ tổng khi giữa 2 bộ tổng có điểm rẽ nhánh:</div><div style='text-align:center'>${S(130,70,`<path d='M5 36H125M40 66V43M100 66V43M70 36V8'/>`+SMk(40,36,'#7aa0ff')+SMk(100,36,'#a8e05a')+DT(70,36,'#d00')+TX(3,30,'x₁')+TX(112,30,'x₃')+TX(45,64,'x₂')+TX(105,64,'x₃')+TX(76,12,'x₄')+XX,'e')}</div>`,
  speech:"Chú ý. Không được chuyển vị trí điểm rẽ nhánh và bộ tổng, vì tín hiệu tại điểm rẽ nhánh sẽ khác đi. Cũng không được chuyển vị trí hai bộ tổng khi giữa hai bộ tổng có điểm rẽ nhánh. Các em ghi nhớ hai điều cấm này, vì đây là lỗi rất hay gặp khi làm bài tập."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'><u>Thí dụ 1</u></div><div class='rb'>Tính hàm truyền tương đương của hệ thống có sơ đồ khối như sau:</div>${S(330,132,`<path d='M2 62H38M52 62H83M97 62H125M160 62H300M18 62V22H55M85 22H90V55M240 62V91H200M240 91V115H200M160 91H118V97M160 115H118V109M111 103H45V69'/><path d='M45 52Q68 36 90 52' stroke='#e0302f' stroke-dasharray='3 2'/><rect x='108' y='78' width='98' height='50' stroke='#2538d8' stroke-dasharray='3 2'/>`+SMc(45,62)+SMc(90,62)+`<circle cx='118' cy='103' r='6' fill='#fff'/><path d='M115 103h6M118 100v6'/>`+DT(240,62,'#111')+ARw(300,62)+ARw(125,62)+BXs(55,14,30,16,'G₁(s)','#fff')+BXs(125,52,35,20,'G₂(s)','#fff')+BXs(160,82,40,18,'G₃(s)','#fff')+BXs(160,106,40,18,'G₄(s)','#fff')+TX(2,56,'R(s)')+TX(292,56,'Y(s)')+TX(41,46,'①')+TX(86,46,'②')+TX(122,95,'+')+TX(122,119,'−'),'w')}`,
  speech:"Bây giờ ta áp dụng các phép biến đổi vào một số thí dụ. Thí dụ đầu tiên khá đơn giản. Tính hàm truyền tương đương của hệ thống có sơ đồ khối như trên màn hình. Tín hiệu vào R của s đi qua hai bộ tổng đánh số một và hai, có nhánh song song G một, rồi qua khối G hai để ra Y của s. Hồi tiếp lấy từ Y của s qua hai khối G ba và G bốn, cộng lại rồi quay về bộ tổng số một. Các em hãy đọc kỹ sơ đồ trước khi giải: xác định đâu là đường thuận, đâu là các nhánh hồi tiếp."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g' style='text-align:left'><u>Bài giải thí dụ 1</u>: Biến đổi tương đương sơ đồ khối</div><div class='tk'>Chuyển vị trí hai bộ tổng (1) và (2),<br>Rút gọn G<sub>A</sub>(s) = [G<sub>3</sub>(s)//G<sub>4</sub>(s)]</div>${S(330,115,`<path d='M2 65H98M20 65V25H35M70 25H105V58M112 65H148M162 65H185M225 65H320M270 65V95H230M190 95H155V72'/><rect x='10' y='6' width='108' height='76' stroke='#f08a00' stroke-dasharray='3 2'/><rect x='132' y='44' width='154' height='68' stroke='#c0c' stroke-dasharray='3 2'/>`+SMc(105,65)+SMc(155,65)+DT(270,65,'#111')+ARw(185,65)+ARw(320,65)+ARw(148,65)+BXs(35,13,35,24,'G₁(s)','#fff')+BXs(185,53,40,24,'G₂(s)','#fff')+BXs(190,83,40,24,'Gₐ(s)','#fff')+TX(2,59,'R(s)')+TX(298,59,'Y(s)')+TX(100,50,'②')+TX(150,50,'①'),'w')}<div style='text-align:center;margin-top:3cqw'><span class='eqy'>G<sub>A</sub>(s) = G<sub>3</sub>(s) − G<sub>4</sub>(s)</span></div>`,
  speech:"Ta bắt tay vào giải thí dụ một. Mục tiêu của bước đầu là đưa sơ đồ về dạng có các vòng tách biệt, dễ rút gọn. Trước hết chuyển vị trí hai bộ tổng một và hai. Sau đó rút gọn G A của s là G ba song song với G bốn, có hàm truyền G A của s bằng G ba của s trừ G bốn của s. Sau bước này, sơ đồ chỉ còn các khối nối tiếp, song song và một vòng hồi tiếp đơn giản."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g' style='text-align:left'><u>Bài giải thí dụ 1</u>: Biến đổi tương đương sơ đồ khối</div><div class='tk'>G<sub>B</sub>(s) = [G<sub>1</sub>(s)// hàm truyền đơn vị] ,<br>G<sub>C</sub>(s) = vòng hồi tiếp [G<sub>2</sub>(s), G<sub>A</sub>(s)]</div>${S(300,40,`<path d='M2 22H55M105 22H175M225 22H298'/>`+ARw(55,22)+ARw(175,22)+ARw(298,22)+BXs(55,10,50,24,'G<tspan font-size="6" dy="2">B</tspan><tspan dy="-2">(s)</tspan>','#e8e8e8')+BXs(175,10,50,24,'G<tspan font-size="6" dy="2">C</tspan><tspan dy="-2">(s)</tspan>','#e8e8e8')+TX(2,16,'R(s)')+TX(272,16,'Y(s)'),'m')}<div style='margin:1cqw 0'><span class='eqy'>G<sub>B</sub>(s) = 1 + G<sub>1</sub>(s)</span></div><div style='margin:1.5cqw 0'><span class='eqy'>G<sub>C</sub>(s) = ${fr('G<sub>2</sub>(s)','1 + G<sub>2</sub>(s)·G<sub>A</sub>(s)')} = ${fr('G<sub>2</sub>(s)','1 + G<sub>2</sub>(s)·[G<sub>3</sub>(s) − G<sub>4</sub>(s)]')}</span></div><div class='tk'>Hàm truyền tương đương của hệ thống:</div><div class='m' style='margin-left:6cqw'>G<sub>td</sub>(s) = G<sub>B</sub>(s)·G<sub>C</sub>(s)</div><div style='margin-top:1cqw'><span class='eqy eqr'>G<sub>td</sub>(s) = ${fr('[1 + G<sub>1</sub>(s)]·G<sub>2</sub>(s)','1 + G<sub>2</sub>(s)·[G<sub>3</sub>(s) − G<sub>4</sub>(s)]')}</span></div>`,
  speech:"Bây giờ ta rút gọn từng phần theo thứ tự từ trong ra ngoài. G B của s là G một song song với hàm truyền đơn vị, nên G B của s bằng 1 cộng G một của s. G C của s là vòng hồi tiếp gồm G hai và G A, bằng G hai chia một cộng G hai nhân G A, bằng G hai chia một cộng G hai nhân G ba trừ G bốn. Hàm truyền tương đương của hệ thống là G t đ của s bằng G B nhân G C, tức là một cộng G một, nhân G hai, chia một cộng G hai nhân G ba trừ G bốn. Đến đây ta đã có đáp số cho thí dụ một. Các em hãy tự kiểm tra lại từng bước biến đổi."},
 {type:"rich",title:"Đại số sơ đồ khối (tt)",
  html:`<div class='sb g'><u>Thí dụ 2</u></div><div class='rb'>Tính hàm truyền tương đương của hệ thống có sơ đồ khối như sau:</div>${S(360,132,`<path d='M2 70H29M43 70H54M84 70H97M111 70H121M135 70H165M200 70H233M247 70H258M290 70H350M148 70V30H240V63M212 70V95H104V77M305 70V110H128V77M330 70V125H36V77'/><path d='M104 54Q116 40 128 54' stroke='#e0302f' stroke-dasharray='3 2'/>`+SMc(36,70)+SMk(104,70,'#ffd24a')+SMk(128,70,'#ffd24a')+SMc(240,70)+DT(148,70,'#2538d8')+DT(212,70,'#111')+DT(305,70,'#111')+DT(330,70,'#111')+ARw(54,70)+ARw(350,70)+BXs(54,58,30,24,'G₁(s)','#fff')+BXs(165,58,35,24,'G₂(s)','#fff')+BXs(258,58,32,24,'G₃(s)','#fff')+BXs(170,22,35,16,'H₁(s)','#fff')+BXs(140,87,35,16,'H₂(s)','#fff')+BXs(190,102,35,16,'H₃(s)','#fff')+TX(2,64,'R(s)')+TX(334,64,'Y(s)')+TX(32,56,'①')+TX(100,56,'②')+TX(124,56,'③')+TX(144,56,'④')+TX(208,56,'⑤')+TX(236,56,'⑥')+TX(301,56,'⑦'),'w')}`,
