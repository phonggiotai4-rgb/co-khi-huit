<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vật lý kỹ thuật – Chương 3: Ánh sáng và Quang học</title>
<style>
:root{--bg:#eef1ee;--ink:#1f2a24;--green:#31644f;--blue:#1f4e8c;--gold:#b8a916;--panel:#fff;--btn:#fff;--line:#c9d2cc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191a;--ink:#e8eee9;--btn:#232a2b;--line:#3a4546}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.player{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.stage{aspect-ratio:4/3;background:var(--green);border-radius:20px;padding:3.2%;position:relative;container-type:inline-size}
.panel{background:var(--panel);color:#1f2a24;border-radius:16px;height:72%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:4%}
.chap{font-size:4cqw;font-weight:700;color:var(--blue);text-decoration:underline;margin-bottom:2cqw}
.ttl{font-size:6.2cqw;font-weight:700;font-style:italic;color:var(--blue);line-height:1.25}
.panel ul{text-align:left;font-size:4cqw;line-height:1.6;margin:0;color:#1f2a24}
.panel h2{font-size:5cqw;color:var(--blue);margin:0 0 2cqw}
.bar{height:5%;background:var(--gold);border-radius:8px;margin-top:3%}
.logo{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);background:#fff;color:#1f4e8c;font-weight:800;font-size:2.6cqw;padding:.8cqw 2.4cqw;border-radius:6px}
.stage.content{background:#fff;border:3px solid var(--green);padding:0}
.stage.content .bar,.stage.content .logo{display:none}
.stage.content .panel{height:100%;background:#fff;border-radius:0;padding:0;position:relative;align-items:stretch;justify-content:flex-start;text-align:left}
.msil{position:absolute;top:2.5cqw;left:4cqw;width:15cqw;height:auto}
.mtitle{font-size:4.8cqw;font-weight:700;font-style:italic;color:var(--blue);text-align:right;padding:4cqw 4.5cqw 0 0}
.mline{height:2px;background:var(--gold);margin:1.8cqw 3cqw 8cqw}
.mi{font-size:2.7cqw;font-weight:700;padding:1.3cqw 2cqw;border-radius:6px;margin:0 17cqw 2.7cqw;color:#111}
.mline.s{margin:10.5cqw 3cqw 0}
.mcen{position:absolute;left:0;right:0;top:40%;display:flex;justify-content:center}
.mi.sec{margin:0;font-size:3.2cqw;color:#e00000;padding:1.2cqw 2.6cqw}
.mfoot{position:absolute;bottom:1.6cqw;left:0;right:0;text-align:center;font-size:1.7cqw;color:#3a5fa0}
.mnum{position:absolute;bottom:1.6cqw;right:4cqw;font-size:1.9cqw;color:#222}
.m0{background:linear-gradient(90deg,#f6f1d0,#b8a916)}
.m1{background:linear-gradient(90deg,#f1f8ee,#8fcf86)}
.m2{background:linear-gradient(90deg,#eef3f3,#b3c6c9)}
.fade{animation:f .4s ease}@keyframes f{from{opacity:0}to{opacity:1}}
button,select{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer}
.note{font-size:13px;opacity:.7;margin-top:10px}
.player{position:relative}
.vp{position:relative;width:100%;border-radius:20px;overflow:hidden;container-type:inline-size;background:#000}
.vp .stage{border-radius:0}
.player:fullscreen,.player:-webkit-full-screen{background:#000;display:flex;align-items:center;justify-content:center}
.player:fullscreen .vp,.player:-webkit-full-screen .vp{width:min(100vw,calc(100vh*4/3));border-radius:0}
.player:not(.show){cursor:none}
#stage{cursor:pointer}
.cap{position:absolute;left:50%;bottom:17%;transform:translateX(-50%);max-width:88%;width:max-content;background:rgba(8,8,8,.78);color:#fff;font-size:clamp(12px,2.5cqw,26px);line-height:1.45;padding:.25em .6em;border-radius:4px;text-align:center;pointer-events:none;transition:bottom .2s}
.player:not(.show) .cap{bottom:5%}
.cap.off{display:none}
.yt{position:absolute;left:0;right:0;bottom:0;padding:28px 12px 4px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;transition:opacity .2s}
.player:not(.show) .yt{opacity:0;pointer-events:none}
.prog{display:flex;gap:2px}
.seg{flex:1;height:16px;position:relative;cursor:pointer}
.seg::before{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;background:rgba(255,255,255,.3);border-radius:2px;transition:height .1s,margin .1s}
.seg.done::before{background:#f00}
.prog:hover .seg::before{height:5px;margin-top:-2.5px}
.yrow{display:flex;align-items:center;justify-content:space-between}
.yl,.yr{display:flex;align-items:center;gap:2px}
.yt button{background:none;border:0;color:#fff;padding:0;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;opacity:.92;position:relative}
.yt button:hover{background:rgba(255,255,255,.18);opacity:1}
.yt button:disabled{opacity:.35;background:none}
.yt svg{width:26px;height:26px;fill:currentColor}
.time{font-size:13px;margin-left:8px;white-space:nowrap}
#cc.on::after{content:"";position:absolute;left:8px;right:8px;bottom:5px;height:3px;background:#f00;border-radius:2px}
.menu{position:absolute;right:12px;bottom:58px;width:270px;background:rgba(28,28,28,.95);border-radius:12px;padding:8px 0;font-size:13px;display:none}
.menu.open{display:block}
.menu label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px}
.menu select{max-width:150px;background:#333;color:#fff;border:1px solid #555;padding:4px 6px;border-radius:6px;font-size:13px}
.menu input[type=range]{width:100px}
.player.pfs{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center}
.player.pfs .vp{width:min(100vw,calc(100dvh*4/3));border-radius:0}
@media (hover:none){.note{display:none}}
@media (max-width:700px) and (orientation:portrait){
  .wrap{padding:8px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
  .player:not(.isfs) .vp{overflow:visible;border-radius:0;background:none}
  .player:not(.isfs) .vp .stage{border-radius:12px 12px 0 0}
  .player:not(.isfs) .cap{position:static;transform:none;width:auto;max-width:none;border-radius:0;background:#1c1c1c;font-size:15px;padding:10px 14px;text-align:left;pointer-events:auto}
  .player:not(.isfs) .yt{position:relative;padding:2px 6px 6px;background:#111;border-radius:0 0 12px 12px}
  .player:not(.isfs):not(.show) .yt{opacity:1;pointer-events:auto}
  .player:not(.isfs) .seg{height:26px}
  .player:not(.isfs) .menu{bottom:100%;right:6px;margin-bottom:6px;width:min(300px,calc(100vw - 28px))}
  .yt button{width:44px;height:44px}
  .yt svg{width:28px;height:28px}
  .menu label{padding:12px 16px;font-size:15px}
  .menu select{font-size:16px;max-width:160px;padding:6px}
  .menu input[type=range]{width:110px}
  .menu input[type=checkbox]{width:22px;height:22px}
}
@media (orientation:landscape) and (max-height:500px){
  .wrap{padding:8px}
  .player:not(.isfs) .vp{width:min(100%,calc((100dvh - 16px)*4/3));margin:0 auto}
}

/* ===== Phong cách Quang học: nền tối, lăng kính, dải quang phổ ===== */
:root{--blue:#2a3b9e}
.stage{background:radial-gradient(120% 90% at 20% 10%,#1d2a7a 0%,#0b1230 60%,#050816 100%)}
.panel{background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 0 6cqw rgba(120,160,255,.25)}
.stage.content{border-color:#0b1230}
.stage.content .panel{background:#fff;color:#1f2a24;border:0;box-shadow:none}
.chap{color:#ffd166;text-decoration:none;letter-spacing:.4cqw}
.ttl{color:#fff;font-style:normal;text-shadow:0 0 3cqw rgba(140,180,255,.8)}
.panel ul{color:#e8ecff}.panel h2{color:#ffd166}
.bar{background:linear-gradient(90deg,#ff3b3b,#ff9f1c,#ffe14d,#3ddc84,#2ec4ff,#4f5bff,#a259ff)}
.mline{background:linear-gradient(90deg,#ff9f1c,#3ddc84,#2ec4ff,#a259ff)}
.m0{background:linear-gradient(90deg,#fff4d6,#ffb347)}
.m1{background:linear-gradient(90deg,#e6f7ff,#5ec8ff)}
.m2{background:linear-gradient(90deg,#efe6ff,#a78bfa)}
.prism{width:48cqw;height:auto;margin-bottom:2cqw}

/* ===== Slide nội dung (nền sáng) theo chủ đề Quang học ===== */
.stage.content{border:3px solid #0b1230}
.stage.content .panel{background:linear-gradient(160deg,#f7faff 0%,#eaf1ff 55%,#f4eeff 100%);counter-reset:c;overflow:hidden}
.stage.content .panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1.4cqw;background:linear-gradient(180deg,#ff3b3b,#ff9f1c,#ffe14d,#3ddc84,#2ec4ff,#4f5bff,#a259ff)}
.stage.content .panel::after{content:"";position:absolute;right:-8cqw;top:-8cqw;width:34cqw;height:34cqw;border-radius:50%;background:radial-gradient(circle,rgba(79,91,255,.14),transparent 70%);pointer-events:none}
.mtitle{color:#1b2a7a;font-style:normal;letter-spacing:.2cqw}
.mline{height:3px;background:linear-gradient(90deg,#ff9f1c,#3ddc84,#2ec4ff,#a259ff,transparent)}
.mi:not(.sec){color:#0b1230;border-radius:999px;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.12)}
.mi:not(.sec)::before{counter-increment:c;content:counter(c);display:inline-block;width:3.6cqw;height:3.6cqw;line-height:3.6cqw;text-align:center;border-radius:50%;background:#0b1230;color:#ffd166;margin-right:1.6cqw;font-size:2.2cqw}
.panel>.mi:nth-child(4){background:linear-gradient(90deg,#ffe1dc,#ff7a6b)}
.panel>.mi:nth-child(5){background:linear-gradient(90deg,#fff0c4,#ffc83d)}
.panel>.mi:nth-child(6){background:linear-gradient(90deg,#dcf7e3,#5fd68a)}
.panel>.mi:nth-child(7){background:linear-gradient(90deg,#d9f0ff,#4cb8ff)}
.panel>.mi:nth-child(8){background:linear-gradient(90deg,#e6e0ff,#8f7bff)}
.mfoot{color:#1b2a7a}

.mtitle.o{font-size:4cqw;padding-top:3.4cqw}
.mline.o{margin:1.2cqw 3cqw 2.4cqw}
.ocols{display:flex;gap:2.2cqw;padding:0 4cqw 0 4.2cqw}
.ocol{flex:1;min-width:0}
.oc{border-left:.9cqw solid var(--c);background:#fff;border-radius:1.2cqw;padding:.9cqw 1.6cqw;margin-bottom:1.5cqw;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.12)}
.oc b{display:block;font-size:2.35cqw;color:#0b1230;line-height:1.3}
.oart{margin:1.2cqw 0 .4cqw;padding:0 1cqw}.oart svg{display:block;width:100%;height:auto}
.oc span{display:block;font-size:2cqw;color:#2a3560;line-height:1.5;padding-left:1.4cqw}

.mtitle.o.t3{font-size:3.4cqw}
.tbody{display:flex;gap:3cqw;padding:0 4cqw 0 4.5cqw;align-items:flex-start}
.tcol{flex:1.4;min-width:0;color:#0b1230}
.tsub{font-size:3cqw;font-weight:700;color:#1b2a7a;margin:0 0 1cqw}
.tlead{font-size:2.5cqw;font-weight:700;color:#d4572a;margin:0 0 .8cqw}
.panel ul.tl{margin:0;padding-left:3cqw;font-size:2.5cqw;line-height:1.5;color:#1f2a4d}
.tl li{margin-bottom:.9cqw}.tl li::marker{color:#ff9f1c}
.tf{margin-top:1.2cqw;text-align:center;font-size:3.6cqw;font-weight:700;color:#d4572a;background:#fff;border-radius:1.2cqw;padding:.8cqw;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.12)}
.tfig{flex:1;background:#fff;border-radius:1.6cqw;padding:1.2cqw;border:1px solid #d6def5;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.12)}
.tfig svg{width:100%;height:auto;display:block}

.tbody.w .tcol{flex:1}.tbody.w .tfig{flex:1.4}
.tprob{font-size:2.7cqw;line-height:1.6;color:#0b1230;background:#fff;border-left:1cqw solid #ff9f1c;border-radius:1.2cqw;padding:1.6cqw 2cqw;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.12)}

.tbody.w2 .tcol{flex:1.7}.tbody.w2 .tfig{flex:1}
.tsteps{display:flex;flex-direction:column;gap:1cqw;counter-reset:st}
.tstep{display:flex;gap:1.4cqw;align-items:center;background:#fff;border-radius:1.2cqw;padding:.8cqw 1.4cqw;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.12)}
.tstep i{counter-increment:st;flex:none;width:3.4cqw;height:3.4cqw;border-radius:50%;background:#0b1230;color:#ffd166;font-style:normal;text-align:center;line-height:3.4cqw;font-size:2cqw;font-weight:700}
.tstep i::before{content:counter(st)}
.tstep b{display:block;font-size:2.05cqw;color:#1b2a7a;line-height:1.3}
.tstep span{display:block;font-size:2.4cqw;color:#d4572a;font-weight:700;line-height:1.35}
.tstep .fr{display:inline-flex;font-size:inherit;color:inherit;font-weight:inherit;line-height:1.2}
.tstep .fr>span{display:block;font-size:inherit;color:inherit;font-weight:inherit;line-height:1.2}
.tstep .rt,.tstep .rr{display:inline;font-size:inherit;color:inherit;font-weight:inherit;line-height:inherit}
.tstep .rr{display:inline-block;line-height:1.2}
.tf.ans{margin-top:1cqw;font-size:2.8cqw}

.tl li em,.tprob em{color:#d4572a;font-style:normal;font-weight:700}
.mv{font-style:italic;font-family:"Cambria Math","STIX Two Text","Times New Roman",serif;font-weight:inherit}
sub,sup{font-size:.68em;line-height:0}
.rt{white-space:nowrap}.rr{border-top:.22cqw solid currentColor;padding:0 .3cqw;margin-left:.15cqw}
.tl .fr,.tstep .fr,.tprob .fr,.tb .fr,.opt .fr{font-size:.92em;margin:0 .25cqw}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .5cqw;line-height:1.25}
.fr>span:first-child{border-bottom:.25cqw solid currentColor;padding:0 .6cqw}
.tf small{font-size:2.4cqw;margin-left:1.5cqw;font-weight:400}

.tb{font-size:2.5cqw;line-height:1.55;color:#1f2a4d;background:#fff;border-left:1cqw solid #ff9f1c;border-radius:1.2cqw;padding:.7cqw 1.6cqw;margin-bottom:1.1cqw;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.12)}
.tb em{color:#d4572a;font-style:normal;font-weight:700}
.tb sub{font-size:.7em}

.tbubs{display:flex;gap:3cqw;margin:1.4cqw 0 2.4cqw 1cqw}
.bub{position:relative;background:#fff;border:.28cqw solid #c0504d;border-radius:3cqw;padding:1cqw 2.4cqw;font-size:2.6cqw;font-weight:700;color:#1b2a7a}
.bub::before{content:"";position:absolute;left:2.2cqw;bottom:-1.5cqw;border:.9cqw solid transparent;border-top:1.5cqw solid #c0504d;border-bottom:0}
.bub::after{content:"";position:absolute;left:2.4cqw;bottom:-1cqw;border:.7cqw solid transparent;border-top:1.1cqw solid #fff;border-bottom:0}
.bub sub{font-size:.7em}

.tprob.sm{font-size:2.15cqw;line-height:1.5;padding:1.1cqw 1.8cqw;margin-bottom:1.1cqw}
.tprob ol{margin:.3cqw 0 0;padding-left:3cqw}
.tsol{background:#fff;border-radius:1.2cqw;padding:.4cqw 1.6cqw;border:1px solid #d6def5;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.12)}
.sr{display:flex;gap:1.4cqw;align-items:center;padding:.6cqw 0;border-top:1px dashed #cbd5ee}
.sr:first-child{border-top:0}
.sr>b{flex:none;width:12cqw;font-size:1.9cqw;color:#1b2a7a;line-height:1.3}
.sr>div{font-size:2.1cqw;line-height:1.5;color:#0b1230}
.sr mark{background:#f2ea9a;padding:0 .5cqw;font-weight:700;border-radius:.4cqw}

.tbody:not(.w):not(.w2) .tprob{font-size:3.1cqw}
.topts{display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw;margin-top:2cqw}
.opt{display:flex;align-items:center;gap:1.8cqw;background:#fff;border-radius:1.4cqw;padding:1.3cqw 2cqw;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.12);font-size:3.1cqw;font-weight:600;color:#0b1230}
.opt i{flex:none;width:5cqw;height:5cqw;border-radius:50%;line-height:5cqw;text-align:center;font-style:normal;font-weight:800;color:#fff;font-size:2.8cqw}
.opt:nth-child(1) i{background:#ff5a4d}.opt:nth-child(2) i{background:#f2a900}.opt:nth-child(3) i{background:#2bb673}.opt:nth-child(4) i{background:#4f5bff}

.tb .ctr{display:block;text-align:center;font-size:3cqw;font-weight:700}
.tright{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.6cqw}
.tbody .tright .tfig{flex:none}
.tnote{position:relative;background:linear-gradient(160deg,#ffd9a3,#ffb04d);border:.28cqw solid #c0504d;border-radius:3cqw;padding:1.2cqw 2cqw;font-size:2.25cqw;line-height:1.45;font-style:italic;font-weight:600;color:#3a1a0a;box-shadow:0 .4cqw 1.2cqw rgba(30,40,120,.15)}
.tnote em{color:#b3261e;font-style:normal;font-weight:800}

/* --- nâng cấp giao diện --- */
.tl li{line-height:1.5}
.tl li::marker{font-size:1.15em}
.tl li:nth-child(5n+1)::marker{color:#ff5a4d}.tl li:nth-child(5n+2)::marker{color:#ff9f1c}.tl li:nth-child(5n+3)::marker{color:#2bb673}.tl li:nth-child(5n+4)::marker{color:#2ec4ff}.tl li:nth-child(5n+5)::marker{color:#8f7bff}
.tfig{background:linear-gradient(180deg,#fff,#f5f8ff);border-radius:2cqw;padding:1.6cqw;box-shadow:0 .6cqw 2cqw rgba(30,40,120,.16)}
.tb,.tstep,.opt{box-shadow:0 .5cqw 1.6cqw rgba(30,40,120,.14)}
.tb{border-left-width:.9cqw;border-radius:1.4cqw}
.tbody{transform-origin:top left}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* hiệu ứng slide 3 */
.a-wave{animation:wvmove 2.4s linear infinite}
@keyframes wvmove{to{transform:translateX(80px)}}
.a-arrow{animation:arrowpulse 1.6s ease-in-out infinite}
@keyframes arrowpulse{0%,100%{opacity:.35}50%{opacity:1}}
.a-ph{animation:phfly 3.2s linear infinite;opacity:0}
@keyframes phfly{0%{transform:translateX(0);opacity:0}8%{opacity:1}45%{transform:translateX(128px);opacity:1}46%,100%{transform:translateX(128px);opacity:0}}
.a-el{animation:eljump 3.2s ease-out infinite;opacity:0}
@keyframes eljump{0%,44%{transform:translate(0,0);opacity:0}46%{opacity:1}100%{transform:translate(-46px,30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.a-ph{opacity:1}.a-el{opacity:1;transform:translate(-30px,20px)}}

/* hiệu ứng slide 76 */
.a-flow{stroke-dasharray:7 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
.a-lens{transform-origin:150px 110px;animation:accom 3.6s ease-in-out infinite}
@keyframes accom{0%,100%{transform:scale(1,1)}50%{transform:scale(1.45,1.08)}}
.a-img{animation:imgpulse 1.8s ease-in-out infinite}
@keyframes imgpulse{0%,100%{opacity:.45}50%{opacity:1}}

/* hiệu ứng slide 77, 79, 80 */
.a-bt{animation:aptop 3.4s ease-in-out infinite}.a-bb{animation:apbot 3.4s ease-in-out infinite}
@keyframes aptop{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
@keyframes apbot{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.a-cam{animation:camlight 3.4s ease-in-out infinite}
@keyframes camlight{0%,100%{opacity:1}50%{opacity:.3}}
.a-star{animation:twinkle 1.6s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.55;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}

/* hiệu ứng slide 17, 18 */
.t-inc,.t-ref,.t-rfr{transform-origin:160px 120px}

.t-ref{animation:tref 10s linear infinite}

.t-rfr{animation:trfr 10s linear infinite}
@keyframes trfr{0%{transform:rotate(15.1deg);opacity:1}8.33%{transform:rotate(22.8deg)}16.67%{transform:rotate(30.9deg)}25%{transform:rotate(39.3deg)}33.33%{transform:rotate(48.6deg)}41.67%{transform:rotate(59.4deg)}46.67%{transform:rotate(67.4deg)}50%{transform:rotate(74.6deg)}51.67%{transform:rotate(79.8deg)}53%{transform:rotate(90deg);opacity:1}54%{transform:rotate(90deg);opacity:0}100%{transform:rotate(90deg);opacity:0}}

@keyframes tl2{0%,46%{opacity:0}49%,57%{opacity:1}60%,100%{opacity:0}}
@keyframes tl3{0%,58%{opacity:0}62%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.t-l1{opacity:1}.t-rfr{transform:rotate(30.9deg)}.t-inc{transform:rotate(20deg)}.t-ref{transform:rotate(-20deg)}}
.a-dot{animation:dotrun 3.2s linear infinite;offset-rotate:0deg}

@keyframes rip{0%{opacity:1;transform:scale(1)}18%{opacity:0;transform:scale(3.2)}100%{opacity:0;transform:scale(3.2)}}

/* ===== Hiệu ứng cho slide ===== */
.stage{overflow:hidden}
/* 1. Chuyển slide: trượt nhẹ từ phải vào, hiện dần */
.panel.fade{animation:ax-slide .55s cubic-bezier(.22,.8,.3,1) both}

@keyframes ax-down{from{opacity:0;transform:translateY(-4cqw)}to{opacity:1;transform:none}}

.ttl.ax-down{animation:ax-down .7s cubic-bezier(.22,.8,.3,1) var(--d,0s) both,ax-glow 3.2s ease-in-out calc(var(--d,0s) + 1s) infinite}

 0%,100%{text-shadow:0 0 3cqw rgba(140,180,255,.8)}
 50%{text-shadow:0 0 5.5cqw rgba(175,205,255,1),0 0 1.4cqw rgba(255,255,255,.55)}}

.stage.content .panel::before{transform-origin:top;animation:ax-grow-y .9s cubic-bezier(.3,.7,.3,1) .15s both}

.ax-card{animation:ax-rise .55s cubic-bezier(.2,.8,.25,1) var(--d,0s) both}

/* slide 38: sóng E, B lan truyền từ O sang M (chu kỳ dịch đúng 1 bước sóng = 90 nên lặp liền mạch) */

@keyframes e-draw{from{stroke-dasharray:100;stroke-dashoffset:100}to{stroke-dasharray:100;stroke-dashoffset:0}}
@keyframes e-shimmer{0%,100%{opacity:.7}50%{opacity:1}}

  animation:e-pop .8s cubic-bezier(.2,.9,.3,1.2) var(--d,0s) both,e-wave 3.4s ease-in-out calc(var(--d,0s) + 1.3s) infinite}
@keyframes e-pop{from{opacity:0;transform:translateY(6cqw) scale(.4) rotate(-14deg)}60%{opacity:1;transform:translateY(-1cqw) scale(1.12) rotate(2deg)}to{opacity:1;transform:none}}

.e-sp{position:absolute;width:var(--z,1cqw);height:var(--z,1cqw);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff 0,rgba(255,255,255,.75) 30%,rgba(255,255,255,0) 70%);

@keyframes e-tw{0%,100%{opacity:.1}50%{opacity:1}}

/* ===== Trắc nghiệm: đồng hồ đếm ngược ===== */
.qtimer{position:absolute;left:23cqw;top:1.3cqw;width:7.4cqw;height:7.4cqw;cursor:pointer;z-index:3;filter:drop-shadow(0 .4cqw .8cqw rgba(30,40,120,.25))}

.qtimer .bg{fill:#fff;stroke:#dfe6ff;stroke-width:3.4}
.qtimer .fg{fill:none;stroke:#4f5bff;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;transition:stroke-dashoffset .12s linear,stroke .3s}
.qtimer b{position:absolute;inset:0;display:grid;place-items:center;font-size:3.2cqw;color:#1b2a7a;font-weight:800}
.qtimer.low .fg{stroke:#ff3b3b}
.qtimer.low b{color:#e5322d;animation:qpulse 1s ease-in-out infinite}
.qtimer.up{animation:qshake .5s}
.qtimer.up .fg{stroke:#ff3b3b}
@keyframes qpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes qshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-.6cqw)}40%{transform:translateX(.6cqw)}60%{transform:translateX(-.4cqw)}80%{transform:translateX(.4cqw)}}
/* ===== Trắc nghiệm: khoảnh khắc đáp án (slide lời giải) ===== */
.sopts{gap:1cqw;margin-top:1.2cqw}
.sopts .opt{font-size:1.75cqw;line-height:1.3;padding:.7cqw 1.1cqw;gap:1cqw;position:relative;
  transition:opacity .7s ease,filter .7s ease,transform .6s cubic-bezier(.2,.9,.3,1.2),box-shadow .6s ease,background-color .6s ease}
.sopts .opt i{width:3cqw;height:3cqw;line-height:3cqw;font-size:1.7cqw}
.sopts .opt::after{content:"✓";margin-left:auto;padding-left:.6cqw;font-size:2.6cqw;font-weight:800;color:#1c9a5b;opacity:0;transform:scale(.3);transition:opacity .4s .25s,transform .5s .25s cubic-bezier(.2,.9,.3,1.6)}

.sopts.rev .opt.ok{background-color:#e8fff2;transform:scale(1.035);z-index:1;box-shadow:0 0 0 .35cqw #2bb673,0 0 3cqw rgba(43,182,115,.65)}
.sopts.rev .opt.ok::after{opacity:1;transform:scale(1)}
.sopts.rev .opt.ok{animation:qok 1.1s ease-out}
@keyframes qok{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){.sopts .opt,.sopts .opt::after,.qtimer .fg{transition:none!important}.qtimer.up,.qtimer.low b{animation:none!important}}

@keyframes m-cos{0%{transform:scaleY(1.0)}5%{transform:scaleY(0.9877)}10%{transform:scaleY(0.9511)}15%{transform:scaleY(0.891)}20%{transform:scaleY(0.809)}25%{transform:scaleY(0.7071)}30%{transform:scaleY(0.5878)}35%{transform:scaleY(0.454)}40%{transform:scaleY(0.309)}45%{transform:scaleY(0.1564)}50%{transform:scaleY(0.0)}55%{transform:scaleY(0.1564)}60%{transform:scaleY(0.309)}65%{transform:scaleY(0.454)}70%{transform:scaleY(0.5878)}75%{transform:scaleY(0.7071)}80%{transform:scaleY(0.809)}85%{transform:scaleY(0.891)}90%{transform:scaleY(0.9511)}95%{transform:scaleY(0.9877)}100%{transform:scaleY(1.0)}}
@keyframes m-c2{0%{opacity:1.0}5%{opacity:0.9755}10%{opacity:0.9045}15%{opacity:0.7939}20%{opacity:0.6545}25%{opacity:0.5}30%{opacity:0.3455}35%{opacity:0.2061}40%{opacity:0.0955}45%{opacity:0.0245}50%{opacity:0.0}55%{opacity:0.0245}60%{opacity:0.0955}65%{opacity:0.2061}70%{opacity:0.3455}75%{opacity:0.5}80%{opacity:0.6545}85%{opacity:0.7939}90%{opacity:0.9045}95%{opacity:0.9755}100%{opacity:1.0}}

<script>

  [{c:"#ff5a4d",h:"3.1. Định luật phản xạ và khúc xạ ánh sáng",sub:["3.1.1. Định luật phản xạ","3.1.2. Định luật khúc xạ","Phản xạ toàn phần"]},
   {c:"#ffa726",h:"3.2. Sự giao thoa ánh sáng",sub:["3.2.1. Điều kiện giao thoa","3.2.2. GT khe Young","3.2.3. GT bản mỏng (Lloyd, Newton)","3.2.4. Ứng dụng (chống phản xạ, CD)"]},
   {c:"#f2c200",h:"3.3. Sự nhiễu xạ ánh sáng",sub:["3.3.1. Khái niệm","3.3.2. Nhiễu xạ khe hẹp","3.3.3. Nhiễu xạ cách tử"]}],
  [{c:"#3ddc84",h:"3.4. Sự phân cực ánh sáng",sub:["Ánh sáng tự nhiên, ánh sáng phân cực","Định luật Malus","Ứng dụng: phản xạ, tán xạ, tinh thể lỏng"]},
   {c:"#2ec4ff",h:"3.5. Các dụng cụ quang học",sub:["Mắt, Camera, kính hiển vi, kính thiên văn"]},
   {c:"#8f7bff",h:"3.6. Đọc thêm",sub:["Màu sắc, quang sai, giao thoa kế Michelson"]}]],
  speech:"Đây là bản đồ của cả chương, gồm sáu phần. Phần một là phản xạ và khúc xạ: ánh sáng đổi hướng thế nào khi gặp mặt phân cách, kể cả hiện tượng phản xạ toàn phần. Phần hai là giao thoa, từ khe Young, màng mỏng, vân tròn Newton, đến ứng dụng như kính chống phản xạ và đĩa CD. Phần ba là nhiễu xạ: ánh sáng đi qua khe hẹp và cách tử. Phần bốn là phân cực, cùng định luật Malus và các ứng dụng như kính râm hay màn hình LCD. Phần năm là những dụng cụ quen thuộc: mắt, máy ảnh, kính hiển vi, kính thiên văn. Cuối cùng là phần đọc thêm về màu sắc, quang sai và giao thoa kế Michelson."},
 {type:"outline",title:"Lưỡng tính sóng – hạt của ánh sáng",cols:[
   [{c:"#ff5a4d",art:"wave3",h:"Tính chất SÓNG",sub:["Biểu hiện rõ trong các hiện tượng liên quan tới sự lan truyền của nó (giao thoa, nhiễu xạ, phản xạ, khúc xạ...), nghiên cứu với lý thuyết sóng."]}],
   [{c:"#2ec4ff",art:"photon3",h:"Tính chất HẠT",sub:["Biểu hiện rõ trong sự tương tác giữa ánh sáng với vật chất (quang hiệu ứng, hấp thụ...), khảo sát chủ yếu với quan điểm thuyết photon."]}]],
  speech:"Trước khi vào bài, có một ý rất thú vị: ánh sáng có hai bộ mặt, vừa như sóng, vừa như hạt. Khi ánh sáng lan truyền, ta thấy giao thoa, nhiễu xạ, phản xạ, khúc xạ, thì cứ xem nó là sóng. Còn khi ánh sáng tác dụng lên vật chất, như hiệu ứng quang điện hay sự hấp thụ, thì ta xem nó là những hạt gọi là photon. Trong chương này, chúng ta chủ yếu nhìn ánh sáng như một sóng."},
 {type:"text",title:"Cơ sở của quang học sóng",w2:true,
  items:["**Quang học sóng:** nghiên cứu về bản chất, sự lan truyền và tương tác của ánh sáng với môi trường vật chất dựa trên cơ sở tính chất sóng của ánh sáng.","**Quang lộ** của ánh sáng trong thời gian t là quãng đường ánh sáng truyền được trong chân không trong khoảng thời gian đó:"],
  blocks:['<span class="ctr"><em>L = c·t</em></span>','Trong môi trường đồng tính có chiết suất <em>n</em>, ta có:'],
  fhtml:'c = n·v = n·<span class="fr"><span>s</span><span>t</span></span>',art:"ab",
  speech:"Bây giờ là nền tảng của quang học sóng. Quang học sóng đơn giản là nghiên cứu ánh sáng như một sóng: nó lan truyền ra sao và tác dụng với vật chất thế nào. Ta cần một khái niệm mới là quang lộ. Quang lộ L là quãng đường ánh sáng đi được trong chân không, trong cùng khoảng thời gian t. Nên L bằng c nhân t. Trong môi trường có chiết suất n, ánh sáng đi chậm hơn, vận tốc chỉ còn v, và c bằng n nhân v. Gọi s là quãng đường thật sự trong môi trường, thì v bằng s chia t, nên c bằng n nhân s chia t. Hiểu nôm na: quang lộ bằng chiết suất nhân quãng đường thật."},
 {type:"text",title:"3.1. Định luật phản xạ và khúc xạ ánh sáng",sub:"3.1.1. Định luật phản xạ",lead:"Phản xạ ánh sáng xảy ra:",
  items:["Khi chiếu ánh sáng từ một MT tới một bề mặt nhẵn phẳng, ánh sáng bị quay trở lại MT cũ.","Tia phản xạ nằm trong mp chứa tia tới và đường pháp tuyến của bề mặt tại điểm tới.","Góc phản xạ luôn luôn bằng góc tới"],
  formula:"θ′₁ = θ₁",art:"reflect",
  speech:"Phần đầu tiên là định luật phản xạ. Khi ánh sáng gặp một bề mặt nhẵn phẳng, nó bật ngược lại môi trường cũ, giống như quả bóng nảy lên khỏi mặt sàn. Có hai điều cần nhớ. Một: tia phản xạ nằm cùng mặt phẳng với tia tới và pháp tuyến, tức là đường vuông góc với bề mặt tại điểm tới. Hai: góc phản xạ luôn bằng góc tới."},
 {type:"text",title:"Định luật phản xạ",wide:true,
  body:"Hai gương tạo với nhau góc 120°. Tia tới trên gương M₁ hợp với pháp tuyến góc 65°. Tìm góc của tia phản xạ cuối cùng trên gương M₂ với pháp tuyến.",
  art:"mirrors",
  speech:"Giờ thử áp dụng nhé. Hai gương đặt hợp nhau một góc một trăm hai mươi độ. Tia sáng tới gương M một, hợp với pháp tuyến góc sáu mươi lăm độ. Câu hỏi: sau khi phản xạ lần lượt trên hai gương, tia ra cuối cùng hợp với pháp tuyến của gương M hai một góc bao nhiêu? Các bạn thử nghĩ trước, rồi mình cùng xem lời giải."},
 {type:"text",title:"Định luật phản xạ – Lời giải",w2:true,
  steps:[{h:"Phản xạ tại gương M₁",f:"θref = θinc = 65°"},
         {h:"Góc giữa tia phản xạ và mặt gương M₁",f:"φ = 90° − 65° = 25°"},
         {h:"Xét tam giác tạo bởi M₁, M₂ và tia phản xạ",f:"α = 180° − 120° − 25° = 35°"},
         {h:"Góc tới trên M₂ (so với pháp tuyến)",f:"βinc = 90° − α = 90° − 35° = 55°"},
         {h:"Phản xạ tại gương M₂",f:"βref = βinc = 55°"}],
  answer:"Đáp số: βref = 55°",art:"mirrors",
  speech:"Mình đi từng bước nhé. Bước một: ở gương M một, góc phản xạ bằng góc tới, tức sáu mươi lăm độ. Bước hai: tia phản xạ hợp với mặt gương một góc chín mươi trừ sáu mươi lăm, bằng hai mươi lăm độ. Bước ba: hai gương và tia phản xạ tạo thành một tam giác, ba góc cộng lại bằng một trăm tám mươi độ. Nên góc còn lại là một trăm tám mươi trừ một trăm hai mươi trừ hai mươi lăm, bằng ba mươi lăm độ. Bước bốn: góc này cộng với góc tới trên gương M hai tạo thành góc vuông, nên góc tới là chín mươi trừ ba mươi lăm, bằng năm mươi lăm độ. Bước năm: góc phản xạ bằng góc tới. Vậy đáp số là năm mươi lăm độ."},
 {type:"text",title:"3.1. Định luật phản xạ và khúc xạ ánh sáng",sub:"3.1.2. Định luật khúc xạ",w2:true,
  items:["Khi một tia sáng lan truyền trong một MT trong suốt đến gặp **mpc** với một MT trong suốt khác thì một phần **tia tới** bị bẻ cong và đi vào MT thứ hai.","Tia khúc xạ **cùng mp** và ở phía **bên kia pháp tuyến** so với tia tới","Góc khúc xạ phụ thuộc vào **môi trường và góc tới**."],
  fhtml:'<span class="fr"><span>sinθ₂</span><span>sinθ₁</span></span> = <span class="fr"><span>v₂</span><span>v₁</span></span> <small>(1)</small>',art:"refract",
  speech:"Tiếp theo là khúc xạ. Khi ánh sáng đi từ môi trường trong suốt này sang môi trường trong suốt khác, một phần ánh sáng bị bẻ cong khi đi vào môi trường thứ hai. Bạn nhúng chiếc đũa vào cốc nước sẽ thấy đũa như bị gãy, đó chính là khúc xạ. Ba điều cần nhớ: tia khúc xạ nằm cùng mặt phẳng với tia tới, nằm ở phía bên kia pháp tuyến, và góc khúc xạ phụ thuộc vào môi trường cũng như góc tới. Công thức một: sin theta hai chia sin theta một bằng v hai chia v một. Nghĩa là góc bị bẻ nhiều hay ít là do ánh sáng chạy nhanh chậm khác nhau ở hai môi trường."},
 {type:"text",title:"3.1. Định luật phản xạ và khúc xạ ánh sáng",sub:"3.1.2. Định luật khúc xạ",w2:true,
  blocks:['Chiết suất của một môi trường: <em>n = <span class="fr"><span>c</span><span>v</span></span></em>',
          'Chiết suất <i>n</i> là một số <em>không thứ nguyên</em> ≥ 1 (n<sub>ck</sub> = n<sub>kk</sub> ≈ 1)',
          'λ = v·T = <span class="fr"><span>v</span><span>f</span></span> &nbsp;suy ra&nbsp; <em>v = f·λ</em>',
          'Vì f₁ = f₂ = f, mà v₁ ≠ v₂ nên <em>λ₁ ≠ λ₂</em>'],
  fhtml:'<span class="fr"><span>λ₁</span><span>λ₂</span></span> = <span class="fr"><span>v₁</span><span>v₂</span></span> = <span class="fr"><span>c/n₁</span><span>c/n₂</span></span> = <span class="fr"><span>n₂</span><span>n₁</span></span> <small>(2)</small>',art:"refract",
  speech:"Từ đó ta có khái niệm chiết suất: n bằng c chia v, tức là vận tốc ánh sáng trong chân không chia cho vận tốc trong môi trường. Chiết suất không có đơn vị và luôn lớn hơn hoặc bằng một. Chân không và không khí có chiết suất xấp xỉ bằng một. Có một điểm hay: khi ánh sáng đổi môi trường, tần số f không đổi, nhưng vận tốc đổi, nên bước sóng cũng đổi, vì v bằng f nhân lambda. Từ đó, lambda một chia lambda hai bằng v một chia v hai, bằng n hai chia n một. Nhớ nhé: chiết suất càng lớn thì bước sóng càng ngắn."},
 {type:"text",title:"3.1.2. Định luật khúc xạ",wide:true,
  body:"Biết tốc độ truyền của ánh sáng trong nước và thủy tinh lần lượt là 2,25.10⁸ m/s và 2,00.10⁸ m/s. Tìm chiết suất của nước và thủy tinh.",
  art:"refract",
  speech:"Thử một bài nhé. Tốc độ ánh sáng trong nước là hai phẩy hai lăm nhân mười mũ tám mét trên giây, còn trong thủy tinh là hai phẩy không không nhân mười mũ tám mét trên giây. Hãy tính chiết suất của nước và thủy tinh. Gợi ý: dùng công thức n bằng c chia v."},
 {type:"text",title:"3.1.2. Định luật khúc xạ – Lời giải",w2:true,
  steps:[{h:"Công thức chiết suất",f:"n = c / v"},
         {h:"Tốc độ ánh sáng trong chân không",f:"c = 3,00.10⁸ m/s"},
         {h:"Chiết suất của nước (v = 2,25.10⁸ m/s)",f:"n = 3,00.10⁸ / 2,25.10⁸ ≈ 1,33"},
         {h:"Chiết suất của thủy tinh (v = 2,00.10⁸ m/s)",f:"n = 3,00.10⁸ / 2,00.10⁸ = 1,50"}],
  answer:"Đáp số: n(nước) ≈ 1,33; n(thủy tinh) = 1,50",art:"refract",
  speech:"Mình giải nhé. Bắt đầu từ công thức n bằng c chia v, với c là vận tốc ánh sáng trong chân không, ba nhân mười mũ tám mét trên giây. Với nước, n bằng ba chia hai phẩy hai lăm, mười mũ tám ở trên và dưới triệt tiêu nhau, ra khoảng một phẩy ba ba. Với thủy tinh, n bằng ba chia hai, ra đúng một phẩy năm. Vậy chiết suất của nước khoảng một phẩy ba ba, của thủy tinh là một phẩy năm. Để ý nhé: thủy tinh có chiết suất lớn hơn, nên ánh sáng đi trong nó chậm hơn."},
 {type:"text",title:"3.1.2. Định luật khúc xạ",w2:true,
  body:"Biết tốc độ truyền của ánh sáng trong nước và thủy tinh lần lượt là 2,25.10⁸ m/s và 2,00.10⁸ m/s. Tìm chiết suất của nước và thủy tinh.",
  bub:["n<sub>nước</sub> = 1,33","n<sub>tt</sub> = 1,5"],
  blocks:["<em>VD:</em> Bước sóng của một ánh sáng trong môi trường chiết suất n = 1,6 là 600nm. Bước sóng của nó trong nước chiết suất n = 4/3 là?"],
  art:"refract",
  speech:"Đây là kết quả của bài vừa rồi: chiết suất của nước là một phẩy ba ba, của thủy tinh là một phẩy năm. Giờ sang ví dụ tiếp theo. Một ánh sáng có bước sóng sáu trăm nanomet trong môi trường có chiết suất một phẩy sáu. Khi ánh sáng này đi vào nước, có chiết suất bốn phần ba, thì bước sóng của nó là bao nhiêu? Gợi ý: khi đổi môi trường, tần số giữ nguyên."},
 {type:"text",title:"3.1.2. Định luật khúc xạ – Lời giải",w2:true,
  steps:[{h:"Công thức (2): tần số không đổi khi đổi môi trường",f:"λ₁ / λ₂ = n₂ / n₁"},
         {h:"Dữ kiện",f:"n₁ = 1,6 ; λ₁ = 600 nm ; n₂ = 4/3"},
         {h:"Suy ra bước sóng trong nước",f:"λ₂ = λ₁ · n₁ / n₂"},
         {h:"Thay số",f:"λ₂ = 600 · 1,6 / (4/3) = 720 nm"}],
  answer:"Đáp số: λ₂ = 720 nm",art:"refract",
  speech:"Mình giải ví dụ này. Điểm mấu chốt là khi ánh sáng đổi môi trường, tần số không đổi, nên bước sóng tỉ lệ nghịch với chiết suất: lambda một chia lambda hai bằng n hai chia n một. Suy ra lambda hai bằng lambda một nhân n một chia n hai. Thay số: sáu trăm nhân một phẩy sáu, chia bốn phần ba, ra bảy trăm hai mươi nanomet. Bước sóng trong nước dài hơn vì nước có chiết suất nhỏ hơn môi trường lúc đầu."},
 {type:"text",title:"3.1.2. Định luật khúc xạ",w2:true,
  prob:'Một tia sáng bước sóng 589nm (as đèn Na) truyền trong không khí đến chiếu tới một phiến thủy tinh phẳng nhẵn ở góc 30° so với pt.<ol><li>Tìm góc khúc xạ.</li><li>Tia ló ra khỏi kính đi lại vào không khí và nước ở góc ló nào?</li></ol>',
  sol:['<b>1. Góc khúc xạ trong kính</b><div>sinθ₂ = <span class="fr"><span>1,00</span><span>1,52</span></span> · sin 30,0° = 0,329<br>θ₂ = sin⁻¹(0,329) = <mark>19,2°</mark></div>','<b>2. Tia ló ra không khí</b><div>sinθ₃ = <span class="fr"><span>n₂</span><span>n₁</span></span> · sinθ₂ = <span class="fr"><span>1,52</span><span>1,00</span></span> · sin 19,2° = 0,500<br>θ₃ = sin⁻¹(0,500) = <mark>30,0°</mark></div>','<b>2. Tia ló ra nước</b><div>sinθ₃ = <span class="fr"><span>n₂</span><span>n₃</span></span> · sinθ₂ = <span class="fr"><span>1,52</span><span>1,33</span></span> · sin 19,2° = 0,376<br>θ₃ = sin⁻¹(0,376) = <mark>22,1°</mark></div>'],
  art:"slab",
  speech:"Thêm một bài hay nữa. Tia sáng đèn natri, bước sóng năm trăm tám mươi chín nanomet, đi từ không khí vào một tấm kính phẳng ở góc ba mươi độ so với pháp tuyến. Câu một: tìm góc khúc xạ trong kính. Câu hai: khi tia ló ra khỏi kính, vào không khí hoặc vào nước, thì góc ló là bao nhiêu? Câu một: chiết suất kính là một phẩy năm hai, nên sin theta hai bằng sin ba mươi độ chia một phẩy năm hai, ra không phẩy ba hai chín, suy ra theta hai khoảng mười chín phẩy hai độ. Câu hai: ló ra không khí, sin theta ba bằng một phẩy năm hai nhân sin mười chín phẩy hai độ, bằng không phẩy năm, nên góc ló là ba mươi độ, đúng bằng góc tới ban đầu. Còn ló ra nước, sin theta ba bằng một phẩy năm hai chia một phẩy ba ba, nhân sin mười chín phẩy hai độ, ra không phẩy ba bảy sáu, nên góc ló khoảng hai mươi hai phẩy một độ."},
 {type:"text",title:"Câu hỏi trắc nghiệm 1",
  body:"Một chùm tia sáng trong không khí chiếu tới bề mặt của một khối hình chữ nhật bằng nhựa trong (n = 1,49). Nếu vận tốc của chùm tia trước khi đi vào khối là 3,00.10⁸ m/s thì vận tốc của nó bên trong khối là bao nhiêu?",
  opts:["3,00.10⁸ m/s","1,93.10⁸ m/s","2,01.10⁸ m/s","1,35.10⁸ m/s"],
  speech:"Câu trắc nghiệm số một. Một chùm sáng trong không khí chiếu vào một khối nhựa trong suốt có chiết suất một phẩy bốn chín. Vận tốc ánh sáng trước khi vào khối là ba nhân mười mũ tám mét trên giây. Hỏi vận tốc bên trong khối là bao nhiêu? Đáp án A: ba phẩy không không nhân mười mũ tám. B: một phẩy chín ba nhân mười mũ tám. C: hai phẩy không một nhân mười mũ tám. D: một phẩy ba lăm nhân mười mũ tám. Đơn vị đều là mét trên giây. Gợi ý: ánh sáng đi chậm lại khi vào môi trường có chiết suất lớn hơn."},
 {type:"text",title:"Câu hỏi trắc nghiệm 1 – Lời giải",
  steps:[{h:"Công thức chiết suất",f:"n = c / v  ⟹  v = c / n"},
         {h:"Dữ kiện (vận tốc trong không khí ≈ c)",f:"c = 3,00.10⁸ m/s ; n = 1,49"},
         {h:"Thay số",f:"v = 3,00.10⁸ / 1,49 ≈ 2,01.10⁸ m/s"},
         {h:"Đối chiếu các đáp án",f:"v ≈ 2,01.10⁸ m/s  ⟹  chọn C"}],
  answer:"Đáp án đúng: C. 2,01.10⁸ m/s",
  speech:"Lời giải câu một. Ánh sáng đi vào môi trường có chiết suất lớn hơn một thì sẽ chậm lại, nên đáp án A, chính là vận tốc ban đầu, chắc chắn sai. Tính cụ thể: từ n bằng c chia v, suy ra v bằng c chia n, bằng ba nhân mười mũ tám chia một phẩy bốn chín, ra khoảng hai phẩy không một nhân mười mũ tám mét trên giây. Vậy chọn đáp án C."}
 ,{type:"text",title:"Hiện tượng phản xạ toàn phần",w2:true,
  blocks:['<div style="text-align:center;font-size:3cqw"><em>n₁·sinθ₁ = n₂·sinθ₂</em></div>','Ánh sáng chiếu từ môi trường có <em>chiết suất lớn hơn</em> đến môi trường có <em>chiết suất nhỏ hơn</em>','Góc tới lớn hơn <em>góc tới hạn</em>: <em>sinθ<sub>C</sub> = <span class="fr"><span>n₂</span><span>n₁</span></span></em>','→ Tia tới bị <em>phản xạ hoàn toàn</em> tại mặt phân cách hai môi trường'],
  art:"tir17",
  speech:"Giờ đến một hiện tượng rất thú vị: phản xạ toàn phần. Ta xuất phát từ công thức khúc xạ, n một sin theta một bằng n hai sin theta hai. Giả sử ánh sáng đi từ môi trường chiết suất lớn sang môi trường chiết suất nhỏ hơn. Khi đó tia khúc xạ bị bẻ ra xa pháp tuyến. Tăng dần góc tới, đến một lúc tia khúc xạ chạy sát mặt phân cách. Góc tới lúc đó gọi là góc tới hạn, với sin theta C bằng n hai chia n một. Nếu góc tới còn lớn hơn góc tới hạn, ánh sáng không đi qua được nữa mà bị phản xạ hoàn toàn trở lại. Nhớ hai điều kiện nhé: đi từ môi trường chiết suất lớn sang nhỏ, và góc tới lớn hơn góc tới hạn."},
 {type:"text",title:"Hiện tượng phản xạ toàn phần – Ứng dụng",w2:true,lead:"Ứng dụng:",
  items:["**Sợi quang:** lõi thủy tinh hoặc chất dẻo trong suốt chiết suất n₁ > n₂ lớp vỏ.","Trong y học dùng các bó sợi quang trong phương pháp nội soi."],
  art:"fiber18",
  speech:"Ứng dụng quan trọng nhất của phản xạ toàn phần là sợi quang. Sợi quang có lõi bằng thủy tinh hoặc chất dẻo trong suốt, bọc bên ngoài là lớp vỏ có chiết suất nhỏ hơn. Ánh sáng đi vào lõi sẽ phản xạ toàn phần liên tiếp ở mặt tiếp xúc với lớp vỏ, nên cứ thế chạy dọc theo sợi mà không thoát ra ngoài, giống như đi trong một ống dẫn bằng gương. Trong y học, các bó sợi quang được dùng để nội soi, giúp bác sĩ nhìn vào bên trong cơ thể."},
 {type:"text",title:"Câu hỏi trắc nghiệm 2",
  body:"Một sợi cáp quang (n = 1,50) ngập trong nước (n = 1,33). Góc tới hạn để ánh sáng chiếu vào bên trong cáp là bao nhiêu?",
  opts:["83,1°","62,5°","41,8°","27,6°"],
  speech:"Câu trắc nghiệm số hai. Một sợi cáp quang có chiết suất một phẩy năm, ngập trong nước có chiết suất một phẩy ba ba. Góc tới hạn để ánh sáng chiếu vào bên trong cáp là bao nhiêu? Đáp án A: tám mươi ba phẩy một độ. B: sáu mươi hai phẩy năm độ. C: bốn mươi mốt phẩy tám độ. D: hai mươi bảy phẩy sáu độ. Gợi ý: sin theta C bằng chiết suất nhỏ chia chiết suất lớn."},
 {type:"text",title:"Câu hỏi trắc nghiệm 2 – Lời giải",w2:true,
  steps:[{h:"Điều kiện phản xạ toàn phần (n₁ > n₂)",f:"sinθC = n₂ / n₁"},
         {h:"Dữ kiện (n₁: lõi cáp quang, n₂: nước)",f:"n₁ = 1,50 ; n₂ = 1,33"},
         {h:"Thay số",f:"sinθC = 1,33 / 1,50 ≈ 0,887"},
         {h:"Suy ra góc tới hạn, đối chiếu đáp án",f:"θC = sin⁻¹(0,887) ≈ 62,5°  ⟹  chọn B"}],
  answer:"Đáp án đúng: B. 62,5°",
  speech:"Lời giải câu hai. Ánh sáng đi từ lõi cáp, chiết suất lớn hơn, ra nước, chiết suất nhỏ hơn, nên có thể xảy ra phản xạ toàn phần. Ta có sin theta C bằng n hai chia n một, bằng một phẩy ba ba chia một phẩy năm, khoảng không phẩy tám tám bảy. Bấm máy tính ngược lại, theta C khoảng sáu mươi hai phẩy năm độ. Vậy chọn đáp án B."},
 {type:"text",title:"Câu hỏi trắc nghiệm 3",
  body:"Mô tả nào sau đây diễn tả hiện tượng sẽ xảy ra đối với tia sáng từ không khí đến thủy tinh?",
  opts:["phản xạ toàn phần","khúc xạ toàn phần","phản xạ một phần, truyền qua một phần","phản xạ một phần, truyền qua hoàn toàn."],
  speech:"Câu trắc nghiệm số ba. Một tia sáng đi từ không khí tới mặt thủy tinh. Hiện tượng nào sẽ xảy ra? Đáp án A: phản xạ toàn phần. B: khúc xạ toàn phần. C: phản xạ một phần và truyền qua một phần. D: phản xạ một phần và truyền qua hoàn toàn. Gợi ý: nhớ lại điều kiện để có phản xạ toàn phần."},
 {type:"text",title:"Câu hỏi trắc nghiệm 3 – Lời giải",w2:true,
  steps:[{h:"Chiều truyền ánh sáng",f:"không khí (n ≈ 1,00) → thủy tinh (n ≈ 1,50), n₁ < n₂"},
         {h:"Phản xạ toàn phần có xảy ra không?",f:"Không: chỉ xảy ra khi n₁ > n₂ và θ > θC"},
         {h:"Tại mặt phân cách hai môi trường trong suốt",f:"một phần ánh sáng phản xạ, phần còn lại khúc xạ vào thủy tinh"},
         {h:"Đối chiếu các đáp án",f:"A, B sai; D sai (không truyền qua hoàn toàn)  ⟹  chọn C"}],
  answer:"Đáp án đúng: C. phản xạ một phần, truyền qua một phần",
  speech:"Lời giải câu ba. Ánh sáng đi từ không khí, chiết suất khoảng một, sang thủy tinh, chiết suất khoảng một phẩy năm. Tức là đi từ môi trường chiết suất nhỏ sang lớn, nên không thể có phản xạ toàn phần. Với hai môi trường trong suốt, tại mặt phân cách, một phần ánh sáng bị phản xạ lại, phần còn lại khúc xạ đi vào thủy tinh. Giống như khi bạn nhìn vào cửa kính: vừa thấy hình mình mờ mờ phản chiếu, vừa nhìn xuyên qua được. Vậy chọn đáp án C."},
 {type:"text",title:"Câu hỏi trắc nghiệm 4",
  body:"Câu nào dưới đây **sai**:",
  opts:["Ta luôn có tia khúc xạ khi tia sáng đi từ môi trường có chiết suất nhỏ hơn sang môi trường có chiết suất lớn hơn.","Ta luôn có tia khúc xạ khi tia sáng đi từ môi trường có chiết suất lớn hơn sang môi trường có chiết suất nhỏ hơn.","Khi chùm sáng phản xạ toàn phần thì không có chùm tia khúc xạ.","Khi có sự phản xạ toàn phần, cường độ chùm sáng phản xạ gần như bằng cường độ chùm sáng tới."],
  speech:"Câu trắc nghiệm số bốn. Câu này hỏi câu nào sai, nên đọc kỹ nhé. A: ta luôn có tia khúc xạ khi ánh sáng đi từ môi trường chiết suất nhỏ sang chiết suất lớn. B: ta luôn có tia khúc xạ khi đi từ môi trường chiết suất lớn sang chiết suất nhỏ. C: khi có phản xạ toàn phần thì không có tia khúc xạ. D: khi có phản xạ toàn phần, cường độ chùm phản xạ gần bằng cường độ chùm tới. Hãy chọn câu sai."},
 {type:"text",title:"Câu hỏi trắc nghiệm 4 – Lời giải",w2:true,
  steps:[{h:"A: n₁ < n₂",f:"sinθ₂ = (n₁/n₂)·sinθ₁ < 1  ⟹  luôn có tia khúc xạ  ⟹  đúng"},
         {h:"B: n₁ > n₂",f:"khi θ₁ > θC (sinθC = n₂/n₁) thì phản xạ toàn phần, không có tia khúc xạ  ⟹  SAI"},
         {h:"C: phản xạ toàn phần",f:"toàn bộ ánh sáng bị phản xạ, không có tia khúc xạ  ⟹  đúng"},
         {h:"D: phản xạ toàn phần",f:"I phản xạ ≈ I tới (không mất mát qua khúc xạ)  ⟹  đúng"}],
  answer:"Đáp án đúng (câu sai): B",
  speech:"Lời giải câu bốn. Ta xét từng câu. Câu A đúng: đi từ chiết suất nhỏ sang lớn thì sin theta hai bằng n một chia n hai nhân sin theta một, luôn nhỏ hơn một, nên lúc nào cũng có tia khúc xạ. Câu B sai: đi từ chiết suất lớn sang nhỏ, nếu góc tới vượt góc tới hạn thì xảy ra phản xạ toàn phần, và không còn tia khúc xạ. Chữ luôn có chính là chỗ bẫy. Câu C đúng, vì phản xạ toàn phần nghĩa là toàn bộ ánh sáng bị phản xạ. Câu D cũng đúng, vì không bị hao hụt qua khúc xạ nên cường độ phản xạ gần bằng cường độ tới. Vậy câu sai là B."},
 {type:"text",title:"Kính tiềm vọng",w2:true,
  body:"Cho một tia sáng đi từ thủy tinh (n = 1,52) ra không khí. Sự phản xạ toàn phần xảy ra khi góc tới?",
  bub:["θ₁ > 41°"],
  blocks:["sinθC = n₂/n₁ = 1/1,52 ≈ 0,658 ⟹ θC ≈ 41°","Lăng kính vuông cân: tia tới góc 45° > θC ⟹ phản xạ toàn phần (dùng trong kính tiềm vọng)."],
  art:"peri",
  speech:"Giờ là một ứng dụng: kính tiềm vọng. Cho tia sáng đi từ thủy tinh, chiết suất một phẩy năm hai, ra không khí. Phản xạ toàn phần xảy ra khi góc tới lớn hơn bao nhiêu? Ta tính góc tới hạn: sin theta C bằng một chia một phẩy năm hai, khoảng không phẩy sáu năm tám, nên theta C khoảng bốn mươi mốt độ. Vậy góc tới lớn hơn bốn mươi mốt độ là có phản xạ toàn phần. Trong kính tiềm vọng, người ta dùng lăng kính vuông cân. Tia sáng đi vuông góc vào mặt bên, rồi tới mặt huyền ở góc bốn mươi lăm độ, lớn hơn bốn mươi mốt độ, nên bị phản xạ toàn phần và đổi hướng chín mươi độ. Nhờ vậy, lăng kính hoạt động như một chiếc gương rất hiệu quả."},
 {type:"text",title:"Câu hỏi trắc nghiệm 5",
  body:"Có thể xảy ra phản xạ toàn phần khi:",
  opts:["Chiếu ánh sáng từ không khí vào nước (n = 4/3)","Chiếu ánh sáng từ nước vào tấm thủy tinh (n = 1,5)","Chiếu ánh sáng từ chân không vào dầu","Chiếu ánh sáng từ nước ra không khí"],
  speech:"Câu trắc nghiệm số năm. Trường hợp nào có thể xảy ra phản xạ toàn phần? A: chiếu ánh sáng từ không khí vào nước, chiết suất bốn phần ba. B: từ nước vào tấm thủy tinh, chiết suất một phẩy năm. C: từ chân không vào dầu. D: từ nước ra không khí. Gợi ý: để ý chiều đi của ánh sáng, từ chiết suất lớn sang nhỏ hay ngược lại."},
 {type:"text",title:"Câu hỏi trắc nghiệm 5 – Lời giải",w2:true,
  steps:[{h:"Điều kiện phản xạ toàn phần",f:"n₁ > n₂ và θ₁ > θC (sinθC = n₂/n₁)"},
         {h:"A: không khí (1) → nước (4/3)",f:"n₁ < n₂  ⟹  không xảy ra"},
         {h:"B: nước (4/3) → thủy tinh (1,5)",f:"n₁ < n₂  ⟹  không xảy ra"},
         {h:"C: chân không (1) → dầu (n > 1)",f:"n₁ < n₂  ⟹  không xảy ra"},
         {h:"D: nước (4/3) → không khí (1)",f:"n₁ > n₂  ⟹  có thể xảy ra, sinθC = 3/4  ⟹  chọn D"}],
  answer:"Đáp án đúng: D. Chiếu ánh sáng từ nước ra không khí",
  speech:"Lời giải câu năm. Nhớ điều kiện nhé: ánh sáng phải đi từ môi trường chiết suất lớn sang chiết suất nhỏ, và góc tới lớn hơn góc tới hạn. Xét câu A: từ không khí vào nước, chiết suất tăng, không được. Câu B: từ nước vào thủy tinh, chiết suất cũng tăng, không được. Câu C: từ chân không vào dầu, dầu có chiết suất lớn hơn một, cũng tăng, không được. Chỉ có câu D: từ nước ra không khí, chiết suất giảm, thỏa điều kiện, với sin theta C bằng ba phần tư. Vậy chọn D."},
 {type:"text",title:"Câu hỏi trắc nghiệm 6",
  body:"Khi ánh sáng đi từ vật có chiết suất cao sang vật có chiết suất thấp thì:",
  opts:["không có ánh sáng nào bị phản xạ.","ánh sáng phản xạ mà không thay đổi pha.","ánh sáng phản xạ với pha thay đổi 180°.","ánh sáng không bị phản xạ có pha thay đổi 180°."],
  speech:"Câu trắc nghiệm số sáu. Khi ánh sáng đi từ vật có chiết suất cao sang vật có chiết suất thấp thì điều gì xảy ra? A: không có ánh sáng nào bị phản xạ. B: ánh sáng phản xạ và không đổi pha. C: ánh sáng phản xạ với pha đổi một trăm tám mươi độ. D: ánh sáng không bị phản xạ nhưng pha đổi một trăm tám mươi độ. Gợi ý: nhớ lại khi nào phản xạ làm đổi pha."},
 {type:"text",title:"Câu hỏi trắc nghiệm 6 – Lời giải",w2:true,
  steps:[{h:"Quy tắc đổi pha khi phản xạ",f:"n₁ < n₂ (phản xạ trên môi trường chiết suất lớn hơn): pha đổi 180° (π)"},
         {h:"Trường hợp đề bài",f:"n₁ > n₂ (từ chiết suất cao sang thấp): pha KHÔNG đổi"},
         {h:"A sai",f:"luôn có một phần ánh sáng phản xạ tại mặt phân cách"},
         {h:"C, D sai",f:"đổi pha 180° chỉ xảy ra khi n₁ < n₂  ⟹  chọn B"}],
  answer:"Đáp án đúng: B. ánh sáng phản xạ mà không thay đổi pha",
  speech:"Lời giải câu sáu. Có một quy tắc đáng nhớ: khi ánh sáng phản xạ trên bề mặt của môi trường có chiết suất lớn hơn, pha bị đổi một trăm tám mươi độ. Đề bài cho ánh sáng đi từ chiết suất cao sang thấp, tức là phản xạ trên môi trường chiết suất nhỏ hơn, nên pha không đổi. Câu A sai, vì tại mặt phân cách luôn có một phần ánh sáng phản xạ. Câu C và D sai, vì đổi pha một trăm tám mươi độ chỉ xảy ra khi phản xạ trên môi trường chiết suất lớn hơn. Vậy chọn B. Quy tắc này sẽ rất quan trọng khi ta học giao thoa ở bản mỏng."},
 {type:"text",title:"Câu hỏi trắc nghiệm 7",
  body:"Mô tả nào sau đây diễn tả hiện tượng sẽ xảy ra đối với tia sáng từ không khí đến thủy tinh?",
  opts:["phản xạ toàn phần","khúc xạ toàn phần","phản xạ một phần, truyền qua một phần","phản xạ một phần, truyền qua hoàn toàn"],
  speech:"Câu trắc nghiệm số bảy. Câu này quen quen, giống câu số ba đấy. Tia sáng đi từ không khí đến thủy tinh, hiện tượng nào xảy ra? A: phản xạ toàn phần. B: khúc xạ toàn phần. C: phản xạ một phần, truyền qua một phần. D: phản xạ một phần, truyền qua hoàn toàn. Bạn nhớ lại lời giải câu ba để chọn nhanh nhé."},
 {type:"text",title:"Câu hỏi trắc nghiệm 7 – Lời giải",w2:true,
  steps:[{h:"Tại mặt phân cách không khí – thủy tinh",f:"Một phần năng lượng ánh sáng bị phản xạ, phần còn lại bị khúc xạ vào thủy tinh"},
         {h:"A sai",f:"phản xạ toàn phần chỉ xảy ra khi n₁ > n₂; ở đây n₁ < n₂"},
         {h:"B sai",f:"không có hiện tượng \"khúc xạ toàn phần\""},
         {h:"D sai",f:"không có mặt phân cách nào phản xạ 0% ánh sáng, luôn có phản xạ một phần  ⟹  chọn C"}],
  answer:"Đáp án đúng: C. phản xạ một phần, truyền qua một phần",
  speech:"Lời giải câu bảy, cũng là lời giải cho câu ba luôn. Từ không khí vào thủy tinh, tại mặt phân cách một phần ánh sáng bị phản xạ, phần còn lại khúc xạ vào thủy tinh. Đáp án A sai, vì phản xạ toàn phần chỉ xảy ra khi đi từ chiết suất lớn sang nhỏ. Đáp án B sai, vì thực tế không có hiện tượng khúc xạ toàn phần. Đáp án D sai, vì không có mặt phân cách nào phản xạ không phần trăm ánh sáng, luôn có một phần bị phản xạ. Vậy chọn C."},
 {type:"text",title:"Câu hỏi trắc nghiệm 8",
  body:"Một chùm sáng đơn sắc trong không khí có bước sóng 589 nm. Nó đi qua thủy tinh (n = 1,52) và sau đó đi qua chất lỏng carbon disulfua (n = 1,63). Bước sóng của nó trong cacbon disulfua là gì?",
  opts:["361 nm","387,5 nm","895 nm","960 nm"],
  speech:"Câu trắc nghiệm số tám. Một chùm sáng đơn sắc trong không khí có bước sóng năm trăm tám mươi chín nanomet. Nó đi qua thủy tinh, chiết suất một phẩy năm hai, rồi vào chất lỏng carbon disulfua, chiết suất một phẩy sáu ba. Bước sóng của nó trong carbon disulfua là bao nhiêu? A: ba trăm sáu mươi mốt nanomet. B: ba trăm tám mươi bảy phẩy năm nanomet. C: tám trăm chín mươi lăm nanomet. D: chín trăm sáu mươi nanomet. Gợi ý: vào môi trường chiết suất lớn thì bước sóng ngắn lại hay dài ra nhỉ?"},
 {type:"text",title:"Câu hỏi trắc nghiệm 8 – Lời giải",w2:true,
  steps:[{h:"Tần số không đổi khi qua các môi trường",f:"f = const;  v = c/n  ⟹  λ = λ₀/n"},
         {h:"Thủy tinh chỉ là môi trường trung gian",f:"Bước sóng trong CS₂ chỉ phụ thuộc n của CS₂ (1,63)"},
         {h:"Tính bước sóng trong CS₂",f:"λ = 589 / 1,63 ≈ 361 nm"},
         {h:"Các phương án nhiễu",f:"B = 589/1,52 (nhầm n thủy tinh); C, D = 589×n (nhân thay vì chia)  ⟹  chọn A"}],
  answer:"Đáp án đúng: A. 361 nm",
  speech:"Lời giải câu tám. Khi đi qua các môi trường, tần số ánh sáng không đổi, nên bước sóng trong môi trường chiết suất n bằng bước sóng trong không khí chia cho n. Có một cái bẫy ở đây: thủy tinh chỉ là môi trường trung gian, nên ta không cần dùng đến chiết suất một phẩy năm hai. Bước sóng trong carbon disulfua chỉ phụ thuộc chiết suất của chính nó: năm trăm tám mươi chín chia một phẩy sáu ba, ra khoảng ba trăm sáu mươi mốt nanomet. Đáp án C và D sai vì nhân thay vì chia, đáp án B sai vì chia nhầm cho chiết suất của thủy tinh. Vậy chọn A."},
 {type:"text",title:"Câu hỏi trắc nghiệm 9",w2:true,
  body:"Một màng dầu nổi trên mặt nước. Chiết suất của nước và dầu lần lượt là 1,333 và 1,466. Nếu một tia sáng tới bề mặt không khí với dầu một góc 37° so với pháp tuyến thì góc tới ở bề mặt dầu với nước là bao nhiêu?",
  opts:["18,10°","24,20°","27,30°","37,00°"],
  art:"film",
  speech:"Câu trắc nghiệm số chín. Một màng dầu nổi trên mặt nước. Chiết suất của nước là một phẩy ba ba ba, của dầu là một phẩy bốn sáu sáu. Một tia sáng tới mặt phân cách không khí với dầu, hợp với pháp tuyến góc ba mươi bảy độ. Hỏi góc tới ở mặt phân cách giữa dầu và nước là bao nhiêu? A: mười tám phẩy một độ. B: hai mươi bốn phẩy hai độ. C: hai mươi bảy phẩy ba độ. D: ba mươi bảy độ. Gợi ý: hãy tìm góc khúc xạ trong dầu trước."},
 {type:"text",title:"Câu hỏi trắc nghiệm 9 – Lời giải",w2:true,
  steps:[{h:"Khúc xạ tại mặt không khí – dầu (n₁ = 1, n₂ = 1,466)",f:"n₁ sinθ₁ = n₂ sinθ₂  ⟹  sinθ₂ = sin37°/1,466 ≈ 0,4105"},
         {h:"Góc khúc xạ trong dầu",f:"θ₂ ≈ 24,2°"},
         {h:"Hai mặt phân cách song song",f:"θ₂ cũng là góc tới ở mặt dầu – nước"},
         {h:"Chiết suất nước (1,333) chưa cần dùng",f:"chỉ cần để tính θ₃ ≈ 26,8°  ⟹  chọn B"}],
  answer:"Đáp án đúng: B. 24,20°",
  speech:"Lời giải câu chín. Đầu tiên, tại mặt phân cách không khí và dầu, áp dụng định luật khúc xạ: sin theta hai bằng sin ba mươi bảy độ chia một phẩy bốn sáu sáu, khoảng không phẩy bốn một không năm. Suy ra theta hai khoảng hai mươi bốn phẩy hai độ. Vì hai mặt của màng dầu song song với nhau, nên góc khúc xạ trong dầu cũng chính là góc tới ở mặt phân cách dầu với nước. Chiết suất của nước ở đây chưa cần dùng, nó chỉ cần nếu hỏi tiếp góc khúc xạ trong nước, khoảng hai mươi sáu phẩy tám độ. Vậy chọn B."},
 {type:"text",title:"Câu hỏi trắc nghiệm 10",w2:true,
  body:"Một sợi cáp quang bằng thủy tinh (n = 1,50) ngập trong nước. Tia sáng từ lõi đến vỏ cáp có góc tới bao nhiêu để xảy ra phản xạ toàn phần?",
  opts:["83,1°","62,5°","41,8°","27,6°"],
  art:"cap",
  speech:"Câu trắc nghiệm số mười. Một sợi cáp quang bằng thủy tinh, chiết suất một phẩy năm, ngập trong nước. Tia sáng đi từ lõi ra vỏ cáp, hỏi góc tới bao nhiêu để xảy ra phản xạ toàn phần? A: tám mươi ba phẩy một độ. B: sáu mươi hai phẩy năm độ. C: bốn mươi mốt phẩy tám độ. D: hai mươi bảy phẩy sáu độ. Gợi ý: bài này gần giống câu hai, bạn thử tính góc tới hạn nhé."},
 {type:"text",title:"Câu hỏi trắc nghiệm 10 – Lời giải",w2:true,
  steps:[{h:"Điều kiện phản xạ toàn phần",f:"n₁ > n₂ và θ ≥ θC, với sinθC = n₂/n₁"},
         {h:"Thủy tinh (n₁ = 1,50) → nước (n₂ ≈ 1,33)",f:"n₁ > n₂  ⟹  có thể xảy ra phản xạ toàn phần"},
         {h:"Tính góc tới hạn",f:"sinθC = 1,33/1,50 ≈ 0,887  ⟹  θC ≈ 62,5°"},
         {h:"Kết luận",f:"phản xạ toàn phần khi θ ≥ 62,5°  ⟹  chọn B"}],
  answer:"Đáp án đúng: B. 62,5°",
  speech:"Lời giải câu mười. Phản xạ toàn phần xảy ra khi ánh sáng đi từ môi trường chiết suất lớn sang nhỏ, và góc tới lớn hơn hoặc bằng góc tới hạn. Ở đây ánh sáng đi từ thủy tinh, chiết suất một phẩy năm, ra nước, chiết suất khoảng một phẩy ba ba, nên điều kiện được thỏa. Sin theta C bằng một phẩy ba ba chia một phẩy năm, khoảng không phẩy tám tám bảy, suy ra theta C khoảng sáu mươi hai phẩy năm độ. Vậy từ sáu mươi hai phẩy năm độ trở lên thì xảy ra phản xạ toàn phần. Chọn B."},
 {type:"text",title:"3.2.1. Điều kiện giao thoa",sub:"Hàm sóng",
  blocks:["Sóng tại nguồn O: <em>E<sub>0</sub> = A sin ωt</em>",
          "Sóng tại M: <em>E<sub>M</sub> = A sin(ωt − <span class=\"fr\"><span>2πL</span><span>λ</span></span>)</em>",
          "Sóng tại M luôn trễ pha hơn sóng tại nguồn một lượng: <em>Δφ = <span class=\"fr\"><span>2πL</span><span>λ</span></span></em>",
          "L là quang lộ: <em>L = c·t</em>. Trong môi trường đồng tính có chiết suất n: <em>L = n·s</em>"],
  art:"wave",
  speech:"Sang phần mới nhé: giao thoa ánh sáng. Trước tiên, ta cần biết sóng ánh sáng được viết thế nào. Giả sử sóng tại nguồn O có dạng E không bằng A sin omega t. Sóng truyền đến điểm M sẽ đến trễ hơn, nên pha bị trừ đi một lượng hai pi L chia lambda: E M bằng A sin, mở ngoặc, omega t trừ hai pi L chia lambda, đóng ngoặc. Nói cách khác, tại M sóng trễ pha hơn tại nguồn một lượng delta phi bằng hai pi L chia lambda. Ở đây L là quang lộ: L bằng c nhân t, và trong môi trường chiết suất n thì L bằng n nhân s, với s là quãng đường hình học. Nhớ nhé: quãng đường đi càng dài thì pha trễ càng nhiều."},
 {type:"text",title:"3.2.1. Điều kiện giao thoa",sub:"Sơ đồ thí nghiệm khe Young",wide:true,
  blocks:["Hai nguồn kết hợp: <em>E<sub>O1</sub> = E<sub>O2</sub> = A sin ωt</em>",
          "<em>E<sub>1</sub>(M) = A sin(ωt − <span class=\"fr\"><span>2πL<sub>1</sub></span><span>λ</span></span>)</em>",
          "<em>E<sub>2</sub>(M) = A sin(ωt − <span class=\"fr\"><span>2πL<sub>2</sub></span><span>λ</span></span>)</em>",
          "Độ lệch pha giữa hai sóng tại M:"],
  fhtml:"Δφ = <span class=\"fr\"><span>2π(L₁ − L₂)</span><span>λ</span></span>",
  art:"young",
  speech:"Bây giờ là sơ đồ thí nghiệm khe Young. Ta có hai nguồn O một và O hai là hai nguồn kết hợp, tức là cùng phát sóng E bằng A sin omega t. Sóng từ O một đến điểm M trên màn đi qua quang lộ L một, sóng từ O hai đến M đi qua quang lộ L hai. Vì quãng đường khác nhau nên tại M hai sóng có pha khác nhau: E một tại M bằng A sin, omega t trừ hai pi L một chia lambda, còn E hai tại M bằng A sin, omega t trừ hai pi L hai chia lambda. Độ lệch pha giữa hai sóng tại M là delta phi bằng hai pi nhân, L một trừ L hai, chia lambda. Điểm mấu chốt: độ lệch pha chỉ phụ thuộc vào hiệu quang lộ L một trừ L hai."},
 {type:"text",title:"3.2.1. Điều kiện giao thoa",sub:"Điều kiện cực đại, cực tiểu",wide:true,
  blocks:["Độ lệch pha: <em>Δφ = <span class=\"fr\"><span>2π(L<sub>1</sub> − L<sub>2</sub>)</span><span>λ</span></span></em>",
          "<em>Điều kiện giao thoa cực đại:</em> <span class=\"fr\"><span>2π(L<sub>1</sub> − L<sub>2</sub>)</span><span>λ</span></span> = 2kπ  ⇒  <em>L<sub>1</sub> − L<sub>2</sub> = kλ</em>",
          "<em>Điều kiện giao thoa cực tiểu:</em> <span class=\"fr\"><span>2π(L<sub>1</sub> − L<sub>2</sub>)</span><span>λ</span></span> = (2k + 1)π  ⇒  <em>L<sub>1</sub> − L<sub>2</sub> = (k + <span class=\"fr\"><span>1</span><span>2</span></span>)λ</em>"],
  speech:"Từ độ lệch pha, ta suy ra điều kiện cực đại và cực tiểu. Cực đại là chỗ hai sóng cùng pha, tăng cường nhau, nên độ lệch pha bằng hai k pi. Suy ra hiệu quang lộ L một trừ L hai bằng k lambda, nghĩa là bằng một số nguyên lần bước sóng. Cực tiểu là chỗ hai sóng ngược pha, triệt tiêu nhau, nên độ lệch pha bằng hai k cộng một, nhân pi. Suy ra hiệu quang lộ bằng, k cộng một phần hai, nhân lambda, tức là số bán nguyên lần bước sóng. Cách nhớ gọn: hiệu quang lộ bằng số nguyên lần bước sóng thì sáng, bằng số bán nguyên lần bước sóng thì tối."},
 {type:"text",title:"3.2.2. Giao thoa khe Young",
  blocks:["<em>Vị trí vân sáng (VS):</em> y = k·<span class=\"fr\"><span>λL</span><span>d</span></span>",
          "<em>Vị trí vân tối (VT):</em> y = (k + <span class=\"fr\"><span>1</span><span>2</span></span>)·<span class=\"fr\"><span>λL</span><span>d</span></span>",
          "Với k = 0, ±1, ±2, …"],
  fhtml:"δ = d·tgθ = d·<span class=\"fr\"><span>y</span><span>L</span></span>",art:"young2",
  speech:"Sang phần giao thoa khe Young. Kết quả quan trọng nhất của thí nghiệm này là vị trí các vân. Vân sáng nằm ở y bằng k nhân lambda L chia d. Vân tối nằm ở y bằng, k cộng một phần hai, nhân lambda L chia d. Trong đó k nhận các giá trị không, cộng trừ một, cộng trừ hai, và cứ thế; d là khoảng cách giữa hai khe, L là khoảng cách từ hai khe đến màn. Các công thức này đến từ đâu? Từ hiệu quang lộ: delta bằng d nhân tang theta, và vì góc nhỏ nên bằng d nhân y chia L. Thay vào điều kiện cực đại, cực tiểu ở slide trước là ra."},
 {type:"text",title:"3.2.2. Giao thoa khe Young",w2:true,
  blocks:["<em>Vị trí VS:</em> y = k·<span class=\"fr\"><span>λL</span><span>d</span></span><br><em>Vị trí VT:</em> y = (k + <span class=\"fr\"><span>1</span><span>2</span></span>)·<span class=\"fr\"><span>λL</span><span>d</span></span><br>Với k = 0, ±1, ±2, …",
          "<em>Khoảng vân</em> là khoảng cách giữa hai vân sáng (hay vân tối) kế tiếp:",
          "Giữa <em>n</em> vân sáng (vân tối) kế tiếp có <em>n − 1</em> khoảng vân."],
  fhtml:"i = <span class=\"fr\"><span>λL</span><span>d</span></span>",art:"fringe",
  speech:"Từ vị trí các vân, ta rút ra khoảng vân i. Khoảng vân là khoảng cách giữa hai vân sáng kế tiếp, hoặc hai vân tối kế tiếp, và bằng lambda L chia d. Dễ thấy: hai khe càng gần nhau, màn càng xa, hay bước sóng càng dài thì các vân càng thưa. Có một mẹo hay dùng trong bài tập: giữa n vân sáng liên tiếp có n trừ một khoảng vân. Ví dụ năm vân sáng liên tiếp thì có bốn khoảng vân, chứ không phải năm đâu nhé."},
 {type:"text",title:"3.2.2. Giao thoa khe Young",sub:"Bậc của vân",w2:true,
  blocks:["Với <em>k = 0</em> → <em>y<sub>s</sub> = 0</em>: gốc O trùng với vân cực đại giao thoa (vân sáng trung tâm).",
          "Vân sáng thứ (bậc) n: <em>k = n</em><br>Vân tối thứ (bậc) n: <em>k = n − 1</em>",
          "<span style=\"font-size:2.1cqw\">Vân sáng bậc n cách vân trung tâm một khoảng:</span><br><em>x<sub>s</sub> = n·i = k·i</em>",
          "<span style=\"font-size:2.1cqw\">Vân tối bậc n cách vân trung tâm một khoảng:</span><br><em>x<sub>t</sub> = (n − <span class=\"fr\"><span>1</span><span>2</span></span>)·i = (k + <span class=\"fr\"><span>1</span><span>2</span></span>)·i</em>"],
  note:"Giao thoa khe Young được hệ vân có <em>i = 2 mm</em>. Tại các điểm cách vân trung tâm <em>4 mm, 9 mm, 15 mm</em> thu được các vân gì, bậc bao nhiêu?",
  art:"fringe2",
  speech:"Tiếp theo là bậc của vân. Với k bằng không thì y bằng không, tức là gốc O trùng với vân sáng trung tâm. Vân sáng bậc n ứng với k bằng n. Còn vân tối bậc n ứng với k bằng n trừ một, vì vân tối đầu tiên nằm cách vân trung tâm nửa khoảng vân, ứng với k bằng không. Vì vậy, vân sáng bậc n cách vân trung tâm x bằng n nhân i, còn vân tối bậc n cách x bằng, n trừ một phần hai, nhân i. Giờ thử một bài: khoảng vân i bằng hai milimét. Tại các điểm cách vân trung tâm bốn milimét, chín milimét và mười lăm milimét, ta thu được vân gì, bậc bao nhiêu? Gợi ý: hãy tính tỉ số x chia i."},
 {type:"text",title:"3.2.2. Giao thoa khe Young – Lời giải",sub:"Cho i = 2 mm. Xét tỉ số x / i",w2:true,
  steps:[{h:"x = 4 mm → x / i = 4 / 2 = 2 (số nguyên)",f:"x = n·i → n = 2: vân sáng bậc 2"},
         {h:"x = 9 mm → x / i = 9 / 2 = 4,5 = n − 0,5",f:"n = 5: vân tối bậc 5"},
         {h:"x = 15 mm → x / i = 15 / 2 = 7,5 = n − 0,5",f:"n = 8: vân tối bậc 8"}],
  art:"fringe2",
  speech:"Cách làm rất đơn giản: tính tỉ số x chia i. Nếu ra số nguyên thì là vân sáng, nếu ra số có phần lẻ là năm phần mười thì là vân tối. Điểm bốn milimét: bốn chia hai bằng hai, là số nguyên, nên là vân sáng bậc hai. Điểm chín milimét: chín chia hai bằng bốn phẩy năm, bằng n trừ không phẩy năm, suy ra n bằng năm, là vân tối bậc năm. Điểm mười lăm milimét: mười lăm chia hai bằng bảy phẩy năm, suy ra n bằng tám, là vân tối bậc tám."},
 {type:"text",title:"Câu hỏi trắc nghiệm 11",w2:true,

 {type:"text",title:"Câu hỏi trắc nghiệm 11 – Lời giải",w2:true,
