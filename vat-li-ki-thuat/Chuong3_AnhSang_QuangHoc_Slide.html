 {type:"text",title:"3.2.2. Giao thoa khe Young – Ví dụ",w2:true,
  prob:'<em>VD:</em> Hai khe Young cách nhau một khoảng <em>d = 1 mm</em>, được chiếu bằng ánh sáng đơn sắc <em>λ = 0,6 µm</em>. Màn quan sát đặt cách mặt phẳng chứa 2 khe một đoạn <em>L = 2 m</em>.<ol type="a"><li>Tìm khoảng vân giao thoa.</li><li>Xác định vị trí hai vân sáng (tối) đầu tiên.</li></ol>',
  art:"young2",
  speech:"Giờ là một ví dụ trọn vẹn. Hai khe Young cách nhau d bằng một milimét, được chiếu bằng ánh sáng đơn sắc có bước sóng không phẩy sáu micromét. Màn đặt cách hai khe hai mét. Câu a: tìm khoảng vân. Câu b: xác định vị trí hai vân sáng và hai vân tối đầu tiên. Gợi ý: nhớ đổi đơn vị về mét trước khi tính nhé."},
 {type:"text",title:"3.2.2. Giao thoa khe Young – Ví dụ – Lời giải",w2:true,
  steps:[{h:"a) Khoảng vân: i = λL / d = 0,6·10⁻⁶ · 2 / 10⁻³",f:"i = 1,2 mm"},
         {h:"b) Vân sáng thứ nhất (k = 1): y = k·i = 1 · 1,2",f:"yₛ₁ = 1,2 mm"},
         {h:"b) Vân sáng thứ hai (k = 2): y = k·i = 2 · 1,2",f:"yₛ₂ = 2,4 mm"},
         {h:"Vân tối đầu tiên (k = 0, 1): y = (k + ½)·i",f:"yₜ₁ = 0,6 mm; yₜ₂ = 1,8 mm"}],
  answer:"i = 1,2 mm; yₛ₁ = 1,2 mm; yₛ₂ = 2,4 mm",
  art:"fringe2",
  speech:"Lời giải. Câu a: khoảng vân i bằng lambda L chia d, bằng không phẩy sáu nhân mười mũ trừ sáu, nhân hai, chia mười mũ trừ ba, ra một phẩy hai milimét. Câu b: vân sáng thứ nhất ứng với k bằng một, nên y bằng một phẩy hai milimét. Vân sáng thứ hai ứng với k bằng hai, nên y bằng hai phẩy bốn milimét. Còn hai vân tối đầu tiên ứng với k bằng không và k bằng một, nên y bằng không phẩy sáu milimét và một phẩy tám milimét. Để ý vân tối luôn nằm giữa hai vân sáng, cách vân sáng một nửa khoảng vân."},
 {type:"text",title:"3.2.2. Giao thoa khe Young – Ví dụ",w2:true,
  prob:'<em>VD:</em> Thí nghiệm về GTAS. Biết <em>d = 1 mm</em>, <em>L = 1 m</em>. Khoảng cách từ vân sáng bậc 4 đến vân sáng thứ 10 cùng bên là <em>3,6 mm</em>.<ol type="a"><li>Bước sóng ánh sáng là bao nhiêu?</li><li>Vân tối thứ 4 cách vân trung tâm?</li></ol>',
  art:"young3",
  speech:"Thêm một ví dụ nữa. Trong thí nghiệm giao thoa ánh sáng, khoảng cách giữa hai khe d bằng một milimét, khoảng cách từ hai khe đến màn L bằng một mét. Khoảng cách từ vân sáng bậc bốn đến vân sáng bậc mười, ở cùng một bên, là ba phẩy sáu milimét. Câu a: bước sóng ánh sáng là bao nhiêu? Câu b: vân tối thứ tư cách vân trung tâm bao nhiêu? Gợi ý: từ vân bậc bốn đến vân bậc mười có mấy khoảng vân?"},
 {type:"text",title:"3.2.2. Giao thoa khe Young – Ví dụ – Lời giải",w2:true,
  steps:[{h:"Từ vân sáng bậc 4 đến bậc 10 có 10 − 4 = 6 khoảng vân",f:"6i = 3,6 mm ⟹ i = 0,6 mm"},
         {h:"a) Từ i = λL / d suy ra λ = i·d / L = 0,6·10⁻³ · 10⁻³ / 1",f:"λ = 0,6·10⁻⁶ m = 0,6 µm"},
         {h:"b) Vân tối thứ 4: k = 3, y = (k + ½)·i = 3,5 · 0,6",f:"yₜ₄ = 2,1 mm"}],
  answer:"λ = 0,6 µm; vân tối thứ 4 cách vân trung tâm 2,1 mm",
  art:"fringe2",
  speech:"Lời giải. Từ vân sáng bậc bốn đến bậc mười có mười trừ bốn bằng sáu khoảng vân, nên sáu i bằng ba phẩy sáu milimét, suy ra i bằng không phẩy sáu milimét. Câu a: từ i bằng lambda L chia d, ta có lambda bằng i nhân d chia L, bằng không phẩy sáu nhân mười mũ trừ ba, nhân mười mũ trừ ba, chia một, ra không phẩy sáu micromét. Câu b: vân tối thứ tư ứng với k bằng ba, nên y bằng ba phẩy năm nhân i, bằng hai phẩy một milimét."},
 {type:"text",title:"Câu hỏi trắc nghiệm 12",
  body:"Trong thí nghiệm giao thoa ánh sáng của Young trong không khí, hai khe cách nhau 3 mm được chiếu bằng ánh sáng đơn sắc có bước sóng 0,60 µm, màn cách hai khe 2 m. Sau đó đặt toàn bộ thí nghiệm vào trong nước có chiết suất 4/3, khoảng vân quan sát trên màn là bao nhiêu?",
  opts:["i′ = 0,4 m","i′ = 0,3 m","i′ = 0,4 mm","i′ = 0,3 mm"],
  speech:"Câu trắc nghiệm số mười hai. Trong thí nghiệm giao thoa Young trong không khí, hai khe cách nhau ba milimét, được chiếu bằng ánh sáng đơn sắc có bước sóng không phẩy sáu mươi micromét, màn cách hai khe hai mét. Sau đó đặt cả thí nghiệm vào nước có chiết suất bốn phần ba. Khoảng vân quan sát trên màn bây giờ là bao nhiêu? A: i phẩy bằng không phẩy bốn mét. B: không phẩy ba mét. C: không phẩy bốn milimét. D: không phẩy ba milimét. Gợi ý: trong nước bước sóng ngắn lại, vậy khoảng vân sẽ thế nào?"},
 {type:"text",title:"Câu hỏi trắc nghiệm 12 – Lời giải",w2:true,
  steps:[{h:"Trong nước, bước sóng giảm: λ′ = λ / n = 0,60 / (4/3)",f:"λ′ = 0,45 µm"},
         {h:"Khoảng vân trong nước: i′ = λ′L / d = 0,45·10⁻⁶ · 2 / (3·10⁻³)",f:"i′ = 0,3·10⁻³ m = 0,3 mm"},
         {h:"Kiểm tra: i′ = i / n = 0,4 mm / (4/3)",f:"i′ = 0,3 mm ⟹ chọn D"}],
  answer:"Đáp án đúng: D. i′ = 0,3 mm",
  art:"fringe2",
  speech:"Lời giải câu mười hai. Khi đặt thí nghiệm vào nước, bước sóng giảm n lần: lambda phẩy bằng không phẩy sáu mươi chia bốn phần ba, bằng không phẩy bốn mươi lăm micromét. Khoảng vân mới: i phẩy bằng lambda phẩy nhân L chia d, bằng không phẩy bốn mươi lăm nhân mười mũ trừ sáu, nhân hai, chia ba nhân mười mũ trừ ba, ra không phẩy ba milimét. Cách kiểm tra nhanh: trong không khí khoảng vân là không phẩy bốn milimét, vào nước thì giảm n lần, tức là không phẩy bốn chia bốn phần ba, đúng bằng không phẩy ba milimét. Vậy chọn D. Hai đáp án tính bằng mét thì quá lớn, loại ngay được."},
 {type:"text",title:"Câu hỏi trắc nghiệm 13",
  body:"Xét thí nghiệm giao thoa ánh sáng Young, biết L = 2,4 m. Khi sử dụng sóng ánh sáng có bước sóng λ₁ = 0,5 µm thì 15 vân sáng liên tiếp cách nhau 1 khoảng 3 cm. Khi sử dụng sóng ánh sáng có bước sóng λ₂ thì khoảng cách giữa 11 vân sáng liên tiếp cũng là 3 cm. Vậy λ₂ bằng bao nhiêu?",
  opts:["λ₂ = 0,2 µm","λ₂ = 0,4 µm","λ₂ = 0,35 µm","λ₂ = 0,7 µm"],
  speech:"Câu trắc nghiệm số mười ba. Xét thí nghiệm giao thoa Young, L bằng hai phẩy bốn mét. Với ánh sáng có bước sóng lambda một bằng không phẩy năm micromét, mười lăm vân sáng liên tiếp cách nhau ba xentimét. Khi đổi sang ánh sáng có bước sóng lambda hai, thì mười một vân sáng liên tiếp cũng cách nhau ba xentimét. Hỏi lambda hai bằng bao nhiêu? A: không phẩy hai micromét. B: không phẩy bốn micromét. C: không phẩy ba lăm micromét. D: không phẩy bảy micromét. Gợi ý: đếm cho đúng số khoảng vân giữa các vân nhé."},
 {type:"text",title:"Câu hỏi trắc nghiệm 13 – Lời giải",w2:true,
  steps:[{h:"15 vân sáng liên tiếp có 15 − 1 = 14 khoảng vân",f:"14·i₁ = 3 cm ⟹ i₁ = 3/14 cm"},
         {h:"11 vân sáng liên tiếp có 11 − 1 = 10 khoảng vân",f:"10·i₂ = 3 cm ⟹ i₂ = 3/10 cm"},
         {h:"Cùng L và d nên i tỉ lệ với λ: i₁ / i₂ = λ₁ / λ₂",f:"λ₂ = λ₁ · i₂ / i₁ = 0,5 · 14 / 10"},
         {h:"Kết quả",f:"λ₂ = 0,7 µm ⟹ chọn D"}],
  answer:"Đáp án đúng: D. λ₂ = 0,7 µm",
  art:"fringe2",
  speech:"Lời giải câu mười ba. Mười lăm vân sáng liên tiếp có mười bốn khoảng vân, nên mười bốn i một bằng ba xentimét, suy ra i một bằng ba phần mười bốn xentimét. Mười một vân sáng liên tiếp có mười khoảng vân, nên i hai bằng ba phần mười xentimét. Vì L và d không đổi, khoảng vân tỉ lệ với bước sóng, nên lambda hai bằng lambda một nhân i hai chia i một, bằng không phẩy năm nhân mười bốn chia mười, ra không phẩy bảy micromét. Vậy chọn D. Kết quả này cũng hợp lý: số khoảng vân ít đi nghĩa là vân thưa hơn, nên bước sóng phải dài hơn."},
 {type:"text",title:"3.2.3. Giao thoa bản mỏng",w2:true,
  items:["Nhìn lên những bản mỏng như: màng xà phòng, váng dầu trên mặt nước, lớp hơi nước đọng trên cửa kính… khi được chiếu bằng ánh sáng mặt trời ta sẽ thấy những màu sắc rất đẹp."],
  blocks:["Màu sắc của bản mỏng là do <em>sự giao thoa của các tia phản xạ trên hai mặt của bản mỏng</em> gây nên."],
  art:"thinfilm",
  speech:"Bây giờ ta sang giao thoa ở bản mỏng. Chắc các bạn từng thấy váng dầu trên mặt nước, hay bong bóng xà phòng, có những màu sắc rất đẹp khi gặp ánh nắng mặt trời. Lớp hơi nước đọng trên cửa kính cũng vậy. Những màu sắc đó không phải do chất màu, mà do sự giao thoa của các tia phản xạ trên hai mặt của bản mỏng."},
 {type:"text",title:"3.2.3. Giao thoa bản mỏng",sub:"Thí nghiệm Lloyd về giao thoa do phản xạ",w2:true,
  items:["Những điểm M mà lí thuyết dự đoán là **sáng** thì lại **tối** và ngược lại.","→ chứng tỏ **pha** của sóng phản xạ đã đổi pha khi ánh sáng phản xạ trên bề mặt môi trường có **chiết suất lớn hơn** môi trường tới."],
  art:"lloyd",
  speech:"Trước khi vào bản mỏng, ta xem một thí nghiệm rất hay của Lloyd. Ánh sáng từ nguồn đến màn theo hai đường: một đường đi thẳng, một đường phản xạ trên gương, rồi hai chùm này giao thoa với nhau. Theo lý thuyết, có những điểm M phải sáng, nhưng thực tế lại tối, và ngược lại. Điều đó chứng tỏ pha của sóng đã bị đổi khi phản xạ trên gương. Tổng quát: ánh sáng phản xạ trên bề mặt môi trường có chiết suất lớn hơn môi trường tới sẽ đổi pha một trăm tám mươi độ. Quy tắc này chính là câu trắc nghiệm số sáu ta vừa gặp, và nó sẽ giúp ta giải thích màu sắc của bản mỏng."},
 {type:"text",title:"3.2.3. Giao thoa bản mỏng – Vân tròn Newton",w2:true,
  blocks:["<em>Hiệu quang lộ:</em> L<sub>1</sub> − L<sub>2</sub> = 2d + λ/2 <small>(n<sub>tt</sub> &gt; n<sub>kk</sub>: hai tia lệch pha 180°, hiệu quang lộ tăng λ/2)</small>",
          "<em>Vị trí vân tối:</em> d<sub>t</sub> = k·λ/2",
          "<em>Vị trí vân sáng:</em> d<sub>s</sub> = (k − 1/2)·λ/2",
          "<em>Bán kính vân tối thứ k:</em> r<sub>k</sub>² = R² − (R − d<sub>k</sub>)² ≈ 2R·d<sub>k</sub>"],
  fhtml:"r<sub>k</sub> = √(k·R·λ) , k = 1, 2, 3, …",art:"newton",
  speech:"Giờ đến vân tròn Newton. Ta đặt một thấu kính phẳng lồi lên một tấm thủy tinh phẳng, giữa chúng là một lớp không khí mỏng có bề dày d. Hai tia phản xạ trên hai mặt của lớp không khí này giao thoa với nhau. Một trong hai tia phản xạ trên mặt thủy tinh, có chiết suất lớn hơn, nên bị đổi pha một trăm tám mươi độ. Vì vậy hiệu quang lộ là L một trừ L hai bằng hai d cộng lambda chia hai. Từ đó, vân tối ứng với d bằng k nhân lambda chia hai, và vân sáng ứng với d bằng, k trừ một phần hai, nhân lambda chia hai. Để tìm bán kính vân, ta dùng hình học: r k bình phương bằng R bình phương trừ, R trừ d k, bình phương, xấp xỉ hai R d k. Thay d bằng k lambda chia hai, ta được bán kính vân tối thứ k bằng căn của k nhân R nhân lambda, với k bằng một, hai, ba, và cứ thế."},
 {type:"text",title:"3.2.3. Vân tròn Newton – Ví dụ",w2:true,
  prob:'<em>VD:</em> Một chùm sáng đơn sắc <em>λ = 0,6 µm</em> rọi vuông góc với hệ thống tạo vân tròn Newton. Tìm bề dày lớp không khí:<ol type="a"><li>Vân sáng đầu tiên</li><li>Tại vị trí vân tối thứ 4</li></ol>',
  art:"newton",
  speech:"Thử áp dụng nhé. Một chùm sáng đơn sắc có bước sóng không phẩy sáu micromét rọi vuông góc vào hệ thống vân tròn Newton. Hãy tìm bề dày lớp không khí: câu a, tại vân sáng đầu tiên; câu b, tại vân tối thứ tư. Gợi ý: dùng công thức vị trí vân sáng và vân tối theo bề dày d."},
 {type:"text",title:"3.2.3. Vân tròn Newton – Ví dụ – Lời giải",w2:true,
  steps:[{h:"a) Vân sáng đầu tiên (k = 1): dₛ = (k − ½)·λ/2 = ½ · 0,6/2",f:"dₛ = 0,15 µm"},
         {h:"b) Vân tối thứ 4 (k = 4): dₜ = k·λ/2 = 4 · 0,6/2",f:"dₜ = 1,2 µm"}],
  answer:"dₛ = 0,15 µm; dₜ₄ = 1,2 µm",
  art:"newton",
  speech:"Lời giải. Câu a: vân sáng đầu tiên ứng với k bằng một, nên d s bằng, k trừ một phần hai, nhân lambda chia hai, bằng một phần hai nhân không phẩy sáu chia hai, ra không phẩy mười lăm micromét. Câu b: vân tối thứ tư ứng với k bằng bốn, nên d t bằng k nhân lambda chia hai, bằng bốn nhân không phẩy sáu chia hai, ra một phẩy hai micromét. Lưu ý ở đây ta đếm vân tối theo k bằng một, hai, ba, không tính điểm tối ở tâm."},
 {type:"text",title:"3.2.3. Vân tròn Newton – Ví dụ",w2:true,
  prob:'<em>VD:</em> Chiếu chùm sáng đơn sắc vào hệ tạo vân tròn Newton, bán kính mặt lồi thấu kính <em>R = 6,4 m</em>. Bán kính 2 vân tối kế tiếp là <em>4 mm</em> và <em>4,38 mm</em>. Xác định bước sóng chùm sáng tới và số thứ tự của vân trên.',
  art:"newton",
  speech:"Một bài nữa về vân tròn Newton. Chiếu chùm sáng đơn sắc vào hệ vân tròn Newton, bán kính mặt lồi của thấu kính R bằng sáu phẩy bốn mét. Bán kính của hai vân tối kế tiếp là bốn milimét và bốn phẩy ba tám milimét. Hãy xác định bước sóng của chùm sáng và số thứ tự của các vân đó. Gợi ý: viết công thức bán kính cho hai vân liên tiếp, rồi lấy hiệu hai bình phương."},
 {type:"text",title:"3.2.3. Vân tròn Newton – Ví dụ – Lời giải",w2:true,
  steps:[{h:"Bán kính vân tối: r² = k·R·λ. Hai vân kế tiếp: rₖ = 4 mm, rₖ₊₁ = 4,38 mm",f:"rₖ₊₁² − rₖ² = R·λ"},
         {h:"Bước sóng: λ = (4,38² − 4²)·10⁻⁶ / 6,4",f:"λ ≈ 0,5·10⁻⁶ m = 0,5 µm"},
         {h:"Số thứ tự: k = rₖ² / (R·λ) = 4²·10⁻⁶ / (6,4 · 0,5·10⁻⁶)",f:"k = 5 ⟹ vân tối thứ 5 và thứ 6"}],
  answer:"λ ≈ 0,5 µm; hai vân tối thứ 5 (4 mm) và thứ 6 (4,38 mm)",
  art:"newton",
  speech:"Lời giải. Bán kính vân tối thứ k thỏa r bình phương bằng k nhân R nhân lambda. Hai vân tối kế tiếp có bán kính bốn milimét và bốn phẩy ba tám milimét, nên ta lấy hiệu hai bình phương: r k cộng một bình phương trừ r k bình phương bằng R nhân lambda. Suy ra lambda bằng, bốn phẩy ba tám bình phương trừ bốn bình phương, nhân mười mũ trừ sáu, chia sáu phẩy bốn, khoảng không phẩy năm micromét. Có lambda rồi, ta tìm số thứ tự: k bằng r k bình phương chia R lambda, bằng mười sáu nhân mười mũ trừ sáu, chia ba phẩy hai nhân mười mũ trừ sáu, bằng năm. Vậy hai vân đó là vân tối thứ năm và vân tối thứ sáu."},
 {"type": "text", "title": "3.2.4. Ứng dụng của giao thoa", "w2": true, "items": ["**Màng chống phản xạ:** phủ lên thấu kính một lớp mỏng có bề dày d = λ/(4n) để hai tia phản xạ ở hai mặt lớp màng triệt tiêu nhau, ánh sáng truyền qua nhiều hơn.", "**Kiểm tra độ phẳng** của bề mặt quang học bằng vân giao thoa của nêm không khí hoặc vân tròn Newton.", "**Giao thoa kế:** đo chiều dài, chiết suất, độ dịch chuyển nhỏ với độ chính xác cỡ bước sóng."], "speech": "Giao thoa không chỉ đẹp mà còn rất hữu ích. Ứng dụng đầu tiên là màng chống phản xạ. Ta phủ lên thấu kính một lớp mỏng có bề dày d bằng lambda chia bốn n. Khi đó hai tia phản xạ ở hai mặt của lớp màng triệt tiêu nhau, nên ánh sáng phản xạ ít đi và ánh sáng truyền qua nhiều hơn. Ứng dụng thứ hai là kiểm tra độ phẳng của bề mặt quang học, dựa vào hình dạng vân giao thoa của nêm không khí hoặc vân tròn Newton. Ứng dụng thứ ba là giao thoa kế, dùng để đo chiều dài, chiết suất, hay độ dịch chuyển rất nhỏ, với độ chính xác cỡ bước sóng."},
 {type:"text",title:"3.2.4. Ứng dụng đọc đĩa CD, DVD",w2:true,
  items:["Dữ liệu trên các CD, DVD được lưu trữ kỹ thuật số dưới dạng một chuỗi các số không và số một, các số không và số một này được đọc bằng ánh sáng laser phản chiếu từ đĩa.","Phản xạ mạnh (giao thoa **tăng cường**) từ đĩa được chọn để đại diện cho các **số không**, và phản xạ yếu (giao thoa **triệt tiêu**) đại diện cho các **số một**."],
  art:"cddisc",
  speech:"Một ứng dụng thú vị nữa là đọc đĩa CD, DVD. Dữ liệu trên đĩa được lưu dưới dạng một chuỗi các số không và số một. Để đọc, máy chiếu chùm tia laser vào đĩa rồi xem ánh sáng phản chiếu trở lại. Nếu phản xạ mạnh, do giao thoa tăng cường, thì đó là số không. Nếu phản xạ yếu, do giao thoa triệt tiêu, thì đó là số một. Vậy máy chỉ cần nhận biết ánh sáng phản xạ mạnh hay yếu là đọc ra được cả bộ phim hay bài hát."},
 {"type": "text", "title": "3.3. Sự nhiễu xạ ánh sáng", "sub": "3.3.1. Khái niệm", "w2": true, "items": ["**Nhiễu xạ ánh sáng:** hiện tượng ánh sáng lệch khỏi phương truyền thẳng, uốn quanh mép vật cản hoặc đi qua khe hẹp.", "Quan sát rõ khi kích thước khe hoặc vật cản **cỡ bước sóng** λ.", "**Nguyên lý Huygens – Fresnel:** mỗi điểm trên mặt sóng là nguồn sóng thứ cấp, các sóng thứ cấp giao thoa với nhau để tạo nên hình nhiễu xạ.", "Có hai loại: nhiễu xạ **Fresnel** (nguồn hoặc màn ở gần khe) và **Fraunhofer** (nguồn và màn ở xa vô cùng)."], "speech": "Chúng ta chuyển sang nhiễu xạ ánh sáng. Nhiễu xạ là hiện tượng ánh sáng bị lệch khỏi phương truyền thẳng, uốn quanh mép vật cản hoặc đi qua khe hẹp. Giống như bạn đứng sau góc tường vẫn nghe được tiếng nói, vì sóng âm cũng nhiễu xạ. Với ánh sáng, hiện tượng này rõ nhất khi kích thước khe hay vật cản cỡ bước sóng. Để giải thích, ta dùng nguyên lý Huygens Fresnel: mỗi điểm trên mặt sóng là một nguồn sóng thứ cấp, và các sóng thứ cấp giao thoa với nhau tạo ra hình nhiễu xạ. Có hai loại: nhiễu xạ Fresnel, khi nguồn hoặc màn ở gần khe, và nhiễu xạ Fraunhofer, khi nguồn và màn ở xa vô cùng."},
 {type:"text",title:"3.3.2. Nhiễu xạ khe hẹp",w2:true,
  items:["Một vân sáng trung tâm, rộng được bao quanh bởi các vân sáng yếu hơn nhiều, xen kẽ với các vân tối.","Vị trí mỗi đỉnh vân sáng xấp xỉ một nửa khoảng cách giữa các vân tối.","Cực đại sáng trung tâm rộng **gấp hai lần** các cực đại phụ.","Không có vân tối trung tâm."],
  art:"slit",
  speech:"Giờ là nhiễu xạ qua khe hẹp. Hình nhiễu xạ có một vân sáng trung tâm, rộng và rất sáng, hai bên là các vân sáng yếu hơn nhiều, xen kẽ với các vân tối. Đỉnh của mỗi vân sáng nằm xấp xỉ ở giữa hai vân tối. Có hai điều cần nhớ: vân sáng trung tâm rộng gấp hai lần các vân sáng phụ, và chính giữa là vân sáng chứ không phải vân tối."},
 {"type": "text", "title": "3.3.2. Nhiễu xạ khe hẹp", "sub": "Điều kiện cực tiểu", "w2": true, "items": ["Khe hẹp có bề rộng **a**, màn đặt cách khe một đoạn **L**. Vân tối (cực tiểu nhiễu xạ) xuất hiện ở các góc θ thỏa điều kiện bên dưới.", "Với góc nhỏ, bề rộng vân sáng trung tâm trên màn là **2λL / a**: khe càng hẹp thì vân trung tâm càng rộng."], "fhtml": "a·sinθ = m·λ , m = ±1, ±2, …", "art": "slit2", "speech": "Vân tối của nhiễu xạ khe hẹp xuất hiện ở các góc theta thỏa a nhân sin theta bằng m lambda, trong đó a là bề rộng khe, và m bằng cộng trừ một, cộng trừ hai, và cứ thế. Chú ý m không nhận giá trị không, vì ở tâm là vân sáng. Với góc nhỏ, bề rộng của vân sáng trung tâm trên màn là hai lambda L chia a, với L là khoảng cách từ khe đến màn. Nghĩa là khe càng hẹp thì vân trung tâm càng rộng, tức ánh sáng càng bị xòe ra nhiều. Nghe có vẻ ngược trực giác, nhưng đúng là như vậy."},
 {"type": "text", "title": "3.3.3. Nhiễu xạ cách tử", "w2": true, "items": ["**Cách tử nhiễu xạ:** rất nhiều khe hẹp song song, cách đều nhau với **chu kỳ cách tử d**.", "Cực đại chính ở góc θ thỏa điều kiện bên dưới (m = 0, ±1, ±2, …); số khe càng nhiều, cực đại càng **sáng và sắc nét**.", "Ánh sáng trắng bị **tán sắc** ở các bậc m ≠ 0; cực đại giữa (m = 0) vẫn trắng.", "Ứng dụng: máy quang phổ."], "fhtml": "d·sinθ = m·λ", "art": "gratingd", "speech": "Tiếp theo là nhiễu xạ qua cách tử. Cách tử là hệ gồm rất nhiều khe hẹp song song và cách đều nhau, khoảng cách giữa hai khe kế tiếp gọi là chu kỳ cách tử d. Các cực đại chính nằm ở góc theta thỏa d nhân sin theta bằng m lambda, với m bằng không, cộng trừ một, cộng trừ hai, và cứ thế. Càng nhiều khe thì các cực đại càng sáng và sắc nét. Nếu chiếu ánh sáng trắng, mỗi màu có bước sóng khác nhau nên lệch theo góc khác nhau, tạo ra quang phổ ở các bậc m khác không. Riêng cực đại giữa, m bằng không, vẫn là màu trắng. Nhờ vậy, cách tử được dùng trong máy quang phổ để phân tích và đo bước sóng ánh sáng."},
 {type:"text",title:"3.4. Sự phân cực ánh sáng",sub:"3.4.1. Ánh sáng tự nhiên, ánh sáng phân cực",w2:true,
  items:["**Ánh sáng tự nhiên:** là ánh sáng mà véctơ dao động sáng có đủ mọi phương trong mặt phẳng vuông góc với phương truyền và có biên độ bằng nhau."],
  art:"natlight",
  speech:"Bây giờ sang phần phân cực ánh sáng. Ánh sáng là sóng ngang, nên véctơ dao động sáng vuông góc với phương truyền. Ánh sáng tự nhiên là ánh sáng mà véctơ dao động có đủ mọi phương trong mặt phẳng vuông góc với phương truyền, và biên độ theo các phương đều bằng nhau. Bạn có thể hình dung như các mũi tên chỉ hướng dao động tỏa ra mọi phía quanh tia sáng."},
 {type:"text",title:"3.4. Sự phân cực ánh sáng",sub:"3.4.1. Ánh sáng tự nhiên, ánh sáng phân cực",w:true,
  items:["**Ánh sáng phân cực toàn phần:** là ánh sáng mà véc tơ dao động sáng chỉ có một phương duy nhất.","Một số môi trường gây ra hiện tượng **phân cực một phần**, tức là vẫn cho ánh sáng tự nhiên đi qua theo mọi phương, nhưng có phương nhiều, phương ít."],
  art:"polar2",
  speech:"Đối lập với ánh sáng tự nhiên là ánh sáng phân cực. Ánh sáng phân cực toàn phần là ánh sáng mà véctơ dao động sáng chỉ có một phương duy nhất, như hình bên trái: ánh sáng tự nhiên đi qua một tấm lọc thì chỉ còn dao động theo một phương. Còn phân cực một phần thì nằm ở giữa: ánh sáng vẫn có mặt theo mọi phương, nhưng có phương nhiều, phương ít, như hình bên phải. Một số môi trường gây ra hiện tượng này."},
 {type:"text",title:"Câu hỏi trắc nghiệm 14",
  body:"Ánh sáng chiếu từ môi trường 1 vào môi trường 2 có thể bị phản xạ toàn phần khi chiết suất của hai môi trường thỏa điều kiện nào?",
  opts:["n₁ = n₂","n₁ < n₂","n₁ > n₂","n₁ và n₂ phải bằng 1."],
  speech:"Câu trắc nghiệm số mười bốn. Ánh sáng chiếu từ môi trường một vào môi trường hai, có thể bị phản xạ toàn phần khi chiết suất hai môi trường thỏa điều kiện nào? A: n một bằng n hai. B: n một nhỏ hơn n hai. C: n một lớn hơn n hai. D: n một và n hai phải bằng một. Gợi ý: nhớ lại ánh sáng phải đi từ môi trường nào sang môi trường nào."},
 {type:"text",title:"Câu hỏi trắc nghiệm 14 – Lời giải",w2:true,
  steps:[{h:"Phản xạ toàn phần chỉ xảy ra khi ánh sáng đi từ môi trường chiết suất lớn sang môi trường chiết suất nhỏ hơn",f:"n₁ > n₂"},
         {h:"Góc giới hạn: sin θC = n₂ / n₁ (phải có n₂ / n₁ < 1)",f:"n₁ > n₂ ⟹ chọn C"}],
  answer:"Đáp án đúng: C. n₁ > n₂",
  art:"tir",
  speech:"Lời giải câu mười bốn. Nhớ điều kiện của phản xạ toàn phần: ánh sáng phải đi từ môi trường chiết suất lớn sang môi trường chiết suất nhỏ hơn, tức là n một lớn hơn n hai. Lý do là góc tới hạn được tính từ sin theta C bằng n hai chia n một, mà sin thì không thể lớn hơn một, nên n hai chia n một phải nhỏ hơn một. Vậy chọn đáp án C."},
 {"type": "text", "title": "3.4. Sự phân cực ánh sáng", "sub": "Định luật Malus", "w2": true, "items": ["Ánh sáng tự nhiên đi qua kính phân cực cho ánh sáng phân cực thẳng, cường độ giảm còn **một nửa**: I = I₀ / 2.", "Ánh sáng phân cực thẳng cường độ I₀ đi qua kính phân tích có phương hợp với phương phân cực một góc θ thì cường độ ra là:", "θ = 0°: I = I₀ (sáng nhất); θ = 90°: I = 0 (tối hoàn toàn)."], "fhtml": "I = I₀·cos²θ", "art": "malus", "w2": true, "speech": "Giờ ta xem ánh sáng bị phân cực qua kính phân cực như thế nào. Khi ánh sáng tự nhiên đi qua một kính phân cực, ta thu được ánh sáng phân cực thẳng, và cường độ giảm còn một nửa, tức I bằng I không chia hai. Tiếp theo, cho ánh sáng phân cực thẳng, cường độ I không, đi qua một kính thứ hai gọi là kính phân tích. Nếu phương của kính này hợp với phương phân cực một góc theta, thì cường độ ánh sáng ra là I bằng I không nhân cos bình phương theta. Đây là định luật Malus. Hai trường hợp đặc biệt dễ nhớ: theta bằng không thì ánh sáng đi qua hết, còn theta bằng chín mươi độ thì ánh sáng bị chặn hoàn toàn."},
 {"type": "text", "title": "3.4. Sự phân cực ánh sáng", "sub": "Ứng dụng: phân cực do phản xạ", "w2": true, "items": ["Khi ánh sáng tự nhiên phản xạ trên mặt phân cách giữa hai môi trường, tia phản xạ bị phân cực một phần.", "Khi góc tới bằng **góc Brewster** θB, tia phản xạ phân cực hoàn toàn (dao động vuông góc với mặt phẳng tới) và vuông góc với tia khúc xạ.", "Ứng dụng: kính râm phân cực lọc ánh sáng chói phản xạ từ mặt nước, mặt đường."], "fhtml": "tanθ<sub>B</sub> = <span class=\"fr\"><span>n₂</span><span>n₁</span></span>", "art": "brewster", "speech": "Phân cực không chỉ xảy ra khi qua kính lọc, mà còn khi ánh sáng phản xạ. Khi ánh sáng tự nhiên phản xạ trên mặt phân cách giữa hai môi trường, tia phản xạ bị phân cực một phần. Đặc biệt, nếu góc tới đúng bằng góc Brewster, tia phản xạ phân cực hoàn toàn, dao động vuông góc với mặt phẳng tới, và lúc đó tia phản xạ vuông góc với tia khúc xạ. Góc Brewster được tính từ tang theta B bằng n hai chia n một. Ứng dụng quen thuộc là kính râm phân cực: nó lọc bớt ánh sáng chói phản xạ từ mặt nước hay mặt đường, giúp bạn nhìn rõ hơn."},
 {"type": "text", "title": "3.4. Sự phân cực ánh sáng", "sub": "Ứng dụng: phân cực do tán xạ", "w2": true, "items": ["Ánh sáng Mặt Trời bị các phân tử khí quyển **tán xạ** trở thành ánh sáng phân cực một phần, mạnh nhất theo phương vuông góc với tia sáng Mặt Trời.", "Tán xạ Rayleigh tỉ lệ nghịch với λ⁴ nên ánh sáng xanh bị tán xạ mạnh hơn ánh sáng đỏ: bầu trời có màu xanh.", "Ứng dụng: kính lọc phân cực trong nhiếp ảnh làm sẫm bầu trời, tăng độ tương phản của ảnh."], "speech": "Ánh sáng còn bị phân cực khi tán xạ. Ánh sáng Mặt Trời đi qua khí quyển bị các phân tử khí tán xạ, và trở thành ánh sáng phân cực một phần, mạnh nhất theo phương vuông góc với tia sáng Mặt Trời. Tán xạ Rayleigh tỉ lệ nghịch với lambda mũ bốn, nên ánh sáng bước sóng ngắn như xanh bị tán xạ mạnh hơn ánh sáng đỏ. Đó là lý do bầu trời có màu xanh. Trong nhiếp ảnh, người ta dùng kính lọc phân cực để làm sẫm bầu trời, giúp ảnh có độ tương phản cao hơn."},
 {"type": "text", "title": "3.4. Sự phân cực ánh sáng", "sub": "Ứng dụng: tinh thể lỏng", "w2": true, "items": ["Tinh thể lỏng đặt giữa hai kính phân cực có phương vuông góc nhau. Khi **không có điện áp**, các phân tử xoay mặt phẳng phân cực 90°, ánh sáng đi qua: điểm ảnh **sáng**.", "Khi **đặt điện áp**, các phân tử đổi hướng, không còn xoay mặt phẳng phân cực nên ánh sáng bị kính thứ hai chặn lại: điểm ảnh **tối**.", "Ứng dụng: màn hình LCD của đồng hồ, máy tính, điện thoại, ti vi."], "speech": "Một ứng dụng rất gần gũi của phân cực là màn hình LCD. Tinh thể lỏng được đặt giữa hai kính phân cực có phương vuông góc nhau. Khi chưa đặt điện áp, các phân tử xoay mặt phẳng phân cực đi chín mươi độ, nên ánh sáng đi qua được kính thứ hai, điểm ảnh sáng. Khi đặt điện áp, các phân tử đổi hướng và không còn xoay nữa, nên ánh sáng bị kính thứ hai chặn lại, điểm ảnh tối. Điều khiển điện áp ở từng điểm ảnh là ta tạo ra hình ảnh trên đồng hồ, máy tính, điện thoại hay ti vi."},
 {"type": "text", "title": "3.5. Các dụng cụ quang học", "sub": "Mắt", "w2": true, "items": ["Gồm **giác mạc**, **thủy tinh thể** (thấu kính hội tụ có độ tụ thay đổi để điều tiết) và **võng mạc** (màn thu ảnh).", "Ảnh của vật trên võng mạc là ảnh **thật, ngược chiều, nhỏ hơn vật**.", "Mắt thường: điểm cực cận cách mắt khoảng 25 cm, điểm cực viễn ở vô cực.", "Mắt cận thị đeo kính **phân kỳ**; mắt viễn thị đeo kính **hội tụ**."], "art": "eye76", "speech": "Sang phần các dụng cụ quang học quen thuộc, bắt đầu từ chính đôi mắt của bạn. Mắt gồm giác mạc, thủy tinh thể và võng mạc. Thủy tinh thể là một thấu kính hội tụ có thể thay đổi độ tụ để điều tiết, còn võng mạc là màn thu ảnh. Ảnh của vật trên võng mạc là ảnh thật, ngược chiều và nhỏ hơn vật, nhưng não bộ tự lật lại để ta thấy đúng chiều. Mắt thường nhìn rõ từ điểm cực cận, cách mắt khoảng hai mươi lăm xentimét, đến điểm cực viễn ở vô cực. Mắt cận thị đeo kính phân kỳ, còn mắt viễn thị đeo kính hội tụ."},
 {"type": "text", "title": "3.5. Các dụng cụ quang học", "sub": "Camera", "w2": true, "items": ["Vật kính là thấu kính hội tụ, tạo ảnh **thật, ngược chiều, nhỏ hơn vật** trên cảm biến (hoặc phim).", "Công thức thấu kính (d: khoảng cách vật, d′: khoảng cách ảnh, f: tiêu cự):", "**Khẩu độ** điều chỉnh lượng ánh sáng vào máy; thời gian mở cửa trập quyết định độ sáng và độ nhòe do chuyển động."], "fhtml": "<span class=\"fr\"><span>1</span><span>f</span></span> = <span class=\"fr\"><span>1</span><span>d</span></span> + <span class=\"fr\"><span>1</span><span>d′</span></span>", "art": "camera77", "speech": "Máy ảnh hoạt động khá giống con mắt. Vật kính là thấu kính hội tụ, tạo ảnh thật, ngược chiều, nhỏ hơn vật trên cảm biến hoặc phim. Vị trí ảnh được tính bằng công thức thấu kính: một chia f bằng một chia d cộng một chia d phẩy, với d là khoảng cách từ vật đến kính, d phẩy là khoảng cách từ ảnh đến kính, f là tiêu cự. Hai thông số ảnh hưởng đến độ sáng của ảnh là khẩu độ, tức độ mở của ống kính, và thời gian mở cửa trập. Khẩu độ càng lớn, mở càng lâu thì ảnh càng sáng, nhưng mở lâu quá thì vật chuyển động sẽ bị nhòe."},
 {"type": "text", "title": "3.5. Các dụng cụ quang học", "sub": "Kính hiển vi", "w2": true, "items": ["Gồm hai thấu kính hội tụ tiêu cự ngắn: **vật kính** tạo ảnh thật lớn hơn vật, **thị kính** hoạt động như kính lúp cho ảnh ảo.", "Độ bội giác khi ngắm chừng ở vô cực (δ: độ dài quang học của kính, Đ = 25 cm):"], "fhtml": "G<sub>∞</sub> = <span class=\"fr\"><span>δ·Đ</span><span>f₁·f₂</span></span>", "art": "microscope", "speech": "Muốn nhìn các vật rất nhỏ, ta dùng kính hiển vi. Kính hiển vi gồm hai thấu kính hội tụ có tiêu cự ngắn. Vật kính tạo ra một ảnh thật lớn hơn vật, rồi thị kính hoạt động như một chiếc kính lúp, phóng tiếp ảnh đó thành ảnh ảo để mắt quan sát. Khi ngắm chừng ở vô cực, độ bội giác bằng delta nhân Đ chia tích f một nhân f hai, trong đó delta là độ dài quang học của kính, Đ bằng hai mươi lăm xentimét. Nghĩa là tiêu cự của hai kính càng ngắn thì độ bội giác càng lớn."},
 {"type": "text", "title": "3.5. Các dụng cụ quang học", "sub": "Kính thiên văn", "w2": true, "items": ["Vật kính có tiêu cự dài, thị kính có tiêu cự ngắn; khi ngắm chừng ở vô cực, hai kính cách nhau **f₁ + f₂**.", "Độ bội giác khi ngắm chừng ở vô cực:", "Kính thiên văn **phản xạ** dùng gương cầu lõm làm vật kính, giảm sắc sai và chế tạo được đường kính lớn."], "fhtml": "G<sub>∞</sub> = <span class=\"fr\"><span>f₁</span><span>f₂</span></span>", "art": "telescope79", "speech": "Còn để nhìn các vật ở rất xa, như các vì sao, ta dùng kính thiên văn. Vật kính có tiêu cự dài, thị kính có tiêu cự ngắn. Khi ngắm chừng ở vô cực, hai kính cách nhau f một cộng f hai, và độ bội giác bằng f một chia f hai. Vậy vật kính càng dài tiêu cự so với thị kính thì độ bội giác càng lớn. Ngoài loại dùng thấu kính, còn có kính thiên văn phản xạ, dùng gương cầu lõm làm vật kính. Loại này giảm được sắc sai và chế tạo được đường kính rất lớn."},
 {"type": "text", "title": "3.6. Đọc thêm", "sub": "Màu sắc", "w2": true, "items": ["Ánh sáng nhìn thấy có bước sóng khoảng **380 – 760 nm**, từ tím đến đỏ; mỗi bước sóng ứng với một màu đơn sắc.", "Trộn màu **cộng** (đỏ, lục, lam – RGB) dùng cho màn hình; trộn màu **trừ** (lục lam, đỏ tươi, vàng – CMY) dùng trong in ấn.", "Màu của vật phụ thuộc vào ánh sáng mà vật **hấp thụ và phản xạ chọn lọc**."], "art": "color80", "speech": "Phần đọc thêm đầu tiên là màu sắc. Ánh sáng nhìn thấy có bước sóng khoảng từ ba trăm tám mươi đến bảy trăm sáu mươi nanomet, từ tím đến đỏ, và mỗi bước sóng ứng với một màu đơn sắc. Khi trộn màu có hai cách. Trộn màu cộng, với ba màu đỏ, lục, lam, thường dùng cho màn hình. Trộn màu trừ, với lục lam, đỏ tươi và vàng, thường dùng trong in ấn. Còn màu của một vật là do vật hấp thụ và phản xạ chọn lọc ánh sáng. Ví dụ, lá cây có màu xanh vì nó phản xạ ánh sáng màu lục và hấp thụ phần lớn các màu còn lại."},
 {"type": "text", "title": "3.6. Đọc thêm", "sub": "Quang sai", "w2": true, "items": ["**Quang sai** là sai lệch của ảnh so với ảnh lý tưởng do thấu kính thật không hội tụ hoàn hảo.", "**Cầu sai:** tia gần trục và tia xa trục hội tụ ở các điểm khác nhau.", "**Sắc sai:** chiết suất phụ thuộc bước sóng nên các màu hội tụ ở các điểm khác nhau, ảnh bị viền màu.", "Khắc phục: ghép nhiều thấu kính, dùng thấu kính phi cầu, che bớt khẩu độ."], "speech": "Tiếp theo là quang sai. Thấu kính thật không hội tụ hoàn hảo như trong lý thuyết, nên ảnh bị sai lệch so với ảnh lý tưởng, đó gọi là quang sai. Có hai loại phổ biến. Cầu sai: tia gần trục và tia xa trục hội tụ ở các điểm khác nhau. Sắc sai: vì chiết suất phụ thuộc bước sóng, các màu hội tụ ở các điểm khác nhau, nên ảnh bị viền màu. Để khắc phục, người ta ghép nhiều thấu kính, dùng thấu kính phi cầu, hoặc che bớt khẩu độ. Đó là lý do ống kính máy ảnh tốt thường gồm nhiều thấu kính ghép lại với nhau."},
 {"type": "text", "title": "3.6. Đọc thêm", "sub": "Giao thoa kế Michelson", "w2": true, "items": ["**Gương bán mạ** tách chùm sáng thành hai chùm theo hai nhánh vuông góc; phản xạ trên M₁, M₂ rồi gặp lại và giao thoa.", "Dịch M₂ một đoạn Δd thì hiệu quang lộ đổi 2Δd; mỗi Δd = λ/2, vân dịch đúng **một vân**. Với N vân:", "Ứng dụng: đo chiều dài, chiết suất; máy dò sóng hấp dẫn LIGO."], "fhtml": "Δd = N·λ / 2", "art": "michelson", "speech": "Cuối cùng là giao thoa kế Michelson, một dụng cụ cực kỳ chính xác. Gương bán mạ tách chùm sáng thành hai chùm đi theo hai nhánh vuông góc, phản xạ trên hai gương M một và M hai, rồi gặp lại nhau và giao thoa. Giả sử dịch gương M hai một đoạn delta d, thì hiệu quang lộ đổi hai delta d. Cứ mỗi khi delta d bằng lambda chia hai, hệ vân dịch chuyển đúng một vân. Vậy nếu đếm được N vân dịch chuyển thì delta d bằng N lambda chia hai. Nhờ đó ta đo được chiều dài hay chiết suất với độ chính xác cỡ bước sóng. Giao thoa kế cũng là nguyên lý của các máy dò sóng hấp dẫn như LIGO."},
 {type:"ftable",title:"Tổng hợp công thức (1/5) – Khúc xạ",rows:[
  ["Quang lộ","L = c·t = n·s","c: vận tốc ánh sáng trong chân không; s: quãng đường hình học"],
  ["Chiết suất","n = "+FR("c","v"),"n ≥ 1, không có đơn vị"],
  ["Bước sóng và tần số","λ = v·T = "+FR("v","f")+" ⇒ v = f·λ","Tần số f không đổi khi ánh sáng đổi môi trường"],
  ["Định luật phản xạ","θ′₁ = θ₁","Góc phản xạ luôn bằng góc tới"],
  ["Định luật khúc xạ","n₁·sinθ₁ = n₂·sinθ₂","Tương đương "+FR("sinθ₂","sinθ₁")+" = "+FR("v₂","v₁")],
  ["Bước sóng khi đổi môi trường",FR("λ₁","λ₂")+" = "+FR("v₁","v₂")+" = "+FR("n₂","n₁"),"Chiết suất càng lớn, bước sóng càng ngắn"],
  ["Góc tới hạn","sinθ<sub>C</sub> = "+FR("n₂","n₁"),"Phản xạ toàn phần khi n₁ > n₂ và góc tới > θ<sub>C</sub>"]],
  speech:"Bảng tổng hợp công thức, phần một: phản xạ và khúc xạ. Đầu tiên là quang lộ: L bằng c nhân t, bằng n nhân s. Chiết suất n bằng c chia v. Bước sóng và tần số: lambda bằng v nhân T, bằng v chia f, nên v bằng f nhân lambda. Định luật phản xạ: góc phản xạ bằng góc tới. Định luật khúc xạ: n một sin theta một bằng n hai sin theta hai. Khi đổi môi trường, lambda một chia lambda hai bằng v một chia v hai, bằng n hai chia n một. Cuối cùng là góc tới hạn: sin theta C bằng n hai chia n một, áp dụng khi ánh sáng đi từ môi trường có chiết suất lớn sang môi trường có chiết suất nhỏ."},
 {type:"ftable",title:"Tổng hợp công thức (2/5) – Giao thoa sóng",rows:[
  ["Sóng tại nguồn O","E<sub>0</sub> = A sin ωt","Hai nguồn kết hợp có cùng dạng sóng"],

    return raw<.9?0:raw/Math.sqrt(CS[c].size||1);
  };
  const sc=sent.map((_,k)=>[0,...cardTexts.map((_,c)=>score(k,c))]);
  /* "Đáp án A:" / "B:" ... -> ép câu nhãn và câu ngay sau về đúng phương án */
  const isLab=sent.map(x=>/^(?:dap an\s+)?([a-d])\s*:$/.exec(x.t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[đĐ]/g,"d").toLowerCase().trim()));
  isLab.forEach((m,k)=>{
    if(!m||!letters)return;
    const c=letters.indexOf(m[1].toUpperCase());if(c<0)return;
    sc[k][c+1]+=50;if(k+1<nS&&!isLab[k+1])sc[k+1][c+1]+=50;
  });
  const M=nC+1,dp=[],bp=[];
  for(let k=0;k<nS;k++){
    dp.push(Array(M).fill(0));bp.push(Array(M).fill(0));
    for(let q=0;q<M;q++){
      let best=-1,arg=0;
      if(k===0){best=0;arg=q}
      else for(let p=0;p<=q;p++){if(dp[k-1][p]>=best){best=dp[k-1][p];arg=p}}
      dp[k][q]=sc[k][q]+best;bp[k][q]=arg;
    }
  }
  let q=0;for(let p=1;p<M;p++)if(dp[nS-1][p]>dp[nS-1][q])q=p;
  const a=Array(nS);
  for(let k=nS-1;k>=0;k--){a[k]=q-1;q=bp[k][q]}
  let any=false;
  for(let k=0;k<nS;k++){if(sc[k][a[k]+1]>0)any=true;else a[k]=k?a[k-1]:-1}
  if(!any)for(let k=0;k<nS;k++)a[k]=Math.min(nC-1,Math.floor(k*nC/nS));
  spread(a,nC);
  return {sent,assign:a};
}
function syncWanted(){return playing&&$("sync").checked&&!reducedMotion()}
function syncStart(){
  SY=null;
  if(!syncWanted())return;
  const cards=[...$("panel").querySelectorAll(SYNC_SEL)];
  if(!cards.length)return;
  const plan=planSync(cards.map(c=>c.textContent),slides[i].speech,cards.map(c=>c.classList.contains("opt")?((c.querySelector("i")||{}).textContent||""):""));
  cards.forEach(c=>{c.classList.remove("ax-card","ax-now");c.classList.add("ax-s","ax-pend")});
  SY={cards,sent:plan.sent,assign:plan.assign,now:-1};
}
function syncTo(pos,my){
  quizProgress(pos,my);
  const S=SY;if(!S||my!==token)return;
  let k=S.sent.findIndex(x=>pos<x.end);if(k<0)k=S.sent.length-1;
  const c=S.assign[k];if(c<=S.now)return;
  S.cards.forEach((el,j)=>{if(j<=c)el.classList.remove("ax-pend");el.classList.toggle("ax-now",j===c)});
  S.now=c;
}
function syncReveal(){
  SY=null;
  document.querySelectorAll("#panel .ax-pend,#panel .ax-now").forEach(e=>e.classList.remove("ax-pend","ax-now"));
}
function chunkSpans(t){
  const re=/[^.!?;:]+[.!?;:]?\s*/g;let m;const parts=[];
  while((m=re.exec(t)))parts.push({s:m[0],i:m.index});
  if(!parts.length)parts.push({s:t,i:0});
  const out=[];let cur="",st=0,en=0;
  for(const p of parts){
    if((cur+p.s).length>180&&cur){out.push({text:cur.trim(),start:st,end:en});cur=p.s;st=p.i;en=p.i+p.s.length}
    else{if(!cur)st=p.i;cur+=p.s;en=p.i+p.s.length}
  }
  if(cur.trim())out.push({text:cur.trim(),start:st,end:en});
  return out;
}
function stopSpeech(){
  token++;qtStop(true);try{synth&&synth.cancel()}catch(e){}
  if(audio){audio.onended=null;audio.onerror=null;audio.ontimeupdate=null;audio.pause();audio=null}
}
function chunks(t){
  const parts=t.match(/[^.!?;:]+[.!?;:]?\s*/g)||[t];const out=[];let cur="";
  for(const p of parts){if((cur+p).length>180&&cur){out.push(cur.trim());cur=p}else cur+=p}
  if(cur.trim())out.push(cur.trim());
  return out;
}
function speakOnline(my,done){
  const sp=chunkSpans(slides[i].speech),q=sp.map(x=>x.text);let k=0;
  const next=()=>{
    if(my!==token||!playing)return;
    if(k>=q.length){done();return}
    audio=new Audio("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q="+encodeURIComponent(q[k++]));
    audio.playbackRate=parseFloat($("rate").value);
    audio.onended=next;
    const span=sp[k-1],au=audio;syncTo(span.start,my);
    au.ontimeupdate=()=>{if(isFinite(au.duration)&&au.duration>0)syncTo(span.start+(span.end-span.start)*Math.min(1,au.currentTime/au.duration),my)};
    audio.onerror=()=>{if(my===token){setPlaying(false);$("sub").textContent=slides[i].speech+"  (Không tải được giọng trực tuyến, hãy kiểm tra kết nối mạng.)"}};
    audio.play().catch(()=>{if(my===token)setPlaying(false)});
  };
  next();
}
function speak(){
  stopSpeech();
  syncStart();
  quizRearm();
  const my=token;
  const done=()=>{
    if(my!==token||!playing)return;
    revealAnswer();syncReveal();
    const cont=()=>{
      if(my!==token||!playing)return;
      if($("auto").checked&&i<slides.length-1){setTimeout(()=>{if(my===token&&playing){i++;render();speak()}},900)}
      else setPlaying(false);
    };
    if(QT&&qtDur()>0)qtStart(cont,my);else cont();
  };
  if($("voice").value==="gt"){speakOnline(my,done);return}
  if(!synth){setPlaying(false);return}
  const u=new SpeechSynthesisUtterance(slides[i].speech);
  u.lang="vi-VN";u.rate=parseFloat($("rate").value);
  const v=voices[$("voice").value];if(v){u.voice=v;u.lang=v.lang}
  let lastB=0,t0=0;const tm=setInterval(()=>{
    if(my!==token||!playing){clearInterval(tm);return}
    if(!t0||lastB)return;
    syncTo((performance.now()-t0)/1000*12*parseFloat($("rate").value),my);
  },200);
  u.onstart=()=>{t0=performance.now();syncTo(0,my)};
  u.onboundary=e=>{lastB=performance.now();syncTo(e.charIndex,my)};
  u.onend=()=>{clearInterval(tm);done()};
  u.onerror=()=>{if(my===token)setPlaying(false)};
  synth.speak(u);
}
function setPlaying(p){playing=p;if(!p){syncReveal();revealAnswer()}$("play").innerHTML=p?IC.pause:IC.play;$("play").title=p?"Tạm dừng (Dấu cách)":"Phát (Dấu cách)";wake()}
let started=false;
function toggle(){
  if(playing){stopSpeech();setPlaying(false)}
  else{started=true;setPlaying(true);speak()}
}
function go(d){
  const n=i+d;if(n<0||n>=slides.length)return;
  i=n;render();
  if(playing)speak();else stopSpeech();
}
function loadVoices(){
  voices=synth?synth.getVoices():[];
  const sel=$("voice"),old=sel.value;sel.innerHTML="";
  const isVi=v=>/^vi/i.test(v.lang.replace("_","-"))||/vi[eệ]t/i.test(v.name);
  const all=voices.map((v,k)=>[v,k]);
  const vi=all.filter(x=>isVi(x[0]));
  (vi.length?vi:all).forEach(([v,k])=>{const o=document.createElement("option");o.value=k;o.textContent=v.name+" ("+v.lang+")";sel.appendChild(o)});
  const g=document.createElement("option");g.value="gt";g.textContent="Giọng Việt Google (trực tuyến)";sel.appendChild(g);
  if(old&&[...sel.options].some(o=>o.value===old))sel.value=old;
}
if(!synth){$("sub").textContent="Trình duyệt không hỗ trợ giọng đọc có sẵn, hãy chọn giọng trực tuyến trong phần cài đặt."}
else{synth.onvoiceschanged=loadVoices}
loadVoices();setTimeout(loadVoices,800);
function buildJump(){
  const sel=$("jump");sel.innerHTML="";
  slides.forEach((s,k)=>{const o=document.createElement("option");o.value=k;
    const t=s.title.length>40?s.title.slice(0,40)+"…":s.title;
    o.textContent=(k+1)+". "+t;sel.appendChild(o)});
  const pg=$("prog");pg.innerHTML="";
  slides.forEach((s,k)=>{const d=document.createElement("div");d.className="seg";d.title=(k+1)+". "+s.title;
    d.onclick=()=>{i=k;render();if(playing)speak();else stopSpeech()};pg.appendChild(d)});
}
function updateProg(){[...$("prog").children].forEach((d,k)=>d.classList.toggle("done",k<=i))}
$("jump").onchange=e=>{
  i=parseInt(e.target.value,10);render();
  if(playing)speak();else stopSpeech();
  e.target.blur();
};
buildJump();
const player=$("player"),menu=$("menu");
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function toggleFS(){
  if(!canFS){player.classList.toggle("pfs");fsUpdate();return}
  if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
  else{(player.requestFullscreen||player.webkitRequestFullscreen).call(player)}
}
const canFS=!!(player.requestFullscreen||player.webkitRequestFullscreen);
function fsUpdate(){
  const on=!!fsEl()||player.classList.contains("pfs");
  player.classList.toggle("isfs",on);
  $("fs").innerHTML=on?IC.fsx:IC.fs;$("fs").title=on?"Thoát toàn màn hình (F)":"Toàn màn hình (F)";
}
document.addEventListener("fullscreenchange",fsUpdate);
document.addEventListener("webkitfullscreenchange",fsUpdate);
$("fs").onclick=()=>{toggleFS();$("fs").blur()};
function toggleSub(){const off=$("sub").classList.toggle("off");$("cc").classList.toggle("on",!off)}
$("cc").onclick=()=>{toggleSub();$("cc").blur()};
let idle=0;
function wake(){
  player.classList.add("show");clearTimeout(idle);
  if(playing&&!menu.classList.contains("open"))idle=setTimeout(()=>player.classList.remove("show"),2500);
}
["mousemove","touchstart","click"].forEach(ev=>player.addEventListener(ev,wake,{passive:true}));
$("gear").onclick=()=>{menu.classList.toggle("open");wake()};
document.addEventListener("click",e=>{if(!menu.contains(e.target)&&!$("gear").contains(e.target))menu.classList.remove("open")});
$("stage").onclick=()=>{if(menu.classList.contains("open")){menu.classList.remove("open");return}toggle()};
$("stage").ondblclick=toggleFS;
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);$("play").onclick=toggle;
$("rate").oninput=e=>{$("rv").textContent=parseFloat(e.target.value).toFixed(1)+"×"};
$("rate").onchange=()=>{if(playing)speak()};
$("voice").onchange=()=>{if(playing)speak()};
$("qt").onchange=()=>{if(QT&&!QT.iv)qtIdle();$("qt").blur()};
$("sync").onchange=()=>{if(!playing)return;if($("sync").checked)render(),speak();else syncReveal()};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  wake();
  if(e.key==="Escape"&&player.classList.contains("pfs")){player.classList.remove("pfs");fsUpdate()}
  if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="ArrowRight")go(1);
  else if(e.key==="f"||e.key==="F")toggleFS();
  else if(e.key==="c"||e.key==="C")toggleSub();
  else if(e.key===" "){e.preventDefault();toggle()}
});
render();setPlaying(false);fsUpdate();
</script>
