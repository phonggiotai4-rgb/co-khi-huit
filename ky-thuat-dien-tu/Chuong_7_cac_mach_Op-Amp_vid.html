<style>
:root{--bg:#fbfaf4;--ink:#1f2a37;--mut:#6b7280;--ac:#2563eb;--hl:#fde68a;--card:#fff;--ln:#e3e8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(min-width:760px){#ln{grid-row:span 3}}
@media(min-width:760px){.board{display:grid;grid-template-columns:1fr 1fr;column-gap:18px;align-content:start}.board h2{grid-column:1/-1}}
.o2{fill:none;stroke:#f59e0b;stroke-width:2.4;stroke-dasharray:1;stroke-dashoffset:1;animation:d 1.6s forwards}

#bf{margin:.6rem 0 0;text-align:center}
#bf img{max-width:100%;max-height:300px;background:#fff;border-radius:8px;border:1px solid var(--mut)}
#bf figcaption{font-size:.8rem;color:var(--mut)}
#bt{display:flex;gap:.4rem;justify-content:center;margin-bottom:.4rem}

#bf svg{width:100%;max-height:320px}.sk{fill:none;stroke:var(--ink);stroke-width:1.5}.sk text{fill:var(--ink);stroke:none;font-size:11px;font-style:italic;font-family:Georgia,serif}
#de{margin:.5rem 0;padding:.6rem .8rem;border-left:4px solid var(--ac);background:var(--card);border-radius:6px;font-size:.92rem;line-height:1.5}

#de .cur{background:#ffe58a;color:#111;font-weight:600;animation:fl .6s}

#sim{margin-top:10px;padding:10px 12px;border:1px dashed var(--ln);border-radius:12px;background:var(--card)}#sim .sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;margin:8px 0}#sim label{font-size:.85rem;display:block}#sim label[hidden]{display:none}#sim input{width:100%}#sv{width:100%;height:auto;display:block;background:var(--bg);border-radius:8px}#sv text{font-size:9px;fill:var(--mut)}#so{font-size:.88rem;margin-top:6px;line-height:1.5}
#ps{align-self:center;font-size:.85rem;color:var(--mut)}#ph{align-items:center;flex-wrap:wrap}
#sheet{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);color:var(--ink);padding:14px 14px 40px;line-height:1.5}#sheet[hidden]{display:none}#sheet h2{margin:0 0 4px;font-size:1.15rem}#sheet .tb{display:flex;gap:8px;margin:8px 0 12px}#sheet .gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}#sheet .cd{border:1px solid var(--ln);border-radius:10px;padding:8px 11px;background:var(--card);break-inside:avoid;font-size:.9rem}#sheet .cd b{display:block;margin-bottom:3px}#sheet ol{margin:2px 0 4px;padding-left:20px}#sheet .w{color:#b45309;font-size:.85rem}
@media print{body>*:not(#sheet){display:none!important}#sheet{position:static;overflow:visible;background:#fff;color:#000;padding:0}#sheet .tb{display:none}#sheet .gr{grid-template-columns:1fr 1fr;gap:6px}#sheet .cd{background:#fff;font-size:10.5px;padding:5px 8px;border-color:#999}#sheet .w{color:#000}}
</style></head><body><main>
<h1>Chương 7. Các mạch ứng dụng bộ khuếch đại thuật toán</h1>
<nav id="nv"></nav>
<div id="tools"><label for="jp" style="font-size:.85rem">Chuyển đến bài: </label><select id="jp"></select></div>
<section class="board"><h2><span id="ct"></span><span id="st"></span><span id="pt"></span></h2><div id="de"></div><div id="ln"></div><svg id="ck" viewBox="0 0 400 180"></svg><figure id="bf"><div id="bt"></div><svg id="bk" class="sk" role="img" aria-label="Hình vẽ lại từ sách"></svg><figcaption id="bc"></figcaption></figure><div id="ph" style="display:none"><button>v<sub>i</sub> &gt; 0</button><button>v<sub>i</sub> &lt; 0</button><span id="ps"></span></div><div id="sim" hidden><b id="simT"></b><div class="sg" id="sg"></div><svg id="sv" viewBox="0 0 400 150"></svg><div id="so"></div></div></section>
<div id="sub"></div>
<div class="bar"><button id="pv">◀ Trước</button><button id="pl">▶ Phát</button><button id="nx">Tiếp ▶</button><button id="cs">Tờ ôn</button><button id="lgb">Chú thích: bật</button><select id="sp" title="Tốc độ đọc"><option value="0.85">0,85×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option></select><input type="range" id="pr" min="0" value="0"></div>
<small>Giọng đọc dùng giọng tiếng Việt của trình duyệt; nếu máy không có, bài tự chuyển bước theo độ dài câu.</small>
</main>
<div id="sheet" hidden></div><script>
const f=(x,d=2)=>(+x.toFixed(d)).toString().replace('.',','),C=[],S=[];
const ch=t=>C.push(t),T=(say,ln=[],k)=>S.push({c:C.length-1,say:say.replace(/(^|[\s(])-(\d)/g,'$1trừ $2'),ln,k});
const CK={'7.1 Tổng quan bộ khuếch đại thuật toán':'amp','7.2.1 Mạch khuếch đại đảo':'inv','7.2.2 Mạch khuếch đại không đảo':'non','7.2.3 Mạch khuếch đại tổng đảo':'sum','7.2.4 Mạch khuếch đại tổng không đảo':'sumn','7.2.5 Mạch khuếch đại vi sai':'dif','7.2.6 Mạch lặp điện áp':'buf','VD 7.1':'amp','VD 7.2':'inv','VD 7.3':'non','VD 7.4':'sum','BT 7.1':'non','BT 7.2':'-','BT 7.3':'-','BT 7.4':'sum','BT 7.5':'-','BT 7.6':'dif','BT 7.7':'wave','BT 7.8':'non','BT 7.9':'sumn','BT 7.10':'sum','BT 7.11':'non','BT 7.12':'inv','BT 7.13':'sum','BT 7.14':'sumn','Kết luận chương 7':'-'};
const G={'7.1 Tổng quan bộ khuếch đại thuật toán':'7.1 · Tổng quan','7.2.1 Mạch khuếch đại đảo':'7.2 · Các mạch ứng dụng cơ bản','Kết luận chương 7':'Kết luận','BT 7.1':'Bài tập chương 7'};
const Vs=12;

ch('7.1 Tổng quan bộ khuếch đại thuật toán');
T('Chương 7 nói về bộ khuếch đại thuật toán, gọi tắt là Op-Amp. Nó có hai ngõ vào: ngõ không đảo dấu cộng và ngõ đảo dấu trừ, cùng một ngõ ra. Ngõ ra bằng hệ số khuếch đại vòng hở nhân hiệu hai điện áp vào.',['v_o = A_vo·(v⁺ − v⁻)   (7.1)','A_vo ≈ 10⁴ … 2·10⁵  (rất lớn)']);
T('Op-Amp lý tưởng có trở kháng vào rất lớn, trở kháng ra bằng không, nên dòng vào hai ngõ đều bằng không. Khi mạch có hồi tiếp âm, hai ngõ vào luôn bằng nhau. Đây là hai quy tắc dùng cho cả chương.',['i⁺ = i⁻ = 0','v⁻ = v⁺  (hồi tiếp âm)   (7.2)']);
T('Đặc tuyến vào ra có ba vùng. Vùng tuyến tính: ngõ ra nằm giữa trừ V sat và cộng V sat. Nếu ngõ ra vượt ngưỡng thì Op-Amp bão hòa, ngõ ra bị giữ ở cộng hoặc trừ V sat. Với nguồn đôi, V sat xấp xỉ V cc. Với nguồn đơn, bão hòa âm xấp xỉ không.',['Tuyến tính: −Vsat < v_o < +Vsat','v⁺ > v⁻ (vòng hở): v_o = +Vsat ≈ Vcc','v⁺ < v⁻ (vòng hở): v_o = −Vsat ≈ −Vcc (nguồn đôi) hoặc 0 (nguồn đơn)']);

ch('VD 7.1');
T('Đề: Op-Amp LF411 có hệ số khuếch đại vòng hở A_vo = 200000, cấp nguồn đôi ±12 V. Ngõ vào không đảo nối 0,5 V, ngõ vào đảo nối 0,3 V. Tìm điện áp ngõ ra v_o.',['Cho: A_vo = 200000 ; nguồn ±12 V','v⁺ = 0,5 V ; v⁻ = 0,3 V','Cần tìm: v_o'],'amp');
T('Bước 1, nhận dạng mạch. Ngõ ra không nối về ngõ vào nào, tức không có hồi tiếp âm. Đây là mạch vòng hở, nên không được dùng điều kiện v⁻ = v⁺ của Op-Amp lý tưởng có hồi tiếp. Ta phải dùng công thức 7.1 và kiểm tra giới hạn nguồn.',['Không có hồi tiếp ⇒ vòng hở','⇒ dùng v_o = A_vo·(v⁺ − v⁻) rồi kiểm tra Vsat']);
{const d=.5-.3,a=200000*d;
T(`Bước 2, tính hiệu điện áp giữa hai ngõ vào: v cộng trừ v trừ bằng 0,5 trừ 0,3, bằng ${f(d)} vôn.`,['Δv_in = v⁺ − v⁻ = 0,5 − 0,3 = '+f(d)+' V']);
T(`Bước 3, tính ngõ ra theo lý thuyết: v o bằng 200000 nhân ${f(d)}, bằng ${a} vôn.`,['v_o = A_vo·Δv_in = 200000·'+f(d)+' = '+a+' V']);
T(`Bước 4, so sánh với nguồn. Ngõ ra Op-Amp không thể vượt điện áp nguồn: ${a} vôn lớn hơn rất nhiều 12 vôn. Vậy Op-Amp không làm việc ở vùng tuyến tính mà đã bão hòa.`,[a+' V ≫ 12 V ⇒ không thể đạt được','⇒ Op-Amp bão hòa']);}
T('Bước 5, xác định bão hòa dương hay âm. Hiệu v cộng trừ v trừ dương, nên ngõ ra bị kéo về phía dương: Op-Amp bão hòa dương. Với nguồn đôi, V sat xấp xỉ V cc.',['Δv_in > 0 ⇒ BH(+)','v_o = +Vsat ≈ +Vcc = 12 V']);
T('Cách làm nhanh: theo 7.3, chỉ cần so sánh hai ngõ vào. v cộng 0,5 lớn hơn v trừ 0,3 nên ngõ ra bằng cộng 12 vôn. Nhận xét: chỉ cần chênh lệch 12 chia 200000, tức 60 micro vôn, là đã bão hòa; vì vậy Op-Amp vòng hở thường dùng làm mạch so sánh.',['v⁺ > v⁻ ⇒ v_o = +12 V ✓','Ngưỡng bão hòa: 12/200000 = 60 µV']);

ch('7.2.1 Mạch khuếch đại đảo');
T('Mạch khuếch đại đảo: tín hiệu vào qua điện trở R i tới ngõ đảo, điện trở R f nối từ ngõ ra về ngõ đảo, ngõ không đảo nối đất. Vì v cộng bằng không, nên v trừ, tức điện áp nút N, cũng bằng không.',['v⁺ = 0 ⇒ v_N = v⁻ = 0']);
T('Viết định luật Kirchhoff một tại nút N. Dòng vào ngõ đảo bằng không, nên dòng qua R i đi tới nút N phải bằng dòng đi qua R f.',['i_i − i_f − i⁻ = 0 ⇒ i_i = i_f','{v_i − v_N|R_i} − {v_N − v_o|R_f} = 0   (7.5)']);
T('Thay v N bằng không: v i chia R i bằng trừ v o chia R f. Suy ra độ lợi điện áp bằng trừ R f chia R i. Dấu trừ nghĩa là ngõ ra đảo pha so với ngõ vào.',['{v_i|R_i} + {v_o|R_f} = 0','A_v = {v_o|v_i} = −{R_f|R_i}   (7.6)']);
T('Tổng trở vào nhìn từ nguồn: nút N là đất ảo, nên dòng vào chỉ chảy qua R i. Vậy Z i bằng R i.',['Z_i = {v_i|i_i} = R_i   (7.7)']);

ch('VD 7.2');
T('Đề: mạch như Hình 7.5 với R f bằng 120 kilô ôm, R i bằng 8,2 kilô ôm, V sat bằng cộng trừ 12 vôn. Câu a: loại mạch. Câu b: độ lợi. Câu c: tổng trở vào. Câu d: điều kiện của v i để Op-Amp ở vùng tuyến tính.',['Cho: R_f = 120 kΩ ; R_i = 8,2 kΩ ; ±Vsat = ±12 V'],'inv');
T('Câu a. Nhìn hình: nguồn v i đi qua R i vào ngõ đảo, ngõ không đảo nối đất, R f hồi tiếp từ ngõ ra về ngõ đảo. Đây là mạch khuếch đại đảo.',['v_i → R_i → ngõ đảo (−)','Ngõ không đảo (+) nối đất','⇒ Mạch khuếch đại đảo']);
{const A=-120/8.2,L=12/-A;
T('Câu b. Viết công thức độ lợi của mạch đảo, công thức 7.6: A v bằng v o chia v i, bằng trừ R f chia R i.',['A_v = {v_o|v_i} = −{R_f|R_i}']);
T(`Thế số: 120 chia 8,2 bằng ${f(120/8.2,3)}. Vậy độ lợi bằng trừ ${f(-A)}. Dấu trừ cho biết ngõ ra đảo pha, độ lớn ngõ ra gấp ${f(-A)} lần ngõ vào.`,['A_v = −{120|8,2} = −'+f(120/8.2,3)+' ≈ '+f(A)]);
T('Câu c. Ở mạch đảo, ngõ đảo là đất ảo, điện áp tại nút N bằng không. Dòng từ nguồn chỉ chảy qua R i, nên i i bằng v i chia R i. Do đó tổng trở vào bằng R i.',['v_N = 0 ⇒ i_i = {v_i − 0|R_i}','Z_i = {v_i|i_i} = R_i = 8,2 kΩ']);
T('Câu d. Op-Amp ở vùng tuyến tính khi ngõ ra nằm giữa trừ V sat và cộng V sat, tức trừ 12 đến cộng 12 vôn.',['−Vsat < v_o < Vsat','−12 < v_o < 12']);
T(`Thay v o bằng A v nhân v i, bằng trừ ${f(-A)} nhân v i.`,['−12 < '+f(A)+'·v_i < 12']);
T(`Chia ba vế cho ${f(A)}. Vì đây là số âm nên phải đổi chiều các dấu bất đẳng thức. Mười hai chia ${f(-A)} bằng ${f(L)}.`,['{−12|'+f(A)+'} > v_i > {12|'+f(A)+'}','⇒ −'+f(L)+' < v_i < '+f(L)+'  (đã đổi chiều)']);
T(`Kết luận: v i nằm giữa trừ ${f(L)} và cộng ${f(L)} vôn. Kiểm tra: v i bằng 0,82 vôn thì v o bằng ${f(A*L)} vôn, đúng bằng biên. Nếu v i bằng 1 vôn thì tính ra ${f(A)} vôn, vượt ngưỡng nên ngõ ra bị giữ ở trừ 12 vôn.`,['−'+f(L)+' V < v_i < '+f(L)+' V','Kiểm tra: v_i = 0,82 V ⇒ v_o = '+f(A*L)+' V ✓','v_i = 1 V ⇒ '+f(A)+' V ⇒ bão hòa, v_o = −12 V']);}
ch('7.2.2 Mạch khuếch đại không đảo');
T('Mạch không đảo: tín hiệu v i đưa thẳng vào ngõ không đảo, R i nối từ ngõ đảo xuống đất, R f nối từ ngõ ra về ngõ đảo. Vì v trừ bằng v cộng, nên điện áp nút N bằng v i.',['v⁺ = v_i ⇒ v_N = v⁻ = v_i']);
T('Kirchhoff một tại nút N: dòng đi từ đất qua R i tới N bằng dòng đi qua R f ra ngõ ra. Thay v N bằng v i vào.',['{0 − v_N|R_i} − {v_N − v_o|R_f} = 0   (7.8)','{−v_i|R_i} − {v_i − v_o|R_f} = 0']);
T('Giải ra độ lợi: một cộng R f chia R i, luôn lớn hơn hoặc bằng một và cùng dấu với ngõ vào. Tổng trở vào là vô cùng, vì tín hiệu nối thẳng vào ngõ có dòng bằng không.',['A_v = {v_o|v_i} = 1 + {R_f|R_i}   (7.9)','Z_i = {v_i|(−i⁺)} = ∞   (7.10)']);

ch('VD 7.3');
T('Đề: mạch như Hình 7.8 với R f bằng 68 kilô ôm, R i bằng 8,2 kilô ôm, V sat bằng cộng trừ 12 vôn. Các câu hỏi giống ví dụ 7.2.',['Cho: R_f = 68 kΩ ; R_i = 8,2 kΩ ; ±Vsat = ±12 V'],'non');
T('Câu a. Nguồn v i nối trực tiếp vào ngõ không đảo, R i nối từ ngõ đảo xuống đất, R f hồi tiếp về ngõ đảo. Đây là mạch khuếch đại không đảo.',['v_i → ngõ không đảo (+)','R_i xuống đất, R_f hồi tiếp','⇒ Mạch khuếch đại không đảo']);
{const A=1+68/8.2,L=12/A;
T('Câu b. Viết công thức độ lợi của mạch không đảo, công thức 7.9.',['A_v = {v_o|v_i} = 1 + {R_f|R_i}']);
T(`Thế số: 68 chia 8,2 bằng ${f(68/8.2,3)}, cộng một được ${f(A)}. Lưu ý: dòng thế số trong sách ghi 82 chia 6,8 là nhầm số; thế đúng số của đề cho kết quả ${f(A)} như sách. Độ lợi dương nên ngõ ra cùng pha với ngõ vào.`,['A_v = 1 + {68|8,2} = 1 + '+f(68/8.2,3)+' = '+f(A)]);
T('Câu c. Tín hiệu nối thẳng vào ngõ không đảo, nơi dòng vào bằng không, nên nguồn không phải cấp dòng. Tổng trở vào là vô cùng.',['i⁺ = 0 ⇒ Z_i = {v_i|(−i⁺)} → ∞']);
T('Câu d. Điều kiện tuyến tính: trừ 12 nhỏ hơn v o nhỏ hơn 12. Thay v o bằng A v nhân v i.',['−12 < v_o < 12','−12 < '+f(A)+'·v_i < 12']);
T(`Chia ba vế cho ${f(A)}, số dương nên giữ nguyên chiều. Mười hai chia ${f(A)} bằng ${f(L)}. Vậy v i nằm giữa trừ ${f(L)} và cộng ${f(L)} vôn. Kiểm tra: v i bằng 1,29 vôn cho v o gần 12 vôn.`,['{−12|'+f(A)+'} < v_i < {12|'+f(A)+'}','−'+f(L)+' V < v_i < '+f(L)+' V','Kiểm tra: 1,29·'+f(A)+' = '+f(1.29*A)+' V ≈ 12 V ✓']);}
ch('7.2.3 Mạch khuếch đại tổng đảo');
T('Mạch tổng đảo có nhiều ngõ vào, mỗi ngõ qua một điện trở riêng tới nút N. Giống mạch đảo, v cộng bằng không nên v N cũng bằng không.',['v⁺ = 0 ⇒ v_N = 0']);
T('Kirchhoff một tại N: tổng các dòng vào bằng dòng qua R f. Thay v N bằng không, rồi rút v o. Mỗi ngõ vào được khuếch đại đảo với hệ số riêng R f chia điện trở của ngõ đó.',['i_1 + i_2 + i_3 − i_f = 0','{v_1|R_1} + {v_2|R_2} + {v_3|R_3} + {v_o|R_f} = 0','v_o = −( v_1·{R_f|R_1} + v_2·{R_f|R_2} + v_3·{R_f|R_3} )   (7.12)']);
T('Hai trường hợp đặc biệt: nếu các điện trở bằng R f thì ngõ ra là trừ tổng các ngõ vào, đây là mạch cộng đảo. Nếu các điện trở đều bằng ba lần R f thì ngõ ra là trừ trung bình cộng.',['R_1=R_2=R_3=R_f ⇒ v_o = −(v_1+v_2+v_3)','R_1=R_2=R_3=3R_f ⇒ v_o = −{v_1+v_2+v_3|3}']);

ch('VD 7.4');
T('Đề: mạch như Hình 7.11, hai tín hiệu v một, v hai qua R một, R hai vào ngõ đảo, R f hồi tiếp, ngõ không đảo nối đất. Câu a: loại mạch. Câu b: viết v o theo v một, v hai. Câu c: với v o bằng trừ hai v một cộng v hai, tính linh kiện. Câu d: với V sat bằng cộng trừ 12 V, v một bằng 2 V, tìm điều kiện của v hai.',['v_o = −(2v_1 + v_2) ; ±Vsat = ±12 V ; v_1 = 2 V'],'sum');
T('Câu a. Hai ngõ vào cùng nối tới ngõ đảo, ngõ không đảo nối đất, nên đây là mạch khuếch đại tổng đảo.',['v_1, v_2 → ngõ đảo ; (+) nối đất','⇒ Mạch khuếch đại tổng đảo']);
T('Câu b. Dùng nguyên lý xếp chồng. Cho v hai bằng 0, nối đất nguồn v hai: mạch thành mạch đảo với ngõ vào v một, nên v o một bằng trừ R f chia R một nhân v một.',['v_2 = 0 ⇒ v_o1 = −{R_f|R_1}·v_1']);
T('Cho v một bằng 0, nối đất nguồn v một: mạch đảo với ngõ vào v hai, nên v o hai bằng trừ R f chia R hai nhân v hai. Ngõ ra khi có cả hai nguồn là tổng hai kết quả, công thức 7.13.',['v_1 = 0 ⇒ v_o2 = −{R_f|R_2}·v_2','v_o = v_o1 + v_o2 = −( {R_f|R_1}·v_1 + {R_f|R_2}·v_2 )   (7.13)']);
T('Câu c. Đồng nhất hệ số của công thức 7.13 với v o bằng trừ hai v một cộng v hai: hệ số của v một là 2, hệ số của v hai là 1.',['−( {R_f|R_1}·v_1 + {R_f|R_2}·v_2 ) ≡ −(2·v_1 + 1·v_2)','{R_f|R_1} = 2 ; {R_f|R_2} = 1']);
T('Có hai phương trình nhưng ba ẩn, nên ta được chọn một điện trở. Chọn R f bằng 100 kilô ôm, vì giá trị vài chục đến vài trăm kilô ôm là hợp lý. Suy ra R một bằng R f chia 2, bằng 50 kilô ôm; R hai bằng R f bằng 100 kilô ôm. Kiểm tra: 100 chia 50 bằng 2 và 100 chia 100 bằng 1, đúng.',['Chọn R_f = 100 kΩ','R_1 = R_f/2 = 50 kΩ','R_2 = R_f/1 = 100 kΩ','Kiểm tra: 100/50 = 2 ✓ ; 100/100 = 1 ✓']);
T('Câu d. Với v một bằng 2 vôn, số hạng hai v một bằng 4 vôn, nên v o bằng trừ bốn cộng v hai. Sách viết 2.2 nghĩa là 2 nhân 2.',['2·v_1 = 2·2 = 4','v_o = −(4 + v_2)']);
T('Điều kiện tuyến tính: trừ 12 nhỏ hơn v o nhỏ hơn 12. Nhân cả ba vế với trừ một thì đổi chiều bất đẳng thức, được trừ 12 nhỏ hơn 4 cộng v hai nhỏ hơn 12. Trừ 4 cả ba vế: v hai nằm giữa trừ 16 và cộng 8 vôn. Kiểm tra: v hai bằng 8 thì v o bằng trừ 12; v hai bằng trừ 16 thì v o bằng cộng 12.',['−12 < −(4 + v_2) < 12','−12 < 4 + v_2 < 12  (nhân −1, đổi chiều)','−16 V < v_2 < 8 V','Kiểm tra: v_2 = 8 ⇒ v_o = −12 V ✓ ; v_2 = −16 ⇒ v_o = +12 V ✓']);
ch('7.2.4 Mạch khuếch đại tổng không đảo');
T('Mạch tổng không đảo: hai tín hiệu v một, v hai qua R một, R hai tới ngõ không đảo; ngõ đảo có R i xuống đất và R f hồi tiếp. Dùng nguyên lý xếp chồng: xét từng nguồn, nối đất nguồn còn lại.',['Xếp chồng: v_o = v_o1 + v_o2']);
T('Chỉ có v một: R một và R hai tạo cầu chia áp, điện áp tại ngõ không đảo là v một nhân R hai chia R một cộng R hai. Sau đó mạch là không đảo với độ lợi một cộng R f chia R i.',['v_1+ = v_1·{R_2|R_1+R_2}','v_o1 = (1 + {R_f|R_i})·{R_2|R_1+R_2}·v_1   (7.14)']);
T('Tương tự với v hai, rồi cộng hai kết quả. Nếu R một, R hai, R i, R f đều bằng nhau thì ngõ ra bằng v một cộng v hai, đây là mạch cộng không đảo.',['v_o2 = (1 + {R_f|R_i})·{R_1|R_1+R_2}·v_2   (7.15)','v_o = (1 + {R_f|R_i})·( {R_2|R_1+R_2}·v_1 + {R_1|R_1+R_2}·v_2 )   (7.16)','R_1=R_2=R_i=R_f ⇒ v_o = v_1 + v_2']);

ch('7.2.5 Mạch khuếch đại vi sai');
T('Mạch vi sai có hai tín hiệu: v hai vào ngõ đảo qua R hai, v một vào ngõ không đảo qua R mười một, và R mười hai nối ngõ không đảo xuống đất. Ta xếp chồng, xét từng nguồn.',['Xếp chồng: v_o = v_o1 + v_o2']);
T('Chỉ có v một: mạch là không đảo, điện áp tại ngõ không đảo qua cầu chia áp R mười một, R mười hai. Chỉ có v hai: mạch là đảo với độ lợi trừ R f chia R hai.',['v_o1 = v_1·{R_12|R_11+R_12}·(1 + {R_f|R_2})','v_o2 = −{R_f|R_2}·v_2']);
T('Cộng lại ta được công thức tổng quát. Nếu R mười một, R mười hai, R hai, R f bằng nhau thì ngõ ra bằng v một trừ v hai, đây là mạch trừ.',['v_o = {R_12|R_11+R_12}·(1 + {R_f|R_2})·v_1 − {R_f|R_2}·v_2   (7.17)','R_11=R_12=R_2=R_f ⇒ v_o = v_1 − v_2']);

ch('7.2.6 Mạch lặp điện áp');
T('Mạch lặp điện áp nối thẳng ngõ ra về ngõ đảo. Vì v trừ bằng v cộng, mà v trừ chính là v o và v cộng là v i, nên v o bằng v i, độ lợi bằng một.',['v⁻ = v_o , v⁺ = v_i , v⁻ = v⁺','A_v = {v_o|v_i} = 1']);
T('Tổng trở vào rất lớn, tổng trở ra rất nhỏ. Vì vậy mạch lặp dùng để lấy tín hiệu từ cảm biến mà không làm sụt áp nguồn tín hiệu.',['Z_i = R_i + R_in = ∞']);

ch('Kết luận chương 7');
T('Tóm tắt: mạch đảo có độ lợi trừ R f chia R i. Mạch không đảo có độ lợi một cộng R f chia R i. Tổng đảo cộng các ngõ vào với hệ số R f chia R. Vi sai khuếch đại hiệu hai ngõ vào. Mạch lặp có độ lợi một. Luôn nhớ kiểm tra ngõ ra có vượt V sat không. Vậy là xong chương 7!',['Đảo: A_v = −R_f/R_i','Không đảo: A_v = 1 + R_f/R_i','Tổng đảo: v_o = −Σ (R_f/R_k)·v_k','Vi sai (đặc biệt): v_o = v_1 − v_2','Lặp áp: A_v = 1 · Luôn kiểm tra |v_o| < Vsat']);

ch('BT 7.1');
{const A=1+22/3.3;
T('Đề: tín hiệu v i nối thẳng vào ngõ không đảo, có điện trở 470 kilô ôm nối đất ngay tại ngõ vào. Ngõ đảo có 3,3 kilô ôm xuống đất và 22 kilô ôm hồi tiếp. Tìm Z i và độ lợi.',['470 kΩ ∥ ngõ vào ; R_i = 3,3 kΩ ; R_f = 22 kΩ'],'non');
T('Đây là mạch không đảo. Ngõ vào của Op-Amp có trở kháng vô cùng, nên nguồn chỉ thấy điện trở 470 kilô ôm mắc song song với vô cùng, tức 470 kilô ôm.',['Z_i = 470 kΩ ∥ ∞ = 470 kΩ']);
T(`Độ lợi bằng một cộng 22 chia 3,3, được ${f(A)}.`,['A_v = 1 + {22|3,3} = '+f(A)]);}

ch('BT 7.2');
T('Đề: tầng một dùng R f một bằng 100 kilô ôm, R một bằng 10 kilô ôm, vào ngõ đảo. Tầng hai là không đảo có độ lợi 5. Câu a: chức năng OP1, OP2. Câu b: v o hai theo v i. Câu c: tính A v một, R f hai, R hai, v o hai.',['R_f1 = 100 kΩ, R_1 = 10 kΩ, A_v2 = 5']);
T('Câu a và b. OP1 là mạch khuếch đại đảo, OP2 là mạch khuếch đại không đảo. Hai tầng nối tiếp nên độ lợi tổng bằng tích hai độ lợi. Câu b: v o hai bằng A v một nhân A v hai nhân v i.',['OP1: đảo ; OP2: không đảo','v_o2 = A_v1·A_v2·v_i']);
T('Câu c. A v một bằng trừ 100 chia 10, bằng trừ 10. Tầng hai: một cộng R f hai chia R hai bằng 5, nên R f hai bằng 4 lần R hai. Chọn R hai bằng 10 kilô ôm thì R f hai bằng 40 kilô ôm. Vậy v o hai bằng trừ 50 v i.',['A_v1 = −100/10 = −10','1 + R_f2/R_2 = 5 ⇒ R_f2 = 4R_2','Chọn R_2 = 10 kΩ ⇒ R_f2 = 40 kΩ','v_o2 = (−10)·5·v_i = −50·v_i']);

ch('BT 7.3');
T('Đề: hai tầng đảo nối tiếp. Cho R f hai bằng 100 kilô ôm, R hai bằng 10 kilô ôm, A v một bằng trừ 5. Tính A v hai, R f một, R một, v o hai theo v i.',['R_f2 = 100 kΩ, R_2 = 10 kΩ, A_v1 = −5']);
T('Câu a đến c. OP1 và OP2 đều là mạch khuếch đại đảo. A v hai bằng trừ 100 chia 10, bằng trừ 10. Tầng một: R f một chia R một bằng 5; chọn R một bằng 10 kilô ôm thì R f một bằng 50 kilô ôm. Hai dấu trừ triệt tiêu, nên v o hai bằng cộng 50 v i.',['A_v2 = −100/10 = −10','R_f1/R_1 = 5 ⇒ chọn R_1 = 10 kΩ, R_f1 = 50 kΩ','v_o2 = (−5)(−10)·v_i = 50·v_i']);

ch('BT 7.4');
T('Đề: tổng đảo ba ngõ vào. Cho v o bằng trừ hai v một cộng ba v hai cộng v ba. Tính linh kiện; với v một bằng 2 V, v hai bằng 1 V, tìm điều kiện của v ba để ở vùng tuyến tính, nguồn cộng trừ 12 V.',['v_o = −(2v_1 + 3v_2 + v_3) ; ±Vsat = ±12 V'],'sum');
T('Câu a và c. Mạch là tổng đảo. Đồng nhất hệ số: R f chia R một bằng 2, chia R hai bằng 3, chia R ba bằng 1. Chọn R f bằng 100 kilô ôm thì R một bằng 50, R hai bằng 33,3, R ba bằng 100 kilô ôm.',['R_f/R_1 = 2 , R_f/R_2 = 3 , R_f/R_3 = 1','Chọn R_f = 100 kΩ ⇒ R_1 = 50 kΩ , R_2 = 33,3 kΩ , R_3 = 100 kΩ']);
T('Câu d. Thế v một bằng 2, v hai bằng 1: v o bằng trừ 7 cộng v ba. Trừ 12 nhỏ hơn v o nhỏ hơn 12 cho v ba nằm giữa trừ 19 và cộng 5 vôn.',['v_o = −(4 + 3 + v_3) = −(7 + v_3)','−12 < −(7 + v_3) < 12','−19 V < v_3 < 5 V']);

ch('BT 7.5');
T('Đề: tín hiệu vào trừ 30 dBV. Tầng một là mạch không đảo có R i bằng 2 kilô ôm, R f bằng 14 kilô ôm; tầng hai cũng không đảo, R i bằng 2 kilô ôm, R f bằng 18 kilô ôm; tải 15 kilô ôm. Trở kháng vào tầng một là 100 kilô ôm. Tính độ lợi và v o theo dB, với công thức của đề: A dB bằng 10 log A.',['v_in = −30 dBV ; Z_in = 100 kΩ','Tầng 1: R_i = 2k, R_f = 14k ; Tầng 2: R_i = 2k, R_f = 18k','A[dB] = 10·log₁₀ A (theo đề)']);
T('Hai tầng đều là mạch không đảo nên độ lợi mỗi tầng là một cộng R f chia R i: tầng một bằng 8, tầng hai bằng 10. Hai tầng nối tiếp nên nhân lại, được 80. Tải 15 kilô ôm không ảnh hưởng vì ngõ ra Op-Amp lý tưởng có trở kháng ra bằng không.',['A_1 = 1 + {14|2} = 8','A_2 = 1 + {18|2} = 10','A = A_1·A_2 = 80']);
T('Đổi sang dB theo công thức của đề: 10 log 8 bằng 9,03; 10 log 10 bằng 10; cộng lại 19,03 dB, trùng 10 log 80. Ngõ ra theo dB bằng ngõ vào cộng độ lợi: trừ 30 cộng 19,03 bằng trừ 10,97 dBV.',['A_1 = 10·log 8 = 9,03 dB ; A_2 = 10·log 10 = 10 dB','A = 9,03 + 10 = 19,03 dB','v_o = −30 + 19,03 = −10,97 dBV']);
T('Lưu ý: dBV là đơn vị điện áp, chuẩn dùng 20 log. Theo cách này độ lợi là 38,06 dB, ngõ ra 8,06 dBV, tức khoảng 2,53 vôn, đúng bằng 31,6 mili vôn nhân 80. Bạn hỏi thầy cô dùng cách nào để trình bày cho khớp.',['Chuẩn điện áp: A = 20·log 80 = 38,06 dB','v_o = −30 + 38,06 = 8,06 dBV ≈ 2,53 V']);

ch('BT 7.6');
T('Đề: mạch vi sai, hai điện trở 20 kilô ôm ở ngõ vào, hai điện trở 100 kilô ôm, tải 39 kilô ôm. Tín hiệu vi sai ngõ vào 200 mili vôn, tìm v o. Lưu ý về hình: ở hình, điện trở 100 kilô ôm hồi tiếp nối về ngõ cộng, đó là hồi tiếp dương, mạch bị bão hòa và đề không cho V sat. Mình hiểu theo mạch vi sai chuẩn mục 7.2.5: hồi tiếp về ngõ đảo, 100 kilô ôm còn lại nối đất ở ngõ không đảo.',['R_11 = R_2 = 20 kΩ , R_12 = R_f = 100 kΩ','v_1 − v_2 = 200 mV'],'dif');
T('Xếp chồng. Chỉ có v một: điện áp ngõ không đảo bằng v một nhân 100 chia 120, rồi nhân độ lợi không đảo một cộng 100 chia 20 bằng 6, được 5 v một. Chỉ có v hai: mạch đảo, độ lợi trừ 100 chia 20 bằng trừ 5.',['v_o1 = {100|120}·(1 + {100|20})·v_1 = 5·v_1','v_o2 = −{100|20}·v_2 = −5·v_2','v_o = 5·(v_1 − v_2)']);
T('Với hiệu v một trừ v hai bằng 200 mili vôn, v o bằng 5 nhân 0,2, được 1 vôn. Tải 39 kilô ôm không ảnh hưởng. Mình đã tính lại bằng máy, ra đúng 1 vôn, và tín hiệu chung giống nhau cho ngõ ra bằng không.',['v_o = 5·0,2 = 1 V']);

ch('BT 7.7');
T('Đề: mạch đảo, R một 10 kilô ôm, R hai 100 kilô ôm, nguồn cộng trừ 12 V, v i bằng 2 sin 20 t vôn. Tìm v o và vẽ v i, v o chung một trục.',['R_1 = 10 kΩ, R_2 = 100 kΩ, v_i = 2·sin(20t) V'],'wave');
T('Độ lợi bằng trừ 100 chia 10, bằng trừ 10. Vậy v o lý thuyết bằng trừ 20 sin 20 t, biên độ 20 vôn, vượt 12 vôn, nên đỉnh bị cắt.',['A_v = −100/10 = −10','v_o = −20·sin(20t) V (nếu không bão hòa)']);
{const a=Math.asin(.6)*180/Math.PI;
T(`Op-Amp chỉ tuyến tính khi 20 nhân giá trị tuyệt đối sin nhỏ hơn 12, tức sin nhỏ hơn 0,6, ứng với góc nhỏ hơn khoảng ${f(a,1)} độ. Ngoài đó v o bị giữ ở cộng trừ 12 vôn. Đồ thị: v i là nét đứt, v o bị xén phẳng ở hai đỉnh.`,['|v_o| = 20·|sin(20t)| < 12 ⇒ |sin(20t)| < 0,6','v_o = −20·sin(20t) khi |v_o| < 12 ; ngược lại v_o = ∓12 V']);}

ch('BT 7.8');
T('Đề: mạch không đảo, v i bằng 2 vôn, R một nối đất, R hai hồi tiếp từ ngõ ra, nguồn cộng trừ 12 V. Tìm v o cho ba trường hợp.',['v_i = 2 V , A_v = 1 + R_2/R_1 , ±Vsat = ±12 V'],'non');
{const g=(a,b)=>1+b/a;
T(`Câu a đến c. R một 5, R hai 10: độ lợi ${g(5,10)}, v o bằng ${g(5,10)*2} vôn, nhỏ hơn 12 nên tuyến tính. Câu b. R một 10, R hai 50: độ lợi ${g(10,50)}, v o bằng ${g(10,50)*2} vôn, đúng bằng ngưỡng 12, tức vừa chạm bão hòa. Câu c. R một 10, R hai 100: độ lợi ${g(10,100)}, tính ra ${g(10,100)*2} vôn nhưng bị giữ ở 12 vôn.`,['a) A_v = 1+10/5 = '+g(5,10)+' ⇒ v_o = '+g(5,10)*2+' V','b) A_v = 1+50/10 = '+g(10,50)+' ⇒ v_o = '+g(10,50)*2+' V ≈ Vsat','c) A_v = 1+100/10 = '+g(10,100)+' ⇒ 22 V ⇒ bão hòa, v_o = 12 V']);}

ch('BT 7.9');
{const k=10/15*(1+100/50);
T('Đề: v i qua R một 5 kilô ôm vào ngõ không đảo, R hai 10 kilô ôm nối đất ở ngõ đó. Ngõ đảo có R bốn 50 kilô ôm xuống đất và R ba 100 kilô ôm hồi tiếp. Viết v o theo v i và tìm độ lợi.',['R_1 = 5 kΩ, R_2 = 10 kΩ, R_3 = 100 kΩ, R_4 = 50 kΩ'],'sumn');
T(`Ngõ không đảo qua cầu chia áp: v cộng bằng v i nhân R hai chia R một cộng R hai, bằng hai phần ba v i. Phần còn lại là mạch không đảo với độ lợi một cộng R ba chia R bốn bằng 3. Vậy v o bằng 2 v i, độ lợi bằng ${f(k,0)}.`,['v⁺ = v_i·{R_2|R_1+R_2} = {10|15}·v_i = {2|3}·v_i','1 + {R_3|R_4} = 1 + {100|50} = 3','v_o = 3·{2|3}·v_i = 2·v_i ⇒ A_v = '+f(k,0)]);}

ch('BT 7.10');
T('Đề: thiết kế tổng đảo ba ngõ vào, v o bằng trừ hai v một cộng ba v hai cộng 0,5 v ba, nguồn cộng trừ 15 V. Câu a: linh kiện. Câu b: với v một 1 V, v hai 2 V, điều kiện v ba để tuyến tính. Câu c: điều kiện để bão hòa.',['v_o = −(2v_i1 + 3v_i2 + 0,5v_i3) ; ±15 V'],'sum');
T('Câu a. Mạch tổng đảo, R f chia R một bằng 2, chia R hai bằng 3, chia R ba bằng 0,5. Chọn R f bằng 100 kilô ôm thì R một bằng 50, R hai bằng 33,3, R ba bằng 200 kilô ôm.',['R_f/R_1 = 2 , R_f/R_2 = 3 , R_f/R_3 = 0,5','Chọn R_f = 100 kΩ ⇒ R_1 = 50 kΩ , R_2 = 33,3 kΩ , R_3 = 200 kΩ']);
T('Câu b và c. Thế v một bằng 1, v hai bằng 2: v o bằng trừ 8 cộng 0,5 v ba. Trừ 15 nhỏ hơn v o nhỏ hơn 15 cho v ba nằm giữa trừ 46 và cộng 14 vôn. Câu c: bão hòa khi v ba lớn hơn hoặc bằng 14 vôn, ngõ ra trừ 15; hoặc v ba nhỏ hơn hoặc bằng trừ 46 vôn, ngõ ra cộng 15.',['v_o = −(2 + 6 + 0,5v_3) = −(8 + 0,5v_3)','−15 < −(8 + 0,5v_3) < 15 ⇒ −46 V < v_3 < 14 V','Bão hòa: v_3 ≥ 14 V (v_o = −15 V) hoặc v_3 ≤ −46 V (v_o = +15 V)']);

ch('BT 7.11');
T('Đề: thiết kế mạch một ngõ vào, độ lợi 11, nguồn cộng trừ 12 V. Độ lợi dương lớn hơn một nên chọn mạch không đảo.',['A_v = 1 + R_f/R_i = 11'],'non');
T('Một cộng R f chia R i bằng 11, nên R f bằng 10 lần R i. Chọn R i bằng 10 kilô ôm, R f bằng 100 kilô ôm. Mạch tuyến tính khi v i nhỏ hơn 12 chia 11, khoảng 1,09 vôn.',['R_f = 10·R_i ⇒ chọn R_i = 10 kΩ , R_f = 100 kΩ','|v_i| < 12/11 ≈ 1,09 V']);

ch('BT 7.12');
T('Đề: thiết kế mạch một ngõ vào, tổng trở vào 10 kilô ôm, độ lợi trừ 10, nguồn cộng trừ 15 V. Độ lợi âm nên chọn mạch đảo.',['Z_i = 10 kΩ , A_v = −10'],'inv');
T('Mạch đảo có Z i bằng R i, nên R i bằng 10 kilô ôm. Độ lợi trừ R f chia R i bằng trừ 10 cho R f bằng 100 kilô ôm.',['R_i = Z_i = 10 kΩ','R_f = 10·R_i = 100 kΩ']);

ch('BT 7.13');
T('Đề: thiết kế mạch ba ngõ vào, v o bằng trừ tổng ba ngõ vào chia 3, nguồn cộng trừ 12 V. Dấu trừ và phép cộng nên dùng tổng đảo.',['v_o = −{v_1+v_2+v_3|3}'],'sum');
T('Câu a và b. Mỗi hệ số bằng R f chia R bằng một phần ba, nên R bằng 3 lần R f. Chọn R f bằng 10 kilô ôm thì ba điện trở ngõ vào đều bằng 30 kilô ôm.',['R_1=R_2=R_3=3R_f','Chọn R_f = 10 kΩ ⇒ R_1 = R_2 = R_3 = 30 kΩ']);

ch('BT 7.14');
T('Đề: mạch trộn hai ngõ vào, v o bằng v một cộng v hai, nguồn cộng trừ 15 V. Dùng mạch cộng không đảo, theo công thức 7.16 với bốn điện trở bằng nhau.',['v_o = v_i1 + v_i2'],'sumn');
T('Câu a và b. Với R một bằng R hai bằng R i bằng R f, độ lợi một cộng R f chia R i bằng 2, còn cầu chia áp cho mỗi ngõ một nửa, nên v o bằng v một cộng v hai. Chọn tất cả bằng 10 kilô ôm.',['(1 + {R_f|R_i})·{R_2|R_1+R_2} = 2·{1|2} = 1','R_1 = R_2 = R_i = R_f = 10 kΩ']);

ch('Bảng tổng hợp 7.1');
T('Bảng tổng hợp các mạch của chương 7. Bạn có thể đổi R i, R f, v một, v hai ở tiêu đề bảng để thấy ví dụ số thay đổi. Hàng một: mạch đảo, ngõ ra bằng trừ R f chia R i nhân v i, tổng trở vào bằng R i.',[]);
T('Hàng hai: mạch không đảo, độ lợi một cộng R f chia R i, luôn lớn hơn hoặc bằng một và cùng pha với ngõ vào; tổng trở vào vô cùng.',[]);
T('Hàng ba: mạch tổng đảo, mỗi ngõ vào có hệ số trừ R f chia điện trở của ngõ đó. Ví dụ số lấy R một bằng R hai bằng R i.',[]);
T('Hàng bốn: mạch tổng không đảo. Mỗi tín hiệu đi qua cầu chia áp rồi nhân độ lợi một cộng R f chia R i. Ví dụ số lấy R một bằng R hai bằng R i, nên mỗi ngõ vào nhân một nửa độ lợi.',[]);
T('Hàng năm: mạch vi sai. Ví dụ số lấy R mười một bằng R hai bằng R i và R mười hai bằng R f, khi đó ngõ ra bằng R f chia R i nhân hiệu v một trừ v hai.',[]);
T('Hàng sáu: mạch lặp điện áp, độ lợi bằng một, tổng trở vào vô cùng.',[]);
T('Hàng bảy: mạch vòng hở, không có hồi tiếp. Ngõ ra bằng A v o nhân hiệu v cộng trừ v trừ, nhưng bị kẹp ở cộng trừ V sat, nên chỉ cần chênh lệch rất nhỏ là bão hòa. Mạch này dùng làm mạch so sánh.',[]);
T('Hàng tám: hai tầng nối tiếp. Độ lợi tổng bằng tích hai độ lợi A v một nhân A v hai, còn tổng trở vào là của tầng thứ nhất. Ví dụ số lấy tầng một là mạch đảo, tầng hai là mạch không đảo, cùng R i và R f.',[]);
T('Hàng chín: độ lợi tính theo đề xi ben. Chuẩn cho điện áp là hai mươi log của trị tuyệt đối A v; riêng bài tập 7.5 trong sách dùng mười log, nên cần đọc kỹ đề.',[]);
T('Hàng mười: điều kiện để Op-Amp còn ở vùng tuyến tính. Ngõ ra phải nằm giữa trừ V sat và cộng V sat, tức biên độ v i nhỏ hơn V sat chia trị tuyệt đối A v. Ví dụ số lấy V sat bằng 12 vôn với mạch đảo. Hãy thử đổi các ô nhập ở đầu bảng để xem các hàng thay đổi.',[]);

$('ln').innerHTML=`<div class='tw'><table class='t51'><tr><th rowspan='2'>Mạch</th><th colspan='3'>Công thức</th><th>Ví dụ số</th></tr><tr><th>Ngõ ra v_o</th><th>Độ lợi / hệ số</th><th>Z_i</th><th>R_i=${ip('Ri',4)}kΩ · R_f=${ip('Rf',4)}kΩ<br>v_1=${ip('v1',3.5)}V · v_2=${ip('v2',3.5)}V</th></tr>`.replace(/(<th>|<th [^>]*>)/g,m=>m)+TRW.slice(0,n).map((r,i)=>`<tr${i==n-1?" class='n'":''}><td class='l'>${r[0]}</td><td>${mt(r[1])}</td><td>${mt(r[2])}</td><td>${mt(r[3])}</td><td class='nm'>${mt(r[4]())}</td></tr>`).join('')+`</table></div><small>Tổng: R_1=R_2=R_i · Vi sai: R_11=R_2=R_i, R_12=R_f</small>`;
$('ln').querySelectorAll('input').forEach(e=>e.onchange=()=>{tv[e.dataset.k]=+e.value||(e.dataset.k=='v1'||e.dataset.k=='v2'?0:1);TB(tN)})}
/* ---- Mô phỏng + dạng sóng ---- */
const SKD=['inv','non','sum','sumn','dif','buf'],AKM={wave:'inv'};
const DFK={inv:{Ri:10,Rf:40,R2:10,A:1,B:0,Vs:12},non:{Ri:10,Rf:20,R2:10,A:1.5,B:0,Vs:12},sum:{Ri:10,Rf:10,R2:10,A:1,B:.5,Vs:12},sumn:{Ri:10,Rf:10,R2:10,A:1,B:.5,Vs:12},dif:{Ri:10,Rf:30,R2:10,A:1,B:.5,Vs:12},buf:{Ri:10,Rf:10,R2:10,A:1.5,B:0,Vs:12}};
const DFC={'VD 7.2':{Ri:8.2,Rf:120,A:.8},'VD 7.3':{Ri:8.2,Rf:68,A:1},'VD 7.4':{Ri:50,Rf:100,R2:100,A:2,B:1},'BT 7.7':{Ri:10,Rf:100,A:2},'BT 7.8':{Ri:5,Rf:10,A:2},'BT 7.12':{Ri:10,Rf:100,A:.1}};
const SL=[['Ri','R_i','kΩ',.5,100,.1],['Rf','R_f','kΩ',1,200,.1],['R2','R_2','kΩ',1,200,.1],['A','Biên độ v_1','V',0,5,.1],['B','v_2 (một chiều)','V',-3,3,.1],['Vs','Vsat','V',5,15,1]];
const SHOW={inv:['Ri','Rf','A','Vs'],non:['Ri','Rf','A','Vs'],sum:['Ri','Rf','R2','A','B','Vs'],sumn:['Ri','Rf','A','B','Vs'],dif:['Ri','Rf','A','B','Vs'],buf:['A','Vs']};
let SP={},sk='',sc7='';
$('sg').innerHTML=SL.map(([k,n,u])=>`<label id='sl_${k}'><span>${mt(k=='Ri'?'R_i':n)}</span> = <output></output> ${u}<input type='range' data-k='${k}'></label>`).join('');
SL.forEach(([k,n,u,a,b,st])=>{const e=document.querySelector(`#sl_${k} input`);e.min=a;e.max=b;e.step=st;e.oninput=()=>{SP[k]=+e.value;simDraw()}});
const gains=()=>{const{Ri,Rf,R2}=SP;return{inv:[-Rf/Ri,0],non:[1+Rf/Ri,0],sum:[-Rf/Ri,-Rf/R2],sumn:[(1+Rf/Ri)/2,(1+Rf/Ri)/2],dif:[Rf/Ri,-Rf/Ri],buf:[1,0]}[sk]};
function simDraw(){const[g1,g2]=gains(),{A,B,Vs}=SP,two=SHOW[sk].includes('B'),Y=Vs*1.3,y=v=>(75-v/Y*65).toFixed(1);
SL.forEach(([k])=>{const l=$('sl_'+k);l.hidden=!SHOW[sk].includes(k);const e=l.querySelector('input');e.value=SP[k];l.querySelector('output').textContent=f(SP[k],1)});
$('sl_Ri').firstChild.innerHTML=sk=='sum'?mt('R_1'):mt('R_i');
const a=[],b=[],c=[];for(let x=0;x<=400;x++){const s=Math.sin(2*Math.PI*x/200),vi=A*s,vo=g1*vi+(two?g2*B:0);a.push(x+','+y(vi));b.push(x+','+y(vo));c.push(x+','+y(Math.max(-Vs,Math.min(Vs,vo))))}
$('sv').innerHTML=`<path d='M0 75H400' stroke='currentColor' opacity='.3'/><path d='M0 ${y(Vs)}H400M0 ${y(-Vs)}H400' stroke='currentColor' stroke-dasharray='2 4' opacity='.4'/><text x='2' y='${+y(Vs)-3}'>+Vsat</text><text x='2' y='${+y(-Vs)+10}'>−Vsat</text><path class='i' d='M${a.join('L')}'/><path class='o2' pathLength='1' style='opacity:.6' d='M${b.join('L')}'/><path class='o' pathLength='1' d='M${c.join('L')}'/><text x='120' y='10'>┄ v₁   cam: v_o lý thuyết   xanh: v_o thực (xén ±Vsat)</text>`;
const mx=Math.abs(g1)*A+(two?Math.abs(g2*B):0),lin=mx<=Vs,rg=Math.abs(g1)>1e-9?(Vs-(two?Math.abs(g2*B):0))/Math.abs(g1):0;
$('so').innerHTML=(two?`v_o = ${f(g1)}·v₁ ${g2<0?'−':'+'} ${f(Math.abs(g2))}·v₂`:`A_v = <b>${f(g1)}</b>`)+` · |v_o|max lý thuyết = <b>${f(mx)} V</b> → `+(lin?`<b>tuyến tính</b> (còn dư ${f(Vs-mx)} V)`:`<b style='color:#dc2626'>bão hòa</b>, ngõ ra bị xén ở ±${f(Vs,0)} V`)+`.<br>Biên độ v₁ tối đa để còn tuyến tính: <b>${f(rg)} V</b>.`}
function ext(s,k){const tb=C[s.c]=='Bảng tổng hợp 7.1',kk=AKM[k]||k;document.querySelector('.board').classList.toggle('wide',tb);
if(tb)TB(S.slice(0,i+1).filter(t=>t.c==s.c).length);else $('ln').insertAdjacentHTML('beforeend',LG(s.ln));
const ok=!tb&&SKD.includes(kk);$('sim').hidden=!ok;
if(ok){if(sc7!=C[s.c]||sk!=kk){sc7=C[s.c];sk=kk;SP=Object.assign({},DFK[kk],DFC[C[s.c]]||{})}
$('simT').textContent='Thử nghiệm: '+({inv:'mạch khuếch đại đảo',non:'mạch khuếch đại không đảo',sum:'mạch tổng đảo (2 ngõ vào)',sumn:'mạch tổng không đảo (R₁=R₂)',dif:'mạch vi sai (R₁₁=R₂=Rᵢ, R₁₂=R_f)',buf:'mạch lặp điện áp'}[kk])+' — kéo thanh để xem dạng sóng';simDraw()}
window.NG=kk=='non'?-1:1;const l=FG[C[s.c]]||[],id=l[fk==C[s.c]?fi:0],ar=['7.4','7.6','7.7','7.10','7.12'].includes(id);$('ph').style.display=ar?'':'none';phU()}
function phU(){const n=window.NG==-1;$('ph').querySelectorAll('button').forEach((b,j)=>b.className=(j==0)==((window.PH||1)==1)?'on':'');
$('ps').textContent=(window.PH||1)==1?(n?'v_i > 0 ⇒ v_o > 0 (cùng pha); dòng chảy từ ngõ ra qua R_f xuống đất':'v_i > 0 ⇒ v_o < 0 (đảo pha); dòng chảy từ nguồn qua R_i và R_f'):(n?'v_i < 0 ⇒ v_o < 0 (cùng pha); dòng đổi chiều':'v_i < 0 ⇒ v_o > 0 (đảo pha); dòng đổi chiều')}
function phSet(j){window.PH=j?-1:1;rf(S[i],1);phU()}
$('ph').querySelectorAll('button').forEach((b,j)=>b.onclick=()=>{auto=false;phSet(j)});
let auto=!matchMedia('(prefers-reduced-motion:reduce)').matches;setInterval(()=>{if(auto&&!document.hidden&&$('ph').style.display!='none')phSet((window.PH||1)==1?1:0)},2600);
$('sv').onclick=()=>{if(!$('sim').hidden)simDraw()};


const CS=[
['0. Mở đầu mọi bài (ghi vào bài làm)',['Op-Amp lý tưởng, có hồi tiếp âm: v⁻ = v⁺, i⁻ = i⁺ = 0.','Gọi N là nút ngõ đảo, viết KCL tại N: tổng dòng vào = tổng dòng ra.','Thế v_N (biết từ v⁺) rồi rút v_o.'],'Quên ghi giả thiết lý tưởng; nhầm chiều dòng khi viết KCL.'],
['1. Mạch đảo (tín hiệu vào ngõ −)',['v⁺ = 0 ⇒ v_N = 0.','KCL: {v_i|R_i} = −{v_o|R_f}.','A_v = −{R_f|R_i}; Z_i = R_i.'],'Mất dấu −. Đề cho v_i thì v_o ngược pha.'],
['2. Mạch không đảo (tín hiệu vào ngõ +)',['v⁺ = v_i ⇒ v_N = v_i.','KCL: −{v_i|R_i} = {v_i − v_o|R_f}.','A_v = 1 + {R_f|R_i}; Z_i = ∞.'],'Viết thiếu số 1; A_v không bao giờ nhỏ hơn 1.'],
['3. Tổng đảo / tổng không đảo',['Tổng đảo (v_N = 0): v_o = −({R_f|R_1}v_1 + {R_f|R_2}v_2 + …).','Tổng không đảo: xếp chồng; mỗi v_k qua cầu chia áp rồi nhân (1 + {R_f|R_i}).','Có thể dùng xếp chồng: cho các nguồn khác = 0, tính từng v_ok, rồi cộng.'],'Quên đặt các nguồn khác bằng 0 (nối đất) khi xếp chồng.'],
['4. Vi sai',['Xếp chồng: cho v_2 = 0 → v_o1 = {R_12|R_11+R_12}(1 + {R_f|R_2})v_1.','Cho v_1 = 0 → v_o2 = −{R_f|R_2}v_2.','Cân bằng R_11 = R_2, R_12 = R_f: v_o = {R_f|R_2}(v_1 − v_2).'],'Nhầm ngõ nào là v_1, ngõ nào là v_2; quên v_o1 là không đảo có chia áp.'],
['5. Mạch lặp & hai tầng nối tiếp',['Lặp: A_v = 1, Z_i = ∞ (đệm, không sụt áp nguồn).','Hai tầng: v_o1 là ngõ vào tầng 2; A_v = A_v1·A_v2; Z_i = Z_i tầng 1.','dB: dùng công thức đề cho (BT 7.5 sách ghi 10·log₁₀; chuẩn điện áp là 20·log₁₀).'],'Đổi dB phải tính từng tầng hoặc cộng dB; đừng nhân dB.'],
['6. Điều kiện tuyến tính (đề hay hỏi)',['Giải −V_sat < v_o < V_sat với v_o = A_v·v_i.','Chia cho A_v < 0 thì đảo chiều bất đẳng thức.','Có nhiều ngõ: thế các ngõ đã cho, giải ra miền của ngõ còn lại.'],'Quên đổi chiều khi chia số âm; quên nguồn cấp của đề (±12 V hay ±15 V).'],
['7. Bão hòa / vòng hở',['v⁺ > v⁻ ⇒ v_o = +V_sat; v⁺ < v⁻ ⇒ v_o = −V_sat (nguồn đơn thì −V_sat ≈ 0).','Tính thử v_o lý thuyết; nếu vượt ±V_sat thì ghi v_o = ±V_sat.'],'Ghi v_o lý thuyết (hàng chục nghìn V) thay vì giá trị bão hòa.'],
['8. Bài thiết kế',['Đảo, A_v = −n, Z_i cho trước: R_i = Z_i, R_f = n·R_i.','Không đảo, A_v = n: chọn R_i, R_f = (n − 1)R_i.','Tổng đảo: hệ số a_k = {R_f|R_k} ⇒ chọn R_f (vd 100 kΩ), R_k = {R_f|a_k}.','Kiểm tra lại v_o tối đa < V_sat.'],'Chọn điện trở quá nhỏ (<1 kΩ) hoặc quá lớn; quên vẽ mạch.'],
['9. Checklist trước khi nộp',['Dấu của v_o và A_v.','Đơn vị: kΩ chia kΩ ra số thuần; V, mA, dB.','Đã kiểm tra bão hòa chưa?','Kết luận cuối bài bằng một câu.'],'']];
$('sheet').innerHTML='<div class="tb"><button id="shp">In tờ này</button><button id="shx">Đóng</button></div><h2>Tờ ôn: khuôn giải tự luận – Chương 7 Op-Amp</h2><div class="gr">'+CS.map(c=>`<div class="cd"><b>${mt(c[0])}</b><ol>${c[1].map(x=>'<li>'+mt(x)+'</li>').join('')}</ol>${c[2]?`<div class="w">⚠ ${mt(c[2])}</div>`:''}</div>`).join('')+'</div>';
