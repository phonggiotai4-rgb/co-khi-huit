ch('Bảng 5.1');
T('Bảng 5.1 của sách tổng hợp các thông số chỉnh lưu, với N bằng U một m chia U hai m. Trung bình: bán kỳ là U hai m chia pi, toàn kỳ gấp đôi. Có tụ lọc: hệ số 2fRC cho bán kỳ, 8fRC cho toàn kỳ. Hiệu dụng: bán kỳ là U hai m chia 2, toàn kỳ là U hai m chia căn 2.',['Thông số | Bán kỳ | Toàn kỳ','ULDC | U2m/π | 2U2m/π','U′LDC | U2m·2fRC/(2fRC+1) | U2m·8fRC/(8fRC+1)','ULHD | U2m/2 | U2m/√2']);
T('Áp ngược lớn nhất: bán kỳ và cầu là U hai m, riêng mạch tia là hai U hai m. Dòng điện bằng áp chia R tải: trung bình U hai m chia pi R cho bán kỳ và gấp đôi cho toàn kỳ; hiệu dụng U hai m chia 2R hoặc chia căn 2 R. Dòng thuận cực đại qua diode luôn bằng U hai m chia R tải.',['URDmax: bán kỳ = U2m · cầu = U2m · tia = 2U2m','ILDC = ULDC/RL: U2m/(πRL) · 2U2m/(πRL)','ILHD = ULHD/RL: U2m/(2RL) · U2m/(√2RL)','IFDmax = U2m/RL (cả ba loại)']);
T(`Độ gợn sóng là thành phần xoay chiều lẫn trong đầu ra một chiều: gamma bằng căn của U_LHD bình phương trừ U_LDC bình phương, chia U_LDC. Bán kỳ ra ${f(Gh)}, toàn kỳ chỉ ${f(Gf)}, nên toàn kỳ cho điện áp phẳng hơn nhiều.`,['Γ = √(ULHD² − ULDC²) / ULDC','Bán kỳ: Γ = '+f(Gh),'Toàn kỳ: Γ = '+f(Gf),'Γ càng nhỏ → áp càng phẳng'],'cm');
T(`Ví dụ số: lấy U hai m bằng 20 vôn, tải 100 ôm, 50 héc, tụ 1000 micrô farad. Bán kỳ cho trung bình ${f(20/P)} vôn, toàn kỳ gấp đôi, ${f(40/P)} vôn. Có tụ lọc, trung bình tăng lên ${f(20*10/11)} vôn ở bán kỳ và ${f(20*40/41)} vôn ở toàn kỳ, rất sát U hai m. Áp ngược mạch tia là 40 vôn, gấp đôi mạch cầu. Bạn có thể đổi giá trị U hai m trong ô nhập để xem các công thức thay đổi.`,[]);

ch('Ổn áp');
T('Ổn áp bằng diode Zener: khi phân cực ngược và vượt ngưỡng Vz, điện áp trên diode được giữ cố định bằng Vz. Dòng qua Zener bằng dòng qua R trừ dòng tải, và phải nằm giữa Izmin, khoảng 5 đến 10 miliampe, và Izmax.',['UL = Vz','Iz = (Vdc − Vz)/R − Vz/RL','Izmin ≤ Iz ≤ Izmax'],'zr');
T('Chọn R bằng hai đầu: R nhỏ nhất ứng với Vdc lớn nhất và Izmax, R lớn nhất ứng với Vdc nhỏ nhất và Izmin. Khi hở tải thì toàn bộ dòng đi qua Zener, nên R bằng Vdc max trừ Vz chia Izmax. Nhược điểm: dòng tải không được vượt Izmax.',['(Vdcmax−Vz)/(Izmax+Vz/RL) ≤ R ≤ (Vdcmin−Vz)/(Izmin+Vz/RL)','Hở tải: R = (Vdcmax − Vz)/Izmax']);
{const Vz=12,RL=1000,a=18,b=24,i0=.005,i1=1/12,R1=(b-Vz)/(i1+Vz/RL),R2=(a-Vz)/(i0+Vz/RL),R=220,za=(a-Vz)/R-Vz/RL,zb=(b-Vz)/R-Vz/RL,Rh=(b-Vz)/i1,zh=(b-Vz)/R,m=x=>f(x*1000,1);
T('Ví dụ số do mình tự đặt để luyện công thức, sách không có số cho phần này. Cho Vz bằng 12 vôn, công suất tối đa của Zener 1 oát, nên Izmax bằng 1 chia 12, khoảng 83,3 mili ampe. Izmin lấy 5 mili ampe. Tải 1 kì lô ôm, nên dòng tải bằng 12 chia 1000, là 12 mili ampe. Nguồn Vdc dao động từ 18 đến 24 vôn.',['VD tự đặt: Vz = 12 V, Pzmax = 1 W, RL = 1 kΩ','Izmax = 1/12 = '+m(i1)+' mA, Izmin = 5 mA','IL = Vz/RL = 12 mA','Vdc = 18 … 24 V']);
T(`Theo công thức 5.35: R nhỏ nhất bằng 24 trừ 12 chia, 0,0833 cộng 0,012, được ${f(R1,1)} ôm. R lớn nhất bằng 18 trừ 12 chia, 0,005 cộng 0,012, được ${f(R2,1)} ôm. Chọn R nằm trong khoảng này, ví dụ 220 ôm là trị số chuẩn.`,['(Vdcmax−Vz)/(Izmax+Vz/RL) = 12/(0,0833+0,012) = '+f(R1,1)+' Ω','(Vdcmin−Vz)/(Izmin+Vz/RL) = 6/(0,005+0,012) = '+f(R2,1)+' Ω',f(R1,1)+' Ω ≤ R ≤ '+f(R2,1)+' Ω → chọn R = 220 Ω']);
T(`Kiểm tra Iz bằng Vdc trừ Vz chia R, trừ Vz chia R tải. Ở 18 vôn được ${m(za)} mili ampe, lớn hơn 5. Ở 24 vôn được ${m(zb)} mili ampe, nhỏ hơn ${m(i1)}. Hở tải theo công thức 5.38, R tối thiểu bằng 12 chia 0,0833, là ${f(Rh,0)} ôm, mà 220 lớn hơn nên an toàn: khi hở tải Iz là ${m(zh)} mili ampe, công suất ${f(Vz*zh)} oát, dưới 1 oát.`,['Iz(18V) = 6/220 − 0,012 = '+m(za)+' mA ≥ 5 ✓','Iz(24V) = 12/220 − 0,012 = '+m(zb)+' mA ≤ '+m(i1)+' ✓','Hở tải: R ≥ 12/0,0833 = '+f(Rh,0)+' Ω ✓','Iz = 12/220 = '+m(zh)+' mA, P = '+f(Vz*zh)+' W < 1 W']);}
T('Muốn tải dòng lớn hơn, thêm transistor BJT. Điện áp ra là Vz trừ 0,6 vôn, và dòng tải có thể lớn gấp bê ta lần dòng Izmax.',['UL = Vz − 0,6 V','IL ≈ IC, tới β·Izmax']);
T('IC 78XX ổn áp nguồn dương, 79XX ổn áp nguồn âm, XX là điện áp ra, chịu tải tới 1,5 ampe. Điện áp vào phải cao hơn điện áp ra ít nhất 3 vôn với 78XX. Hai tụ nhỏ ở vào và ra để lọc nhiễu cao tần. Chú ý chân: 7812 là vào, đất, ra; còn 7912 là đất, vào, ra.',['78XX: +, chân 1 IN · 2 GND · 3 OUT','79XX: −, chân 1 GND · 2 IN · 3 OUT','Vào − ra ≥ 3V, IL ≤ 1,5A'],'-','i7');
T('Mạch 7912 vẽ ngược: chân 1 nối đất ở trên, điện áp vào âm ở chân 2, điện áp ra âm ở chân 3. Còn 7812 thì chân 1 là vào, chân 2 là đất, chân 3 là ra.',['7912: 1 GND · 2 IN · 3 OUT','Vout = −12 V so với đất'],'-','i9');
T(`Điện áp vào của IC 317 lên tới 40 vôn, hoặc âm 40 vôn với 337. Điện áp ra điều chỉnh được từ 1,25 đến 37 vôn, tải tới 1,5 ampe, theo công thức V ra bằng 1,25 nhân một cộng VR hai chia R một. Với R một 240 ôm và biến trở 5 kilô ôm thì tối đa khoảng ${f(1.25*(1+5000/240),1)} vôn.`,['Vout ≈ ±1,25(1 + VR2/R1)','R1 = 240Ω, VR2 = 5kΩ → tối đa ≈ '+f(1.25*(1+5000/240),1)+' V'],'-','i3');
T('IC 337 là bản nguồn âm của 317: chân 1 ADJ, chân 2 vào, chân 3 ra; điện áp ra âm V ra bằng trừ 1,25 nhân một cộng VR hai chia R một. Cầu diode và tụ lọc phía trước giống nhau.',['LM337: 1 ADJ · 2 IN · 3 OUT','Vout ≈ −1,25(1 + VR2/R1)'],'-','i4');
T('Mạch ±12 vôn dùng biến áp có điểm giữa nối đất. Hai diode trên cấp nguồn dương qua 7812, hai diode dưới cấp nguồn âm qua 7912; mỗi nhánh có tụ lọc lớn C1, C2 và tụ nhỏ lọc nhiễu.',['Điểm giữa cuộn thứ cấp = đất (GND)','+12 V: D1, D2 → 7812','−12 V: D3, D4 → 7912'],'-','i5');

const uf=x=>f(x,x<100?1:0);
const PB=(nm,o,seq)=>{ch(nm);
const ty=o.ty,cap=!!o.cap,ha=ty=='h',kk=ha?2:8,fr=o.f||50,RL=o.RL,U1m=o.sq?o.am*Q:o.am,

tn=ha?'bán kỳ':ty=='b'?'toàn kỳ kiểu cầu':'toàn kỳ kiểu tia',res=[],Ld=l=>l?`Câu ${l}. `:'',rp=(l,s)=>res.push((l?l+') ':'')+s),

fo=o.om=='314'?314/2/P:fr,c={U2m,U1m,N,g,fr,RL,res,rp,Ld,tn,ha,ty,kk,nz};
const B={
u2m:l=>{if(o.noTr){T(`${Ld(l)}Đề không có biến áp, nguồn đưa thẳng vào mạch chỉnh lưu, nên điện áp xoay chiều đặt vào mạch chính là điện áp nguồn: U hai m bằng ${f(U2m)} vôn.`,['Không biến áp ⇒ U2m = Um nguồn = '+o.am+'√2 = '+f(U2m)+' V'])}
else if(o.N){T(`${Ld(l)}Đề cho sẵn N bằng ${o.N}. Vì N bằng U một m chia U hai m, nên U hai m bằng U một m chia N, tức ${f(U1m)} chia ${o.N}, được ${f(U2m)} vôn.${ty=='t'?' Chú ý đây là biên độ của mỗi nửa cuộn thứ cấp.':''}`,['N = U1m/U2m ⇒ U2m = U1m/N','U2m = '+f(U1m)+'/'+o.N+' = '+f(U2m)+' V'])}
else{T(`${Ld(l)}Mọi công thức chỉnh lưu đều tính theo U hai m, nên ta tìm U hai m trước. Với mạch ${tn}, điện áp trung bình bằng ${ha?'U hai m chia pi':'hai U hai m chia pi'}. Đảo lại, U hai m bằng pi nhân ${o.ULDC}${ha?'':' rồi chia 2'}, được ${f(U2m)} vôn.`,[ha?'ULDC = U2m/π ⇒ U2m = π·ULDC':'ULDC = 2U2m/π ⇒ U2m = π·ULDC/2','U2m = π·'+o.ULDC+(ha?'':'/2')+' = '+f(U2m)+' V'])}
rp(l,'U2m = '+f(U2m)+' V')},
N:l=>{T(`${Ld(l)}Hệ số biến áp N bằng U một m chia U hai m, tức ${f(U1m)} chia ${f(U2m)}, được ${f(N)}. N lớn hơn 1 nên đây là biến áp hạ áp, đúng với mục đích tạo nguồn một chiều điện áp thấp.`,['N = U1m/U2m = '+f(U1m)+'/'+f(U2m)+' = '+f(N),'N > 1 ⇒ biến áp hạ áp ✓']);rp(l,'N = '+f(N))},
dc:l=>{if(o.ULDC){const I=o.ULDC/RL;T(`${Ld(l)}Điện áp chỉnh lưu trung bình đề đã cho là ${o.ULDC} vôn. Dòng trung bình qua tải theo định luật Ôm bằng ULDC chia RL, tức ${o.ULDC} chia ${RL}, được ${f(I,3)} ampe.`,['ILDC = ULDC/RL = '+o.ULDC+'/'+RL+' = '+f(I,3)+' A']);rp(l,'ILDC = '+f(I,3)+' A')}
else{T(`${Ld(l)}Với mạch ${tn}, ${ha?'chỉ nửa dương có dòng nên điện áp trung bình bằng U hai m chia pi':'cả hai nửa chu kỳ đều có dòng nên trung bình gấp đôi nửa kỳ, bằng hai U hai m chia pi'}. Thay số được ${f(g.dc)} vôn. Dòng trung bình bằng ULDC chia RL, tức ${f(g.dc)} chia ${RL}, được ${f(g.idc,4)} ampe.`,['ULDC = '+(ha?'U2m/π = ':'2U2m/π = 2·')+f(U2m)+'/π = '+f(g.dc)+' V','ILDC = ULDC/RL = '+f(g.dc)+'/'+RL+' = '+f(g.idc,4)+' A']);rp(l,'ULDC = '+f(g.dc)+' V, ILDC = '+f(g.idc,4)+' A')}},
rms:(l,x)=>{const i=x&&x.i;T(`${Ld(l)}${ha?'Ở mạch bán kỳ, nửa âm bằng 0 nên bình phương trung bình chỉ còn một nửa của sóng sin, và hiệu dụng bằng U hai m chia 2':'Ở mạch toàn kỳ, điện áp trên tải lặp lại như một sóng sin đầy đủ, nên hiệu dụng bằng U hai m chia căn 2'}. Thay số: ${f(g.rms)} vôn.${i?` Dòng hiệu dụng bằng ULHD chia RL, tức ${f(g.rms)} chia ${RL}, được ${f(g.irms,4)} ampe.`:''}`,['ULHD = '+(ha?'U2m/2 = ':'U2m/√2 = ')+f(U2m)+(ha?'/2':'/√2')+' = '+f(g.rms)+' V'].concat(i?['ILHD = ULHD/RL = '+f(g.rms)+'/'+RL+' = '+f(g.irms,4)+' A']:[]));rp(l,'ULHD = '+f(g.rms)+' V'+(i?', ILHD = '+f(g.irms,4)+' A':''))},

fwd:l=>{T(`${Ld(l)}Diode mắc nối tiếp với tải nên dòng qua diode chính là dòng qua tải. Dòng lớn nhất khi điện áp tải đạt U hai m, nên IFDmax bằng U hai m chia RL, tức ${f(U2m)} chia ${RL}, được ${f(g.if,4)} ampe.`,['IFDmax = U2m/RL = '+f(U2m)+'/'+RL+' = '+f(g.if,4)+' A']);rp(l,'IFDmax = '+f(g.if,4)+' A')},
cap:l=>{const x=kk*fr*RL*o.C*1e-6,v=U2m*x/(x+1);T(`${Ld(l)}Có tụ lọc nên dùng công thức gần đúng: U phẩy bằng U hai m nhân ${kk} f RL C trên ${kk} f RL C cộng 1, hệ số ${kk} dành cho mạch ${tn}. Tính ${kk} f RL C bằng ${kk} nhân ${f(fr,0)} nhân ${RL} nhân ${o.C} nhân mười mũ trừ sáu, được ${nz(x)}. Vậy U phẩy bằng ${f(U2m)} nhân ${nz(x)} chia ${nz(x+1)}, được ${f(v)} vôn. Giá trị này nhỏ hơn U hai m nhưng sát, vì tụ giữ điện áp gần mức đỉnh.`,['U′LDC = U2m·'+kk+'fRC/('+kk+'fRC+1)',kk+'fRC = '+kk+'·'+fr+'·'+RL+'·'+o.C+'·10⁻⁶ = '+nz(x),'U′LDC = '+f(U2m)+'·'+nz(x)+'/'+nz(x+1)+' = '+f(v)+' V','U′LDC < U2m ✓'],cap||o.ck?(ha?'ch':'cf'):undefined,o.ck);rp(l,'U′LDC = '+f(v)+' V')},

chk:()=>{T(`Tóm tắt đáp số của bài. Lỗi hay gặp: ${ha&&!cap?'dùng nhầm hệ số hai trên pi của toàn kỳ cho mạch bán kỳ':cap?'nhầm hệ số 2 f R C của bán kỳ với 8 f R C của toàn kỳ':ty=='t'?'quên rằng U hai m là biên độ của mỗi nửa cuộn, và áp ngược của mạch tia là hai U hai m':'nhầm áp ngược của mạch cầu, bằng U hai m, với của mạch tia, bằng hai U hai m'}.`,res.slice())}};
T(`Bước đầu tiên là đọc đề. Mạch có ${cd}${cap?', thêm tụ C song song với tải':''}, nên đây là mạch chỉnh lưu ${tn}${cap?' có tụ lọc':''}.${o.noTr?' Đề không có biến áp, nguồn đưa thẳng vào mạch.':''} Nguồn có dạng U một m nhân sin omega t. ${o.sq?`Có căn 2 nên biên độ U một m là ${o.am} căn 2, khoảng ${f(U1m)} vôn, còn hiệu dụng là ${o.am} vôn`:`Không có căn 2 nên biên độ U một m chính là ${o.am} vôn`}. Tần số góc ${o.om} rad trên giây cho f bằng omega chia 2 pi, khoảng ${f(fr,0)} héc.`,['Mạch: '+tn+(cap?' + tụ lọc':''),'u1 = '+o.sp+' ⇒ U1m = '+(o.sq?o.am+'√2 = '+f(U1m):o.am)+' V','ω = '+o.om+' rad/s ⇒ f = ω/2π ≈ '+f(fo,2)+' Hz','Cho: '+o.given],cap?(ha?'ch':'cf'):(ha?'h':'f'));

PB('BT 5.6',{ty:'t',cap:1,sq:1,am:100,sp:'100√2·sin(100πt)',om:'100π',RL:100,C:2200,N:5,given:'RL = 100 Ω, C = 2200 µF, N = 5',plan:'Hướng giải: mạch tia có tụ nên hệ số là 8 f RL C. Câu a, b giống các bài trước. Câu c hỏi giá trị tối đa của điện áp trung bình, câu d so độ gợn sóng khi có và không có tụ.',pl:['a, b: như các bài có tụ trước','c: giá trị tối đa của U′LDC','d: so sánh độ gợn Γ']},[['a',['u2m','cap']],['b',[['capC',{v:20}]]],['c',[(l,c)=>{const v=.99*c.U2m,C=v/(8*c.fr*c.RL*(c.U2m-v));T(`${c.Ld(l)}Điện áp trung bình có tụ luôn nhỏ hơn U hai m, và chỉ tiến tới U hai m khi tích f RL C tiến ra vô cùng. Vậy giá trị tối đa là U hai m, bằng ${f(c.U2m)} vôn, nhưng không có tụ hữu hạn nào đạt đúng giá trị này. Trong thực tế chọn C đủ lớn: ví dụ muốn đạt 99%, tức ${f(v)} vôn, thì C khoảng ${uf(C*1e6)} micrô farad. Câu này đề hơi mở, bạn nên hỏi lại thầy cách hiểu.`,['U′LDC → U2m = '+f(c.U2m)+' V khi C → ∞','Ví dụ 99%: U′ = '+f(v)+' V ⇒ C ≈ '+uf(C*1e6)+' µF']);c.rp(l,'U′max = U2m = '+f(c.U2m)+' V (C → ∞)')}]],['d',[(l,c)=>{const x=8*c.fr*c.RL*2200e-6,Ud=c.U2m*x/(x+1),dV=c.U2m/(2*c.fr*c.RL*2200e-6),rm=dV/(2*Math.sqrt(3)),G=rm/Ud;T(`${c.Ld(l)}Không có tụ, độ gợn sóng toàn kỳ là ${f(Gf)}. Có tụ, sách không cho công thức, nên mình dùng xấp xỉ quen thuộc: gợn đỉnh đỉnh bằng U hai m chia 2 f RL C, được ${f(dV)} vôn; gợn hiệu dụng bằng gợn đỉnh đỉnh chia 2 căn 3, được ${f(rm,3)} vôn. Chia cho điện áp trung bình ${f(Ud)} vôn ta được gamma khoảng ${f(G,3)}. Tụ giảm độ gợn khoảng ${f(Gf/G,0)} lần.`,['Không tụ: Γ = '+f(Gf),'ΔVpp ≈ U2m/(2fRLC) = '+f(dV)+' V','Vgợn,hd = ΔVpp/(2√3) = '+f(rm,3)+' V','Có tụ: Γ ≈ '+f(rm,3)+'/'+f(Ud)+' = '+f(G,3)]);c.rp(l,'Γ: '+f(Gf)+' → ≈ '+f(G,3)+' (có tụ)')}]]]);

PB('BT 5.8',{ty:'b',noTr:1,sq:1,am:28,sp:'28√2·sin(100πt)',om:'100π',RL:200,C:2200,ck:'bnc',given:'RL = 200 Ω; câu e: C = 2200 µF',plan:'Hướng giải: nguồn nối thẳng vào cầu nên U hai m bằng biên độ nguồn, 28 căn 2 vôn. Từ đó tính trung bình, hiệu dụng; câu c so sánh dòng qua diode với dòng qua tải; câu d viết biểu thức áp ngược; câu e thêm tụ.',pl:['Không biến áp: U2m = 28√2','a, b: công thức cầu','c, d: dòng và áp ngược trên diode','e: thêm tụ 2200 µF']},[['a',['u2m','dc']],['b',[['rms',{i:1}]]],['c',[(l,c)=>{T(`${c.Ld(l)}Dòng thuận cực đại qua mỗi diode bằng U hai m chia RL, được ${f(c.g.if,4)} ampe. Dòng cực đại qua tải cũng bằng U hai m chia RL, nên hai giá trị bằng nhau: lúc dẫn, mỗi diode mang trọn dòng tải. Nhưng mỗi diode chỉ dẫn nửa thời gian, nên dòng trung bình qua mỗi diode chỉ bằng một nửa dòng trung bình tải, tức ${f(c.g.idc/2,4)} ampe.`,['IFDmax = U2m/RL = '+f(c.U2m)+'/'+c.RL+' = '+f(c.g.if,4)+' A','IL max = U2m/RL = '+f(c.g.if,4)+' A','⇒ IFDmax = IL max','Trung bình mỗi diode = ILDC/2 = '+f(c.g.idc/2,4)+' A']);c.rp(l,'IFDmax = IL max = '+f(c.g.if,4)+' A')}]],['d',[(l,c)=>{T(`${c.Ld(l)}Diode đang khóa chịu điện áp bằng trị tuyệt đối của điện áp nguồn: u RD bằng U hai m nhân trị tuyệt đối sin omega t, trong nửa chu kỳ mà nó khóa. Giá trị lớn nhất bằng U hai m, tức ${f(c.U2m)} vôn. Hình trong đề không đọc rõ nhãn diode nên mình mô tả chung cho cặp diode đang khóa.`,['uRD = U2m·|sin ωt| (nửa chu kỳ diode khóa)','URDmax = U2m = '+f(c.U2m)+' V']);c.rp(l,'URDmax = '+f(c.U2m)+' V')}]],['e',['cap']]]);

PB('Thêm 5',{ty:'b',cap:1,sq:0,am:311,sp:'311·sin(314t)',om:'314',RL:60,C:2200,N:14,given:'RL = 60 Ω, C = 2200 µF, N = 14',plan:'Hướng giải: nguồn 311 sin không có căn 2, ω bằng 314 nên f khoảng 50 héc. Mạch cầu có tụ dùng hệ số 8 f RL C. Câu c là câu mở rộng: ước lượng độ gợn đỉnh đỉnh của điện áp tải.',pl:['U1m = 311 V, f ≈ 50 Hz','Toàn kỳ: hệ số 8fRC','c: độ gợn đỉnh–đỉnh ΔV']},[['a',['u2m','cap']],['b',[['capC',{v:21}]]],['c',[(l,c)=>{const C=2200e-6,dV=c.U2m/(2*c.fr*c.RL*C),x=8*c.fr*c.RL*C,Ud=c.U2m*x/(x+1);T(`${c.Ld(l)}Sau mỗi lần nạp tới đỉnh, tụ xả qua tải trong khoảng một nửa chu kỳ, tức một chia hai f giây, với dòng xấp xỉ U hai m chia RL. Độ sụt điện áp đỉnh đỉnh khi đó là dòng nhân thời gian chia C, được ΔV bằng U hai m chia, 2 f RL C, bằng ${f(dV)} vôn. So với điện áp trung bình ${f(Ud)} vôn thì độ gợn khoảng ${f(dV/Ud*100,1)} phần trăm. Đây là công thức xấp xỉ ngoài sách, dùng để ước lượng nhanh.`,['ΔV ≈ (U2m/RL)·(1/(2f))/C = U2m/(2fRLC)','ΔV = '+f(c.U2m)+'/(2·'+c.fr+'·'+c.RL+'·2200·10⁻⁶) = '+f(dV)+' V','ΔV/U′LDC ≈ '+f(dV/Ud*100,1)+' %']);c.rp(l,'ΔV ≈ '+f(dV)+' V (≈ '+f(dV/Ud*100,1)+' %)')}]]]);

ch('Thêm 6');
{const Vz=9,RL=300,a=15,b=20,i0=.005,i1=1/9,IL=Vz/RL,R1=(b-Vz)/(i1+IL),R2=(a-Vz)/(i0+IL),R=120,za=(a-Vz)/R-IL,zb=(b-Vz)/R-IL,Rh=(b-Vz)/i1,zh=(b-Vz)/R,m=x=>f(x*1000,1);
T('Đọc đề: đây là bài thiết kế điện trở R cho mạch ổn áp Zener. Cần ba việc: giữ dòng qua Zener nằm giữa Izmin và Izmax khi nguồn dao động từ 15 đến 20 vôn, chọn R trong khoảng cho phép, và kiểm tra trường hợp hở tải để Zener không bị hỏng.',['Cho: Vz = 9 V, Pzmax = 1 W, Izmin = 5 mA','RL = 300 Ω, Vdc = 15 … 20 V','Cần: Izmax, IL, khoảng R, kiểm tra hở tải']);
T(`Câu a. Dòng Zener lớn nhất theo công suất: Izmax bằng Pzmax chia Vz, bằng 1 chia 9, được ${m(i1)} mili ampe. Dòng tải bằng Vz chia RL, bằng 9 chia 300, được ${m(IL)} mili ampe.`,['Izmax = Pzmax/Vz = 1/9 = '+m(i1)+' mA','IL = Vz/RL = 9/300 = '+m(IL)+' mA']);
T(`Câu b. Theo công thức 5.35, R nhỏ nhất bằng Vdcmax trừ Vz, chia Izmax cộng Vz chia RL: 11 chia ${f(i1+IL,4)}, được ${f(R1,1)} ôm. R lớn nhất bằng Vdcmin trừ Vz, chia Izmin cộng Vz chia RL: 6 chia ${f(i0+IL,3)}, được ${f(R2,1)} ôm.`,['Rmin = (Vdcmax−Vz)/(Izmax+Vz/RL) = 11/'+f(i1+IL,4)+' = '+f(R1,1)+' Ω','Rmax = (Vdcmin−Vz)/(Izmin+Vz/RL) = 6/'+f(i0+IL,3)+' = '+f(R2,1)+' Ω',f(R1,1)+' Ω ≤ R ≤ '+f(R2,1)+' Ω']);
T(`Câu c. Chọn R bằng 120 ôm, nằm trong khoảng trên. Kiểm tra Iz bằng Vdc trừ Vz chia R, trừ Vz chia RL. Ở 15 vôn được ${m(za)} mili ampe, lớn hơn 5. Ở 20 vôn được ${m(zb)} mili ampe, nhỏ hơn ${m(i1)}. Vậy Zener luôn ổn áp và không quá tải.`,['R = 120 Ω','Iz(15V) = 6/120 − 0,03 = '+m(za)+' mA ≥ 5 ✓','Iz(20V) = 11/120 − 0,03 = '+m(zb)+' mA ≤ '+m(i1)+' ✓']);
T(`Câu d. Khi hở tải, toàn bộ dòng đi qua Zener. Theo công thức 5.38, R tối thiểu bằng Vdcmax trừ Vz chia Izmax, bằng 11 chia ${f(i1,4)}, được ${f(Rh,0)} ôm. R bằng 120 lớn hơn nên an toàn: Iz khi hở tải là ${m(zh)} mili ampe, công suất ${f(Vz*zh)} oát, dưới 1 oát.`,['Hở tải: R ≥ (Vdcmax−Vz)/Izmax = 11/'+f(i1,4)+' = '+f(Rh,0)+' Ω','R = 120 Ω > '+f(Rh,0)+' Ω ✓','Iz = 11/120 = '+m(zh)+' mA, P = '+f(Vz*zh)+' W < 1 W'])}

ch('Khó 1');
{const RL=24,f0=50,C1=2200e-6,C2=6800e-6,Ut=12,U1m=220*Q,x1=8*f0*RL*C1,U2n=Ut*(x1+1)/x1,Nn=U1m/U2n,N=25,U2=U1m/N,Uav=U2*x1/(x1+1),IL=Uav/RL,Ipk=U2/RL,dV=U2/(2*f0*RL*C1),Cmin=U2/(2*f0*RL*1),x2=8*f0*RL*C2,Uav2=U2*x2/(x2+1),dV2=U2/(2*f0*RL*C2);
T('Đọc đề: đây là bài thiết kế nguồn, không chỉ tính toán. Ta cần chọn hệ số biến áp N, kiểm tra điện áp trung bình, rồi chọn diode và tụ. Mạch cầu có tụ lọc dùng công thức toàn kỳ với hệ số 8 f RL C. Dữ kiện: tải 24 ôm cần 12 vôn, lưới 220 vôn 50 héc, tụ 2200 micrô farad, và yêu cầu độ gợn đỉnh đỉnh không quá 1 vôn.',['Cầu + tụ lọc · U1m = 220√2 = '+f(U1m)+' V · f = 50 Hz','RL = 24 Ω, C = 2200 µF','Mục tiêu: U′LDC = 12 V, ΔV ≤ 1 V'],'cf');
T(`Câu a. Đảo công thức tụ lọc để tìm U hai m cần thiết: 8 f RL C bằng ${f(x1,2)}, nên U hai m bằng 12 nhân ${f(x1+1,2)} chia ${f(x1,2)}, được ${f(U2n)} vôn. Hệ số biến áp N bằng U một m chia U hai m, khoảng ${f(Nn)}. Quấn biến áp cần số nguyên nên chọn N bằng 25. Khi đó U hai m thực là ${f(U2)} vôn và điện áp trung bình thực là ${f(Uav)} vôn, lệch khoảng ${f((Ut-Uav)/Ut*100,1)} phần trăm so với 12 vôn, chấp nhận được.`,['8fRC = 8·50·24·2200·10⁻⁶ = '+f(x1,2),'U2m = U′·(8fRC+1)/(8fRC) = 12·'+f(x1+1,2)+'/'+f(x1,2)+' = '+f(U2n)+' V','N = U1m/U2m = '+f(U1m)+'/'+f(U2n)+' ≈ '+f(Nn)+' → chọn N = 25','U2m thực = '+f(U1m)+'/25 = '+f(U2)+' V','U′LDC thực = '+f(U2)+'·'+f(x1,2)+'/'+f(x1+1,2)+' = '+f(Uav)+' V'],'cf');
T(`Câu b. Dòng trung bình qua tải bằng ${f(Uav)} chia 24, được ${f(IL,3)} ampe. Mỗi diode chỉ dẫn một nửa thời gian nên dòng trung bình mỗi diode khoảng một nửa, ${f(IL/2,3)} ampe. Dòng thuận cực đại theo sách bằng U hai m chia RL, được ${f(Ipk,3)} ampe. Trong thực tế khi có tụ lọc, dòng nạp đỉnh qua diode còn lớn hơn nhiều, nên phải chọn diode dư dòng.`,['ILDC = U′LDC/RL = '+f(Uav)+'/24 = '+f(IL,3)+' A','Mỗi diode: ILDC/2 ≈ '+f(IL/2,3)+' A','IFDmax = U2m/RL = '+f(U2)+'/24 = '+f(Ipk,3)+' A']);
T(`Câu c. Mạch cầu có áp ngược lớn nhất bằng U hai m, tức ${f(U2)} vôn. Nên chọn diode có áp ngược gấp ít nhất 2 đến 3 lần, tức từ 50 vôn trở lên, và dòng định mức gấp đôi dòng tính được, khoảng 1 ampe. Ví dụ họ diode 1N4001 chịu 50 vôn, 1 ampe. Tụ lọc phải có điện áp định mức lớn hơn U hai m, nên chọn loại 25 vôn để có dự phòng.`,['URDmax = U2m = '+f(U2)+' V → chọn diode ≥ 50 V','IF định mức ≥ 2·'+f(Ipk,2)+' ≈ 1 A (ví dụ 1N4001: 50 V, 1 A)','Tụ: điện áp định mức > '+f(U2)+' V → chọn 25 V']);
T(`Câu d. Với C bằng 2200 micrô farad, độ gợn đỉnh đỉnh xấp xỉ U hai m chia, 2 f RL C, được ${f(dV)} vôn, vượt yêu cầu 1 vôn. Muốn gợn không quá 1 vôn thì C phải lớn hơn U hai m chia, 2 f RL nhân 1 vôn, tức ${f(Cmin*1e6,0)} micrô farad. Chọn tụ chuẩn 6800 micrô farad. Kiểm tra lại: độ gợn còn ${f(dV2)} vôn và điện áp trung bình mới là ${f(Uav2)} vôn, tăng nhẹ vì tụ lớn hơn.`,['ΔV ≈ U2m/(2fRLC) = '+f(U2)+'/(2·50·24·2200·10⁻⁶) = '+f(dV)+' V > 1 V ✗','C ≥ U2m/(2fRL·ΔV) = '+f(U2)+'/(2·50·24·1) = '+f(Cmin*1e6,0)+' µF','Chọn C = 6800 µF → ΔV = '+f(dV2)+' V ✓','U′LDC mới = '+f(U2)+'·'+f(x2,2)+'/'+f(x2+1,2)+' = '+f(Uav2)+' V']);
T('Tóm tắt đáp số và lưu ý thực tế: các công thức tụ lọc của sách đều là gần đúng. Khi lắp thật, nên đo lại điện áp, và cần kể thêm sụt áp khoảng 0,7 vôn trên mỗi diode, mà bài này xem diode là lý tưởng.',['a) N = 25, U2m = '+f(U2)+' V, U′LDC = '+f(Uav)+' V','b) ILDC = '+f(IL,3)+' A; IFDmax = '+f(Ipk,3)+' A','c) Diode ≥ 50 V / 1 A; tụ ≥ 25 V','d) C ≥ '+f(Cmin*1e6,0)+' µF → chọn 6800 µF; U′LDC = '+f(Uav2)+' V','Lưu ý: bỏ qua sụt áp ~0,7 V mỗi diode'])}

ch('Khó 2');
{const IL=.8,Vi=18,RLe=Vi/IL,f0=50,C1=2200e-6,U1m=220*Q,x=8*f0*RLe*C1,U2n=Vi*(x+1)/x,Nn=U1m/U2n,N=16,U2=U1m/N,Uav=U2*x/(x+1),dV=U2/(2*f0*RLe*C1),Vmin=U2-dV,PIC=(Uav-12)*IL;
T('Đọc đề: nguồn đối xứng cộng trừ 12 vôn. Mỗi nhánh là một mạch toàn kỳ kiểu tia với hai diode, nên dùng hệ số 8 f R C, rồi qua IC 7812 hoặc 7912 để ổn áp. Điều kiện của IC: điện áp vào phải cao hơn điện áp ra ít nhất 3 vôn, tức tối thiểu 15 vôn, kể cả lúc thấp nhất do gợn sóng. Hai nhánh đối xứng nên chỉ cần tính một nhánh.',['Hình 5.23: biến áp có điểm giữa, 4 diode, IC 7812 / 7912','U1m = 220√2 = '+f(U1m)+' V · f = 50 Hz','Mỗi nhánh: IL = 0,8 A, C1 = 2200 µF','IC cần: Vin ≥ 12 + 3 = 15 V']);
T(`Câu a. Chọn điện áp trung bình sau tụ lọc là 18 vôn, cao hơn 15 vôn để chừa chỗ cho độ gợn. Điện trở tải tương đương của mỗi nhánh, tức đầu vào của IC, bằng 18 chia 0,8, được ${f(RLe)} ôm. Dòng 0,8 ampe nhỏ hơn giới hạn 1,5 ampe của IC nên đạt.`,['Chọn Vin(TB) = 18 V','RL,tđ = Vin/IL = 18/0,8 = '+f(RLe)+' Ω','IL = 0,8 A < 1,5 A ✓']);
T(`Câu b. Tính 8 f R C bằng ${f(x,1)}. Đảo công thức: U hai m bằng 18 nhân ${f(x+1,1)} chia ${f(x,1)}, được ${f(U2n)} vôn cho mỗi nửa cuộn. N bằng ${f(U1m)} chia ${f(U2n)}, khoảng ${f(Nn)}, chọn N bằng 16. Khi đó U hai m thực là ${f(U2)} vôn và điện áp trung bình thực là ${f(Uav)} vôn.`,['8fRC = 8·50·'+f(RLe)+'·2200·10⁻⁶ = '+f(x,1),'U2m = 18·'+f(x+1,1)+'/'+f(x,1)+' = '+f(U2n)+' V','N = '+f(U1m)+'/'+f(U2n)+' ≈ '+f(Nn)+' → chọn N = 16','U2m thực = '+f(U2)+' V → U′LDC = '+f(Uav)+' V']);
T(`Câu c. Độ gợn đỉnh đỉnh xấp xỉ U hai m chia, 2 f RL C, được ${f(dV)} vôn. Điện áp thấp nhất sau gợn khoảng U hai m trừ gợn, bằng ${f(Vmin)} vôn. Giá trị này ${Vmin>=15?'lớn hơn':'nhỏ hơn'} 15 vôn nên IC còn làm việc, nhưng dự phòng chỉ ${f(Vmin-15)} vôn, khá sát. Nên tăng C lên hoặc tăng một chút số vòng thứ cấp để an toàn khi lưới tụt áp.`,['ΔV ≈ U2m/(2fRL,tđC) = '+f(U2)+'/(2·50·'+f(RLe)+'·2200·10⁻⁶) = '+f(dV)+' V','Vin,min ≈ U2m − ΔV = '+f(Vmin)+' V','Vin,min ≥ 15 V ✓ (dự phòng '+f(Vmin-15)+' V)']);
T(`Câu d. Mỗi nhánh là mạch tia, nên áp ngược lớn nhất lên diode bằng hai U hai m, được ${f(2*U2)} vôn. Dòng trung bình mỗi diode bằng một nửa dòng tải, ${f(IL/2,2)} ampe. Diode 1N4007 chịu 1000 vôn, 1 ampe là đủ về áp, nhưng vì dòng nạp tụ đỉnh khá lớn nên thường chọn loại 3 ampe như 1N5401.`,['URDmax = 2U2m = 2·'+f(U2)+' = '+f(2*U2)+' V','Dòng TB mỗi diode = IL/2 = '+f(IL/2,2)+' A','Chọn diode ≥ 100 V, 3 A (ví dụ 1N5401)']);
T(`Câu e. Công suất tiêu tán trên IC 7812 bằng hiệu điện áp vào ra nhân dòng tải: ${f(Uav)} trừ 12, nhân 0,8, được ${f(PIC)} oát. Công suất này khá lớn, hầu hết chuyển thành nhiệt nên IC phải gắn tản nhiệt. Nếu hạ điện áp vào gần 15 vôn, công suất giảm nhưng dự phòng gợn cũng mất.`,['P = (Vin − Vout)·IL = ('+f(Uav)+' − 12)·0,8 = '+f(PIC)+' W','→ cần tản nhiệt cho 7812 / 7912','a) Vin(TB) = 18 V · b) N = 16, U2m = '+f(U2)+' V','c) Vin,min = '+f(Vmin)+' V · d) URDmax = '+f(2*U2)+' V'])}

ch('Khó 3');
{const Vz=6.8,UL=Vz-.6,RL=12,IL=UL/RL,be=50,IB=IL/be,i1=1/Vz,i0=.005,a=11,b=14,Rm=(a-Vz)/(i0+IB),Rn=(b-Vz)/i1,R=150,z1=(a-Vz)/R-IB,z2=(b-Vz)/R,PQ=(b-UL)*IL,m=x=>f(x*1000,1);
T('Đọc đề: đây là mạch ổn áp Zener có thêm transistor BJT, để mở rộng dòng tải. Điện áp ra thấp hơn Vz khoảng 0,6 vôn do mối nối base emitter. Dòng R cung cấp cho Zener và cho base, chứ không cung cấp dòng tải lớn. Ta kiểm tra Zener có đủ dòng ở trường hợp xấu nhất.',['Hình 5.19: Zener + BJT','Vz = 6,8 V, Pzmax = 1 W, Izmin = 5 mA','RL = 12 Ω, β = 50, Vdc = 11 … 14 V']);
T(`Câu a. Điện áp ra UL bằng Vz trừ 0,6, tức ${f(UL,1)} vôn. Dòng tải bằng UL chia RL, được ${m(IL)} mili ampe.`,['UL = Vz − 0,6 = '+f(UL,1)+' V','IL = UL/RL = '+f(UL,1)+'/12 = '+m(IL)+' mA']);
T(`Câu b. Dòng Zener lớn nhất bằng Pzmax chia Vz, bằng 1 chia 6,8, được ${m(i1)} mili ampe. Dòng tải ${m(IL)} mili ampe lớn hơn nhiều, nên nếu chỉ dùng Zener thì Zener bị quá tải và hỏng. Đây chính là lý do phải thêm BJT: dòng tải đi qua BJT, còn Zener chỉ cần cấp dòng base nhỏ.`,['Izmax = 1/6,8 = '+m(i1)+' mA','IL = '+m(IL)+' mA > Izmax ⇒ Zener đơn không đủ','Thêm BJT: dòng tải qua BJT, Zener chỉ cấp IB']);
T(`Câu c. Dòng tải xấp xỉ dòng collector, bằng bê ta nhân dòng base, nên dòng base bằng ${m(IL)} chia 50, được ${m(IB)} mili ampe. Đây là dòng R phải cấp thêm cho nhánh Zener.`,['IL ≈ IC = β·IB ⇒ IB ≈ IL/β','IB = '+m(IL)+'/50 = '+m(IB)+' mA']);
T(`Câu d. Với dòng base cần cấp, R lớn nhất ứng với Vdc nhỏ nhất: 11 trừ 6,8, chia Izmin cộng IB, được ${f(Rm,1)} ôm. R nhỏ nhất ứng với Vdc lớn nhất khi hở tải, lúc đó IB bằng 0 và toàn bộ dòng qua Zener: 14 trừ 6,8, chia Izmax, được ${f(Rn,1)} ôm.`,['Rmax = (Vdcmin − Vz)/(Izmin + IB) = 4,2/'+f(i0+IB,4)+' = '+f(Rm,1)+' Ω','Rmin = (Vdcmax − Vz)/Izmax = 7,2/'+f(i1,4)+' = '+f(Rn,1)+' Ω',f(Rn,1)+' Ω ≤ R ≤ '+f(Rm,1)+' Ω']);
T(`Câu e. Chọn R bằng 150 ôm. Khi đầy tải với Vdc bằng 11 vôn, Iz bằng 4,2 chia 150 trừ IB, được ${m(z1)} mili ampe, lớn hơn 5, nên Zener vẫn ổn áp. Khi hở tải với Vdc bằng 14 vôn, Iz bằng 7,2 chia 150, được ${m(z2)} mili ampe, nhỏ hơn ${m(i1)}, nên Zener an toàn.`,['R = 150 Ω','Đầy tải, 11 V: Iz = 4,2/150 − IB = '+m(z1)+' mA ≥ 5 ✓','Hở tải, 14 V: Iz = 7,2/150 = '+m(z2)+' mA ≤ '+m(i1)+' ✓']);
T(`Câu f. Công suất lớn nhất trên BJT bằng điện áp collector emitter nhân dòng tải, lúc Vdc lớn nhất: 14 trừ ${f(UL,1)}, nhân ${f(IL,3)}, được ${f(PQ)} oát. Rất lớn so với một transistor nhỏ, nên cần chọn BJT công suất và gắn tản nhiệt. Đây cũng là nhược điểm của mạch ổn áp tuyến tính: phần điện áp thừa biến thành nhiệt.`,['PQ,max = (Vdcmax − UL)·IL = (14 − '+f(UL,1)+')·'+f(IL,3)+' = '+f(PQ)+' W','→ BJT công suất + tản nhiệt'])}

ch('Khó 4');
{const R1=240,Vo=9,VR=R1*(Vo/1.25-1),Vmax=1.25*(1+5000/R1),IR=1.25/R1,Vin=Vo+3,Vi2=15,IL=1,P=(Vi2-Vo)*IL;
T('Đọc đề: IC 317 điều chỉnh điện áp ra theo công thức V ra bằng 1,25 nhân một cộng VR hai chia R một. Điện áp 1,25 vôn là điện áp chuẩn giữa chân ra và chân ADJ, nên lúc nào cũng có dòng chạy qua R một. Ta dùng công thức đó để chọn biến trở, kiểm tra dải điều chỉnh, rồi tính nhiệt.',['Hình 5.24: IC 317, R1 = 240 Ω, VR2 ≤ 5 kΩ','IL tối đa 1,5 A','Vout ≈ 1,25·(1 + VR2/R1)']);
T(`Câu a. Muốn V ra bằng 9 vôn thì một cộng VR hai chia R một bằng 9 chia 1,25, được ${f(Vo/1.25,2)}. Suy ra VR hai chia R một bằng ${f(Vo/1.25-1,2)}, nên VR hai bằng 240 nhân ${f(Vo/1.25-1,2)}, được ${f(VR,0)} ôm, nhỏ hơn 5 kilô ôm nên chỉnh được.`,['Vout = 1,25·(1 + VR2/R1) = 9 V','1 + VR2/R1 = 9/1,25 = '+f(Vo/1.25,2),'VR2 = 240·'+f(Vo/1.25-1,2)+' = '+f(VR,0)+' Ω < 5 kΩ ✓']);
T(`Câu b. Khi biến trở bằng 0, V ra thấp nhất là 1,25 vôn. Khi biến trở bằng 5 kilô ôm, V ra lớn nhất là 1,25 nhân một cộng 5000 chia 240, được ${f(Vmax,1)} vôn. Dòng qua R một khi đó chỉ khoảng ${f(IR*1000,1)} mili ampe, rất nhỏ so với dòng tải. Sách ghi dải đến 25 vôn là số làm tròn của sơ đồ.`,['VR2 = 0: Vout = 1,25 V','VR2 = 5 kΩ: Vout = 1,25·(1 + 5000/240) = '+f(Vmax,1)+' V','Dòng qua R1 ≈ 1,25/240 = '+f(IR*1000,1)+' mA']);
T(`Câu c. Theo sơ đồ của sách, điện áp vào phải lớn hơn điện áp ra khoảng 3 vôn, ví dụ vào hơn 28 vôn để ra 25 vôn. Với V ra bằng 9 vôn thì vào tối thiểu khoảng ${Vin} vôn. Nếu cấp ${Vi2} vôn và tải 1 ampe thì công suất tiêu tán trên IC bằng ${Vi2} trừ 9, nhân 1, được ${f(P,0)} oát, cần tản nhiệt tốt. Muốn giảm nhiệt, hạ điện áp vào gần mức 12 vôn.`,['Vin,min ≈ Vout + 3 = '+Vin+' V','Vin = 15 V, IL = 1 A: P = (15 − 9)·1 = '+f(P,0)+' W','→ tản nhiệt; hạ Vin để giảm nhiệt','a) VR2 ≈ '+f(VR,0)+' Ω · b) 1,25 … '+f(Vmax,1)+' V · c) Vin ≥ '+Vin+' V, P = '+f(P,0)+' W'])}

ch('Tổng kết');
T('Tóm tắt chương 5. Bán kỳ: trung bình U hai m chia pi, hiệu dụng U hai m chia 2. Toàn kỳ: trung bình hai U hai m chia pi, hiệu dụng U hai m chia căn 2. Áp ngược: U hai m cho bán kỳ và cầu, hai U hai m cho tia. Tụ lọc: hệ số 2fRC cho bán kỳ, 8fRC cho toàn kỳ. Vậy là xong chương 5, chúc bạn thi tốt!',['Bán kỳ: U2m/π · U2m/2 · Γ=1,21','Toàn kỳ: 2U2m/π · U2m/√2 · Γ=0,48','Áp ngược: bán kỳ, cầu = U2m · tia = 2U2m','Tụ: 2fRC (bán kỳ) · 8fRC (toàn kỳ)']);

ch('Mở đầu');T('Chương 5 trình bày nguyên lý của một mạch nguồn ổn áp gồm bốn công đoạn: hạ áp, chỉnh lưu, lọc phẳng và ổn áp. Ngoài lý thuyết phân tích và tính toán, chương còn có các ví dụ minh họa, các mạch ứng dụng trong thực tế và bài tập củng cố ở cuối chương.',['Hạ áp → Chỉnh lưu → Lọc phẳng → Ổn áp','5.1 Tổng quan · 5.2 Biến áp · 5.3 Chỉnh lưu · 5.4 Lọc · 5.5 Ổn áp']);
ch('Chỉnh lưu');T('Để chỉnh lưu điện áp xoay chiều thành một chiều, người ta dùng diode hoặc SCR, tương ứng với mạch chỉnh lưu không điều khiển hoặc có điều khiển. Ở đây ta chỉ xét chỉnh lưu dùng diode với tải thuần trở. Diode được xem là lý tưởng: khi điện thế anôt lớn hơn catôt thì dẫn và áp thuận bằng không; ngược lại thì khóa hẳn, không có dòng ngược.',['Diode lý tưởng: VA > VK → dẫn, UFD = 0','VA < VK → khóa, IRD = 0','Ba mạch: bán kỳ · toàn kỳ kiểu cầu · toàn kỳ kiểu tia']);
ch('Mạch lọc');T('Để lọc phẳng điện áp chỉnh lưu, ta có thể mắc tụ điện song song với tải, cuộn cảm nối tiếp với tải, hoặc kết hợp cả hai. Trong phần này chỉ xét tụ điện mắc song song với tải; cách tính với cuộn cảm được trình bày trong giáo trình Điện tử công suất.',['Tụ C song song với tải RL','Cuộn cảm nối tiếp tải: không xét ở đây']);
ch('Ổn áp 5.5');T('Ổn áp là công đoạn cuối của mạch nguồn một chiều, sau khi hạ áp, chỉnh lưu và lọc phẳng. Có nhiều cách ổn định điện áp một chiều: diode Zener, transistor BJT, Op-Amp, vi mạch 78XX/79XX, vi mạch 317/337. Bài giảng giới thiệu ba loại: diode Zener, IC 78XX/79XX và IC 317/337.',['Zener · BJT · Op-Amp · 78XX/79XX · 317/337','Học: Zener → 78XX/79XX → 317/337']);

T('Điện áp trung bình có tụ lọc của mạch toàn kỳ tính gần đúng bằng U hai m nhân 8fRC trên 8fRC cộng 1, hệ số 8 thay cho hệ số 2 của bán kỳ. Muốn có điện áp trung bình U phẩy cho trước thì tính C bằng U phẩy chia 8fR tải nhân hiệu U hai m trừ U phẩy.',['U′LDC = U2m·8fRC/(8fRC+1)','C = U′/(8fRL(U2m−U′))','U′ < U2m']);

QZ('Hỏi nhanh 5.2','x','Hỏi nhanh. Biến áp có điện áp sơ cấp 220 vôn hiệu dụng, thứ cấp 12 vôn. Hệ số biến áp bằng bao nhiêu, và tần số ngõ ra là bao nhiêu?',`Đáp án. N bằng 220 chia 12, khoảng ${f(220/12,1)}. Biến áp chỉ đổi biên độ chứ không đổi tần số, nên tần số ngõ ra vẫn là 50 hertz.`,['N = 220/12 ≈ '+f(220/12,1),'f ra = f vào = 50 Hz']);
QZ('Hỏi nhanh 5.3.1','h','Hỏi nhanh. Trong mạch chỉnh lưu bán kỳ, ở nửa chu kỳ âm diode ở trạng thái nào, và điện áp trên tải bằng bao nhiêu?','Đáp án. Diode khóa, dòng qua tải bằng 0 nên điện áp trên tải cũng bằng 0. Toàn bộ điện áp u hai đặt lên diode, vì vậy điện áp ngược lớn nhất trên diode là U hai m.',['Nửa âm: D khóa, UL = 0','URDmax = U2m']);
QZ('Hỏi nhanh 5.3.2','b','Hỏi nhanh. Trong mạch cầu, ở nửa chu kỳ âm những diode nào dẫn, và dòng qua tải có đổi chiều không?','Đáp án. D hai và D ba dẫn, D một và D bốn khóa. Dòng qua tải vẫn đi từ điểm b đến điểm c, không đổi chiều. Điện áp ngược lớn nhất trên mỗi diode khóa là U hai m.',['Nửa âm: D2, D3 dẫn','IL vẫn chiều b → c','URDmax = U2m']);
QZ('Hỏi nhanh 5.3.3','t','Hỏi nhanh. Vì sao diode trong mạch tia chịu áp ngược lớn nhất gấp đôi U hai m, còn mạch cầu chỉ chịu U hai m?','Đáp án. Ở mạch tia diode khóa nằm giữa hai nửa cuộn thứ cấp nên chịu hiệu u hai mốt trừ u hai hai, bằng hai lần u hai mốt, cực đại là hai U hai m. Ở mạch cầu, diode khóa chỉ chịu một điện áp u hai.',['Tia: uRD = u21 − u22 = 2u21','URDmax = 2U2m (tia) · U2m (cầu)']);
QZ('Hỏi nhanh 5.4.1','hc','Hỏi nhanh. Khi tăng điện dung C hoặc tăng điện trở tải, điện áp trung bình trên tải tăng hay giảm, và độ gợn thay đổi thế nào?','Đáp án. Hằng số thời gian R nhân C lớn hơn nên tụ xả chậm hơn. Điện áp trung bình tăng, tiến gần U hai m, còn độ gợn giảm. Điều này thấy rõ từ tỉ số 2fRC chia 2fRC cộng 1, tiến tới 1 khi RC tăng.',['RC tăng → tụ xả chậm','U′LDC → U2m, độ gợn giảm']);
QZ('Hỏi nhanh 5.4.2','bc','Hỏi nhanh. Với cùng C, R và f, vì sao điện áp trung bình có tụ của mạch toàn kỳ cao hơn mạch bán kỳ?','Đáp án. Hệ số của toàn kỳ là 8fRC chia 8fRC cộng 1, lớn hơn 2fRC chia 2fRC cộng 1 của bán kỳ. Lý do là trong một chu kỳ tụ được nạp hai lần, nên thời gian xả ngắn hơn.',['Toàn kỳ: 8fRC/(8fRC+1)','Bán kỳ: 2fRC/(2fRC+1)']);
QZ('Hỏi nhanh 5.5.1','z','Hỏi nhanh. Nếu mất tải, dòng qua diode Zener bằng bao nhiêu, và điều đó ràng buộc việc chọn điện trở R như thế nào?','Đáp án. Khi hở tải, toàn bộ dòng I bằng V DC trừ Vz chia R chạy qua Zener, nên phải không vượt quá I Z max. Vì vậy chọn R theo V DC max trừ Vz chia I Z max.',['IL = 0 → Iz = I = (Vdc − Vz)/R','R = (VDCmax − Vz)/IZmax']);
QZ('Hỏi nhanh 5.5.2','i9','Hỏi nhanh. IC 7912 khác IC 7812 ở điểm nào về thứ tự chân và dấu của điện áp?','Đáp án. Với 7812: chân một là vào, chân hai là đất, chân ba là ra, điện áp ra cộng 12 vôn. Với 7912: chân một là đất, chân hai là vào, chân ba là ra, điện áp vào và ra đều âm, ra trừ 12 vôn.',['7812: 1 IN · 2 GND · 3 OUT → +12 V','7912: 1 GND · 2 IN · 3 OUT → −12 V']);
QZ('Hỏi nhanh 5.5.3','i3','Hỏi nhanh. Với IC LM317, R một bằng 240 ôm và VR hai chỉnh đến 2160 ôm thì điện áp ra xấp xỉ bao nhiêu vôn?',`Đáp án. V ra bằng 1,25 nhân một cộng 2160 chia 240, tức 1,25 nhân 10, bằng ${f(1.25*(1+2160/240),1)} vôn.`,['Vout ≈ 1,25(1 + 2160/240)','= '+f(1.25*(1+2160/240),1)+' V']);
