const rs=h=>`<b class="res">${h}</b>`;

/* =====================================================================
   CÁC HÀM VẼ SVG – theo đúng Hình 4.48 và Hình 4.49 trong sách tr.125
   ===================================================================== */

// Màu sắc theo CSS vars (dùng inline vì SVG không inherit CSS vars của body)
const COL={
  ink:'var(--ink)',
  f1:'var(--f1)',   // xanh dương
  c2:'var(--c2)',   // cam
  c3:'var(--c3)',   // xanh lá
  c4:'var(--c4)',   // tím
  hl:'var(--hl)',
  card:'var(--card)',
  line:'var(--line)',
  mute:'var(--mute)',
};

/* --- Ký hiệu linh kiện cơ bản --- */
// Tụ điện (nằm ngang hay đứng)
function capH(x,y,w=28){
  // 2 bản song song nằm ngang, dây hai bên
  const hw=4;
  return `<line x1="${x}" y1="${y}" x2="${x+w/2-hw}" y2="${y}" stroke="${COL.ink}" stroke-width="2"/>
<line x1="${x+w/2-hw}" y1="${y-8}" x2="${x+w/2-hw}" y2="${y+8}" stroke="${COL.ink}" stroke-width="2.5"/>
<line x1="${x+w/2+hw}" y1="${y-8}" x2="${x+w/2+hw}" y2="${y+8}" stroke="${COL.ink}" stroke-width="2.5"/>
<line x1="${x+w/2+hw}" y1="${y}" x2="${x+w}" y2="${y}" stroke="${COL.ink}" stroke-width="2"/>`;
}
function capV(x,y,h=28){
  const hh=4;
  return `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+h/2-hh}" stroke="${COL.ink}" stroke-width="2"/>
<line x1="${x-8}" y1="${y+h/2-hh}" x2="${x+8}" y2="${y+h/2-hh}" stroke="${COL.ink}" stroke-width="2.5"/>
<line x1="${x-8}" y1="${y+h/2+hh}" x2="${x+8}" y2="${y+h/2+hh}" stroke="${COL.ink}" stroke-width="2.5"/>
<line x1="${x}" y1="${y+h/2+hh}" x2="${x}" y2="${y+h}" stroke="${COL.ink}" stroke-width="2"/>`;
}
// GND symbol
function gnd(x,y){
  return `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+8}" stroke="${COL.ink}" stroke-width="2"/>
<line x1="${x-10}" y1="${y+8}" x2="${x+10}" y2="${y+8}" stroke="${COL.ink}" stroke-width="2"/>
<line x1="${x-6}" y1="${y+12}" x2="${x+6}" y2="${y+12}" stroke="${COL.ink}" stroke-width="1.5"/>
<line x1="${x-2}" y1="${y+16}" x2="${x+2}" y2="${y+16}" stroke="${COL.ink}" stroke-width="1"/>`;
}
// Hình chữ nhật IC
function ic(x,y,w,h,label,pins){
  let g=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${COL.card}" stroke="${COL.ink}" stroke-width="2"/>
<text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" style="font-size:13px;font-weight:700">${label}</text>`;
  (pins||[]).forEach(p=>{
    g+=`<text x="${p.tx}" y="${p.ty}" text-anchor="${p.ta||'middle'}" style="font-size:10px;fill:${COL.mute}">${p.t}</text>`;
  });
  return g;
}
// Điện trở nằm ngang
function resH(x,y,w=40,label=''){
  return `<line x1="${x}" y1="${y}" x2="${x+8}" y2="${y}" stroke="${COL.ink}" stroke-width="2"/>
<rect x="${x+8}" y="${y-6}" width="${w-16}" height="12" rx="3" fill="${COL.card}" stroke="${COL.ink}" stroke-width="1.8"/>
<line x1="${x+w-8}" y1="${y}" x2="${x+w}" y2="${y}" stroke="${COL.ink}" stroke-width="2"/>
${label?`<text x="${x+w/2}" y="${y+18}" text-anchor="middle" style="font-size:11px;fill:${COL.c2}">${label}</text>`:''}`;
}
// Biến trở đứng (ký hiệu mũi tên)
function potV(x,y,h=40,label=''){
  return `<line x1="${x}" y1="${y}" x2="${x}" y2="${y+h}" stroke="${COL.ink}" stroke-width="2"/>
<rect x="${x-8}" y="${y+8}" width="16" height="${h-16}" rx="3" fill="${COL.card}" stroke="${COL.ink}" stroke-width="1.8"/>
<line x1="${x+10}" y1="${y+h/2}" x2="${x+18}" y2="${y+h/2}" stroke="${COL.c4}" stroke-width="1.5" marker-end="url(#arr)"/>
${label?`<text x="${x+22}" y="${y+h/2+4}" text-anchor="start" style="font-size:11px;fill:${COL.c4}">${label}</text>`:''}`;
}

/* =================================================================
   SVG A: Mạch nguồn đôi ±12V dùng 7812 + 7912  (Hình 4.48 kết hợp)
   ================================================================= */
function svgA(step){
  // step 0=khung, 1=hiện IC, 2=hiện tụ, 3=hiện nhãn điện áp
  const W=580,H=320;
  let g=`<defs>
<marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="${COL.c4}"/></marker>
<marker id="arr2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="${COL.ink}"/></marker>
</defs>`;

  // ---- Dây bus dọc trái (nguồn AC biến áp) ----
  // Nhánh trên: +DC, nhánh dưới: -DC, giữa: GND (điểm giữa biến áp)
  // Biến áp ở trái (x=40)
  const bx=40,ty=70,by=250,my=160; // top y, bottom y, mid y
  // Ký hiệu biến áp đơn giản (hình chữ nhật với nhãn)
  g+=`<rect x="20" y="${ty}" width="38" height="${by-ty}" rx="4" fill="${COL.card}" stroke="${COL.ink}" stroke-width="1.5" stroke-dasharray="4 2"/>`;
  g+=`<text x="39" y="${ty+25}" text-anchor="middle" style="font-size:10px">Biến</text>`;
  g+=`<text x="39" y="${ty+38}" text-anchor="middle" style="font-size:10px">áp</text>`;
  g+=`<text x="39" y="${my}" text-anchor="middle" style="font-size:9px;fill:${COL.mute}">0V</text>`;
  // Dây ra: trên = +AC, giữa = 0V, dưới = -AC
  // Nhãn AC
  g+=`<text x="14" y="${ty+10}" text-anchor="end" style="font-size:10px;fill:${COL.f1}">+AC</text>`;
  g+=`<text x="14" y="${my+4}" text-anchor="end" style="font-size:10px;fill:${COL.ink}">0V</text>`;
  g+=`<text x="14" y="${by+4}" text-anchor="end" style="font-size:10px;fill:${COL.c3}">−AC</text>`;

  // ---- Bus ngang ----
  // Nhánh dương: y=ty → C_IN → IC7812 → C_OUT → +12V
  // Nhánh GND: y=my
  // Nhánh âm: y=by → C_IN → IC7912 → C_OUT → −12V

  // Dây chính nhánh dương
  g+=`<line x1="58" y1="${ty}" x2="540" y2="${ty}" stroke="${COL.f1}" stroke-width="2.2"/>`;
  // Dây GND giữa
  g+=`<line x1="58" y1="${my}" x2="540" y2="${my}" stroke="${COL.ink}" stroke-width="2.2"/>`;
  // Dây chính nhánh âm
  g+=`<line x1="58" y1="${by}" x2="540" y2="${by}" stroke="${COL.c3}" stroke-width="2.2"/>`;

  // Dây đứng nối bus GND với từng IC
  // (sẽ vẽ sau cùng)

  // ---- Tụ C_IN nhánh dương (tụ hóa 0,33µF) ----
  if(step>=1){
    // Tụ đứng từ bus dương xuống bus GND
    const cx1=100;
    g+=capV(cx1,ty,my-ty);
    g+=`<text x="${cx1+12}" y="${ty+35}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">C_IN</text>`;
    g+=`<text x="${cx1+12}" y="${ty+48}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">0,33µF</text>`;
    // Tụ C_IN nhánh âm (2,2µF)
    const cx2=100;
    g+=capV(cx2,my,by-my);
    g+=`<text x="${cx2+12}" y="${my+35}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">C_IN</text>`;
    g+=`<text x="${cx2+12}" y="${my+48}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">2,2µF</text>`;
  }

  // ---- IC 7812 ----
  if(step>=1){
    const ix=200,iy=ty+20,iw=90,ih=60;
    g+=ic(ix,iy,iw,ih,'7812',[
      {t:'IN(1)',tx:ix-2,ty:iy+15,ta:'end'},
      {t:'GND(2)',tx:ix+iw/2,ty:iy+ih+14,ta:'middle'},
      {t:'OUT(3)',tx:ix+iw+2,ty:iy+15,ta:'start'},
    ]);
    // Dây chân IN (trái IC)
    g+=`<line x1="${ix}" y1="${iy+15}" x2="${ix-42}" y2="${iy+15}" stroke="${COL.f1}" stroke-width="2"/>`;
    g+=`<line x1="${ix-42}" y1="${ty}" x2="${ix-42}" y2="${iy+15}" stroke="${COL.f1}" stroke-width="2"/>`;
    // Dây chân GND (xuống bus GND)
    g+=`<line x1="${ix+iw/2}" y1="${iy+ih}" x2="${ix+iw/2}" y2="${my}" stroke="${COL.ink}" stroke-width="1.8"/>`;
    // Dây chân OUT (phải IC → ra)
    g+=`<line x1="${ix+iw}" y1="${iy+15}" x2="${ix+iw+42}" y2="${iy+15}" stroke="${COL.f1}" stroke-width="2"/>`;
    g+=`<line x1="${ix+iw+42}" y1="${iy+15}" x2="${ix+iw+42}" y2="${ty}" stroke="${COL.f1}" stroke-width="2"/>`;
    // Dây nhánh 1.5A
    if(step>=2){
      g+=`<text x="${ix+iw+22}" y="${iy+10}" text-anchor="middle" style="font-size:10px;fill:${COL.f1}">1,5A</text>`;
    }
  }

  // ---- IC 7912 ----
  if(step>=1){
    const ix=200,iy=by-80,iw=90,ih=60;
    g+=ic(ix,iy,iw,ih,'7912',[
      {t:'GND(1)',tx:ix-2,ty:iy+15,ta:'end'},
      {t:'IN(2)',tx:ix+iw/2,ty:iy-8,ta:'middle'},
      {t:'OUT(3)',tx:ix+iw+2,ty:iy+15,ta:'start'},
    ]);
    // Dây chân GND (trái IC) nối bus GND
    g+=`<line x1="${ix}" y1="${iy+15}" x2="${ix-30}" y2="${iy+15}" stroke="${COL.ink}" stroke-width="2"/>`;
    g+=`<line x1="${ix-30}" y1="${my}" x2="${ix-30}" y2="${iy+15}" stroke="${COL.ink}" stroke-width="2"/>`;
    // Dây chân IN (lên bus âm)
    g+=`<line x1="${ix+iw/2}" y1="${iy}" x2="${ix+iw/2}" y2="${by}" stroke="${COL.c3}" stroke-width="1.8"/>`;
    // Dây chân OUT (phải IC)
    g+=`<line x1="${ix+iw}" y1="${iy+15}" x2="${ix+iw+42}" y2="${iy+15}" stroke="${COL.c3}" stroke-width="2"/>`;
    g+=`<line x1="${ix+iw+42}" y1="${iy+15}" x2="${ix+iw+42}" y2="${by}" stroke="${COL.c3}" stroke-width="2"/>`;
    if(step>=2){
      g+=`<text x="${ix+iw+22}" y="${iy+10}" text-anchor="middle" style="font-size:10px;fill:${COL.c3}">1,5A</text>`;
    }
  }

  // ---- Tụ C_OUT ----
  if(step>=2){
    // C_OUT nhánh dương (0,1µF) tại x≈340
    const cx=380;
    g+=capV(cx,ty,my-ty);
    g+=`<text x="${cx+12}" y="${ty+35}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">C_OUT</text>`;
    g+=`<text x="${cx+12}" y="${ty+48}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">0,1µF</text>`;
    // C_OUT nhánh âm (1µF)
    g+=capV(cx,my,by-my);
    g+=`<text x="${cx+12}" y="${my+35}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">C_OUT</text>`;
    g+=`<text x="${cx+12}" y="${my+48}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">1µF</text>`;
  }

  // ---- Đầu ra & GND symbol ----
  if(step>=2){
    // Điểm ra +12V
    g+=`<circle cx="540" cy="${ty}" r="4" fill="${COL.f1}"/>`;
    g+=`<text x="548" y="${ty+4}" text-anchor="start" style="font-weight:700;font-size:13px;fill:${COL.f1}">+12V</text>`;
    // Điểm ra GND
    g+=gnd(540,my);
    g+=`<text x="548" y="${my+4}" text-anchor="start" style="font-size:12px">GND</text>`;
    // Điểm ra −12V
    g+=`<circle cx="540" cy="${by}" r="4" fill="${COL.c3}"/>`;
    g+=`<text x="548" y="${by+4}" text-anchor="start" style="font-weight:700;font-size:13px;fill:${COL.c3}">−12V</text>`;
  }

  // Nhãn hình
  if(step>=2){
    g+=`<text x="${W/2}" y="${H-5}" text-anchor="middle" style="font-size:11px;fill:${COL.mute}">Hình 4.48: Mạch nguồn đôi ±12VDC dùng IC 7812/7912 (theo sách tr.125)</text>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mạch nguồn đôi ±12V">${g}</svg>`;
}

/* =================================================================
   SVG B: Mạch LM317  (Hình 4.49a sách tr.125)
   ================================================================= */
function svgB(step){
  const W=520,H=260;
  let g=`<defs>
<marker id="arrb" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
<path d="M0,0 L6,3 L0,6 Z" fill="${COL.ink}"/></marker>
</defs>`;

  // Đường bus dương (y=60) và bus GND (y=200)
  const busP=60, busG=200;
  const WW=480;

  g+=`<line x1="30" y1="${busP}" x2="${WW}" y2="${busP}" stroke="${COL.f1}" stroke-width="2.2"/>`;
  g+=`<line x1="30" y1="${busG}" x2="${WW}" y2="${busG}" stroke="${COL.ink}" stroke-width="2.2"/>`;

  // Nhãn V_IN
  g+=`<text x="28" y="${busP-8}" text-anchor="middle" style="font-size:11px;fill:${COL.f1}">V_IN</text>`;
  g+=`<text x="28" y="${busP+16}" text-anchor="middle" style="font-size:9px;fill:${COL.mute}">&gt;28V</text>`;

  // Tụ C_IN (0,1µF) giữa bus dương và GND, tại x=80
  if(step>=1){
    g+=capV(80,busP,busG-busP);
    g+=`<text x="93" y="${busP+40}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">C_IN</text>`;
    g+=`<text x="93" y="${busP+53}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">0,1µF</text>`;
  }

  // IC LM317
  if(step>=1){
    const ix=160,iy=busP+20,iw=100,ih=60;
    g+=ic(ix,iy,iw,ih,'LM317',[
      {t:'IN(3)',tx:ix-2,ty:iy+15,ta:'end'},
      {t:'ADJ(1)',tx:ix+iw/2,ty:iy+ih+14,ta:'middle'},
      {t:'OUT(2)',tx:ix+iw+2,ty:iy+15,ta:'start'},
    ]);
    // Dây chân IN ← bus dương
    g+=`<line x1="${ix}" y1="${iy+15}" x2="${ix-22}" y2="${iy+15}" stroke="${COL.f1}" stroke-width="2"/>`;
    g+=`<line x1="${ix-22}" y1="${busP}" x2="${ix-22}" y2="${iy+15}" stroke="${COL.f1}" stroke-width="2"/>`;
    // Dây chân OUT → sang phải
    g+=`<line x1="${ix+iw}" y1="${iy+15}" x2="${ix+iw+30}" y2="${iy+15}" stroke="${COL.f1}" stroke-width="2"/>`;
    g+=`<line x1="${ix+iw+30}" y1="${iy+15}" x2="${ix+iw+30}" y2="${busP}" stroke="${COL.f1}" stroke-width="2"/>`;

    // Dây ADJ xuống
    const adjX=ix+iw/2, adjY=iy+ih;
    g+=`<line x1="${adjX}" y1="${adjY}" x2="${adjX}" y2="${adjY+30}" stroke="${COL.f1}" stroke-width="1.8"/>`;

    // R1=240Ω nối OUT→ADJ (nằm ngang phía dưới IC)
    if(step>=2){
      const r1x=ix+iw+30, r1y=adjY+30;
      // Nút nối (từ chân OUT xuống)
      g+=`<line x1="${r1x}" y1="${iy+15}" x2="${r1x}" y2="${r1y}" stroke="${COL.f1}" stroke-width="1.8"/>`;
      // R1 nằm ngang từ r1x → adjX
      g+=resH(adjX,r1y,r1x-adjX,'R₁ 240Ω');
      // Dây từ adjX xuống tiếp
      g+=`<line x1="${adjX}" y1="${adjY+30}" x2="${adjX}" y2="${adjY+30+16}" stroke="${COL.f1}" stroke-width="1.8"/>`;
    }

    // VR2=5kΩ nối ADJ→GND
    if(step>=2){
      const vrx=adjX, vry=adjY+46;
      g+=potV(vrx,vry,busG-vry,'VR₂ 5kΩ');
    }

    // Tụ C_OUT (1µF)
    if(step>=2){
      const cox=ix+iw+80;
      g+=capV(cox,busP,busG-busP);
      g+=`<text x="${cox+12}" y="${busP+40}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">C_OUT</text>`;
      g+=`<text x="${cox+12}" y="${busP+53}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">1µF</text>`;
      // Kết nối C_OUT với dây OUT
      g+=`<line x1="${cox}" y1="${busP}" x2="${ix+iw+30}" y2="${busP}" stroke="${COL.f1}" stroke-width="2"/>`;
    }
  }

  // V_OUT nhãn
  if(step>=2){
    g+=`<circle cx="${WW}" cy="${busP}" r="4" fill="${COL.f1}"/>`;
    g+=`<text x="${WW+6}" y="${busP+4}" text-anchor="start" style="font-weight:700;font-size:13px;fill:${COL.f1}">V_OUT</text>`;
    g+=`<text x="${WW+6}" y="${busP+18}" text-anchor="start" style="font-size:9px;fill:${COL.mute}">+1,25V..+25V</text>`;
    g+=gnd(WW,busG);
  }

  // Công thức
  if(step>=3){
    g+=`<text x="${W/2}" y="24" text-anchor="middle" style="font-size:12px;font-weight:700;fill:${COL.f1}">V_OUT = +1,25 × (1 + VR₂/R₁)  [V]</text>`;
  }

  g+=`<text x="${W/2}" y="${H-5}" text-anchor="middle" style="font-size:11px;fill:${COL.mute}">Hình 4.49a: Mạch ổn áp LM317 (theo sách tr.125)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mạch LM317">${g}</svg>`;
}

/* =================================================================
   SVG C: Mạch LM337  (Hình 4.49b sách tr.125)
   ================================================================= */
function svgC(step){
  const W=520,H=280;
  let g='';

  const busN=200, busG=60; // bus âm ở dưới, bus GND ở trên
  const WW=480;

  g+=`<line x1="30" y1="${busG}" x2="${WW}" y2="${busG}" stroke="${COL.ink}" stroke-width="2.2"/>`;
  g+=`<line x1="30" y1="${busN}" x2="${WW}" y2="${busN}" stroke="${COL.c3}" stroke-width="2.2"/>`;

  // Nhãn V_IN (âm)
  g+=`<text x="28" y="${busN+16}" text-anchor="middle" style="font-size:11px;fill:${COL.c3}">V_IN</text>`;
  g+=`<text x="28" y="${busN+30}" text-anchor="middle" style="font-size:9px;fill:${COL.mute}">&lt;−28V</text>`;

  // GND
  g+=gnd(30,busG);
  g+=`<text x="18" y="${busG-10}" text-anchor="middle" style="font-size:10px">GND</text>`;

  // Tụ C_IN (1µF)
  if(step>=1){
    g+=capV(80,busG,busN-busG);
    g+=`<text x="93" y="${busG+60}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">C_IN</text>`;
    g+=`<text x="93" y="${busG+73}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">1µF</text>`;
  }

  // IC LM337
  if(step>=1){
    const ix=160,iy=busG+50,iw=100,ih=60;
    g+=ic(ix,iy,iw,ih,'LM337',[
      {t:'IN(2)',tx:ix-2,ty:iy+15,ta:'end'},
      {t:'ADJ(1)',tx:ix+iw/2,ty:iy-10,ta:'middle'},
      {t:'OUT(3)',tx:ix+iw+2,ty:iy+15,ta:'start'},
    ]);
    // Dây chân IN ← bus âm
    g+=`<line x1="${ix}" y1="${iy+15}" x2="${ix-22}" y2="${iy+15}" stroke="${COL.c3}" stroke-width="2"/>`;
    g+=`<line x1="${ix-22}" y1="${busN}" x2="${ix-22}" y2="${iy+15}" stroke="${COL.c3}" stroke-width="2"/>`;
    // Dây chân OUT → sang phải
    g+=`<line x1="${ix+iw}" y1="${iy+15}" x2="${ix+iw+30}" y2="${iy+15}" stroke="${COL.c3}" stroke-width="2"/>`;
    g+=`<line x1="${ix+iw+30}" y1="${iy+15}" x2="${ix+iw+30}" y2="${busN}" stroke="${COL.c3}" stroke-width="2"/>`;

    // Dây ADJ lên (đến VR2 và R1)
    const adjX=ix+iw/2, adjY=iy;
    g+=`<line x1="${adjX}" y1="${adjY}" x2="${adjX}" y2="${adjY-20}" stroke="${COL.c3}" stroke-width="1.8"/>`;

    if(step>=2){
      // VR2=5kΩ nằm ngang trên ADJ → GND bus
      const vrTopY=busG+10;
      // Từ ADJ lên đến điểm nối VR2-R1
      g+=`<line x1="${adjX}" y1="${adjY-20}" x2="${adjX}" y2="${vrTopY+30}" stroke="${COL.c3}" stroke-width="1.8"/>`;

      // VR2 thẳng đứng
      g+=potV(adjX,vrTopY,30,'VR₂ 5kΩ');
      // R1=240Ω nằm ngang từ adjX sang phải đến bus OUT
      const r1y=vrTopY+30;
      const r1x2=ix+iw+30;
      g+=resH(adjX,r1y,r1x2-adjX,'R₁ 240Ω');
      // Nối R1 với dây OUT
      g+=`<line x1="${r1x2}" y1="${iy+15}" x2="${r1x2}" y2="${r1y}" stroke="${COL.c3}" stroke-width="1.8"/>`;

      // Đường từ VR2 lên bus GND
      g+=`<line x1="${adjX}" y1="${vrTopY}" x2="${adjX}" y2="${busG}" stroke="${COL.ink}" stroke-width="1.8"/>`;
      g+=`<text x="${adjX-30}" y="${vrTopY-3}" text-anchor="start" style="font-size:9px;fill:${COL.mute}">I_PROG</text>`;
    }

    // Tụ C_OUT (1µF) bên phải
    if(step>=2){
      const cox=ix+iw+80;
      g+=capV(cox,busG,busN-busG);
      g+=`<text x="${cox+12}" y="${busG+60}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">C_OUT</text>`;
      g+=`<text x="${cox+12}" y="${busG+73}" text-anchor="start" style="font-size:10px;fill:${COL.c2}">1µF</text>`;
      g+=`<line x1="${cox}" y1="${busN}" x2="${ix+iw+30}" y2="${busN}" stroke="${COL.c3}" stroke-width="2"/>`;
    }
  }

  // V_OUT nhãn
  if(step>=2){
    g+=`<circle cx="${WW}" cy="${busN}" r="4" fill="${COL.c3}"/>`;
    g+=`<text x="${WW+6}" y="${busN+4}" text-anchor="start" style="font-weight:700;font-size:13px;fill:${COL.c3}">V_OUT</text>`;
    g+=`<text x="${WW+6}" y="${busN+18}" text-anchor="start" style="font-size:9px;fill:${COL.mute}">−1,25V..−25V</text>`;
  }

  // Công thức
  if(step>=3){
    g+=`<text x="${W/2}" y="${H-20}" text-anchor="middle" style="font-size:12px;font-weight:700;fill:${COL.c3}">V_OUT = −1,25 × (1 + VR₂/R₁)  [V]</text>`;
  }

  g+=`<text x="${W/2}" y="${H-5}" text-anchor="middle" style="font-size:11px;fill:${COL.mute}">Hình 4.49b: Mạch ổn áp LM337 (theo sách tr.125)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mạch LM337">${g}</svg>`;
}

function viz(v){
  if(!v)return '';
  if(v.t==='pinout')return svgPinout();
  if(v.t==='a')return svgA(v.step);
  if(v.t==='b')return svgB(v.step);
  if(v.t==='wave')return svgWave();
  return '';
}

function renderSide(side,hk){
  const sd=SIDE[side];
  if(!sd)return '';
  return `<h3>${sd.t}</h3><table><tr>${sd.h.map(x=>`<th>${x}</th>`).join('')}</tr>${sd.r.map(r=>`<tr class="${(hk||[]).includes(r[0])?'h':''}"><td>${r[1]}</td>${r.slice(2).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
}

let si=0,playing=false,gen=0,tm;
const $=id=>document.getElementById(id);

function render(){
  const s=S[si];
  let side='pin';
  for(let j=0;j<=si;j++) if(S[j].side) side=S[j].side;
  $('tabs').innerHTML=CH.map((x,j)=>`<button data-j="${j}" class="${j==s.c?'on':''}">${x}</button>`).join('');
  $('ttl').textContent=TT[s.c];
  $('side').innerHTML=renderSide(side,s.hk);
  let L=[],k=0;
  for(let j=0;j<=si;j++){const t=S[j];if(t.c==s.c){L.push(...(t.a||[]));k=(t.a||[]).length}}
  $('lines').innerHTML=L.map((x,j)=>`<div class="${j>=L.length-k?'new':''}">${x}</div>`).join('');
  $('viz').innerHTML=viz(s.v);
  $('sub').textContent=s.s;
  document.querySelector('#bar i').style.width=((si+1)/S.length*100)+'%';
  $('play').textContent=playing?'Tạm dừng':'Phát';
}

function speak(){
  clearTimeout(tm);const g=++gen,txt=S[si].s;let done=false;
  const fin=()=>{if(done||g!==gen||!playing)return;done=true;clearTimeout(tm);tm=setTimeout(()=>{if(g===gen&&playing)step(1)},800)};
  const ss=window.speechSynthesis;let v=null;
  try{ss.cancel();v=ss.getVoices().find(x=>/^vi/i.test(x.lang))}catch(e){}
  if(!ss||!v){tm=setTimeout(fin,txt.length*70+1500);return}
  const u=new SpeechSynthesisUtterance(txt);u.voice=v;u.lang='vi-VN';u.rate=.95;u.onend=fin;u.onerror=fin;
  ss.speak(u);tm=setTimeout(fin,txt.length*220+4000);
}

function step(d){
  if(d>0){if(si<S.length-1)si++;else{const w=playing;pause();window.__exDone&&window.__exDone(w);return}}else if(si>0)si--;
  render();if(playing)speak();
}

function pause(){playing=false;gen++;clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}render()}

$('play').onclick=()=>{if(playing)pause();else{if(si==S.length-1)si=0;playing=true;render();speak()}};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('tabs').onclick=e=>{const j=e.target.dataset&&e.target.dataset.j;if(j==null)return;si=S.findIndex(x=>x.c==+j);render();if(playing)speak()};

render();

SECS.forEach((x,q)=>{if(GRP[q]){const g=document.createElement('span');g.className='grp';g.textContent=GRP[q];$('nv').append(g)}const b=document.createElement('button');b.textContent=x[0];b.onclick=()=>goCh(C.indexOf(x[1][0]));$('nv').append(b)});
$('jp').onchange=e=>goCh(+e.target.value);
function navUpd(c){const q=secOf(c);document.querySelectorAll('#nv button').forEach((b,j)=>{b.className=j==q?'on':'';if(j==q)b.scrollIntoView({inline:'center',block:'nearest'})});
 if(q<0)return;const jp=$('jp'),ch=SECS[q][1];jp.hidden=ch.length<2;if(jp.dataset.q!=q){jp.dataset.q=q;jp.innerHTML=ch.map(n=>`<option value="${C.indexOf(n)}">${n}</option>`).join('')}jp.value=c}
function hdr(s){const q=secOf(s.c),cn=S.slice(0,i+1).filter(t=>t.c==s.c).length,cs=S.filter(t=>t.c==s.c).length,sa=S.filter(t=>secOf(t.c)==q).length,sd=S.slice(0,i+1).filter(t=>secOf(t.c)==q).length;
 $('ct').textContent=((LB[C[s.c]]||[])[cn-1])||(/^BT /.test(C[s.c])?SECS[q][0]+' – '+C[s.c]:(q>=0?SECS[q][0]:C[s.c]));$('st').textContent='· bước '+cn+'/'+cs+(sa>cs?' · tiến độ mục '+sd+'/'+sa:'')}
function show(){const s=S[i];hdr(s);$('ln').innerHTML='';
 S.forEach((t,k)=>{if(t.c==s.c&&k<=i)t.ln.forEach(x=>{const d=document.createElement('div');d.innerHTML=mth(x);if(k==i)d.className='n';$('ln').append(d)})});
 $('sub').textContent=s.say;$('fig').innerHTML=(s.k?fig(s.k):'')+realOf(s);$('pr').value=i;
 navUpd(s.c);
 $('pl').textContent=play?'❚❚ Dừng':'▶ Phát'}
function talk(){if(ss)ss.cancel();clearTimeout(tm);if(!play)return;const my=++tk,t=S[i].say,adv=()=>{if(my==tk&&play)go(i+1)};
 const v=ss&&ss.getVoices().find(x=>x.lang.toLowerCase().startsWith('vi'));
 if(v){const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang='vi-VN';u.rate=+$('sp').value;u.onend=()=>{tm=setTimeout(adv,1000)};u.onerror=u.onend;ss.speak(u)}
 else tm=setTimeout(adv,t.length*65/+$('sp').value+1500)}
function go(k,jump){unmount();if(!jump&&k>i&&S[k]&&C.findIndex((t,j)=>j in EXI&&j>S[i].c&&j<S[k].c)>=0){const j=C.findIndex((t,j)=>j in EXI);const w=play;i=k-1;mount(j);if(w){const p=root.querySelector('#play');p&&p.click()}return}
 if(k>=S.length){play=false;k=S.length-1}i=Math.max(0,k);show();tk++;talk()}
$('pv').onclick=()=>go(i-1);$('nx').onclick=()=>go(i+1);
$('pl').onclick=()=>{play=!play;if(play&&i>=S.length-1)i=0;show();talk()};
$('pr').oninput=e=>go(+e.target.value,true);

const CS=[
['BT 4.1 · Đọc trị số R, L, C',['Điện trở 4 vòng: R = ab×10^c Ω ± d%; 5 vòng: R = abc×10^d Ω ± e%.','Màu: đen 0, nâu 1, đỏ 2, cam 3, vàng 4, lục 5, lam 6, tím 7, xám 8, trắng 9; nhũ vàng −1 (±5%), nhũ bạc −2 (±10%).','VD: đỏ-đỏ-cam-nhũ vàng = 22×10³ = 22 kΩ ±5%; lam-vàng-đỏ-nâu-nâu = 642×10¹ = 6,42 kΩ ±1%.','Điện trở dán: R, K, M thay dấu phẩy (R47 = 0,47 Ω; 4K7 = 4,7 kΩ; 47M = 47 MΩ). Mã số: 223 = 22×10³ Ω; 8202 = 820×10² Ω.','Ký tự sai số: F 1%, G 2%, J 5%, K 10%, M 20% (103J = 10 kΩ ±5%).'],'Nhầm số mũ (vòng cuối trước vòng sai số) hoặc quên đổi đơn vị Ω sang kΩ.'],
['BT 4.1 · Cuộn cảm, tụ điện, và ý hai',['Cuộn cảm 4 vòng đọc như điện trở nhưng đơn vị µH: vàng-tím-nâu-đen = 47×10¹ µH ±20% = 470 µH ±20%. Loại 5 vòng: vạch đôi bạc ở đầu, 4 vòng sau đọc như loại 4 vòng.','Tụ gốm: 103 = 10×10³ pF = 10 nF. Tụ hóa ghi trực tiếp (22 µF ±10%, 25 V).','Tụ mica: mã điện áp (1H = 50 V, 2A = 100 V, 2D = 200 V, 2E = 250 V, 2G = 400 V), rồi 3 số, rồi sai số: 2A224J = 100 V, 22×10⁴ pF = 0,22 µF ±5%.','Hai điện trở cùng vòng màu nhưng khác kích thước: cùng trị số và sai số, khác CÔNG SUẤT (nhỏ 0,25 đến 0,5 W; điện trở công suất 1, 2, 5, 10 W… kích thước lớn hơn).'],'Đơn vị cuộn cảm là µH, tụ là pF, điện trở là Ω.'],
['BT 4.2 · Trị số chuẩn',['Điện trở (Bảng 4.2): dãy 24 số 1,0 · 1,1 · 1,2 … 9,1 nhân 10^k, từ 1 Ω đến 9,1 MΩ.','Tụ điện (Bảng 4.4): dãy 12 số 10 · 12 · 15 · 18 · 22 · 27 · 33 · 39 · 47 · 56 · 68 · 82 theo pF, nF, µF (µF thêm 10, 22, 33, 47).','Cuộn cảm: sách không có bảng riêng, dùng dãy 12 số tương tự (phần ngoài sách, nên nói rõ).'],'Tụ hóa đến 4700 µF vượt Bảng 4.4: bảng chỉ là các giá trị thông dụng.'],
['BT 4.3 · Rơ-le',['Rơ-le điện từ: cuộn dây (1) là nam châm điện, thanh hút (2) nối đầu chung CO (3).','Bình thường lò xo giữ CO chạm NC. Cấp DC vào cuộn dây: nam châm kéo CO sang NO. Ngắt điện: lò xo kéo CO về NC.','Rơ-le bán dẫn: LED phát quang (1) + TRIAC quang (2): ánh sáng kích TRIAC nối T1 với T2. Không có chuyển động cơ khí nên không ồn, không tia lửa, bền, nhỏ gọn.','Vì sao dùng rơ-le: điều khiển tải lớn bằng áp DC nhỏ (3 đến 32 VDC), tách mạch điều khiển với mạch tải (phần suy ra, ngoài sách).'],'Ghi rõ phần "theo sách" và phần "tự suy ra" khi trả lời ý ba.'],
['BT 4.4 · Diode thường, Schottky, Zener',['Thường: lớp tiếp giáp P-N, dẫn A→K khi V > Vγ (Si 0,7 V; Ge 0,3 V), ngăn dòng ngược.','Schottky: bán dẫn N nối kim loại, không có Vγ kiểu P-N; kích dẫn ≈ 0,2 V, rơi thuận ≈ 0,6 V (thường ≈ 1 V); đóng mở nhanh, dùng trên 1 MHz; nhược: dòng ngược lớn, áp ngược thấp.','Zener: P-N pha tạp cao hơn; thuận như diode thường; ngược đạt Vz thì dẫn K→A và giữ V_KA = Vz (đánh thủng tạm thời, không hỏng).','Zener thay diode thường được khi áp ngược luôn < Vz và dòng, công suất trong giới hạn; không thay khi chỉnh lưu AC biên độ lớn hơn Vz (phần suy ra).'],'Quên nói Zener dùng chủ yếu phân cực ngược để ổn áp.'],
['BT 4.5 · BJT, SCR, TRIAC, DIAC',['BJT: 3 lớp P-N xen kẽ (NPN, PNP). E pha tạp nhiều nhất, B ít nhất, C trung bình. Ba vùng: khóa (I_B = 0, R_CE rất lớn), bão hòa (R_CE rất nhỏ), khuếch đại. V_CEsat = 0,2 V (Si), V_BEsat = 0,8 V đến 1 V.','SCR: 4 lớp PNPN (A, K, G), kích bằng xung dương vào G, đã dẫn thì tự duy trì cho đến khi V_AK ≤ 0,7 V (cho Si).','TRIAC: như 2 SCR song song ngược, dẫn 2 chiều: V_T1 > V_T2 kích xung âm; V_T2 > V_T1 kích xung dương.','DIAC: 2 chân A1, A2, không có cực cổng, dẫn hai chiều khi vượt V_BO (7 V đến 140 V).','Mỗi linh kiện nêu một mạch ứng dụng: BJT bật LED, SCR bật tắt đèn bằng 2 nút nhấn, TRIAC với DIAC điều chỉnh sáng đèn.'],'Phải có đủ 3 ý cho mỗi linh kiện: cấu tạo, nguyên lý, mạch ứng dụng.'],
['BT 4.6 · Điện trở hạn dòng cho LED',['LED có đặc tuyến rất dốc: chỉ cần tăng điện áp nhỏ là dòng tăng vọt, vượt I_F định mức (10 đến 20 mA) thì LED hỏng. LED 7 đoạn: mỗi đoạn một điện trở (dùng điện trở thanh).','Kirchhoff 2: −E + I·R + V_LED = 0 ⇒ R = (E − V_LED)/I.','VD: E = 5 V, V_LED = 3 V, I = 10 mA ⇒ R = (5 − 3)/0,01 = 200 Ω.','Chọn điện trở chuẩn ≥ giá trị tính (dãy E24).'],'Sách ghi V_LED = 2,8 V nhưng thế số 3 V (và 0,001); với 2,8 V thì R = 2,2/0,01 = 220 Ω, đúng với trị số chuẩn 220 Ω sách chọn.'],
['BT 4.7 · Mạch nguồn ổn áp bằng IC',['a) ±12 V: biến áp có điểm giữa nối đất; 7812 cho +12 V, 7912 cho −12 V; mỗi IC có C_IN và C_OUT (0,33 µF và 0,1 µF; 2,2 µF và 1 µF theo Hình 4.48); tải tối đa 1,5 A.','7812: chân 1 IN, 2 GND, 3 OUT. LM317: chân 1 ADJ, 2 OUT, 3 IN. LM337: chân 1 ADJ, 2 IN, 3 OUT.','b) LM317: V_OUT = +1,25·(1 + VR2/R1), R1 = 240 Ω. Muốn đến +30 V: VR2 = (30/1,25 − 1)·240 = 5520 Ω ⇒ chọn VR2 = 10 kΩ (biến trở 5 kΩ chỉ đến ≈ 27,3 V).','c) LM337: V_OUT = −1,25·(1 + VR2/R1), tính tương tự, V_IN âm hơn V_OUT.'],'Hình 4.48b của sách vẽ 79XX với V_IN ở chân 3, V_OUT ở chân 2; datasheet thực của 7912 là chân 1 GND, 2 IN, 3 OUT. Làm theo đề hoặc thầy cô.'],
['BT 4.8 · Mạch tạo xung IC 555',['Chân: 1 GND, 2 Trigger, 3 Output, 4 Reset (nối Vcc), 5 Control (nối C₁ = 0,01 µF xuống GND), 6 Threshold, 7 Discharge, 8 Vcc. Chân 2 và 6 nối chung vào tụ C.','a) Tần số cố định: nạp qua R1, D, C: t1 = 0,69·R1·C; xả qua R2 về chân 7: t2 = 0,69·R2·C; T = t1 + t2.','f = 1/[0,69(R1+R2)C]; D = t1/T = 0,5 khi R1 = R2.','b) Tần số đổi được: thêm biến trở đôi VR = VR1 = VR2: f = 1/[0,69(R1+R2+2VR)C]; với R1 = R2 thì D vẫn bằng 0,5.'],'Vẽ đủ diode D song song R2 ở ý a; nhớ ghi công thức 4.3, 4.4, 4.5.'],
['BT 4.9–4.10 · Làm nhóm và checklist',['4.9: lập bảng ký hiệu linh kiện (word) và nhận dạng ký hiệu trong sơ đồ nguyên lý do giảng viên đưa.','4.10: vẽ ký hiệu, tóm tắt nguyên lý từng nhóm linh kiện; tìm hiểu dùng đồng hồ VOM kiểm tra linh kiện hỏng.','Trước khi nộp: đúng đơn vị (Ω, µH, pF), đã chọn trị số chuẩn, đã kiểm tra dòng không vượt định mức, ghi rõ phần suy ra ngoài sách.'],'']];
const shq=id=>document.getElementById(id);
shq('sheet').innerHTML='<div class="tb"><button id="shp">In tờ này</button><button id="shx">Đóng</button></div><h2>Tờ ôn: khuôn giải tự luận – Chương 4 Linh kiện điện tử</h2><div class="gr">'+CS.map(c=>`<div class="cd"><b>${mth(c[0])}</b><ol>${c[1].map(x=>'<li>'+mth(x.replace(/\.$/,''))+'</li>').join('')}</ol>${c[2]?`<div class="w">⚠ ${mth(c[2])}</div>`:''}</div>`).join('')+'</div>';
const shT=v=>{shq('sheet').hidden=!v;document.body.style.overflow=v?'hidden':''};
shq('cs').onclick=()=>shT(true);shq('shx').onclick=()=>shT(false);shq('shp').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(e.key=='Escape')shT(false)});

show();
</script></body></html>
