<!doctype html>
<html lang="vi"><head><meta charset="utf-8">

<title>Chương 4 – Linh kiện điện tử (video giảng giải)</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>#ex{display:none}
:root{--bg:#fbfaf4;--ink:#1f2a37;--mut:#6b7280;--ac:#2563eb;--hl:#fde68a;--card:#fff;--ln:#e3e8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111827;--ink:#e5e7eb;--mut:#9ca3af;--ac:#60a5fa;--hl:#713f12;--card:#1f2937;--ln:#2b3646;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111827;--ink:#e5e7eb;--mut:#9ca3af;--ac:#60a5fa;--hl:#713f12;--card:#1f2937;--ln:#2b3646;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:12px 12px 88px}
h1{font-size:1.15rem;margin:4px 0 8px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
nav button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:16px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.board{background-color:var(--card);background-image:linear-gradient(var(--ln) 1px,transparent 1px),linear-gradient(90deg,var(--ln) 1px,transparent 1px);background-size:24px 24px;border:1px solid var(--ln);border-radius:12px;padding:14px;min-height:300px}
.board h2{margin:0 0 8px;font-size:1.05rem;color:var(--ac)}
#st{font-size:.8rem;font-weight:400;color:var(--mut);margin-left:6px}
#ln div{padding:4px 10px;margin:4px 0;border-radius:6px;border-left:3px solid transparent;font-size:1.1rem;opacity:.7;overflow-wrap:anywhere}
#ln div.n{opacity:1;font-weight:600;border-left-color:var(--ac);animation:fl 1.4s}
@keyframes fl{from{background:var(--hl)}to{background:transparent}}
#sub{margin:10px 0;padding:12px 14px;border-left:4px solid var(--ac);background:var(--card);border-radius:6px;min-height:4.5em;font-size:1.08rem}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--ln)}
.bar select{border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 4px;font:inherit}
.bar button{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.bar input{flex:1;min-width:0}
small{color:var(--mut);display:block;margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
#fig svg{width:100%;max-height:250px;margin-top:10px;background:var(--bg);border:1px solid var(--ln);border-radius:8px}#fig text.t{fill:var(--ink)}#fig text{fill:var(--mut);font-size:10px}.o,.o2{fill:none;stroke-width:2.6;stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2s forwards}.o{stroke:var(--ac)}.o2{stroke:#e07b00}.i{fill:none;stroke:var(--mut);stroke-dasharray:4 3;stroke-width:1.5}.a{fill:none;stroke:var(--mut);stroke-width:1.4}.bd{opacity:0;animation:fi .5s forwards}@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}@media(prefers-reduced-motion:reduce){.o,.o2{stroke-dashoffset:0}.bd{opacity:1}}
#ln sub,#ln sup{font-size:.72em;line-height:0}.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;font-size:.95em;line-height:1.25}.fr>span{padding:0 4px}.fr>span:first-child{border-bottom:1.5px solid currentColor}.grp{flex:none;align-self:center;font-size:.72rem;font-weight:700;color:var(--mut);text-transform:uppercase;margin:0 2px 0 8px}#tools{margin:.4rem 0}#tools select{max-width:100%;padding:.45rem .6rem;font-size:.92rem}
#sheet{position:fixed;inset:0;z-index:50;overflow:auto;background:var(--bg);color:var(--ink);padding:14px 14px 40px;line-height:1.5}#sheet[hidden]{display:none}#sheet h2{margin:0 0 4px;font-size:1.15rem}#sheet .tb{display:flex;gap:8px;margin:8px 0 12px}#sheet .tb button{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}#sheet .gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:10px}#sheet .cd{border:1px solid var(--ln);border-radius:10px;padding:8px 11px;background:var(--card);break-inside:avoid;font-size:.9rem}#sheet .cd b{display:block;margin-bottom:3px}#sheet ol{margin:2px 0 4px;padding-left:20px}#sheet .w{color:#b45309;font-size:.85rem}
@media print{body>*:not(#sheet){display:none!important}#sheet{position:static;overflow:visible;background:#fff;color:#000;padding:0}#sheet .tb{display:none}#sheet .gr{grid-template-columns:1fr 1fr;gap:6px}#sheet .cd{background:#fff;font-size:10.5px;padding:5px 8px;border-color:#999}#sheet .w{color:#000}}
#fig svg.rl{max-height:none}#fig svg.rl text{font-size:9px}.fl{animation:flo 4s ease-in-out infinite}@keyframes flo{50%{transform:translateY(-2px)}}.gl{animation:gl 1.6s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.05}50%{opacity:.5}}.spin,.stp,.sw,.arm,.vib{transform-box:fill-box;transform-origin:50% 50%}.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.stp{animation:sp 3s steps(8) infinite}.sw{animation:swp 2.4s ease-in-out infinite alternate}@keyframes swp{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}.arm{transform-origin:50% 100%;animation:arm 2.4s ease-in-out infinite alternate}@keyframes arm{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-28deg)}}.vib{animation:vb .16s linear infinite alternate}@keyframes vb{to{transform:scale(1.05)}}.bm{animation:bm .8s linear infinite}@keyframes bm{to{stroke-dashoffset:-6}}.fw{animation:fw 1.4s linear infinite}@keyframes fw{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(84px);opacity:0}}.sg{transition:opacity .2s}
.xv{animation:xv .1s linear infinite alternate}@keyframes xv{to{transform:translateX(1px)}}.wv{animation:wv 1s linear infinite}@keyframes wv{to{transform:translateX(var(--d,-20px))}}
.rt{font-size:.8rem;font-weight:600;color:var(--mut);margin-top:12px}
</style></head><body><main>
<h1>Chương 4 · Linh kiện điện tử</h1>
<nav id="nv"></nav>
<div id="tools"><label for="jp" style="font-size:.85rem">Chuyển đến bài: </label><select id="jp" hidden></select></div>
<section class="board"><h2><span id="ct"></span><span id="st"></span></h2><div id="ln"></div><div id="fig"></div></section>
<div id="sub"></div>
<div id="ex"></div>
<div class="bar"><button id="pv">◀ Trước</button><button id="pl">▶ Phát</button><button id="nx">Tiếp ▶</button><button id="cs">Tờ ôn</button><select id="sp"><option value="0.85">0,85×</option><option value="1" selected>1×</option><option value="1.25">1,25×</option></select><input type="range" id="pr" min="0" value="0"></div>
<small>Giọng đọc dùng giọng tiếng Việt của trình duyệt; nếu máy không có, bài tự chuyển bước theo độ dài câu. Các số trong phần ví dụ được tính bằng code từ cùng dữ liệu với lời giảng.</small>
</main>
<div id="sheet" hidden></div><script>
const C=[],S=[],ch=t=>C.push(t),T=(say,ln=[])=>S.push({c:C.length-1,say,ln});
const n=(x,d=3)=>String(+x.toFixed(d)).replace('.',',');
const eng=(v,u)=>v>=1e6?n(v/1e6)+' M'+u:v>=1e3?n(v/1e3)+' k'+u:n(v)+' '+u;
const D={'Đen':0,'Nâu':1,'Đỏ':2,'Cam':3,'Vàng':4,'Lục':5,'Lam':6,'Tím':7,'Xám':8,'Trắng':9,'Nhũ vàng':-1,'Nhũ bạc':-2};
const TOL={'Đen':20,'Nâu':1,'Đỏ':2,'Nhũ vàng':5,'Nhũ bạc':10};
function rd(a){const k=a.length==5?3:2,m=a.slice(0,k).reduce((s,c)=>s*10+D[c],0),e=D[a[k]];return{v:m*Math.pow(10,e),m,e,t:TOL[a[k+1]]}}
function smd(c){let m=c.match(/^(\d*)([RKM])(\d*)$/);if(m)return parseFloat((m[1]||'0')+'.'+(m[3]||'0'))*{R:1,K:1e3,M:1e6}[m[2]];return +c.slice(0,-1)*Math.pow(10,+c.slice(-1))}
const pf=c=>+c.slice(0,2)*Math.pow(10,+c[2]);
const fp=v=>v>=1e6?n(v/1e6)+' µF':v>=1e3?n(v/1e3)+' nF':n(v)+' pF';

ch('Mở đầu');
T('Chào bạn! Chương 4 giới thiệu các linh kiện điện tử cơ bản, chia làm năm nhóm: thụ động, cơ điện, bán dẫn, quang điện tử và vi mạch. Mình tóm tắt từng nhóm rồi giải bài tập cuối chương.',['Chương 4: Linh kiện điện tử','Thụ động · Cơ điện · Bán dẫn · Quang điện tử · Vi mạch']);
T('Linh kiện thụ động không điều khiển và không khuếch đại được dòng điện, gồm điện trở, cuộn cảm, tụ điện, biến áp. Còn linh kiện tích cực như diode, transistor thì khuếch đại hoặc điều khiển được dòng.',['Thụ động: R, L, C, biến áp','Tích cực: diode, BJT, SCR, IC…']);

ch('Điện trở');
T('Điện trở dùng để giới hạn dòng điện, hoặc chia điện áp. Hai thông số quan trọng là trị số, đơn vị ôm, kèm sai số phần trăm, và công suất tiêu tán, đơn vị oát.',['Chức năng: hạn dòng, chia áp','Thông số: R (Ω) ± sai số %, P (W)']);
T('Theo vật liệu: bột than ép công suất 0,125 đến 2 oát, sai số lớn. Màng carbon ít sai số hơn. Màng kim loại, oxit kim loại công suất 0,05 đến 0,5 oát, ổn định hơn. Dây quấn trị số nhỏ 0,1 đến 10 ôm nhưng công suất lớn, 1 đến 300 oát, dùng cho động cơ.',['Bột than ép: 0,125–2 W, sai số lớn','Màng carbon: sai số nhỏ hơn','Màng kim loại: 0,05–0,5 W, ổn định','Dây quấn: 0,1–10 Ω, 1–300 W']);
T('Theo công dụng: cầu chì bảo vệ ngắn mạch. Điện trở nhiệt NTC giảm khi nóng, PTC tăng khi nóng. Quang trở giảm khi ánh sáng mạnh. Biến trở có 3 chân, và R mười ba bằng R mười hai cộng R hai ba. Điện trở thanh dùng hạn dòng cho LED 7 đoạn.',['Nhiệt: NTC ↓ / PTC ↑ khi nóng','Quang trở: sáng mạnh → R giảm','Biến trở: R13 = R12 + R23']);
{const a=rd(['Đỏ','Đỏ','Cam','Nhũ vàng']),b=rd(['Lam','Vàng','Đỏ','Nâu','Nâu']);
T(`Đọc vòng màu: đen 0, nâu 1, đỏ 2, cam 3, vàng 4, lục 5, lam 6, tím 7, xám 8, trắng 9. Loại 4 vòng: hai vòng đầu là số, vòng ba là số mũ của 10, vòng bốn là sai số. Ví dụ đỏ, đỏ, cam, nhũ vàng: ${a.m} nhân 10 mũ ${a.e}, bằng ${eng(a.v,'Ω')}, sai số ${a.t} phần trăm.`,['4 vòng: R = ab·10^c Ω ± d%','5 vòng: R = abc·10^d Ω ± e%','Đỏ-Đỏ-Cam-Nhũ vàng = 22×10³ = '+eng(a.v,'Ω')+' ±'+a.t+'%']);
T(`Loại 5 vòng thì ba vòng đầu là số. Ví dụ lam, vàng, đỏ, nâu, nâu: ${b.m} nhân 10 mũ ${b.e}, bằng ${eng(b.v,'Ω')}, sai số ${b.t} phần trăm. Nhũ vàng là sai số 5 phần trăm, nhũ bạc là 10 phần trăm.`,['Lam-Vàng-Đỏ-Nâu-Nâu = 642×10¹ = '+eng(b.v,'Ω')+' ±'+b.t+'%','Nhũ vàng ±5% · Nhũ bạc ±10%']);}
T(`Điện trở dán ghi mã số. Chữ R, K, M thay dấu phẩy và chỉ đơn vị: R47 là ${n(smd('R47'))} ôm, 4K7 là ${eng(smd('4K7'),'Ω')}, 47M là ${eng(smd('47M'),'Ω')}. Mã 3 hoặc 4 chữ số: các số đầu nhân 10 mũ chữ số cuối, nên 223 là ${eng(smd('223'),'Ω')}, 8202 là ${eng(smd('8202'),'Ω')}.`,['R47 = 0,47 Ω · 4K7 = 4,7 kΩ · 47M = 47 MΩ','223 = 22×10³ = '+eng(smd('223'),'Ω'),'8202 = 820×10² = '+eng(smd('8202'),'Ω'),'Sai số: F1% G2% J5% K10% M20%; 103J = 10 kΩ ±5%']);

T('Bổ sung về ứng dụng. Trong mạch điện tử, điện trở kích hoạt điều khiển điện áp cho transistor, hạn dòng cho LED, và kết hợp với linh kiện khác tạo bộ lọc tín hiệu, bộ tạo dao động. Trong điện công nghiệp, điện trở sinh nhiệt như ấm nước, bàn ủi, chiếu sáng như bóng đèn sợi tóc, hoặc hạn dòng khởi động động cơ. Còn có điện trở phụ thuộc áp và phụ thuộc dòng, trị số đổi theo điện áp hoặc dòng qua nó.',['Mạch điện tử: kích hoạt transistor, hạn dòng LED, bộ lọc, dao động', 'Công nghiệp: ấm nước, bàn ủi, đèn sợi tóc, hạn dòng khởi động động cơ', 'Phụ thuộc áp / phụ thuộc dòng: R đổi theo U hoặc I']);
ch('Cuộn cảm');
T('Cuộn cảm là dây quấn nhiều vòng trên lõi. Cảm kháng tăng theo tần số, nên cuộn cảm chặn dòng AC cao tần, cho DC đi qua. Nó còn tích trữ năng lượng từ trường và kết hợp với tụ tạo mạch dao động LC. Đơn vị là henry.',['Cảm kháng tăng theo tần số','Chặn AC, cho DC qua','Thông số: L (H), điện trở cuộn, tần số làm việc']);
T('Theo lõi: lõi không khí độ cảm nhỏ. Lõi lá sắt lớn, tần số thấp, như máy biến áp. Lõi ferrit dùng nhiều ở tần số cao. Cuộn choke chặn tín hiệu xoay chiều tần số cao, hay dùng trong âm thanh.',['Lõi không khí · lá sắt · ferrit','Choke: chặn AC tần số cao']);
{const a=rd(['Vàng','Tím','Nâu','Đen']);
T(`Đọc cuộn cảm 4 vòng màu giống điện trở nhưng đơn vị là micrô henry. Vàng, tím, nâu, đen: ${a.m} nhân 10 mũ ${a.e}, bằng ${a.v} micrô henry, sai số ${a.t} phần trăm. Cuộn dán ghi mã 3 số và một chữ cái sai số: F 1, G 2, J 5, K 10, L 15, M 20, V 25 phần trăm.`,['Vàng-Tím-Nâu-Đen = 47×10¹ = '+a.v+' µH ±'+a.t+'%','Chữ sai số: F1 G2 J5 K10 L15 M20 V25 (%)']);}

T('Bổ sung về cuộn cảm. Ứng dụng khác: nam châm điện, lọc nhiễu, cảm biến dò kim loại, rơ-le điện từ, loa, micro, máy biến áp. Ferrit có công thức chung X Fe hai O bốn: ferrit mềm đảo cực không cần năng lượng ngoài, dùng cho âm thanh tần số cao; ferrit cứng giữ nguyên cực như nam châm vĩnh cửu.',['Ứng dụng: nam châm điện, lọc nhiễu, dò kim loại, rơ-le, loa/micro', 'Ferrit: XFe₂O₄ · mềm (đảo cực dễ) · cứng (nam châm vĩnh cửu)']);
T('Cuộn cảm 5 vòng màu thường có tần số vô tuyến ứng dụng quân sự: màu đầu có vạch đôi màu bạc, bốn vòng sau đọc như loại 4 vòng, đơn vị micrô henry. Cuộn dán không ghi sai số, có 3 chấm màu theo chiều kim đồng hồ từ trên xuống, đọc như điện trở dán.',['5 vòng: vạch đôi bạc + 4 vòng đọc như 4 vòng, µH', 'Cuộn dán: 3 chấm màu, theo chiều kim đồng hồ, µH']);
ch('Tụ điện');
T('Tụ điện tích trữ điện tích, nạp xả năng lượng, cho AC đi qua và chặn DC. Dùng trong mạch lọc, nối tầng khuếch đại, bộ nhớ RAM, mạch dao động. Thông số: điện dung kèm sai số, và điện áp làm việc.',['Nạp–xả · chặn DC · cho AC qua','Thông số: C, sai số %, U làm việc']);
T('Phân loại theo chất điện môi. Tụ hóa 0,47 đến 4700 micrô fara, có cực. Tantalum cũng có cực, trị lớn, kích thước nhỏ. Tụ gốm dưới 0,47 micrô fara, điện áp cao, không cực. Tụ mica ổn định, chịu nhiệt, cho mạch đo lường, cao tần. Còn có tụ giấy, tụ dầu, và tụ xoay là loại chỉnh được điện dung.',['Có cực: tụ hóa, tantalum (C lớn, U nhỏ)','Không cực: gốm, mica (C nhỏ, U lớn)','Tụ xoay = biến dung']);
T(`Đọc tụ gốm: hai số đầu nhân 10 mũ số thứ ba, đơn vị picô fara. Mã 103 là ${fp(pf('103'))}. Tụ mica thêm mã điện áp: 1H là 50 vôn, 2A là 100 vôn, 2D 200 vôn, 2E 250 vôn, 2G 400 vôn. Mã 2A224J: 22 nhân 10 mũ 4 picô fara, bằng ${fp(pf('224'))}, sai số 5 phần trăm, 100 vôn.`,['103 = 10×10³ pF = '+fp(pf('103')),'2A224J = '+fp(pf('224'))+' ±5%, 100 V','103J/240 = '+fp(pf('103'))+' ±5%, 240 V','Tụ hóa ghi thẳng: 22 µF ±10%, 25 V']);

T('Bổ sung về phân loại tụ. Tụ giấy dùng bản cực nhôm và điện môi giấy, điện dung nhỏ, cho mạch tần số thấp, hay lọc nhiễu âm thanh. Tụ dầu dùng dầu khoáng làm điện môi, vỏ nhôm. Tụ tantalum có bản cực nhôm và điện môi gel tantal. Tụ Lithium-ion có bản cực dương carbon hoạt tính, bản cực âm là oxit kim loại chứa Li, dùng tích năng lượng trong pin Li-ion.',['Giấy: C nhỏ, tần số thấp, lọc nhiễu âm thanh', 'Dầu: điện môi dầu khoáng, vỏ nhôm', 'Tantalum: gel tantal, phân cực', 'Li-ion: tích năng lượng cho pin Li-ion']);
T('Tụ phân cực, thường là tụ hóa hoặc tantalum, điện dung lớn, điện áp làm việc nhỏ, dùng lọc nguồn và khuếch đại tín hiệu tần số thấp. Tụ không phân cực như gốm, mica, điện dung nhỏ, điện áp lớn, dùng lọc nhiễu và mạch cao tần. Tụ dán SMD có cả hai loại; nhiều tụ dán không ghi trị số nên phải đo bằng đồng hồ. Tụ 4, 5 vòng màu đọc như điện trở, đơn vị picô fara.',['Phân cực: lọc nguồn, tần số thấp', 'Không phân cực: lọc nhiễu, cao tần', 'Tụ dán: nhiều loại không ghi trị số → đo bằng đồng hồ', 'Tụ 4, 5 vòng màu: đọc như điện trở, đơn vị pF']);
ch('Biến áp & thạch anh');
{const U2=220/10;
T(`Biến áp đổi biên độ điện áp xoay chiều mà không đổi tần số. Quan hệ: U một chia U hai bằng N một chia N hai, gọi là N. N lớn hơn 1 là hạ áp, nhỏ hơn 1 là tăng áp. Công suất vào bằng công suất ra, nên áp tăng thì dòng giảm. Ví dụ N bằng 10, U một 220 vôn thì U hai bằng ${U2} vôn.`,['U1/U2 = N1/N2 = N','N > 1: hạ áp · N < 1: tăng áp','P vào = P ra → áp tăng, dòng giảm','Ví dụ: N=10, U1=220 V → U2 = '+U2+' V']);}
T('Thạch anh cho tín hiệu xung nhịp để đồng bộ hệ thống, như trong Arduino, PIC. Nó mắc kèm hai tụ, tần số 1 đến 20 mê-ga héc. So với mạch dao động LC, RC, thạch anh ít bị nhiệt độ tác động hơn, rẻ và nhỏ.',['Thạch anh + 2 tụ: dao động 1–20 MHz','Ổn định hơn LC, RC']);

T('Bổ sung về cấu tạo và phân loại biến áp. Biến áp đơn giản có một cuộn sơ cấp, một cuộn thứ cấp và lõi lá sắt khép kín. Dòng biến thiên ở sơ cấp tạo từ thông biến thiên trong lõi, từ thông này sinh dòng cảm ứng ở thứ cấp, cùng tần số. Phân loại: theo chức năng tăng áp hoặc giảm áp, theo cấu tạo một pha, ba pha, tự ngẫu, theo mục đích như thí nghiệm, đo lường, chuyên dụng.',['Cấu tạo: cuộn sơ cấp + cuộn thứ cấp + lõi lá sắt khép kín', 'Dòng biến thiên → từ thông biến thiên → dòng cảm ứng (cùng f)', 'Phân loại: tăng/giảm áp · 1 pha/3 pha/tự ngẫu · thí nghiệm/đo lường']);
ch('Cơ điện');
T('Linh kiện cơ điện phụ thuộc chuyển động cơ khi vận hành. Công tắc, nút nhấn đóng hoặc mở tiếp điểm. SPST là đóng mở đơn, SPDT hai chiều, DPST và DPDT là loại đôi. Nút nhấn NO thường hở, NC thường đóng. Công tắc hành trình LSO, LSC chắc chắn hơn để chịu lực lớn.',['SPST · SPDT · SP4T · DPST · DPDT','NO thường hở · NC thường đóng · BD đôi','LSO, LSC: công tắc hành trình']);
T('Rơ-le đóng mở tiếp điểm bằng điện áp một chiều. Rơ-le điện từ có cuộn dây là nam châm hút thanh CO từ NC sang NO khi có dòng DC. Rơ-le bán dẫn gồm LED phát quang và TRIAC quang, không chuyển động cơ nên không ồn, không tia lửa, bền. Cần xem điện áp, dòng ngõ vào, 3 đến 32 vôn DC, và khả năng chịu tải ngõ ra.',['Điện từ: cuộn dây hút CO → NO','Bán dẫn: LED + TRIAC quang, không ồn','Chú ý: áp/dòng vào 3–32 VDC, tải ra']);
T('Loa đổi tín hiệu AC thành âm thanh: cuộn dây trong từ trường nam châm rung màng loa. Thông số: nội trở ôm và công suất oát. Loa bass 20 đến 500 héc, mid 250 héc đến 2 ki-lô héc, treble 2 đến 20 ki-lô héc.',['Loa: cuộn dây + nam châm + màng','Bass 20–500 Hz · Mid 250–2k · Treble 2k–20k']);
T('Động cơ điện chia hai nhóm: một chiều và xoay chiều. Một chiều có nhiều ưu điểm về mô-men khởi động và chỉnh tốc độ. Nam châm vĩnh cửu có 3 loại: DC thường đổi chiều bằng đổi cực nguồn; động cơ bước điều khiển chính xác bằng xung; servo có encoder hồi tiếp tốc độ, vị trí. Mạch điều khiển phải chịu dòng lớn và tản nhiệt.',['DC · bước · servo','Bước: góc quay theo xung','Servo: có encoder hồi tiếp','Dòng lớn → cần tản nhiệt']);

T('Bổ sung về động cơ. Động cơ xoay chiều chia đồng bộ và không đồng bộ, khác nhau ở chỗ tốc độ từ trường quay có bằng tốc độ rotor hay không; loại không đồng bộ một, hai, ba pha cấu tạo ít phức tạp, vận hành đơn giản nên dùng rộng rãi. Động cơ một chiều phức tạp, dễ sự cố hơn, nhưng mô-men khởi động tốt và chỉnh tốc độ liên tục nên hay dùng trong thiết bị tự động, gồm 5 loại: nam châm vĩnh cửu, kích từ độc lập, song song, nối tiếp, hỗn hợp.',['AC: đồng bộ / không đồng bộ (1, 2, 3 pha)', 'DC: 5 loại; mô-men khởi động tốt, chỉnh tốc độ rộng', 'DC nam châm vĩnh cửu: mạch chuyển điện tử, không tia lửa']);
T('Tốc độ động cơ đo bằng vòng trên phút. Dùng hộp số truyền động thì công suất tăng nhưng tốc độ giảm. Động cơ tiêu thụ dòng cao, có thể làm hỏng linh kiện của nguồn, nên mạch điều khiển phải chịu dòng lớn, nhiệt cao và có tản nhiệt.',['Tốc độ: vòng/phút', 'Hộp số: công suất ↑, tốc độ ↓', 'Mạch điều khiển: chịu dòng lớn + tản nhiệt']);
ch('Diode');
T('Chất bán dẫn như silic, germani dẫn điện kém. Pha bo hoặc gali thành bán dẫn P, pha phốt pho hoặc a-xen thành bán dẫn N. Ghép P với N tạo lớp tiếp giáp, có vùng nghèo với điện áp tiếp xúc V gamma.',['Bán dẫn P: pha B, Ga (mang +)','Bán dẫn N: pha P, As (mang −)','Ghép P–N → vùng nghèo, Vγ']);
T('Diode cho dòng đi từ A sang K khi phân cực thuận, cực A nối dương. V gamma của germani 0,3 vôn, silic 0,7 vôn. Phân cực ngược chỉ có dòng rò rất nhỏ; vượt điện áp V BR thì bị đánh thủng.',['Thuận: A(+) → K(−), Vγ: Ge 0,3 V · Si 0,7 V','Ngược: chỉ có dòng rò (~30 µA)','V_AK < V_BR: đánh thủng']);
T('Cầu chỉnh lưu là 4 diode, đổi AC thành DC. Khi thêm tụ lọc, điện áp DC trung bình bằng U m nhân 8fRC chia 8fRC cộng 1, khớp với công thức chương 5. Họ 1N400X khác nhau chủ yếu ở điện áp ngược đỉnh, từ 200 vôn của 1N4003 đến 1200 vôn của 1N4008, dòng thuận 1 ampe.',['Cầu = 4 diode','U_DC = Um·8fRC/(8fRC+1)','1N4003…1N4008: VRRM 200…1200 V, IF = 1 A']);
T('Diode Schottky có mối nối bán dẫn N với kim loại, nên không có V gamma kiểu P-N. Điện áp rơi thuận khoảng 0,6 vôn, thấp hơn diode thường, đóng mở nhanh, dùng ở trên 1 mê-ga héc. Nhược điểm: dòng ngược tương đối lớn, điện áp ngược thấp.',['Schottky: rơi thuận ~0,6 V, kích dẫn ~0,2 V','Nhanh > 1 MHz','Nhược: dòng ngược lớn, áp ngược thấp']);
T(`Diode Zener có nồng độ pha tạp cao hơn. Thuận thì như diode thường. Ngược thì chặn đến điện áp V Z rồi cho dòng chạy K sang A mà giữ áp bằng V Z, không phá lớp tiếp giáp. Dùng ổn áp: V tải bằng V Z dù nguồn E thay đổi. Ví dụ 1N4758A, 56 vôn, 1 oát: dòng tối đa bằng 1 chia 56, khoảng ${n(1000/56,1)} mi-li ampe.`,['Ngược: V_KA = V_Z (cố định)','V_L = V_Z khi E thay đổi','P_Zmax = I_Zmax·V_Z','1N4758A: 1 W/56 V → I_Zmax ≈ '+n(1000/56,1)+' mA']);

T('Bổ sung về diode. Diode chỉnh lưu làm việc ở tần số dưới 1 mê-ga héc. Thông số quan trọng gồm dòng thuận tối đa, điện áp đánh thủng, tức điện áp ngược đỉnh tối đa, độ sụt áp, dải nhiệt độ làm việc, tra từ datasheet. Diode Schottky dòng 1N5817, 18, 19 có điện áp ngược 20, 30, 40 vôn, rơi thuận 0,45, 0,55, 0,6 vôn.',['Chỉnh lưu: f < 1 MHz', 'Thông số: I thuận max, V đánh thủng, độ sụt áp, nhiệt độ', '1N5817/18/19: VRRM 20/30/40 V · VF 0,45/0,55/0,6 V']);
ch('BJT, SCR, TRIAC');
T('BJT gồm 3 lớp bán dẫn tạo hai tiếp giáp P-N, có hai loại NPN và PNP. Cực E pha tạp nhiều nhất, B mỏng và pha tạp ít nhất, C trung bình. Dòng cực B điều khiển điện trở giữa C và E.',['NPN · PNP','E: pha tạp nhiều nhất','B: ít nhất · C: trung bình']);
T('Transistor có 3 vùng. Vùng khóa: C-E điện trở rất lớn, như công tắc hở. Vùng bão hòa: C-E rất nhỏ, như công tắc đóng. Vùng khuếch đại: điện trở trung bình, thay đổi tuyến tính theo dòng B. Thông số: độ lợi dòng beta, I C max, V CE max; V CE bão hòa của silic là 0,2 vôn.',['Khóa = OFF · Bão hòa = ON · Khuếch đại','β (h_fe), IC max, VCE max','VCEsat: Si 0,2 V · Ge 0,1 V']);
T('SCR, hay thyristor, có 4 lớp bán dẫn, kích bằng xung dương vào cực G. Khi đã dẫn thì giữ dẫn cho đến khi V AK nhỏ hơn hoặc bằng V gamma. Nếu I G bằng 0, phải có V AK lớn hơn V BO thì SCR mới dẫn. Mạch bật tắt đèn: nhấn ON cấp xung cho G, đèn sáng và giữ sáng; nhấn OFF nối tắt A với K, V AK bằng 0, SCR ngưng dẫn.',['SCR: kích G bằng xung dương','Duy trì dẫn đến khi V_AK ≤ Vγ','I_G=0: cần V_AK > V_BO','ON → sáng, giữ · OFF nối tắt A-K → tắt']);
T('TRIAC như hai SCR mắc song song ngược chiều, dẫn hai hướng nhờ cực G. Khi dùng với đèn AC, ở bán kỳ âm chỉ mạch TRIAC mới có sóng điện áp, còn SCR bằng 0. DIAC dẫn hai hướng khi chênh lệch vượt V BO, trong khoảng 7 đến 140 vôn, và giống TRIAC không dùng cực cổng.',['TRIAC = 2 SCR song song ngược','Bán kỳ âm: TRIAC có sóng, SCR = 0','DIAC: V_BO 7–140 V, không có cực G']);

T('Bổ sung về BJT. Nhược điểm: không chịu được điện áp cao hoặc nhiệt độ cao, và tiêu thụ năng lượng cao hơn transistor FET. Điện áp B-E bão hòa khoảng 0,8 đến 1 vôn. Thứ tự chân tra trong datasheet; transistor công suất thấp thường có chân E, C, B từ trái sang phải.',['Nhược: không chịu áp/nhiệt cao, tốn năng lượng hơn FET', 'VBEsat ≈ 0,8–1 V', 'Chân E, C, B: xem datasheet']);
ch('Quang điện tử');
T('LED là diode phát quang, phân cực thuận thì điện tử lấp đầy lỗ trống và bức xạ ánh sáng. LED 5 mi-li-mét đỏ, vàng làm việc ở 1,8 đến 2 vôn; trắng, lục, lam ở 2,8 đến 3,2 vôn; dòng 10 đến 20 mi-li ampe.',['Đỏ, vàng: 1,8–2 V','Trắng, lục, lam: 2,8–3,2 V','Dòng: 10–20 mA']);
{const R=(5-2.8)/0.01;
T(`Hạn dòng cho LED lam từ pin 5 vôn. Theo định luật K2: R bằng E trừ V LED, chia I. Lấy V LED 2,8 vôn, I 10 mi-li ampe, tức 0,01 ampe: R bằng ${n(R,0)} ôm, đúng giá trị chuẩn 220. Lưu ý: sách lấy V LED bằng 3 và ghi 0,001, nên viết 200 ôm; con số 0,001 là chép nhầm, vì 10 mi-li ampe là 0,01 ampe.`,['R = (E − V_LED)/I','R = (5 − 2,8)/0,01 = '+n(R,0)+' Ω → chọn 220 Ω','(Sách: (5−3)/0,01 = 200 Ω; “0,001” là nhầm)']);}
T('LED 7 đoạn gồm 8 LED đơn: 7 vạch và 1 dấu chấm, chung chân A là anode chung, chung chân K là cathode chung. Các chân còn lại nối điện trở thanh. Dùng IC 7447 giải mã BCD cho anode chung, 4511 cho cathode chung.',['8 LED: a, b, c, d, e, f, g, h','Anode chung ↔ IC 7447','Cathode chung ↔ IC 4511']);
T('Diode quang đổi ánh sáng thành dòng điện. LED thu hồng ngoại ở chế độ phân cực ngược, nội trở vài trăm ki-lô ôm, khi nhận hồng ngoại giảm còn vài chục ôm. Ở ví dụ, chưa nhấn nút P thì v o1 xấp xỉ 0, v o2 xấp xỉ 5 vôn; nhấn P thì đảo lại.',['Diode quang: ánh sáng → dòng','Có IR: nội trở vài trăm kΩ → vài chục Ω','Chưa nhấn P: vo1≈0, vo2≈5 V · Nhấn P: vo1≈5 V, vo2≈0']);

T('Transistor quang tương tự BJT nhưng không có cực B. Điện trở giữa cực C và E thay đổi theo cường độ ánh sáng chiếu vào thấu kính đặt ở vị trí cực B, giống như điện áp đặt vào cực B của BJT. Có hai loại NPN và PNP; một số loại ba chân gồm C, E và một chân tín hiệu, một số loại hai chân C và E.',['Photo-transistor: như BJT, không có cực B', 'R(C–E) đổi theo ánh sáng vào thấu kính', 'NPN · PNP', '3 chân (C, E, chân tín hiệu) hoặc 2 chân (C, E)']);
T('Mạch ứng dụng transistor quang hai chân như Hình 4.45, gồm mạch E chung và mạch C chung. Điện áp V out tỷ lệ với cường độ ánh sáng chiếu vào transistor, nên dùng làm mạch đo cường độ ánh sáng hoặc cảm biến ánh sáng.',['E chung: Vcc – R_C – V_out – transistor – GND', 'C chung: Vcc – transistor – V_out – R_E – GND', 'V_out tỷ lệ cường độ ánh sáng → đo / cảm biến ánh sáng']);
T('Bộ ghép quang, hay bộ cách ly quang, nối hai mạch điện: truyền tín hiệu từ mạch điều khiển sang mạch vận hành bằng ánh sáng, nhờ đó bảo vệ mạch điều khiển khỏi ảnh hưởng của mạch vận hành. Bên trong có LED phát quang ở chân A, K và transistor quang ở chân C, E; hình trong sách có các loại 4N35 và PC817.',['Opto-coupler = LED + transistor quang', 'Truyền tín hiệu bằng ánh sáng, cách ly hai mạch', 'Chân: A (1), K (2), C (4), E (3)']);
T('Hạn chế của bộ ghép quang là chỉ dùng được cho nguồn một chiều ở mạch vận hành phía tải. Muốn dùng nguồn xoay chiều thì dùng rơ-le bán dẫn thay cho bộ ghép quang. Rơ-le bán dẫn ở Hình 4.47 gồm bộ ghép quang, bộ phát hiện điểm không và so sánh, TRIAC và mạch snubber chống nhiễu xung cho TRIAC; điện áp điều khiển 3 đến 32 vôn DC.',['Bộ ghép quang: chỉ tải dùng nguồn DC', 'Nguồn AC → rơ-le bán dẫn', 'Cấu tạo: ghép quang + phát hiện điểm 0, so sánh + TRIAC + snubber', 'Điều khiển: 3–32 VDC']);
ch('Vi mạch');
T('Vi mạch IC đóng gói hàng chục nghìn phần tử, thông số ghi trong datasheet. IC ổn áp tốt hơn Zener. Họ 78XX ổn áp dương: 7805 ra 5 vôn, 7885 ra 8,5 vôn. Họ 79XX ổn áp âm: 7905 ra âm 5 vôn. LM317, LM337 chỉnh được điện áp ra dương và âm.',['78XX: +; 79XX: −','7805 = +5 V · 7905 = −5 V','LM317 (+) · LM337 (−), chỉnh được']);
{const R1=240,mx=1.25*(1+5000/R1),vr=(30/1.25-1)*R1;

T('Op-Amp có chân vào không đảo In cộng, vào đảo In trừ, nguồn V CC, V EE và ngõ ra. IC 741 một kênh, 4558 hai kênh, 8 chân. Dùng làm mạch khuếch đại đảo, không đảo, vi sai, cộng, so sánh, dao động, lọc, vi phân, tích phân. Chi tiết ở chương 7.',['Khuếch đại: đảo, không đảo, vi sai, cộng','So sánh · dao động · lọc','Vi phân · tích phân']);
{const R1=1e4,R2=1e4,C=1e-7,f=1/(0.69*(R1+R2)*C);

T('Bổ sung về IC 555. Có hai loại: 555 chế tạo theo công nghệ BJT, nguồn 4,5 đến 16 vôn, dòng ra 200 mi-li ampe; và 7555 theo công nghệ CMOS, nguồn 2 đến 18 vôn, dòng ra 100 mi-li ampe. Đóng gói DIP 8 chân, 14 chân hoặc dán SMD. Bên trong gồm 2 Op-Amp, một flip-flop SR, một transistor NPN, ba điện trở 5 ki-lô ôm và tầng ra. Chân: 1 GND, 2 Trigger, 3 Output, 4 Reset, 5 điều khiển, 6 Threshold, 7 Discharge, 8 Vcc.',['555 (BJT): 4,5–16 V, ra 200 mA', '7555 (CMOS): 2–18 V, ra 100 mA', 'Trong: 2 Op-Amp, flip-flop SR, 1 NPN, 3×5 kΩ, tầng ra', 'Chân: 1 GND · 2 Trig · 3 Out · 4 Rst · 5 Ctrl · 6 Thr · 7 Dis · 8 Vcc']);

function mth(t,svg){
 let s=String(t);
 if(!svg){const fr=(a,b)=>'\u0001'+a+'\u0002'+b+'\u0003';
  s=s.replace(/\b([UN][12])\/([UN][12])\b/g,(m,a,b)=>fr(a,b))
   .replace(/\(([^()]*?)\)\/(\d+,\d+|[A-Za-z]\w*)/g,(m,a,b)=>fr(a,b))
   .replace(/8fRC\/\(8fRC\+1\)/g,()=>fr('8fRC','8fRC+1'))
   .replace(/\b(VR[₂2]?)\/(R1|240)\b/g,(m,a,b)=>fr(a,b))
   .replace(/\b1\/\[([^\]]+)\]/g,(m,a)=>fr('1',a))
   .replace(/\b(t1)\/(T)\b/g,(m,a,b)=>fr(a,b))}
 s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const so=x=>'\u0004'+x+'\u0005',sp=x=>'\u0006'+x+'\u0007',dg=(x,m)=>[...x].map(c=>m.indexOf(c)).join('');
 s=s.replace(/\^(\([^)]*\)|[A-Za-z0-9]+)/g,(m,a)=>sp(a.replace(/^\(|\)$/g,'')))

\"><\/p><div id=\"bar\"><i><\/i><\/div><div id=\"ctl\"><button id=\"prev\">Tr\u01b0\u1edbc<\/button><button id=\"play\">Ph\u00e1t<\/button><button id=\"next\">Ti\u1ebfp<\/button><\/div><\/footer>\n<\/div>",run:function(document){

{c:0,side:'re',hk:[],s:'Chào bạn, mình làm bài tập 4.3 nhé. Đề hỏi ba ý: một, nguyên lý hoạt động của rơ-le điện từ; hai, rơ-le bán dẫn khác rơ-le điện từ ở điểm nào; ba, vì sao phải dùng rơ-le trong các mạch cơ điện tử. Mình trả lời lần lượt từng ý, dựa vào mục 4.2.2 trong giáo trình.',a:['Đề 4.3 gồm 3 ý: a, b, c','Nguồn: mục 4.2.2, trang 103 đến 105']},
{c:1,side:'re',hk:['1','2','co','nc','no'],v:{t:'relay',st:0,cap:'Cấu tạo rơ-le điện từ'},s:'Ý một: nguyên lý rơ-le điện từ. Trước hết là cấu tạo, theo Hình 4.16d. Rơ-le có cuộn dây, đóng vai trò như nam châm điện. Có thanh hút nối với đầu ra chung gọi là CO. Thanh hút này có thể dịch chuyển qua lại giữa hai tiếp điểm: NC là thường đóng, và NO là thường hở.',a:['Cuộn dây (1) = nam châm điện','Thanh hút (2) nối với đầu chung CO (3)','Hai tiếp điểm: NC (thường đóng), NO (thường hở)']},
{c:1,hk:['nc','co'],v:{t:'relay',st:0,cap:'Chưa cấp điện: CO chạm NC'},s:'Ở trạng thái bình thường, tức là chưa cấp điện, thanh hút được gắn với một lò xo. Lò xo giữ cho CO tiếp xúc với NC. Vì vậy mạch giữa CO và NC thông, còn giữa CO và NO hở.',a:['Chưa cấp điện: lò xo giữ CO chạm NC','Mạch CO–NC thông, CO–NO hở']},
{c:1,hk:['1','no','co'],v:{t:'relay',st:1,cap:'Cấp DC vào cuộn dây: CO chạm NO'},s:'Khi cấp điện một chiều DC cho cuộn dây, cuộn dây sinh ra từ trường như nam châm. Nam châm điện này kéo thanh hút, làm CO rời NC và tiếp xúc với NO. Lúc đó mạch CO với NO thông, còn CO với NC hở.',a:['Cấp DC cho cuộn dây → nam châm điện hút thanh','CO chạm NO: mạch CO–NO thông, CO–NC hở']},
{c:1,hk:['nc','co'],v:{t:'relay',st:0,cap:'Ngắt điện: lò xo kéo CO về NC'},s:'Khi ngắt điện, nam châm điện mất lực hút, lò xo kéo thanh hút về lại vị trí ban đầu, CO trở về NC. Đây là phần mình suy ra từ câu sách nói về trạng thái bình thường. Tóm lại, rơ-le đóng mở tiếp điểm nhờ điện áp một chiều, thay vì gạt công tắc hay nhấn nút bằng tay.',a:['Ngắt điện: lò xo kéo CO về NC (suy ra từ sách)',rs('Rơ-le = đóng/mở tiếp điểm bằng điện áp DC, không cần gạt tay')]},
{c:2,side:'bd',hk:['led','tr','t'],v:{t:'chain'},s:'Ý hai: rơ-le bán dẫn khác rơ-le điện từ thế nào. Rơ-le bán dẫn, Hình 4.17, gồm hai phần: một đi-ốt phát quang, gọi là LED, và một TRIAC quang. Điện áp DC ngõ vào làm LED phát sáng, TRIAC quang nhận ánh sáng đó để kích mở hai đầu T1 và T2.',a:['(1) LED phát quang: sáng khi có DC ngõ vào','(2) TRIAC quang: nhận ánh sáng, kích mở T1–T2']},
{c:2,hk:['led','tr'],v:{t:'chain'},s:'Hình 4.47 vẽ chi tiết hơn: điện áp điều khiển từ 3 đến 32 vôn DC, qua LED phát quang, bộ ghép quang, transistor quang, bộ phát hiện điểm không và so sánh, rồi tới TRIAC, kèm mạch snubber chống nhiễu xung. Điểm then chốt là bên điều khiển và bên tải chỉ nối với nhau bằng ánh sáng.',a:['Điều khiển 3–32 VDC → ghép quang → TRIAC','Hai bên nối với nhau bằng ánh sáng']},
{c:2,hk:[],v:{t:'cmp',n:3},s:'So sánh. Cách đóng mở: rơ-le điện từ dùng nam châm kéo thanh hút, rơ-le bán dẫn dùng ánh sáng. Về chuyển động cơ học: rơ-le điện từ có, rơ-le bán dẫn không có. Vì thế rơ-le bán dẫn không gây tiếng ồn khi đóng ngắt và không sinh tia lửa điện, như sách viết.',a:['Điện từ: có chuyển động cơ học','Bán dẫn: không chuyển động → không ồn, không tia lửa']},
{c:2,hk:[],v:{t:'cmp',n:6},s:'Hệ quả: theo sách, rơ-le bán dẫn có độ bền cao và thiết kế nhỏ gọn. Còn ngõ ra, rơ-le điện từ có ba đầu NO, NC, CO, rơ-le bán dẫn chỉ có hai đầu T1 và T2. Cột rơ-le điện từ ở hai hàng ồn, tia lửa và độ bền là mình suy ra bằng cách đối lập với sách.',a:[rs('Khác nhau chính: có hay không có chuyển động cơ học'),'Bán dẫn: bền, nhỏ gọn; ngõ ra T1, T2']},
{c:3,side:'ct',hk:['dc'],s:'Ý ba: vì sao dùng rơ-le trong mạch cơ điện tử. Sách không có một đoạn trả lời trực tiếp, nên mình trả lời từ hai nguồn. Từ sách: rơ-le cho phép đóng mở tiếp điểm bằng điện áp DC nhỏ, thông thường từ 3 đến 32 vôn, thay vì phải gạt hay nhấn bằng tay. Nhờ vậy mạch điều khiển có thể tự động đóng mở.',a:['Sách: đóng/mở bằng điện áp DC 3–32 V, không cần tay','→ mạch điều khiển tự động đóng/mở được']},
{c:3,hk:['out'],s:'Từ sách còn một ý nữa ở trang 106: động cơ thường tiêu thụ dòng điện cao và có thể làm hỏng linh kiện điện tử của nguồn. Từ đó suy ra lý do thứ hai, và đây là phần ngoài sách: dùng tín hiệu nhỏ của mạch điều khiển để đóng mở tiếp điểm chịu được dòng lớn của động cơ hay tải công suất, nên linh kiện điều khiển không phải gánh dòng lớn.',a:['Sách (tr.106): động cơ dòng cao dễ hại linh kiện nguồn','Ngoài sách: tín hiệu nhỏ điều khiển tải dòng lớn']},
{c:3,hk:['dc','out'],s:'Lý do thứ ba cũng ngoài sách: mạch điều khiển và mạch tải tách rời nhau về điện, đặc biệt rõ ở rơ-le bán dẫn vì chỉ nối bằng ánh sáng. Khi dùng, sách dặn chú ý điện áp và dòng DC ngõ vào, và điện áp, dòng mà tiếp điểm ngõ ra chịu được.',a:['Ngoài sách: tách biệt điện giữa điều khiển và tải','Khi chọn rơ-le: xem thông số ngõ vào và ngõ ra']},
{c:4,hk:[],s:'Tóm lại. Một: rơ-le điện từ có cuộn dây hút thanh hút, đưa CO từ NC sang NO khi cấp điện DC. Hai: rơ-le bán dẫn dùng LED và TRIAC quang, không có chuyển động cơ học nên không ồn, không tia lửa, bền và nhỏ gọn. Ba: rơ-le dùng tín hiệu DC nhỏ để đóng mở tải lớn một cách tự động. Vậy là xong bài tập 4.3.',a:['Điện từ: DC vào cuộn dây → CO chuyển NC → NO','Bán dẫn: LED + TRIAC quang, không cơ học','Dùng rơ-le: tín hiệu DC nhỏ điều khiển tải, tự động']}];

{c:0,hk:[],s:'Chào bạn, mình làm bài tập 4.4 nhé. Đề hỏi: phân biệt cấu tạo và nguyên lý hoạt động của diode thường, diode Schottky và diode Zener; rồi hỏi diode Zener có thay được diode thường không, và nếu được thì dùng khi nào. Mình chia làm ba phần: cấu tạo, nguyên lý, và chuyện thay thế. Nguồn là mục 4.3.1, 4.3.3 và 4.3.4.',a:['Đề 4.4: phân biệt 3 loại diode; Zener có thay diode thường được không?','Nguồn: mục 4.3.1, 4.3.3, 4.3.4 (trang 108 đến 112)']},
{c:1,hk:['n'],v:{t:'cau',k:1},s:'Phần cấu tạo. Diode thường được làm từ lớp tiếp giáp P-N: bán dẫn P và bán dẫn N đặt tiếp xúc nhau. Ở chỗ tiếp xúc hình thành vùng nghèo, có điện áp tiếp xúc gọi là V gamma. Với vật liệu germani là 0,3 vôn, với silic là 0,7 vôn.',a:['Diode thường: tiếp giáp P-N, có vùng nghèo','V_γ: Ge 0,3 V; Si 0,7 V']},
{c:1,hk:['s'],v:{t:'cau',k:2},s:'Diode Schottky, còn gọi là diode rào cản, có cấu tạo khác: đó là một mối nối nhỏ giữa chất bán dẫn N và kim loại. Vì không có lớp tiếp giáp P-N nên không tồn tại điện thế V gamma như diode thường.',a:['Schottky: mối nối bán dẫn N với kim loại','Không có lớp P-N nên không có V_γ của P-N']},
{c:1,hk:['z'],v:{t:'cau',k:3},s:'Diode Zener, còn gọi là diode ổn áp, về cấu tạo cũng giống diode chỉnh lưu, gồm lớp bán dẫn P và N ghép lại. Khác ở chỗ nồng độ pha tạp chất cao hơn.',a:['Zener: P-N như diode thường','Khác: nồng độ pha tạp chất cao hơn']},
{c:1,hk:['n','s','z'],v:{t:'cau',k:3},s:'Tóm lại về cấu tạo: diode thường và Zener đều là tiếp giáp P-N, chỉ khác mức pha tạp; còn Schottky là tiếp xúc giữa bán dẫn N và kim loại.',a:[rs('Thường, Zener: P-N (Zener pha tạp cao hơn)'),rs('Schottky: bán dẫn N + kim loại')]},
{c:2,hk:['n'],v:{t:'iv',m:'n'},s:'Phần nguyên lý. Diode thường: phân cực thuận, tức A nối cực dương, khi điện áp vượt V gamma thì dòng chạy từ A sang K. Phân cực ngược thì diode ngăn dòng, chỉ có dòng rò rất nhỏ khoảng 30 micrô-ampe. Nếu điện áp ngược quá ngưỡng đánh thủng thì lớp tiếp giáp bị phá hỏng.',a:['Thuận (V > V_γ): dòng chạy A→K','Ngược: chặn, dòng rò ≈ 30 µA','Quá ngưỡng đánh thủng: hỏng lớp tiếp giáp']},
{c:2,hk:['s'],v:{t:'iv',m:'s'},s:'Diode Schottky cũng dẫn theo chiều A sang K, nhưng kích dẫn chỉ khoảng 0,2 vôn và điện áp rơi thuận khoảng 0,6 vôn, trong khi diode thường là 0,7 và 1 vôn. Nó đóng mở rất nhanh nên dùng được ở tần số trên 1 mê-ga-héc. Nhược điểm: dòng ngược tương đối lớn và điện áp ngược thấp. Theo Bảng 4.7, 1N5817 đến 1N5819 chỉ chịu 20 đến 40 vôn, dòng ngược tới 1 mili-ampe.',a:['Kích dẫn ≈ 0,2 V; rơi thuận ≈ 0,6 V','Đóng mở nhanh: dùng > 1 MHz','Nhược: dòng ngược lớn (1 mA), áp ngược thấp (20 đến 40 V)']},
{c:2,hk:['z'],v:{t:'iv',m:'z'},s:'Diode Zener: phân cực thuận thì hoạt động như diode chỉnh lưu, vẫn dẫn từ A sang K. Phân cực ngược thì ngăn dòng cho đến khi đạt điện áp ngưỡng V Z không đổi. Sau đó Zener cho dòng chạy từ K sang A với điện áp V KA bằng V Z. Đây là đánh thủng tạm thời, không phá hủy lớp tiếp giáp.',a:['Thuận: như diode chỉnh lưu (A→K)','Ngược: chặn đến V_Z, sau đó dẫn K→A với V_KA = V_Z','Đánh thủng tạm thời, không hỏng']},
{c:2,hk:['n','s','z'],v:{t:'cmp',n:4},s:'Bảng so sánh. Vì giữ được điện áp ổn định khi phân cực ngược, Zener được dùng để ổn áp DC và bảo vệ quá áp. Ở mạch Hình 4.29, Zener mắc song song với tải, nên điện áp trên tải bằng V Z dù nguồn E thay đổi trong một phạm vi nhất định.',a:[rs('Khác nhau cốt lõi: cách ứng xử khi phân cực ngược'),'Zener ổn áp: V_L = V_Z dù nguồn E thay đổi']},
{c:3,hk:['z'],s:'Phần cuối: Zener có thay diode thường được không? Sách nói khi phân cực thuận, Zener hoạt động như diode chỉnh lưu, vẫn cho dòng từ A sang K. Vậy về nguyên tắc, ở chiều thuận thì có thể thay.',a:['Sách: Zener phân cực thuận hoạt động như diode chỉnh lưu']},
{c:3,hk:['z'],s:'Điều kiện thay được là phần mình suy ra, không phải sách viết thẳng: điện áp ngược đặt lên diode phải luôn nhỏ hơn V Z, và dòng, công suất không vượt giới hạn của Zener. Ví dụ mạch điện áp thấp chỉ cần chặn dòng ngược, hoặc dùng Zener 12 vôn trong mạch nguồn 5 vôn. Khi đó Zener không bao giờ bị đánh thủng nên chỉ làm việc như diode thường.',a:['Được khi: điện áp ngược luôn < V_Z (suy ra)','Và dòng, công suất trong giới hạn Zener']},
{c:3,hk:['n','z'],s:'Không thay được khi chỉnh lưu nguồn xoay chiều có biên độ lớn hơn V Z. Ở nửa chu kỳ ngược, điện áp vượt V Z thì Zener dẫn ngược, mất tác dụng chỉnh lưu. Chiều ngược lại cũng không được: diode thường không thể ổn áp, vì bị đánh thủng là hỏng lớp tiếp giáp, theo trang 109.',a:[rs('Không thay: chỉnh lưu AC có biên độ > V_Z (suy ra)'),'Diode thường không thay Zener ổn áp được: đánh thủng là hỏng']},
{c:4,hk:[],s:'Tóm lại. Cấu tạo: diode thường và Zener là tiếp giáp P-N, Zener pha tạp cao hơn; Schottky là bán dẫn N với kim loại. Nguyên lý: diode thường chặn ngược và hỏng nếu bị đánh thủng; Schottky đóng mở nhanh, kích dẫn thấp nhưng chịu áp ngược kém; Zener dẫn ngược ở V Z để ổn áp. Zener thay được diode thường khi điện áp ngược luôn nhỏ hơn V Z. Vậy là xong bài tập 4.4.',a:['Cấu tạo: P-N | N + kim loại | P-N pha tạp cao','Nguyên lý: chặn ngược | nhanh, kích dẫn thấp | ổn áp ở V_Z','Zener thay diode thường: được nếu áp ngược < V_Z']}];
const CH=['Mở đầu','Cấu tạo','Nguyên lý','Zener thay thế','Tổng kết'],TT=['Đề bài','Phân biệt về cấu tạo','Phân biệt về nguyên lý hoạt động','Zener có thay diode thường được không?','Tổng kết bài 4.4'];
function cau(v){const R=[['Diode thường','P','N',1],['Schottky','kim loại','N',0],['Zener','P⁺','N⁺',1]];
 return `<svg viewBox="0 0 400 230" role="img" aria-label="Cấu tạo ba loại diode">`+R.slice(0,v.k).map((r,i)=>{const y=10+i*76;return `<rect class="rl" x="20" y="${y}" width="100" height="50"/><rect class="rl" x="120" y="${y}" width="100" height="50" style="fill:var(--line)"/><text x="${r[1].length>2?44:64}" y="${y+30}">${r[1]}</text><text x="164" y="${y+30}">${r[2]}</text>${r[3]?`<rect x="110" y="${y}" width="20" height="50" style="fill:var(--hl);opacity:.8"/>`:''}<text x="232" y="${y+22}">${r[0]}</text><text x="232" y="${y+40}">${i==0?'có vùng nghèo':i==1?'không có lớp P-N':'pha tạp cao hơn'}</text>`}).join('')+`</svg>`}
function iv(v){const m=v.m,f=m=='s'?'M200 120H225Q232 118 240 20':'M200 120H265Q275 118 285 20',
 r=m=='n'?'M200 120H80':m=='s'?'M200 120Q170 128 120 160':'M200 120H110Q96 122 92 220',
 t=m=='n'?['V_γ = 0,7 V',255,138,'dòng rò nhỏ',90,110,'đánh thủng: hỏng',30,150]:m=='s'?['≈ 0,2 V',212,138,'dòng ngược lớn',90,176,'áp ngược thấp',90,194]:['V_γ = 0,7 V',255,138,'−V_Z',60,214,'dẫn K→A, không hỏng',110,200];

function viz(v){return !v?'':v.t=='cau'?cau(v):v.t=='iv'?iv(v):cmp(v)}
let si=0,playing=false,gen=0,tm;

 $('side').innerHTML=`<h3>${SIDE.t}</h3><table><tr>${SIDE.h.map(x=>`<th>${x}</th>`).join('')}</tr>${SIDE.r.map(r=>`<tr class="${hk.includes(r[0])?'h':''}"><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`;
 let L=[],k=0;

 $('lines').innerHTML=L.map((x,j)=>`<div class="${j>=L.length-k?'new':''}">${x}</div>`).join('');

 document.querySelector('#bar i').style.width=((si+1)/S.length*100)+'%';

}
function speak(){
 clearTimeout(tm);const g=++gen,txt=S[si].s;let done=false;
 const fin=()=>{if(done||g!==gen||!playing)return;done=true;clearTimeout(tm);tm=setTimeout(()=>{if(g===gen&&playing)step(1)},800)};
 const ss=window.speechSynthesis;let v=null;
 try{ss.cancel();v=ss.getVoices().find(x=>/^vi/i.test(x.lang))}catch(e){}

 const u=new SpeechSynthesisUtterance(txt);u.voice=v;u.lang='vi-VN';u.rate=.95;u.onend=fin;u.onerror=fin;
 ss.speak(u);tm=setTimeout(fin,txt.length*220+4000);
}
function step(d){
 if(d>0){if(si<S.length-1)si++;else{const w=playing;pause();window.__exDone&&window.__exDone(w);return}}else if(si>0)si--;
 render();if(playing)speak();
}
function pause(){playing=false;gen++;clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}render()}
$('play').onclick=()=>{if(playing)pause();else{if(si==S.length-1)si=0;playing=true;render();speak()}};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);

}},{css:"\n:host{--bg:#f4f7fb;--grid:#dce5f1;--ink:#1c2b45;--mute:#5b6b85;--hl:#ffe36b;--f1:#2a5bd7;--c2:#e07b00;--c3:#2e9e4f;--card:#fff;--line:#c9d5e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:host:not([data-theme=\"light\"]){--bg:#101826;--grid:#1a2538;--ink:#e6edf8;--mute:#9aa9c2;--hl:#6b5a00;--f1:#7ea2ff;--c2:#ffa94d;--c3:#5fd07f;--card:#172236;--line:#2b3b57}}\n:host[data-theme=\"dark\"]{--bg:#101826;--grid:#1a2538;--ink:#e6edf8;--mute:#9aa9c2;--hl:#6b5a00;--f1:#7ea2ff;--c2:#ffa94d;--c3:#5fd07f;--card:#172236;--line:#2b3b57}\n\n.w{margin:0;min-height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;display:flex;flex-direction:column}\n#tabs{display:flex;gap:6px;padding:12px;overflow-x:auto}\n#tabs button{font:600 .85rem inherit;font-family:inherit;white-space:nowrap;padding:8px 12px;border:1.5px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;cursor:pointer}\n#tabs button.on{border-color:var(--ink);color:var(--ink);background:var(--hl)}\n#stage{flex:1;display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;padding:4px 12px 12px;align-items:start}\n@media(max-width:760px){#stage{grid-template-columns:1fr}}\n#side{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:8px 10px}\n#side h3{margin:0 0 6px;font-size:.9rem}\n#side table{border-collapse:collapse;width:100%;font-size:.88rem}\n#side th,#side td{padding:4px 6px;border-top:1px solid var(--line);text-align:left}\n#side th{color:var(--mute);font-weight:600}\n#side tr.h td{background:var(--hl);font-weight:700}\n#board{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:14px 18px;min-height:200px}\n#ttl{margin:0 0 10px;font-size:1.05rem}\n#lines div{font:1.15rem/1.8 Georgia,'Times New Roman',serif;overflow-wrap:anywhere;padding:0 4px}\n#lines .new{animation:fl .8s}\n@keyframes fl{from{background:var(--hl)}to{background:transparent}}\n@media(prefers-reduced-motion:reduce){#lines .new{animation:none}}\n.res{display:inline-block;border-bottom:3px solid var(--hl)}\n#viz{margin-top:10px;color:var(--ink)}#viz svg{width:100%;max-width:460px;height:auto}\n#viz text{fill:currentColor;font:600 12px 'Be Vietnam Pro',system-ui,sans-serif}\n.rl{stroke:currentColor;fill:none;stroke-width:2}\n.cap{margin-top:6px;font-size:.88rem;color:var(--mute)}\nfooter{position:sticky;bottom:0;background:var(--card);border-top:1.5px solid var(--ink);padding:10px 14px}\n#sub{margin:0 0 8px;font-size:1.05rem;line-height:1.5;min-height:4.5em;max-width:70ch}\n#bar{height:5px;background:var(--line);margin-bottom:10px}#bar i{display:block;height:100%;width:0;background:var(--f1)}\n#ctl{display:flex;gap:8px}\n#ctl button{font:600 .95rem inherit;font-family:inherit;padding:9px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}\n#ctl #play{background:var(--ink);color:var(--card);min-width:110px}\nbutton:focus-visible{outline:3px solid var(--f1);outline-offset:2px}\n.gw{overflow-x:auto}.g{border-collapse:collapse;font-size:.84rem;width:100%}.g th,.g td{border:1px solid var(--line);padding:4px 8px;text-align:left}\n.g th{background:var(--bg);color:var(--mute)}.g tr.h td{background:var(--hl)}\n:host{display:block}.w{min-height:60vh}",html:"<div class=\"w\">\n<nav id=\"tabs\"><\/nav>\n<section id=\"stage\"><div id=\"side\"><\/div><div id=\"board\"><h2 id=\"ttl\"><\/h2><div id=\"lines\"><\/div><div id=\"viz\"><\/div><\/div><\/section>\n<footer><p id=\"sub\"><\/p><div id=\"bar\"><i><\/i><\/div><div id=\"ctl\"><button id=\"prev\">Tr\u01b0\u1edbc<\/button><button id=\"play\">Ph\u00e1t<\/button><button id=\"next\">Ti\u1ebfp<\/button><\/div><\/footer>\n<\/div>",run:function(document){
const rs=h=>`<b class="res">${h}</b>`;
const n=(x,d=2)=>String(Number(x.toFixed(d))).replace('.',',');
// ---- số liệu (một nguồn duy nhất) ----
const Q={Vcc:5,Vled:2,Vce:.2,Vbe:.8,Ic:.01,beta:100,Ib:.001};
Q.RCc=(Q.Vcc-Q.Vled-Q.Vce)/Q.Ic;Q.RC=270;Q.IcR=(Q.Vcc-Q.Vled-Q.Vce)/Q.RC;
Q.RBc=(Q.Vcc-Q.Vbe)/Q.Ib;Q.RB=4300;Q.IbR=(Q.Vcc-Q.Vbe)/Q.RB;Q.Ibmin=Q.IcR/Q.beta;Q.k=Q.IbR/Q.Ibmin;
const D={Vm:220*Math.SQRT2,f:50,C:1e-7,Vbo:32};
const dim=R=>{const x=2*Math.PI*D.f*R*D.C,pk=D.Vm/Math.sqrt(1+x*x);if(pk<D.Vbo)return null;return (Math.atan(x)+Math.asin(D.Vbo/pk))*180/Math.PI};
const DR=[20e3,100e3,200e3,400e3];
const SIDE={t:'Bốn linh kiện (trang 113 đến 118)',h:['Loại','Đặc điểm'],r:[['b','BJT','3 chân E, B, C; 2 lớp tiếp giáp P-N'],['s','SCR','4 lớp bán dẫn; chân A, K, G'],['t','TRIAC','như 2 SCR song song ngược; T1, T2, G'],['d','DIAC','2 chân A1, A2; V_BO từ 7 đến 140 V']]};
const S=[
{c:0,hk:[],s:'Chào bạn, mình làm bài tập 4.5 nhé. Đề yêu cầu trình bày cấu tạo và nguyên lý hoạt động của bốn linh kiện: BJT, SCR, TRIAC và DIAC. Mỗi linh kiện còn phải tìm một mạch ứng dụng và giải thích mạch đó. Mình làm lần lượt từng linh kiện, mỗi cái ba việc: cấu tạo, nguyên lý, mạch ứng dụng.',a:['Đề 4.5: cấu tạo + nguyên lý của BJT, SCR, TRIAC, DIAC','Mỗi linh kiện: 1 mạch ứng dụng + giải thích','Nguồn: mục 4.3.5 đến 4.3.8 (trang 113 đến 118)']},
{c:1,hk:['b'],v:{t:'bjt',k:1},s:'BJT là transistor lưỡng cực. Về cấu tạo, nó gồm ba lớp bán dẫn P và N xếp xen kẽ nhau, nên có hai lớp tiếp giáp P-N. Có hai loại: NPN và PNP. Ba chân là Emitter, Base và Collector, viết tắt E, B, C.',a:['BJT = 3 lớp bán dẫn xen kẽ → 2 tiếp giáp P-N','Loại: NPN, PNP; chân E, B, C']},
{c:1,hk:['b'],v:{t:'bjt',k:2},s:'Ba lớp có nồng độ pha tạp khác nhau. Emitter pha tạp nhiều nhất, Base ở giữa pha tạp ít nhất, Collector pha tạp trung bình. Vì Emitter pha tạp cao hơn Collector, nên điện trở giữa B và C lớn hơn điện trở giữa B và E.',a:['Pha tạp: E nhiều nhất > C trung bình > B ít nhất','R giữa B và C > R giữa B và E']},
{c:1,hk:['b'],s:'Nguyên lý: độ dẫn điện giữa C và E phụ thuộc vào dòng điện đi qua cực B. Nếu dòng I B bằng 0 thì điện trở giữa C và E rất lớn. Khi I B đạt đến một giá trị nhất định thì điện trở giữa C và E trở nên rất nhỏ. Điện trở thay đổi tuyến tính theo I B nên BJT dùng để khuếch đại tín hiệu tương tự.',a:['I_B = 0 → R_CE rất lớn','I_B đủ lớn → R_CE rất nhỏ','R_CE đổi tuyến tính theo I_B → khuếch đại']},
{c:1,hk:['b'],v:{t:'tb',n:3,h:['Vùng làm việc','Điện trở C-E','Tương đương'],r:[['Vùng khóa','rất lớn','công tắc hở (OFF)'],['Vùng dẫn bão hòa','rất nhỏ','công tắc đóng (ON)'],['Vùng khuếch đại','trung bình','khuếch đại tín hiệu']]},s:'Từ đó transistor có ba vùng làm việc. Vùng khóa: điện trở C-E rất lớn, như công tắc hở. Vùng dẫn bão hòa: điện trở rất nhỏ, như công tắc đóng. Vùng khuếch đại: điện trở trung bình. Mạch ứng dụng dưới đây dùng BJT làm công tắc, tức là hai vùng đầu.',a:['3 vùng: khóa · bão hòa · khuếch đại']},
{c:1,hk:['b'],v:{t:'ckb',k:0},s:`Mạch ứng dụng: dùng BJT NPN bật tắt một đèn LED. Mạch này ngoài sách, mình tự thiết kế theo các số liệu sách cho. Nguồn 5 vôn, LED đỏ áp 2 vôn, dòng 10 mili-ampe theo Bảng 4.8, điện áp C-E bão hòa 0,2 vôn. Điện trở R C bằng 5 trừ 2 trừ 0,2, chia 0,01, ra ${n(Q.RCc,0)} ôm, chọn chuẩn ${Q.RC} ôm.`,a:['Mạch ứng dụng (ngoài sách): BJT làm công tắc bật LED',`R_C = (5 − 2 − 0,2)/0,01 = ${n(Q.RCc,0)} Ω → chọn ${Q.RC} Ω`,`Dòng thực I_C = 2,8/${Q.RC} ≈ ${n(Q.IcR*1000)} mA`]},
{c:1,hk:['b'],v:{t:'ckb',k:0},s:`Tiếp theo là điện trở cực B. Điện áp B-E bão hòa lấy 0,8 vôn, theo sách. Chọn dòng I B khoảng 1 mili-ampe. R B bằng 5 trừ 0,8, chia 0,001, ra ${n(Q.RBc,0)} ôm, chọn chuẩn 4,3 kilôôm. Dòng I B thực tế là ${n(Q.IbR*1000)} mili-ampe. Giả sử độ lợi dòng bằng 100, mình tự giả định, thì chỉ cần I B khoảng ${n(Q.Ibmin*1000)} mili-ampe là đủ, nên transistor chắc chắn bão hòa.`,a:[`R_B = (5 − 0,8)/0,001 = ${n(Q.RBc,0)} Ω → chọn 4,3 kΩ`,`I_B thực = 4,2/4300 ≈ ${n(Q.IbR*1000)} mA`,`Giả định β = 100: cần I_B ≥ ${n(Q.Ibmin*1000)} mA (gấp ${n(Q.k,1)} lần mức cần)`]},
{c:1,hk:['b'],v:{t:'ckb',k:1},s:'Khi đầu vào bằng 0 vôn, dòng I B bằng 0, BJT nằm ở vùng khóa. Điện trở C-E rất lớn, không có dòng qua LED, đèn tắt.',a:['Vào 0 V → I_B = 0 → vùng khóa → LED tắt']},
{c:1,hk:['b'],v:{t:'ckb',k:2},s:'Khi đầu vào lên 5 vôn, dòng I B chạy vào cực B, BJT bão hòa. Điện trở C-E rất nhỏ, dòng I C chạy qua LED, đèn sáng. Vậy một dòng nhỏ ở cực B đã điều khiển được dòng lớn hơn nhiều ở cực C.',a:[rs('Vào 5 V → I_B ≈ 0,98 mA → bão hòa → LED sáng'),'Dòng nhỏ ở B điều khiển dòng lớn ở C']},
{c:2,hk:['s'],v:{t:'scr',k:1},s:'Sang SCR, còn gọi là thyristor. Về cấu tạo, SCR gồm bốn lớp bán dẫn P, N, P, N xếp xen kẽ. Có ba chân: Anode A ở lớp ngoài P, Cathode K ở lớp ngoài N, và cổng G nối vào lớp P bên trong.',a:['SCR = 4 lớp bán dẫn P-N-P-N','3 chân: A, K, G']},
{c:2,hk:['s'],v:{t:'scr',k:2},s:'Bốn lớp này tương đương một transistor PNP và một transistor NPN mắc với nhau, như Hình 4.31b. Nhờ vậy khi đã mở, hai transistor giữ nhau ở trạng thái dẫn.',a:['SCR tương đương PNP + NPN mắc liên kết']},
{c:2,hk:['s'],s:'Nguyên lý: SCR hoạt động như diode phân cực thuận, nhưng được điều khiển bằng dòng cổng I G, dùng xung kích dương. Khi đã kích, dòng chạy từ A sang K và SCR giữ trạng thái dẫn, kể cả khi hết xung, cho đến khi điện áp V AK nhỏ hơn hoặc bằng 0,7 vôn với silic. Nếu không dùng cổng, V AK phải vượt V BO, lớn hơn nhiều 0,7 vôn, SCR mới mở.',a:['Xung dương vào G → dẫn A→K','Hết xung vẫn dẫn, đến khi V_AK ≤ 0,7 V (Si)','I_G = 0: cần V_AK > V_BO ≫ 0,7 V mới mở']},
{c:2,hk:['s'],v:{t:'cks',k:0},s:'Mạch ứng dụng trong sách, Hình 4.33: bật tắt đèn bằng hai nút nhấn thường hở. Nguồn 12 vôn. Nút ON nối qua R 2 bằng 470 ôm và R 1 bằng 1 kilôôm, hai điện trở này tạo cầu phân áp đưa xung dương vào cổng G. Nút OFF mắc song song với hai cực A và K.',a:['Mạch Hình 4.33 (sách): 12 V, ON, OFF, R2 = 470 Ω, R1 = 1 kΩ']},
{c:2,hk:['s'],v:{t:'cks',k:1},s:'Nhấn nút ON: cầu phân áp R 2, R 1 tạo xung kích dương cho cổng G. SCR cho dòng chạy từ A sang K, đèn sáng.',a:['Nhấn ON → xung dương vào G → SCR dẫn → đèn sáng']},
{c:2,hk:['s'],v:{t:'cks',k:2},s:'Nhả nút ON, xung kích biến mất, nhưng SCR vẫn tiếp tục dẫn nên đèn vẫn sáng. Đây là điểm đặc biệt: SCR tự duy trì trạng thái dẫn.',a:['Nhả ON → đèn vẫn sáng (SCR tự giữ)']},
{c:2,hk:['s'],v:{t:'cks',k:3},s:'Nhấn nút OFF: hai cực A và K bị nối tắt, V AK bằng 0, nhỏ hơn 0,7 vôn, nên SCR ngưng dẫn. Lúc đang giữ nút OFF, đèn vẫn còn dòng chạy qua chính nút OFF.',a:['Nhấn OFF → V_AK = 0 < 0,7 V → SCR ngưng dẫn']},
{c:2,hk:['s'],v:{t:'cks',k:4},s:'Nhả nút OFF, SCR đã ngưng dẫn và không có xung kích, nên đèn tắt, như sách mô tả. Muốn sáng lại thì nhấn ON lần nữa.',a:[rs('Nhả OFF → đèn tắt; muốn sáng lại: nhấn ON')]},
{c:3,hk:['t'],v:{t:'tri'},s:'TRIAC hoạt động như SCR nhưng cho dòng chạy theo cả hai hướng. Về cấu tạo, có thể xem TRIAC như hai SCR đấu song song ngược chiều nhau, điều khiển bằng chung một cổng G. Ba chân là T 1, T 2 và G.',a:['TRIAC = 2 SCR song song ngược chiều','3 chân: T1, T2, G']},
{c:3,hk:['t'],s:'Nguyên lý: khi V T1 lớn hơn V T2, kích xung âm vào cổng G thì dòng chạy từ T 1 sang T 2. Khi V T2 lớn hơn V T1, kích xung dương vào G thì dòng chạy từ T 2 sang T 1. Nếu không kích, hiệu điện áp giữa T 1 và T 2 phải lớn hơn V BO thì TRIAC mới dẫn.',a:['V_T1 > V_T2, xung âm vào G: T1 → T2','V_T2 > V_T1, xung dương vào G: T2 → T1','I_G = 0: cần |V_T1T2| > V_BO']},
{c:3,hk:['t'],v:{t:'wave',m:'scr'},s:'Mạch ứng dụng trong sách, Hình 4.36: nguồn xoay chiều, bóng đèn và linh kiện mắc nối tiếp. Nguồn có biên độ lớn hơn V BO nên tự kích mở mà không cần cổng. Với SCR, đèn chỉ có điện áp ở bán kỳ dương, bán kỳ âm bằng không.',a:['Hình 4.36a: nguồn AC + đèn + SCR','Chỉ bán kỳ dương có điện áp trên đèn']},
{c:3,hk:['t'],v:{t:'wave',m:'tri'},s:'Thay SCR bằng TRIAC thì cả hai bán kỳ đều có điện áp trên đèn, vì TRIAC dẫn theo hai hướng. Đó là lý do TRIAC dùng để điều khiển tải xoay chiều.',a:[rs('TRIAC: có điện áp ở cả hai bán kỳ'),'Dùng điều khiển tải xoay chiều']},
{c:4,hk:['d'],v:{t:'dc'},s:'Cuối cùng là DIAC. Theo sách, DIAC có hai chân A 1 và A 2, không có cực cổng. Nó đối xứng, giống TRIAC bỏ cực cổng, chỉ khác ở giá trị điện áp ngưỡng V BO, nằm trong khoảng từ 7 đến 140 vôn.',a:['DIAC: 2 chân A1, A2, không có cổng','Giống TRIAC khi bỏ cổng; V_BO từ 7 đến 140 V']},
{c:4,hk:['d'],v:{t:'dc'},s:'Nguyên lý: khi chênh lệch điện áp giữa hai cực chưa vượt V BO, DIAC không dẫn. Khi vượt V BO, theo chiều nào cũng vậy, DIAC cho dòng đi qua, và giữ trạng thái dẫn ngay cả khi điện áp giảm xuống thấp hơn V BO.',a:['|V| < V_BO: không dẫn','|V| > V_BO: dẫn cả 2 hướng, rồi giữ trạng thái dẫn']},
{c:4,hk:['d'],v:{t:'ckd'},s:'Mạch ứng dụng: điều chỉnh độ sáng đèn. Mạch này ngoài sách, là mạch rất phổ biến. DIAC dùng để tạo xung kích cho cổng TRIAC. Tụ C nạp qua biến trở VR cộng R. Khi điện áp trên tụ vượt V BO của DIAC, DIAC dẫn, xả tụ thành một xung vào cổng G, TRIAC mở và đèn sáng.',a:['Mạch điều chỉnh độ sáng đèn (ngoài sách)','C nạp qua VR + R → đạt V_BO → DIAC dẫn → xung vào G → TRIAC mở']},
{c:4,hk:['d'],v:{t:'tb',n:4,h:['VR + R','Góc kích (ước lượng)','Độ sáng'],r:DR.map((R,i)=>{const a=dim(R);return [n(R/1e3,0)+' kΩ',a==null?'không kích được':n(a,0)+'°',['sáng nhất','giảm','tối hơn','tắt'][i]]})},s:'Tăng điện trở thì tụ nạp chậm hơn, DIAC dẫn muộn hơn trong mỗi bán kỳ, TRIAC mở muộn nên đèn tối đi. Bảng là ước lượng cho nguồn 220 vôn, tụ 0,1 micrô-fara, V BO giả định 32 vôn, bỏ qua dòng tải. Đến mức điện trở quá lớn thì tụ không đạt V BO, đèn tắt.',a:['Điện trở lớn → kích muộn → đèn tối','Bảng: ước lượng (giả định V_BO = 32 V, C = 0,1 µF, 220 V, 50 Hz)']},

  g+=`<text x="30" y="105" text-anchor="middle" style="fill:${cl};font-size:14px">V_CC</text>`;
  // GND
  g+=`<line x1="52" y1="140" x2="68" y2="140" stroke="${cd}" stroke-width="2"/>`;
  g+=`<line x1="56" y1="146" x2="64" y2="146" stroke="${cd}" stroke-width="1.5"/>`;
  g+=`<line x1="59" y1="151" x2="61" y2="151" stroke="${cd}" stroke-width="1"/>`;
  g+=`<text x="30" y="165" text-anchor="middle" style="font-size:13px">GND</text>`;

  // Điện trở R (ở trên, từ x=140 đến x=260, y=60)
  if(step>=2){
    // vẽ điện trở dạng zigzag nằm ngang
    const rx=150,ry=60,rw=100,rh=20;
    g+=`<rect x="${rx}" y="${ry-rh/2}" width="${rw}" height="${rh}" rx="4" fill="var(--card)" stroke="${co}" stroke-width="2.5"/>`;
    g+=`<text x="${rx+rw/2}" y="${ry+35}" text-anchor="middle" style="fill:${co};font-size:13px">R</text>`;
    // ngắt dây ở chỗ R
    g+=`<line x1="140" y1="60" x2="150" y2="60" stroke="${cd}" stroke-width="2.5"/>`;
    g+=`<line x1="250" y1="60" x2="260" y2="60" stroke="${cd}" stroke-width="2.5"/>`;
    // xóa dây đè lên R
    g+=`<rect x="150" y="50" width="100" height="20" fill="var(--card)" stroke="none"/>`;
    g+=`<rect x="${rx}" y="${ry-rh/2}" width="${rw}" height="${rh}" rx="4" fill="var(--card)" stroke="${co}" stroke-width="2.5"/>`;
    g+=`<text x="${rx+rw/2}" y="${ry+35}" text-anchor="middle" style="fill:${co};font-size:13px">R</text>`;
  } else {
    // chưa có R: chỉ vẽ một chấm nguy hiểm giữa đường
    g+=`<circle cx="200" cy="60" r="6" fill="red" opacity="0.7"/>`;
    g+=`<text x="200" y="45" text-anchor="middle" style="fill:red;font-size:12px">⚠ không R</text>`;
  }

  // LED symbol (ở phải, từ x=320→x=400, y=60)
  const lx=320,ly=60;
  // tam giác LED
  g+=`<polygon points="${lx},${ly-14} ${lx},${ly+14} ${lx+22},${ly}" fill="${step==1?'red':'var(--hl)'}" stroke="${cr}" stroke-width="2"/>`;
  // vạch katốt
  g+=`<line x1="${lx+22}" y1="${ly-15}" x2="${lx+22}" y2="${ly+15}" stroke="${cr}" stroke-width="2.5"/>`;
  // tia sáng
  if(step>=1){
    g+=`<line x1="${lx+28}" y1="${ly-18}" x2="${lx+38}" y2="${ly-26}" stroke="${cr}" stroke-width="1.5"/>`;
    g+=`<line x1="${lx+28}" y1="${ly-10}" x2="${lx+40}" y2="${ly-16}" stroke="${cr}" stroke-width="1.5"/>`;
  }
  // dây kết nối LED
  g+=`<line x1="${step>=2?260:260}" y1="60" x2="${lx}" y2="60" stroke="${cd}" stroke-width="2.5"/>`;
  g+=`<line x1="${lx+22}" y1="60" x2="440" y2="60" stroke="${cd}" stroke-width="2.5"/>`;
  // nhãn
  g+=`<text x="${lx+11}" y="${ly+35}" text-anchor="middle" style="fill:${cr};font-size:13px">LED</text>`;

  // Mũi tên dòng điện
  if(step>=2){
    g+=`<text x="300" y="48" text-anchor="middle" style="fill:${cd};font-size:11px">→ I_F</text>`;
  }

  // Chú thích VF
  if(step>=1){
    g+=`<line x1="${lx}" y1="${ly+20}" x2="${lx+22}" y2="${ly+20}" stroke="${cr}" stroke-width="1" stroke-dasharray="3 2"/>`;
    g+=`<text x="${lx+11}" y="${ly+50}" text-anchor="middle" style="fill:${cr};font-size:11px">← V_F →</text>`;
  }

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sơ đồ mạch LED">${g}</svg>`;
}

// Sơ đồ LED 7 đoạn với điện trở
function svg7seg(){
  const W=520,H=220;
  let g='';
  const co='var(--c2)',cr='var(--c3)',cd='var(--ink)',cl='var(--f1)';

  // Vẽ LED 7 đoạn đơn giản (hình chữ 8)
  const cx=300,cy=100;
  const sw=50,sh=20,gap=4;
  // Đoạn a (trên): đỏ
  const segs=[
    {x:cx-sw/2,y:cy-sh-gap-sh/2,w:sw,h:sh/2,id:'a',on:true},   // a trên
    {x:cx+sw/2+gap,y:cy-sh,w:sh/2,h:sh,id:'b',on:true},          // b phải trên
    {x:cx+sw/2+gap,y:cy+gap,w:sh/2,h:sh,id:'c',on:false},        // c phải dưới
    {x:cx-sw/2,y:cy+sh+gap+sh/2,w:sw,h:sh/2,id:'d',on:false},    // d dưới
    {x:cx-sw/2-sh/2-gap,y:cy+gap,w:sh/2,h:sh,id:'e',on:false},   // e trái dưới
    {x:cx-sw/2-sh/2-gap,y:cy-sh,w:sh/2,h:sh,id:'f',on:true},     // f trái trên
    {x:cx-sw/2,y:cy-sh/4,w:sw,h:sh/2,id:'g',on:true},            // g giữa
  ];
  segs.forEach(s=>{
    g+=`<rect x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="3" fill="${s.on?cr:'var(--line)'}" stroke="var(--line)" stroke-width="0.5"/>`;
  });
  g+=`<text x="${cx}" y="${cy+sh*2+20}" text-anchor="middle" style="font-size:11px;fill:${cd}">LED 7 đoạn</text>`;

  // Điện trở cho từng đoạn (đơn giản hóa: 7 đường nối)
  const rsX=140;
  for(let i=0;i<7;i++){
    const yy=20+i*28;
    // Đường từ nguồn → R → đoạn
    g+=`<line x1="60" y1="${yy}" x2="${rsX}" y2="${yy}" stroke="${cd}" stroke-width="1.5"/>`;
    // R nhỏ
    g+=`<rect x="${rsX}" y="${yy-7}" width="36" height="14" rx="3" fill="var(--card)" stroke="${co}" stroke-width="1.5"/>`;
    g+=`<text x="${rsX+18}" y="${yy+4}" text-anchor="middle" style="fill:${co};font-size:10px">R</text>`;
    // dây đến LED
    g+=`<line x1="${rsX+36}" y1="${yy}" x2="${cx-40}" y2="${yy}" stroke="${cd}" stroke-width="1.5" stroke-dasharray="3 2"/>`;
  }
  // VCC bên trái
  g+=`<text x="30" y="105" text-anchor="middle" style="fill:${cl};font-size:13px">V_CC</text>`;
  g+=`<line x1="50" y1="20" x2="50" y2="192" stroke="${cl}" stroke-width="2"/>`;
  for(let i=0;i<7;i++){
    g+=`<circle cx="60" cy="${20+i*28}" r="3" fill="${cl}"/>`;
  }

  // Mũi tên chú thích
  g+=`<text x="${rsX+18}" y="${7*28+22}" text-anchor="middle" style="font-size:10px;fill:${co}">R mỗi đoạn</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="LED 7 đoạn với điện trở hạn dòng">${g}</svg>`;
}

// Bảng tính R (điền dần)
function svgTable(rows){
  // rows: số hàng hiển thị (1-3)
  const DATA=[
    {color:'Đỏ',     vf:'2',  if_:'10', vcc:'5', r:'300'},
    {color:'Xanh lam',vf:'3', if_:'10', vcc:'5', r:'200'},
    {color:'Xanh lá', vf:'3', if_:'20', vcc:'5', r:'100'},
  ];
  const cd='var(--ink)',cm='var(--mute)',co='var(--c2)',cr='var(--c3)',cl='var(--f1)';
  let h=`<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:.88rem">`;
  h+=`<tr><th style="border:1px solid var(--line);padding:5px 10px;background:var(--bg);color:${cm}">Màu LED</th><th style="border:1px solid var(--line);padding:5px 10px;background:var(--bg);color:${cm}">V_CC (V)</th><th style="border:1px solid var(--line);padding:5px 10px;background:var(--bg);color:${cm}">V_F (V)</th><th style="border:1px solid var(--line);padding:5px 10px;background:var(--bg);color:${cm}">I_F (mA)</th><th style="border:1px solid var(--line);padding:5px 10px;background:var(--bg);color:${co}">R = (V_CC−V_F)/I_F</th></tr>`;
  for(let i=0;i<rows;i++){
    const d=DATA[i];
    const rval=((parseFloat(d.vcc)-parseFloat(d.vf))/(parseFloat(d.if_)/1000)).toFixed(0);
    h+=`<tr><td style="border:1px solid var(--line);padding:5px 10px">${d.color}</td><td style="border:1px solid var(--line);padding:5px 10px;text-align:center">${d.vcc}</td><td style="border:1px solid var(--line);padding:5px 10px;text-align:center">${d.vf}</td><td style="border:1px solid var(--line);padding:5px 10px;text-align:center">${d.if_}</td><td style="border:1px solid var(--line);padding:5px 10px;text-align:center;font-weight:700;color:${co}">${rval} Ω</td></tr>`;
  }
  h+=`</table></div>`;
  return h;
}

/* ===== ENGINE ===== */
let si=0,playing=false,gen=0,tm;
const $=id=>document.getElementById(id);

function render(){
  const s=S[si];
  let side='led';
  for(let j=0;j<=si;j++) if(S[j].side) side=S[j].side;
  $('tabs').innerHTML=CH.map((x,j)=>`<button data-j="${j}" class="${j==s.c?'on':''}">${x}</button>`).join('');
  $('ttl').textContent=TT[s.c];

  const sd=CSIDE[side],hk=s.hk||[];
  $('side').innerHTML=`<h3>${sd.t}</h3><table><tr>${sd.h.map(x=>`<th>${x}</th>`).join('')}</tr>${sd.r.map(r=>`<tr class="${hk.includes(r[0])?'h':''}"><td>${r[1]}</td>${r.slice(2).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;

  let L=[],k=0;
  for(let j=0;j<=si;j++){const t=S[j];if(t.c==s.c){L.push(...(t.a||[]));k=(t.a||[]).length}}
  $('lines').innerHTML=L.map((x,j)=>`<div class="${j>=L.length-k?'new':''}">${x}</div>`).join('');
  $('viz').innerHTML=viz(s.v);
  $('sub').textContent=s.s;
  document.querySelector('#bar i').style.width=((si+1)/S.length*100)+'%';
  $('play').textContent=playing?'Tạm dừng':'Phát';
}

function speak(){
  clearTimeout(tm);const g=++gen,txt=S[si].s;let done=false;
  const fin=()=>{if(done||g!==gen||!playing)return;done=true;clearTimeout(tm);tm=setTimeout(()=>{if(g===gen&&playing)step(1)},800)};
  const ss=window.speechSynthesis;let v=null;
  try{ss.cancel();v=ss.getVoices().find(x=>/^vi/i.test(x.lang))}catch(e){}
  if(!ss||!v){tm=setTimeout(fin,txt.length*70+1500);return}

}

function step(d){

}
