<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câu 7 – Kỹ thuật số: chứng minh bằng bảng chân trị 4 biến</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--grid:#dce5f1;--ink:#1c2b45;--mute:#5b6b85;--hl:#ffe36b;--f1:#2a5bd7;--bad:#c0392b;--card:#fff;--line:#c9d5e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101826;--grid:#1a2538;--ink:#e6edf8;--mute:#9aa9c2;--hl:#6b5a00;--f1:#7ea2ff;--bad:#ff8a80;--card:#172236;--line:#2b3b57}}
:root[data-theme="dark"]{--bg:#101826;--grid:#1a2538;--ink:#e6edf8;--mute:#9aa9c2;--hl:#6b5a00;--f1:#7ea2ff;--bad:#ff8a80;--card:#172236;--line:#2b3b57}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;display:flex;flex-direction:column}
#tabs{display:flex;gap:6px;padding:12px;overflow-x:auto}
#tabs button{font:600 .85rem inherit;font-family:inherit;white-space:nowrap;padding:8px 12px;border:1.5px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;cursor:pointer}
#tabs button.on{border-color:var(--ink);color:var(--ink);background:var(--hl)}
#stage{flex:1;display:grid;grid-template-columns:minmax(340px,540px) 1fr;gap:16px;padding:4px 12px 12px;align-items:start}
@media(max-width:820px){#stage{grid-template-columns:1fr}}
.tw{overflow-x:auto}
#tt{border-collapse:collapse;width:100%;background:var(--card);font-variant-numeric:tabular-nums;border:1.5px solid var(--ink)}
#tt th,#tt td{text-align:center;padding:3px 5px;border:1px solid var(--line);font-size:.85rem}
#tt th{background:var(--bg);font-size:.78rem;white-space:nowrap}
#tt td.u{color:var(--mute)}
#tt .on{background:color-mix(in srgb,var(--f1) 18%,transparent)}
#tt .sep{border-left:2.5px solid var(--ink)}
#tt .x{color:var(--bad);font-weight:700}
#tt tr.h td{background:var(--hl);font-weight:700}
#tt tr.d{opacity:.45}
#board{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:14px 18px;min-height:200px}
#ttl{margin:0 0 10px;font-size:1.05rem}
#lines div{font:1.2rem/1.9 Georgia,'Times New Roman',serif;overflow-wrap:anywhere;padding:0 4px}
#lines .new{animation:fl .8s}
@keyframes fl{from{background:var(--hl)}to{background:transparent}}
@media(prefers-reduced-motion:reduce){#lines .new{animation:none}}
.res{display:inline-block;border-bottom:3px solid var(--hl)}
i.n{font-style:normal;display:inline-block;border-top:2px solid currentColor;line-height:1.05;margin:0 2px}
footer{position:sticky;bottom:0;background:var(--card);border-top:1.5px solid var(--ink);padding:10px 14px}
#sub{margin:0 0 8px;font-size:1.05rem;line-height:1.5;min-height:4.5em;max-width:70ch}
#bar{height:5px;background:var(--line);margin-bottom:10px}#bar i{display:block;height:100%;width:0;background:var(--f1)}
#ctl{display:flex;gap:8px}
#ctl button{font:600 .95rem inherit;font-family:inherit;padding:9px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
#ctl #play{background:var(--ink);color:var(--card);min-width:110px}
button:focus-visible{outline:3px solid var(--f1);outline-offset:2px}
</style></head><body>
<nav id="tabs"></nav>
<section id="stage"><div class="tw"><table id="tt"></table></div><div id="board"><h2 id="ttl"></h2><div id="lines"></div></div></section>
<footer><p id="sub"></p><div id="bar"><i></i></div><div id="ctl"><button id="prev">Trước</button><button id="play">Phát</button><button id="next">Tiếp</button></div></footer>
<script>
const n=x=>`<i class="n">${x}</i>`,res=h=>`<b class="res">${h}</b>`,bit=(i,k)=>(i>>(3-k))&1,N=[...Array(16).keys()];
const An=n('A'),Cn=n('C'),Dn=n('D');
const LB={t1:An+'B',t2:An+'D',t3:'B'+Cn+'D',L:'VT',f1:An+'+D',f2:An+'+'+Cn,f3:'B+'+Dn,R:'VP',cmp:'=?',u2:An+Dn,L2:"VT'",cmp2:'=?'};
const V=i=>{const a=bit(i,0),b=bit(i,1),c=bit(i,2),d=bit(i,3),t1=(1-a)&b,t2=(1-a)&d,t3=b&(1-c)&d,L=t1|t2|t3,f1=(1-a)|d,f2=(1-a)|(1-c),f3=b|(1-d),R=f1&f2&f3,u2=(1-a)&(1-d),L2=t1|u2|t3;return{t1,t2,t3,L,f1,f2,f3,R,u2,L2,cmp:L==R?'✓':'✗',cmp2:L2==R?'✓':'✗'}};
const MAIN=['t1','t2','t3','L','f1','f2','f3','R','cmp'],ALT=['t1','u2','t3','L2','R','cmp2'];
const VT=`${An}B + ${An}D + B${Cn}D`,VP=`(${An} + D)(${An} + ${Cn})(B + ${Dn})`;
const S=[
{c:0,h:[],s:'Chào bạn, câu 7 mình làm tiếp nhé. Đề bắt dùng bảng chân trị để chứng minh hai biểu thức tương đương. Có bốn biến A, B, C, D nên bảng có 2 mũ 4 bằng 16 hàng. Mình đặt tên vế trái là VT và vế phải là VP.',a:[`VT = ${VT}`,`VP = ${VP}`]},
{c:0,h:[],s:'Hai quy tắc cần nhớ. Vế trái là tổng các tích: chỉ cần một tích bằng 1 thì cả tổng bằng 1. Vế phải là tích các tổng: chỉ cần một tổng bằng 0 thì cả tích bằng 0. Mình tính từng cột phụ rồi mới ghép lại.',a:['Tổng: có 1 số hạng = 1 ⇒ bằng 1','Tích: có 1 thừa số = 0 ⇒ bằng 0']},
{c:1,f:['t1'],rv:['t1'],h:[4,5,6,7],clr:1,s:'Bắt đầu vế trái. Cột A ngang B bằng 1 khi A bằng 0 và B bằng 1: các hàng 4, 5, 6, 7.',a:[`${An}B = 1 khi A = 0, B = 1`]},
{c:1,f:['t2'],rv:['t2'],h:[1,3,5,7],s:'Cột A ngang D bằng 1 khi A bằng 0 và D bằng 1: các hàng 1, 3, 5, 7.',a:[`${An}D = 1 khi A = 0, D = 1`]},
{c:1,f:['t3'],rv:['t3'],h:[5,13],s:`Cột B C ngang D bằng 1 khi B bằng 1, C bằng 0 và D bằng 1: chỉ có hàng 5 và hàng 13.`,a:[`B${Cn}D = 1 khi B = 1, C = 0, D = 1`]},
{c:1,f:['L'],rv:['L'],h:[1,3,4,5,6,7,13],s:'Cộng ba cột lại: hàng nào có ít nhất một cột bằng 1 thì VT bằng 1. Đó là các hàng 1, 3, 4, 5, 6, 7 và 13. Các hàng còn lại bằng 0.',a:[res('VT = 1 tại hàng 1, 3, 4, 5, 6, 7, 13')]},
{c:2,f:['f1'],rv:['f1'],h:[8,10,12,14],clr:1,s:'Sang vế phải. Tổng A ngang cộng D bằng 0 khi A ngang bằng 0 và D bằng 0, tức A bằng 1 và D bằng 0: các hàng 8, 10, 12, 14.',a:[`${An} + D = 0 khi A = 1, D = 0`]},
{c:2,f:['f2'],rv:['f2'],h:[10,11,14,15],s:'Tổng A ngang cộng C ngang bằng 0 khi A bằng 1 và C bằng 1: các hàng 10, 11, 14, 15.',a:[`${An} + ${Cn} = 0 khi A = 1, C = 1`]},
{c:2,f:['f3'],rv:['f3'],h:[1,3,9,11],s:'Tổng B cộng D ngang bằng 0 khi B bằng 0 và D ngang bằng 0, tức D bằng 1: các hàng 1, 3, 9, 11.',a:[`B + ${Dn} = 0 khi B = 0, D = 1`]},
{c:2,f:['R'],rv:['R'],h:[0,2,4,5,6,7,13],s:'Nhân ba cột lại: chỉ những hàng mà cả ba tổng cùng bằng 1 thì VP mới bằng 1. Đó là các hàng 0, 2, 4, 5, 6, 7 và 13.',a:[res('VP = 1 tại hàng 0, 2, 4, 5, 6, 7, 13')]},
{c:3,f:['L','R','cmp'],rv:['cmp'],h:[0,1,2,3],clr:1,s:'Bây giờ so sánh VT với VP từng hàng. Hai cột giống nhau ở hàng 4 đến 15, nhưng khác nhau ở bốn hàng đầu: hàng 0, 1, 2, 3. Ví dụ hàng 0, A, B, C, D đều bằng 0: VT bằng 0 còn VP bằng 1.',a:['Khác nhau ở hàng 0, 1, 2, 3']},
{c:3,f:['L','R','cmp'],h:[0,1,2,3],s:'Vậy với đề đúng như hình thì hai biểu thức chưa tương đương, vì có phản ví dụ A, B, C, D cùng bằng 0. Bốn hàng lệch này đều có A bằng 0 và B bằng 0: lúc đó VT chỉ còn A ngang D, còn VP chỉ còn A ngang D ngang. Mình nghi số hạng thứ hai ở vế trái bị chép thiếu dấu ngang ở chữ D.',a:[res('Phản ví dụ: A=B=C=D=0 ⇒ VT = 0, VP = 1')]},
{c:4,f:['u2'],rv:['u2'],h:[0,2,4,6],clr:1,s:'Thử sửa số hạng thứ hai thành A ngang D ngang. Cột này bằng 1 khi A bằng 0 và D bằng 0: các hàng 0, 2, 4, 6.',a:['Thử sửa: A̅D → A̅D̅','A̅D̅ = 1 khi A = 0, D = 0']},
{c:4,f:['L2','R','cmp2'],rv:['L2','cmp2'],h:[0,2,4,5,6,7,13],s:'Cộng ba cột A ngang B, A ngang D ngang và B C ngang D. VT mới bằng 1 ở các hàng 0, 2, 4, 5, 6, 7, 13, giống hệt cột VP ở cả 16 hàng.',a:[res("VT′ = 1 tại hàng 0, 2, 4, 5, 6, 7, 13"),'VT′ = VP ở cả 16 hàng']},
{c:4,f:['L2','R','cmp2'],h:[],s:'Kết luận. Nếu số hạng thứ hai là A ngang D ngang thì hai biểu thức tương đương. Còn nếu đề đúng như hình, bạn nêu phản ví dụ ở hàng 0 và ghi chú đề có thể bị chép nhầm. Nhớ kiểm tra lại đề gốc nhé. Vậy là xong câu 7.',a:[res(`${An}B + ${An}${Dn} + B${Cn}D = (${An} + D)(${An} + ${Cn})(B + ${Dn})`)]}];
const CH=['Chuẩn bị','Vế trái','Vế phải','So sánh','Thử sửa đề'],TT=['Câu 7: chứng minh bằng bảng chân trị','Tính cột vế trái','Tính cột vế phải','So sánh VT và VP','Kiểm tra khả năng đề chép nhầm'];
let si=0,playing=false,gen=0,tm;
const $=id=>document.getElementById(id);
function render(){
 const s=S[si],h=s.h||[],f=s.f||[],known=new Set;
 $('tabs').innerHTML=CH.map((x,j)=>`<button data-j="${j}" class="${j==s.c?'on':''}">${x}</button>`).join('');
 $('ttl').textContent=TT[s.c];
 let L=[],k=0;
 for(let j=0;j<=si;j++){const t=S[j];(t.rv||[]).forEach(x=>known.add(x));if(t.c==s.c){if(t.clr)L=[];L.push(...(t.a||[]));k=(t.a||[]).length}}
 for(let j=0;j<=si;j++)if(S[j].c<=2)(S[j].rv||[]).forEach(x=>known.add(x));
 $('lines').innerHTML=L.map((x,j)=>`<div class="${j>=L.length-k?'new':''}">${x}</div>`).join('');
 const ks=s.c==4?ALT:MAIN;
 $('tt').innerHTML='<tr><th>m</th><th>A</th><th>B</th><th>C</th><th>D</th>'+ks.map((q,j)=>`<th class="${j==0?'sep ':''}${f.includes(q)?'on':''}">${LB[q]}</th>`).join('')+'</tr>'+N.map(i=>{const v=V(i);return `<tr class="${h.includes(i)?'h':h.length?'d':''}"><td>${i}</td>${[0,1,2,3].map(q=>`<td>${bit(i,q)}</td>`).join('')}${ks.map((q,j)=>{const kn=known.has(q);return `<td class="${j==0?'sep ':''}${kn?'':'u '}${f.includes(q)?'on ':''}${kn&&v[q]=='✗'?'x':''}">${kn?v[q]:'·'}</td>`}).join('')}</tr>`}).join('');
 $('sub').textContent=s.s;
 document.querySelector('#bar i').style.width=((si+1)/S.length*100)+'%';
 $('play').textContent=playing?'Tạm dừng':'Phát';
}
function speak(){
 clearTimeout(tm);const g=++gen,txt=S[si].s;let done=false;
 const fin=()=>{if(done||g!==gen||!playing)return;done=true;clearTimeout(tm);tm=setTimeout(()=>{if(g===gen&&playing)step(1)},800)};
 const ss=window.speechSynthesis;let v=null;
 try{ss.cancel();v=ss.getVoices().find(x=>/^vi/i.test(x.lang))}catch(e){}
 if(!ss||!v){tm=setTimeout(fin,txt.length*70+1500);return}
 const u=new SpeechSynthesisUtterance(txt);u.voice=v;u.lang='vi-VN';u.rate=.95;u.onend=fin;u.onerror=fin;
 ss.speak(u);tm=setTimeout(fin,txt.length*220+4000);
}
function step(d){
 if(d>0){if(si<S.length-1)si++;else{pause();return}}else if(si>0)si--;
 render();if(playing)speak();
}
function pause(){playing=false;gen++;clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}render()}
$('play').onclick=()=>{if(playing)pause();else{if(si==S.length-1)si=0;playing=true;render();speak()}};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('tabs').onclick=e=>{const j=e.target.dataset&&e.target.dataset.j;if(j==null)return;si=S.findIndex(x=>x.c==j);render();if(playing)speak()};
render();
</script></body></html>
