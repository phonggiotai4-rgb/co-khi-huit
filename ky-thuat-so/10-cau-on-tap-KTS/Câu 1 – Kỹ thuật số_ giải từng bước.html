<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câu 1 – Kỹ thuật số: giải từng bước</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--grid:#dce5f1;--ink:#1c2b45;--mute:#5b6b85;--hl:#ffe36b;--f1:#2a5bd7;--f2:#0e8a7d;--card:#fff;--line:#c9d5e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101826;--grid:#1a2538;--ink:#e6edf8;--mute:#9aa9c2;--hl:#6b5a00;--f1:#7ea2ff;--f2:#4fd1c0;--card:#172236;--line:#2b3b57}}
:root[data-theme="dark"]{--bg:#101826;--grid:#1a2538;--ink:#e6edf8;--mute:#9aa9c2;--hl:#6b5a00;--f1:#7ea2ff;--f2:#4fd1c0;--card:#172236;--line:#2b3b57}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;display:flex;flex-direction:column}
#tabs{display:flex;gap:6px;padding:12px;overflow-x:auto}
#tabs button{font:600 .85rem inherit;font-family:inherit;white-space:nowrap;padding:8px 12px;border:1.5px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;cursor:pointer}
#tabs button.on{border-color:var(--ink);color:var(--ink);background:var(--hl)}
#stage{flex:1;display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:16px;padding:4px 12px 12px;align-items:start}
@media(max-width:700px){#stage{grid-template-columns:1fr}}
#tt{border-collapse:collapse;width:100%;background:var(--card);font-variant-numeric:tabular-nums;border:1.5px solid var(--ink)}
#tt th,#tt td{text-align:center;padding:6px 4px;border:1px solid var(--line)}
#tt th{background:var(--bg);font-size:.85rem}
#tt .c1.on{background:color-mix(in srgb,var(--f1) 16%,transparent)}
#tt .c2.on{background:color-mix(in srgb,var(--f2) 16%,transparent)}
#tt th.c1{color:var(--f1)}#tt th.c2{color:var(--f2)}
#tt tr.h td{background:var(--hl);font-weight:700}
#tt tr.d{opacity:.4}
#board{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:14px 18px;min-height:200px}
#ttl{margin:0 0 10px;font-size:1.05rem}
#lines div{font:1.3rem/1.9 Georgia,'Times New Roman',serif;overflow-wrap:anywhere;padding:0 4px}
#lines .new{animation:fl .8s}
@keyframes fl{from{background:var(--hl)}to{background:transparent}}
@media(prefers-reduced-motion:reduce){#lines .new{animation:none}}
.res{display:inline-block;border-bottom:3px solid var(--hl);color:var(--ink)}
i.n{font-style:normal;display:inline-block;border-top:2px solid currentColor;line-height:1.05;margin:0 2px}
footer{position:sticky;bottom:0;background:var(--card);border-top:1.5px solid var(--ink);padding:10px 14px}
#sub{margin:0 0 8px;font-size:1.05rem;line-height:1.5;min-height:3em;max-width:70ch}
#bar{height:5px;background:var(--line);margin-bottom:10px}#bar i{display:block;height:100%;width:0;background:var(--f1)}
#ctl{display:flex;gap:8px}
#ctl button{font:600 .95rem inherit;font-family:inherit;padding:9px 16px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
#ctl #play{background:var(--ink);color:var(--card);min-width:110px}
button:focus-visible{outline:3px solid var(--f1);outline-offset:2px}
</style></head><body>
<nav id="tabs"></nav>
<section id="stage"><table id="tt"></table><div id="board"><h2 id="ttl"></h2><div id="lines"></div></div></section>
<footer><p id="sub"></p><div id="bar"><i></i></div><div id="ctl"><button id="prev">Trước</button><button id="play">Phát</button><button id="next">Tiếp</button></div></footer>
<script>
const F={F1:[0,0,1,0,0,1,0,1],F2:[1,0,0,1,1,1,1,0]},V=['C','B','A'];
const bit=(i,k)=>(i>>(2-k))&1,R=[0,1,2];
const lit=(k,n)=>n?`<i class="n">${V[k]}</i>`:V[k];
const mt=i=>R.map(k=>lit(k,!bit(i,k))).join('');
const mx=i=>'('+R.map(k=>lit(k,bit(i,k))).join(' + ')+')';
const nm=(i,m)=>R.map(k=>V[k]+((m?bit(i,k):!bit(i,k))?' ngang':'')).join(m?' cộng ':' nhân ');
const bits=i=>`C bằng ${bit(i,0)}, B bằng ${bit(i,1)}, A bằng ${bit(i,2)}`;
const bin=i=>''+bit(i,0)+bit(i,1)+bit(i,2),list=a=>a.join(', ');
const res=h=>`<b class="res">${h}</b>`;
const sres=(f,x)=>f+' = '+x.map(mt).join(' + '),pres=(f,x)=>f+' = '+x.map(mx).join('');
const sg=(f,x)=>`${f}(C,B,A) = Σm(${list(x)})`,pg=(f,x)=>`${f}(C,B,A) = ΠM(${list(x)})`;
const O1=[2,5,7],Z1=[0,1,3,4,6],O2=[0,3,4,5,6],Z2=[1,2,7];
const sop=(f,x)=>x.map((i,k)=>({f,h:[i],s:`Hàng ${i}: ${bits(i)}. ${k?'':'Biến bằng 1 thì giữ nguyên, bằng 0 thì thêm ngang. '}Vậy tích là ${nm(i)}.`,a:[(k?'&emsp;+ ':f+' = ')+mt(i)]}));
const pos=(f,x)=>x.map((i,k)=>({f,h:[i],s:`Hàng ${i}: ${bits(i)}. ${k?'':'Với dạng tích các tổng thì ngược lại: biến bằng 0 giữ nguyên, bằng 1 thì thêm ngang. '}Vậy tổng là ${nm(i,1)}.`,a:[(k?'&emsp;· ':f+' = ')+mx(i)]}));
const sp=(f,o,z,intro)=>[
{f,h:[],s:intro,a:[]},
{f,h:o,s:`Dạng sigma: liệt kê số thứ tự các hàng mà ${f} bằng 1. ${o.map(i=>`${bin(i)} là ${i}`).join(', ')}.`,a:[o.map(i=>`${bin(i)}→${i}`).join(' &nbsp; '),res(sg(f,o))]},
{f,h:z,s:`Dạng pi: liệt kê các hàng mà ${f} bằng 0, đó là hàng ${list(z)}.`,a:[z.map(i=>`${bin(i)}→${i}`).join(' &nbsp; '),res(pg(f,z))]},
{f,h:[],s:`Kiểm tra nhanh: số của sigma và số của pi gộp lại đủ từ 0 đến 7, không trùng nhau. Vậy ${f} bằng sigma m ${list(o)}, và cũng bằng pi M ${list(z)}.`,a:[`{${list(o)}} ∪ {${list(z)}} = {0…7}`]}];
const CH=[
{tab:'a) F1, F2',t:'a) Viết biểu thức của F1, F2',st:[
{f:null,h:[],s:'Chào bạn, mình giải câu 1 nhé. Phần a: viết biểu thức của F1 và F2 từ bảng chân trị. Cách làm: hàm bằng 1 ở hàng nào thì viết một tích cho hàng đó, rồi cộng các tích lại.',a:[]},
{f:'F1',h:O1,s:`Bắt đầu với F1. Nhìn cột F1, hàm bằng 1 ở ba hàng: hàng ${list(O1)}. Mình chỉ quan tâm ba hàng này.`,a:[]},
...sop('F1',O1),
{f:'F1',h:O1,clr:1,s:'Cộng ba tích lại, ta được biểu thức của F1.',a:[res(sres('F1',O1))]},
{f:'F2',h:O2,s:`Sang F2. Cột F2 bằng 1 ở năm hàng: ${list(O2)}.`,a:[]},
{f:'F2',h:O2,s:'Làm y hệt: '+O2.map(i=>`hàng ${i} là ${nm(i)}`).join('; ')+'.',a:O2.map((i,k)=>(k?'&emsp;+ ':'F2 = ')+mt(i))},
{f:'F2',h:O2,clr:1,s:'Cộng năm tích lại, ta có F2. Vậy là xong phần a.',a:[res(sres('F1',O1)),res(sres('F2',O2))]}]},
{tab:'b) F1 POS',t:'b) F1 dạng tích các tổng (POS)',st:[
{f:'F1',h:Z1,s:'Phần b: viết F1 dạng tích các tổng, gọi tắt là POS. Lần này mình nhìn các hàng mà F1 bằng 0: đó là hàng '+list(Z1)+'. Mỗi hàng viết một tổng, rồi nhân các tổng lại.',a:[]},
...pos('F1',Z1),
{f:'F1',h:Z1,clr:1,s:'Nhân năm tổng lại, ta được F1 dạng POS. Xong phần b.',a:[res(pres('F1',Z1))]}]},
{tab:'c) F2 SOP',t:'c) F2 dạng tổng các tích (SOP)',st:[
{f:'F2',h:O2,s:'Phần c: viết F2 dạng tổng các tích, gọi tắt là SOP. Ta lấy các hàng mà F2 bằng 1: hàng '+list(O2)+'.',a:[]},
...sop('F2',O2),
{f:'F2',h:O2,clr:1,s:'Cộng năm tích lại, ta có F2 dạng SOP.',a:[res(sres('F2',O2))]},
{f:'F2',h:[],s:'Mẹo thêm: nếu đề bắt rút gọn thì dùng bìa Các-nô, ra F2 bằng B ngang A ngang, cộng C B ngang, cộng C A ngang, cộng C ngang B A. Còn đề chỉ hỏi dạng SOP thì dạng đầy đủ ở trên là đủ.',a:['Rút gọn: F2 = <i class="n">B</i><i class="n">A</i> + C<i class="n">B</i> + C<i class="n">A</i> + <i class="n">C</i>BA']}]},
{tab:'d) F1 Σ, Π',t:'d) F1 dạng Σ và Π',st:sp('F1',O1,Z1,'Phần d: viết F1 dưới dạng sigma và pi. Mỗi hàng có một số thứ tự m. Đọc C, B, A như một số nhị phân, trong đó C là bit cao nhất.')},
{tab:'e) F2 Σ, Π',t:'e) F2 dạng Σ và Π',st:sp('F2',O2,Z2,'Phần e: làm tương tự cho F2. Vẫn đọc C, B, A như số nhị phân để ra số thứ tự hàng.')}];
let ci=0,si=0,playing=false,gen=0,tm;
const $=id=>document.getElementById(id);
function render(){
 const c=CH[ci],s=c.st[si],h=s.h||[];
 $('tabs').innerHTML=CH.map((x,j)=>`<button data-j="${j}" class="${j==ci?'on':''}">${x.tab}</button>`).join('');
 $('ttl').textContent=c.t;
 let L=[],n=0;for(let j=0;j<=si;j++){const t=c.st[j];if(t.clr)L=[];L.push(...(t.a||[]));n=(t.a||[]).length}
 $('lines').innerHTML=L.map((x,j)=>`<div class="${j>=L.length-n?'new':''}">${x}</div>`).join('');
 const on=k=>s.f==k?' on':'';
 $('tt').innerHTML=`<tr><th>m</th><th>C</th><th>B</th><th>A</th><th class="c1${on('F1')}">F1</th><th class="c2${on('F2')}">F2</th></tr>`+[0,1,2,3,4,5,6,7].map(i=>`<tr class="${h.includes(i)?'h':h.length?'d':''}"><td>${i}</td><td>${bit(i,0)}</td><td>${bit(i,1)}</td><td>${bit(i,2)}</td><td class="c1${on('F1')}">${F.F1[i]}</td><td class="c2${on('F2')}">${F.F2[i]}</td></tr>`).join('');
 $('sub').textContent=s.s;
 document.querySelector('#bar i').style.width=((si+1)/c.st.length*100)+'%';
 $('play').textContent=playing?'Tạm dừng':'Phát';
}
function speak(){
 clearTimeout(tm);const g=++gen,txt=CH[ci].st[si].s;let done=false;
 const fin=()=>{if(done||g!==gen||!playing)return;done=true;clearTimeout(tm);tm=setTimeout(()=>{if(g===gen&&playing)step(1)},800)};
 const ss=window.speechSynthesis;let v=null;
 try{ss.cancel();v=ss.getVoices().find(x=>/^vi/i.test(x.lang))}catch(e){}
 if(!ss||!v){tm=setTimeout(fin,txt.length*70+1500);return}
 const u=new SpeechSynthesisUtterance(txt);u.voice=v;u.lang='vi-VN';u.rate=.95;u.onend=fin;u.onerror=fin;
 ss.speak(u);tm=setTimeout(fin,txt.length*220+4000);
}
function step(d){
 if(d>0){if(si<CH[ci].st.length-1)si++;else if(ci<CH.length-1){ci++;si=0}else{pause();return}}
 else{if(si>0)si--;else if(ci>0){ci--;si=CH[ci].st.length-1}}
 render();if(playing)speak();
}
function pause(){playing=false;gen++;clearTimeout(tm);try{speechSynthesis.cancel()}catch(e){}render()}
$('play').onclick=()=>{if(playing)pause();else{if(ci==CH.length-1&&si==CH[ci].st.length-1){ci=0;si=0}playing=true;render();speak()}};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('tabs').onclick=e=>{const j=e.target.dataset&&e.target.dataset.j;if(j==null)return;ci=+j;si=0;render();if(playing)speak()};
render();
</script></body></html>
